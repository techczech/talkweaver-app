name: Performance regression checks
on:
  pull_request:
  push:
    branches: [main, 'next/**']
  workflow_dispatch:
    inputs:
      hosted:
        description: 'Run on a GitHub-hosted runner instead of the self-hosted Mac Studio (emergency switch; uses paid minutes)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  performance:
    # Required check (branch protection): keep the job name `performance`.
    # Runs on the self-hosted Mac Studio; `hosted: true` on a manual run uses macos-15.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    runs-on: ${{ inputs.hosted && 'macos-15' || fromJSON('["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun packages
        if: ${{ inputs.hosted }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Work budgets, build and hidden Electron journeys
        run: npm run check:performance
