name: Release

# Build installers for macOS (Apple Silicon) and Windows and upload them to a GitHub Release.
# Trigger by pushing a version tag, e.g.  git tag v0.18.0 && git push origin v0.18.0
# Everything goes to a DRAFT release for that version; review it, then publish.
# Mac files are uploaded only by scripts/release-mac-assets.mjs, which runs the release gate
# (scripts/verify-mac-package.mjs) on the very copies it uploads, with the ffmpeg corresponding
# source. The demo vault zip is attached to the same draft. Windows: electron-builder publishes.
#
# macOS builds are code-signed with a Developer ID Application certificate and
# notarized by Apple, so downloads open without the Gatekeeper warning. The
# certificate + notarization credentials are supplied as encrypted repo secrets
# (APPLE_DEVID_P12_BASE64, APPLE_DEVID_P12_PASSWORD, APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID). Only tag pushes by a maintainer
# trigger this; fork pull requests never receive the secrets.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # First, before any build, upload or update-feed change: the agent skill must already be published
  # separately at this release's version (docs/RELEASING.md; the contract's "Available separately").
  # Run the publish step first if this fails.
  skill-published:
    name: Agent skill published at this version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'const expected = "refs/tags/v" + require("./package.json").version; if (process.env.GITHUB_REF !== expected) process.exit(1)'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the agent skill of this release
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/build-agent-skill.mjs --out agent-skill-dist
      - name: Check the public copy of the agent skill (every file, by SHA-256)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-published-skill.mjs --skill agent-skill-dist/talkweaver

  macos:
    name: macOS (arm64)
    needs: skill-published
    # macos-26: the built-in transcription helper (native/transcription.swift) needs the macOS 26 SDK
    # (SpeechTranscriber); the macos-15 image's default Xcode 16.4 cannot compile it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build native macOS helpers (Swift)
        run: npm run build:native
      - name: Build renderer/main
        run: npm run build
      # The Mac app ships a GPL ffmpeg; its complete corresponding source goes on the same release.
      # Made before packaging, so a source that cannot be had stops the release before anything is
      # uploaded. The downloads are cached by the manifest's hash.
      - name: Cache the ffmpeg corresponding-source downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-mac-source/cache
          key: ffmpeg-mac-source-${{ hashFiles('scripts/lib/ffmpeg-mac-source-manifest.json') }}
      - name: Assemble the ffmpeg corresponding source (GPL)
        run: node scripts/build-ffmpeg-source-bundle.mjs
      # Packaged without publishing: nothing reaches GitHub from electron-builder on the Mac.
      - name: Package (signed + notarized dmg, zip)
        run: npx electron-builder --mac --publish never
        env:
          # Developer ID code signing — electron-builder imports this .p12 into a temp keychain
          CSC_LINK: ${{ secrets.APPLE_DEVID_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_DEVID_P12_PASSWORD }}
          # Notarization (activated by "notarize": true in package.json build.mac)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # The one way Mac files reach the release: scripts/release-mac-assets.mjs copies exactly these
      # files into a private folder, runs the release gate (scripts/verify-mac-package.mjs
      # --require-signed) on the copies, refuses a published release or a name already on the draft,
      # uploads the copies to the draft, and downloads each back to compare its SHA-256. The app and
      # its corresponding source always land on the same release.
      - name: Release the verified Mac files to the draft
        run: |
          shopt -s nullglob
          DMG=(release/*.dmg)
          ZIP=(release/*.zip)
          [ ${#DMG[@]} -eq 1 ] && [ ${#ZIP[@]} -eq 1 ] || { echo "expected one dmg and one zip under release/, found: ${DMG[*]} ${ZIP[*]}"; exit 1; }
          VERSION=$(node -p "require('./package.json').version")
          FFMPEG=$(node -p "require('./scripts/lib/ffmpeg-mac-pin.json').version")
          BASE="TalkWeaver-$VERSION-ffmpeg-$FFMPEG-corresponding-source"
          REPO=$(node -p "const p=require('./package.json').build.publish; p.owner + '/' + p.repo")
          node scripts/release-mac-assets.mjs --repo "$REPO" --tag "v$VERSION" "${DMG[0]}" "${ZIP[0]}" "ffmpeg-mac-source/$BASE.tar" "ffmpeg-mac-source/$BASE.SHA256SUMS"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The demo vault (twelve small talks) goes on the same draft, after the Mac files, so the
      # draft exists. Never replaced: a zip already there stops this step.
      - name: Attach the demo vault
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git archive --format=zip --prefix='TalkWeaver demo vault/' -o TalkWeaver-demo-vault.zip HEAD:demo-vault
          gh release upload "v$VERSION" TalkWeaver-demo-vault.zip --repo techczech/talkweaver-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows (x64)
    needs: skill-published
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build renderer/main
        run: npm run build
      - name: Stage Windows app without publishing
        run: npx electron-builder --win --dir --publish never
      - name: Verify Windows Electron security policy before publishing
        run: node scripts/verify-electron-security.cjs release/win-unpacked/TalkWeaver.exe
      - name: Package + publish verified Windows app (nsis installer)
        run: npx electron-builder --win --publish always --prepackaged release/win-unpacked
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
