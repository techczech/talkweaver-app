name: Tests
on:
  pull_request:
  # Push only to long-lived branches; a feature branch is covered by its pull request,
  # so a push to it must not start a second copy of every job.
  push:
    branches: [main, 'next/**']
  workflow_dispatch:
    inputs:
      e2e_scripts:
        description: 'Optional space-separated e2e script names. Blank runs the full desktop tier.'
        type: string
        default: ''
      e2e_output:
        description: 'Include output from passing selected desktop specs.'
        type: boolean
        default: false
      nightly_dom:
        description: 'Run just the Studio nightly DOM job for qualification.'
        type: boolean
        default: false
      hosted:
        description: 'Run on GitHub-hosted runners instead of the self-hosted Spark/Studio runners (emergency switch; uses paid minutes)'
        type: boolean
        default: false
  schedule:
    # Nightly browser and Electron tiers (03:17 UTC).
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  # Per trigger as well as per ref: a push must not cancel the nightly browser run, nor the reverse.
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
# Jobs default to the Mac Studio. The separate PR DOM workflow uses GitHub-hosted Ubuntu.
# `workflow_dispatch` with `hosted: true` moves the regular manual jobs to GitHub-hosted runners.
# Self-hosted jobs never run for pull requests from forks.
# See _MACHINECONFIG/github-runners.md.
jobs:
  unit:
    # Required check (branch protection): keep the job name `unit`.
    # Plain-Node tier of `npm test` (scripts/test-tiers.json), typecheck and the
    # Worker's bun tests, on the self-hosted Mac Studio (ubuntu-latest when `hosted`).
    # The runner validates the tier file against the available npm scripts.
    # Scripts listed in MACOS_ONLY_TESTS assert macOS file-system behaviour and run
    # in `unit-macos` instead (kept skipped here so the hosted Linux fallback passes):
    #   test:vault-paths  needs APFS Unicode normalisation (NFC/NFD folder names);
    #                     ext4 on Linux keeps the two forms distinct, so it fails there.
    #   test:vault-gallery:write-windows
    #                     needs APFS folding for three resume checks, so it is skipped only on the
    #                     hosted Linux fallback; on the Mac it stays in this required job.
    #   test:html-page-import, test:live-page-capture, test:live-page-capture-window
    #   test:live-page-capture-markup
    #                     exercise macOS-only no-link filesystem operations; other platforms refuse.
    if: >-
      (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request') &&
      !inputs.e2e_scripts && !inputs.nightly_dom
    runs-on: ${{ inputs.hosted && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 20
    env:
      MACOS_ONLY_TESTS: test:vault-paths test:html-page-import test:live-page-capture test:live-page-capture-window test:live-page-capture-markup ${{ inputs.hosted && 'test:vault-gallery:write-windows' || '' }}
    steps:
      - name: Create job scratch
        shell: bash
        run: |
          job_tmp="$(cd "$RUNNER_TEMP" && pwd -P)"
          job_tmp="$(mktemp -d "$job_tmp/tw-job.XXXXXX")"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$job_tmp" "$job_tmp" "$job_tmp" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # test:board-panel (unit tier) runs `bun test`, so bun is needed before test:unit.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun packages
        if: ${{ inputs.hosted }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ inputs.hosted }}
        with:
          python-version: '3.12'
      - name: Prepare font coverage dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/talkweaver-font-venv"
          "$RUNNER_TEMP/talkweaver-font-venv/bin/python" -m pip install -r scripts/font-test-requirements.txt
          echo "$RUNNER_TEMP/talkweaver-font-venv/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - name: Prepare native Gallery tests
        run: npm run build:gallery-native:host
      - run: npm run typecheck
      - name: Unit tier (minus macOS-only scripts)
        run: |
          node scripts/run-tests.mjs --check
          read -r -a names <<< "$(node -p "const skip = process.env.MACOS_ONLY_TESTS.split(' '); require('./scripts/test-tiers.json').unit.filter((n) => !skip.includes(n)).join(' ')")"
          node scripts/run-tests.mjs "${names[@]}"
      - name: Worker tests
        run: bun test ./worker

  unit-macos:
    # The same unit tier on macOS, including the macOS-only scripts, where it matters:
    # pull requests into main, pushes to main and manual runs (so `hosted: true` covers it).
    # Not a required check.
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && !inputs.e2e_scripts && !inputs.nightly_dom)
    runs-on: ${{ inputs.hosted && 'macos-15' || fromJSON('["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 20
    steps:
      - name: Create job scratch
        shell: bash
        run: |
          job_tmp="$(cd "$RUNNER_TEMP" && pwd -P)"
          job_tmp="$(mktemp -d "$job_tmp/tw-job.XXXXXX")"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$job_tmp" "$job_tmp" "$job_tmp" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun packages
        if: ${{ inputs.hosted }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ inputs.hosted }}
        with:
          python-version: '3.12'
      - name: Prepare font coverage dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/talkweaver-font-venv"
          "$RUNNER_TEMP/talkweaver-font-venv/bin/python" -m pip install -r scripts/font-test-requirements.txt
          echo "$RUNNER_TEMP/talkweaver-font-venv/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - name: Prepare native Gallery tests
        run: npm run build:gallery-native:host
      - run: npm run test:unit

  nightly-dom:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly_dom)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 55
    outputs:
      failures: ${{ steps.summary.outputs.failures }}
    steps:
      - name: Create job scratch
        shell: bash
        run: |
          job_tmp="$(cd "$RUNNER_TEMP" && pwd -P)"
          job_tmp="$(mktemp -d "$job_tmp/tw-job.XXXXXX")"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$job_tmp" "$job_tmp" "$job_tmp" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: npx playwright install chromium-headless-shell
      - run: npm run build
      - name: Run the full DOM inventory
        shell: bash
        run: |
          npm run test:dom -- --jobs 4 | tee "$RUNNER_TEMP/nightly-dom.log"
      - name: Record results and dependency skips
        id: summary
        if: always() && !cancelled()
        shell: bash
        run: |
          log="$RUNNER_TEMP/nightly-dom.log"
          if test -f "$log"; then
            grep -E '^[0-9]+ passed, |^not run: |^failed: ' "$log" >> "$GITHUB_STEP_SUMMARY" || true
            failures="$(sed -n 's/^failed: //p' "$log" | tail -1)"
            printf 'failures=%s\n' "$failures" >> "$GITHUB_OUTPUT"
          fi

  nightly-dom-issue:
    needs: [nightly-dom, browser-tiers]
    if: >-
      always() && !cancelled() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' &&
      (needs.nightly-dom.result == 'failure' || needs.browser-tiers.result == 'failure')
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update nightly failure issues
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DOM_RESULT: ${{ needs.nightly-dom.result }}
          DOM_FAILURES: ${{ needs.nightly-dom.outputs.failures }}
          ELECTRON_RESULT: ${{ needs.browser-tiers.result }}
          ELECTRON_FAILURES: ${{ needs.browser-tiers.outputs.failures }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          report_failure() {
            local tier="$1" failed_scripts="$2"
            local title="TalkWeaver nightly $tier failures"
            local existing issue state failures
            local body="$RUNNER_TEMP/nightly-$tier-issue.md"
            existing=$(gh issue list --state all --search "\"$title\" in:title" --json number,title,state \
              --jq "map(select(.title == \"$title\")) | first | select(. != null) | \"\(.number) \(.state)\"")
            read -r issue state <<< "$existing"
            {
              printf 'The nightly Studio %s job failed on %s.\n\n' "$tier" "$GITHUB_SHA"
              if test -n "$failed_scripts"; then
                read -r -a failures <<< "$failed_scripts"
                printf -- '- %s\n' "${failures[@]}"
              else
                printf 'The job failed before it emitted a list of failed scripts.\n'
              fi
              printf '\n[Actions run](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            } > "$body"
            if test -n "$issue"; then
              gh issue edit "$issue" --body-file "$body"
              if test "$state" = CLOSED; then gh issue reopen "$issue"; fi
            else
              gh issue create --title "$title" --body-file "$body"
            fi
          }
          if test "$DOM_RESULT" = failure; then report_failure DOM "$DOM_FAILURES"; fi
          if test "$ELECTRON_RESULT" = failure; then report_failure Electron "$ELECTRON_FAILURES"; fi

  browser-tiers:
    # Nightly and manual Playwright and Electron coverage on macOS.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.nightly_dom)
    runs-on: ${{ inputs.hosted && 'macos-15' || fromJSON('["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 60
    outputs:
      failures: ${{ steps.summary.outputs.failures }}
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ (github.event_name == 'schedule' || inputs.e2e_scripts) && fromJSON('["e2e"]') || fromJSON('["dom","e2e"]') }}
    steps:
      - name: Create job scratch
        shell: bash
        run: |
          job_tmp="$(cd "$RUNNER_TEMP" && pwd -P)"
          job_tmp="$(mktemp -d "$job_tmp/tw-job.XXXXXX")"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$job_tmp" "$job_tmp" "$job_tmp" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun packages
        if: ${{ inputs.hosted }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # On the Studio runner PLAYWRIGHT_BROWSERS_PATH (runner .env) points at a shared
      # cache under ~/actions-runner, so browsers are not installed per user or globally.
      - name: Install Playwright Chromium
        run: npx playwright install chromium chromium-headless-shell
      - name: Build the OCR helper on macOS
        if: matrix.tier == 'e2e' && runner.os == 'macOS' && (!inputs.e2e_scripts || contains(inputs.e2e_scripts, 'test:ocr:e2e'))
        run: npm run build:ocr
      # Build once up front so parallel Electron tests do not race to rebuild out/.
      - run: npm run build
      - name: Run the full browser tier
        if: matrix.tier != 'e2e' || !inputs.e2e_scripts
        shell: bash
        run: |
          npm run test:${{ matrix.tier }} | tee "$TMPDIR/browser-tier.log"
      - name: Record nightly Electron failures
        id: summary
        if: always() && !cancelled() && github.event_name == 'schedule' && matrix.tier == 'e2e'
        shell: bash
        run: |
          log="$TMPDIR/browser-tier.log"
          if test -f "$log"; then
            grep -E '^[0-9]+ passed, |^not run: |^failed: ' "$log" >> "$GITHUB_STEP_SUMMARY" || true
            failures="$(sed -n 's/^failed: //p' "$log" | tail -1)"
            printf 'failures=%s\n' "$failures" >> "$GITHUB_OUTPUT"
          fi
      - name: Run selected desktop specs
        if: matrix.tier == 'e2e' && inputs.e2e_scripts
        env:
          TW_E2E_SCRIPTS: ${{ inputs.e2e_scripts }}
          TW_E2E_OUTPUT: ${{ inputs.e2e_output }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { spawnSync } from 'node:child_process'

          const scripts = process.env.TW_E2E_SCRIPTS.trim().split(/\s+/)
          const { e2e } = JSON.parse(readFileSync('scripts/test-tiers.json', 'utf8'))
          if (scripts.some(name => !e2e.includes(name)) || new Set(scripts).size !== scripts.length) {
            throw new Error('Choose unique script names from the desktop tier in scripts/test-tiers.json.')
          }
          const result = spawnSync(process.execPath, [
            'scripts/run-tests.mjs', '--jobs', '2', '--tail', '160',
            ...(process.env.TW_E2E_OUTPUT === 'true' ? ['--show-output'] : []), ...scripts,
          ], { stdio: 'inherit' })
          process.exitCode = result.status ?? 1
          NODE
      - name: Upload object matrix results and screenshots
        if: ${{ always() && matrix.tier == 'e2e' && contains(inputs.e2e_scripts, 'test:object-matrix:e2e') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: object-matrix
          path: artefacts/objects-matrix/
          retention-days: 7
