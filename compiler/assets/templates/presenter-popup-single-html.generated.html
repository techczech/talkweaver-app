  /* COMPARE LAYOUT (ADR-0005 "50/50 comparison", mockup .t-half). Two equal halves side by side
     filling the stage — half A on the section TINT, half B on PAPER. The nav-only
     heading (.slide-head-quiet) is not drawn ({title=show} restores a normal head above).
     Each half: a small-caps mono label in --accent, then vertically-centred content. Half B
     is one reveal beat (MODE_SELECTOR .layout-compare .compare-half.half-b). No italics, no
     underlines; boxed **strong** = accent chip with clone box-decoration. */
  mark.ink-marker {
    /* ==mark== highlighter (ADR-0019). Marker sweep, not a box: clone across wrapped lines,
       minimal vertical padding (ADR-0005 box rules), ink text over warm yellow. */
    background: linear-gradient(transparent 6%, #ffe45e 6%, #ffe45e 94%, transparent 94%);
    color: inherit;
    padding: 0 0.08em;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  /* ADR-0023 §6: an authored {title}/{closing} slide keeps every block past its subtitle
     paragraph. They render as `.tp-body` under the poster byline — byline type size, body ink,
     left-aligned, never dropped. The auto bookends emit no `.tp-body`, so they are untouched. */
  .slide-content.layout-title .tp .tp-body,
  .slide-content.layout-closing .tp .tp-body {
    margin-top: 1.6cqw;
    display: grid;
    gap: .55em;
    font-size: 2.05cqw;
    line-height: 1.45;
    color: var(--ink);
    text-align: left;
    max-width: 34em;
  }
  .slide-content.layout-title .tp .tp-body .content-p,
  .slide-content.layout-title .tp .tp-body li,
  .slide-content.layout-closing .tp .tp-body .content-p,
  .slide-content.layout-closing .tp .tp-body li {
    margin: 0;
    padding-left: 0;
    border-left: 0;
    background: none;
    max-width: none;
    font-size: inherit;
    line-height: inherit;
    text-align: left;
  }
  .slide-content.layout-title .tp .tp-body .feature-list,
  .slide-content.layout-closing .tp .tp-body .feature-list { gap: .4em; }
  .slide-content.layout-title .tp .tp-body .feature-list > li,
  .slide-content.layout-closing .tp .tp-body .feature-list > li { padding: 0; gap: .6em; }
  .image-quote {
    --quote-fitted-size: max(31px, 3.4cqw);
    display: grid;
    grid-template-columns: minmax(0, 0.62fr) minmax(0, 1fr);
    grid-template-rows: 1fr auto;
    column-gap: clamp(28px, 3.2cqw, 56px); row-gap: clamp(20px, 3cqh, 36px);
    align-items: center; width: 100%; align-self: center;
  }
  /* Slide round 2 (0.37): the slide already pads by --slide-pad-x; the second inset above made a table,
     icon-row, chart-column or card-gallery slide 212px narrower than a card slide at 1920. Dropped for
     those four; the other structures keep theirs until they are drawn. */
  /* ════════════════════════════════════════════════════════════════════════════════════════
     THE MEDIA SLOT — ADR-0023 §3, Dominik's pick B2: "text with media = always beside, stacked"

     ONE block owns the geometry of every copy-beside-media slide. The five stylesheet blocks
     that used to own it separately (.layout-list-visual / .layout-copy-visual / .split /
     .cards-media-split / .tv-body) are deleted: each sized its own copy column, and three of
     them scaled copy with bare `cqw`, which is how copy on a list-visual slide ended up at
     30.4px on a 1600-wide stage — below the ADR-0005 floor.

     Grammar (compiler/scripts/lib/slot-composition.mjs):
       div.slot[data-slot-side][data-slot-media-count] > div.slot-copy + div.slot-media

     Copy is always FIRST in the DOM; data-slot-side only decides which grid column the media
     column occupies, so {image=left} / {image=right} never reorders the reading order.
     ════════════════════════════════════════════════════════════════════════════════════════ */
  /* Media takes 38% and copy the rest (Ticket 21, Dominik: "prefer larger text next to images —
     we can always zoom in"; was the old .split's 42%). 38% is the locked mockup's portrait column
     beside text (`.iq` / `.image-quote { grid-template-columns: 38% 1fr }`, skin/list.css @order
     1505), so every text-beside-media composition shares one media width. Both columns centre in
     the content band (ADR-0005 both-axis balance). */
  .slot {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 38%;
    /* ONE row, and it is the whole band. An `auto` row would be as tall as the taller column —
       i.e. the COPY — and `height: 100%` on the media column would then resolve against the
       copy's height (three screenshots sharing 241px beside a three-line list). */
    grid-template-rows: minmax(0, 1fr);
    column-gap: clamp(20px, 4%, 64px);
    align-items: center;
    width: 100%;
    min-width: 0;
    min-height: 0;
  }
  .slot[data-slot-side="left"] { grid-template-columns: 38% minmax(0, 1fr); }
  .slot[data-slot-side="left"] > .slot-copy { grid-column: 2; grid-row: 1; }
  .slot[data-slot-side="left"] > .slot-media { grid-column: 1; grid-row: 1; }
  /* {align=top}: the one authored escape from both-axis centring (carried over from
     .split.align-top). */
  .slot[data-slot-align="top"] { align-items: start; }
  /* The slot FILLS the content band rather than sizing to its tallest image: the media column
     can only divide a height it actually has. Without this, `1fr` rows fall back to each
     image's intrinsic height and three stacked screenshots run off the bottom of the stage. */
  /* `flex-basis: 0` (not auto) is load-bearing: with `auto` the slot's height is decided BY its
     content, so `height: 100%` inside the media column is circular and the rows fall back to the
     images' intrinsic heights — which is how three screenshots pushed the content box past the
     stage at 1280x720. With basis 0 the slot IS the free space in the band, a definite height,
     and `minmax(0, 1fr)` rows divide it. */
  .slide[data-title-layout="left"] > .slide-content > .slot,
  .slide[data-title-layout="hidden"] > .slide-content > .slot { align-self: stretch; }
  /* COPY COLUMN — ONE SIZE. `--copy-size` is the slot's single copy type token: a paragraph, a
     list item, a quote and (Ticket 4) a claim all read at the same size inside one slot. Two
     sizes in one column — 43.2px prose next to 36.8px bullets — is exactly the inconsistency
     this programme removes, and it is what the five deleted blocks produced.

     The value is the deck's own body token --fs-body (skin/base.css, the shared floor or 2.3cqw), so the
     ADR-0005 floor of ~31px at 1600-wide presentation scale is IN the token and no number is
     invented here. No rule in this column may size copy with a bare `cqw`: that is the defect
     ADR-0023 §3 names, and test:slot-composition fails the build if one reappears.

     The selectors carry the [data-slot-side] attribute deliberately: the deck-wide
     `.slide-content:not(.layout-statement) .content-p:not(.card-comment)` rule is (0,4,0) and
     would otherwise keep prose at its own size inside the slot. */
  .slot > .slot-copy {
    --copy-size: var(--fs-body);
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: calc(0.6em * var(--list-gap, 1));
    font-size: var(--copy-size);
  }
  .slot > .slot-copy > * { margin-top: 0; margin-bottom: 0; }
  /* Spelled out rather than :is(…): test:css-modules checks every comma-separated selector part
     against this module's declared scopes, so each part must name .slot-copy itself. */
  /* Running text keeps a measure; the column is already narrow, so the cap is generous. */
  .slot > .slot-copy .content-p { max-width: 34ch; }
  /* Ticket 21: a table beside media reads at the column's one copy size too (Dominik: "larger
     font — eqv of current xl is minimum"); the dense step under it is gone. */
  .slide .slot[data-slot-side] > .slot-copy .slide-table td,
  .slide .slot[data-slot-side] > .slot-copy .slide-table th { font-size: var(--copy-size); }
  /* MEDIA COLUMN. Every media block is its own row and the rows share the column height
     equally (2 → two rows, 3 → three, 4 → four); aspect ratio is preserved by object-fit.
     The column's height is THE CONTENT BAND — the slot stretches to it above, so `height:100%`
     is a definite height and `minmax(0, 1fr)` rows genuinely divide it. There is deliberately
     NO vh cap: a fixed `max-height` is unrelated to the band, so at some viewports it leaves
     dead space and at others the stack runs off the bottom of the stage (it did: the third of
     three screenshots was cut by the slide edge). The band bounds it, and only the band. */
  .slot > .slot-media {
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-auto-rows: minmax(0, 1fr);
    gap: clamp(10px, 1.6%, 24px);
    align-content: stretch;
    justify-items: center;
    height: 100%;
    max-height: 100%;
    /* `overflow: hidden` is load-bearing, not belt-and-braces: it makes the column's automatic
       minimum size 0, which BREAKS the percentage-height circularity (the column's height comes
       from the slot, the slot's from the flex line, the line's from the column's min-content).
       Without it the rows fall back to the images' intrinsic heights — 1506px of column inside
       an 810px band — and the deck's autofit rescues the overflow by zooming the whole slide to
       45%. Same idiom as .image-grid .ig-media above. */
    overflow: hidden;
  }
  /* 5+ media blocks as 5+ rows leaves each a letterbox strip, so the column becomes a
     2-column grid at that point (stamped data-slot-media-grid="2col" by the compiler). */
  .slot[data-slot-media-grid="2col"] > .slot-media { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  /* Every media unit is the same box: it fills its row and contains its content. `min-height: 0`
     on each is what lets a `1fr` row shrink below the media's intrinsic size — without it the
     row's automatic minimum is the image's own height and the column overflows the band. */
  /* ABSOLUTE-INSET CONTAINMENT — the same idiom as .image-grid .ig-media above, and the thing
     that actually bounds the column. An in-flow image CONTRIBUTES its intrinsic height to the
     row, so `minmax(0, 1fr)` rows in a grid whose own height is a percentage of a flex item
     resolve to max-content: three 640x360 screenshots asked for 1452px of column inside an
     810px band, and the deck's autofit rescued that by zooming the whole slide to its 0.45
     floor. Taking the media OUT OF FLOW makes each row's max-content 0, so the rows can only
     ever divide the band the slot was given.

     `inset: 0` + `margin: auto` + auto width/height keeps the NEVER-UPSCALE contract: the image
     sits at its intrinsic size, centred, clamped by max-width/max-height against the row — it is
     scaled DOWN to fit and never stretched up (which `object-fit: contain` alone would do). */
  .slot > .slot-media figure.slide-figure img,
  .slot > .slot-media figure.slide-figure video,
  .slot > .slot-media > img,
  .slot > .slot-media > video {
    position: absolute;
    inset: 0;
    margin: auto;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    min-height: 0;
    object-fit: contain;
    cursor: zoom-in;
  }
  .slot > .slot-media figure.slide-embed {
    position: relative;
    aspect-ratio: auto;
    min-height: 0;
    max-height: 100%;
    display: block;
  }
  .slot > .slot-media figure.slide-embed iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    min-height: 0;
  }
  .slot > .slot-media .timeline { margin-top: 0; }
  /* A narrow stage: the two columns stack, copy first. ADR-0030: keyed to the stage (the slide
     canvas), not the window, like every other layout's narrow rule — a slide view scales the
     canvas and never re-lays the slide out for a narrow window. */
  @container (max-width: 950px) {
    .slot,
    .slot[data-slot-side="left"] { grid-template-columns: minmax(0, 1fr); row-gap: 18px; }
    .slot[data-slot-side="left"] > .slot-copy,
    .slot[data-slot-side="left"] > .slot-media { grid-column: 1; grid-row: auto; }
    .slot > .slot-copy .content-p { max-width: none; }
    .slot > .slot-media { height: auto; max-height: none; grid-auto-rows: minmax(0, auto); }
  }
  .slot > .slot-copy .slide-table { margin: 0; min-width: 0; }
  .slot > .slot-media > * {
    margin: 0;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    max-height: 100%;
  }
  .slot > .slot-media figure.slide-figure { position: relative; display: block; max-height: 100%; }
  /* A captioned figure keeps the caption in flow at the foot of its row; the image gives it room. */
  .slot > .slot-media figure.slide-figure > figcaption {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 0;
  }
  /* === ADR-0023 §4 — THE CLAIM ===
     A paragraph whose WHOLE text is bold is the speaker's CLAIM. ADR-0005 reserves bold for a
     deliberate INLINE highlight, so the claim is never carried by weight: `plain` (C1, the
     default) carries it by SIZE, `bar` (C2) by a section-accent bar. A claim is still a
     `.content-p`, so every container rule and the stepping selector already reach it.

     SIZE IS RELATIVE, not a second literal: `--copy-size` is the body-copy step (the universal
     .content-p size, layouts/statement.css @order 0024), so a copy column can rescale every claim
     inside it by redefining that ONE property. The statement layout is excluded exactly as the
     universal .content-p rule excludes it — a statement paragraph IS already large plain ink, and
     re-sizing it here would shrink it.

     ORDER (renumbered 1810-1814 → 1846-1850 on the composition merge, where Ticket 3's media
     slot had already claimed 1810-1845): this block must sit AFTER the universal .content-p
     sizing it overrides (layouts/statement.css @order 0024), and nothing needs to beat it by
     ORDER. The slot's own copy sizing (layouts/media.css @order 1824) is (0,5,0) against this
     block's (0,6,1), so those two are settled by SPECIFICITY, not position; and `--copy-size`
     is DEFINED on `.slide-content` here and REDEFINED on `.slot-copy` there — different
     elements, so the property resolves by proximity either way. The move is therefore inert:
     a claim inside a slot measures identically before and after it. */
  .slide .slide-content p.content-p.claim {
    font-weight: 400;
    color: var(--ink);
  }
  .slide .slide-content:not(.layout-statement) p.content-p.claim[data-claim-style="plain"] {
    font-size: calc(var(--copy-size) * 1.15);
    border-left: 0;
    padding-left: 0;
  }
  .slide .slide-content:not(.layout-statement) p.content-p.claim[data-claim-style="bar"] {
    font-size: var(--copy-size);
    border-left: 4px solid var(--accent);
    padding-left: 18px;
  }
  .slide .slide-content.layout-statement p.content-p.claim[data-claim-style="bar"] {
    border-left: 4px solid var(--accent);
    padding-left: 18px;
  }
  .slide[data-title-layout="top"] > .slide-content.layout-code {
    height: min(820px, 86cqh);
    min-height: 0;
    padding-bottom: max(0px, calc(59px - var(--slide-pad-y)));
  }
  .slide[data-title-layout="top"] > .slide-content.layout-code > .slide-head {
    margin-bottom: 0 !important;
  }
  s {
    /* ~~strike~~ (ADR-0005 amendment 2026-10-06: a mark the author typed is content, not
       decoration). Line in the text's own colour; the words stay legible on a projector. */
    text-decoration: line-through;
    text-decoration-color: currentColor;
    text-decoration-thickness: 0.08em;
    opacity: 0.62;
  }
  u {
    /* ++underline++: solid accent line, clear of descenders. Reads on light and dark slides
       because --accent is the section accent on both. */
    text-decoration: underline solid var(--accent);
    text-decoration-thickness: 0.08em;
    text-underline-offset: 0.18em;
    text-decoration-skip-ink: auto;
  }
  .card-gallery.cards-rows .card.card-claim { grid-template-columns: minmax(0, 1fr); }
  .card-gallery .card.card-claim {
    justify-content: center;
  }
  .card-gallery .card.card-claim h4 {
    margin-bottom: 0;
    font-size: max(calc(var(--type-floor) * 1.15), calc(var(--fs-body) * 1.15));
    font-weight: 500;
    line-height: 1.25;
    color: var(--ink);
  }
  /* === Ticket 18 — LONG-LIST FITTING SEAM ===
     `--list-lh` is every list item's leading and `--list-gap` a unitless multiplier on the air
     between items (row padding .55em, grid gaps, sub-list gaps, slot-copy gaps): 1 is today's
     spacing, .64 puts the row padding at its .35em floor. A crowded list gives up leading FIRST
     (1.35 → 1.18), then air (1 → .64), and only then type — never below --type-floor.
     Two writers, one seam: the compiler stamps data-list-density from the item count so print
     and static renders tighten too; the presenter runtime (fitLists) measures the real column
     and writes the same two properties inline on .slide-content. The content column keeps its
     top/bottom margins — the block is centred on both axes, so a fitted list only gains air. */
  /* Slot lists join the long-list fitting seam: leading tightens before type (Ticket 18). */
  .slide-content:has(> .feature-list[data-list-density="long"]),
  .slide-content:has(> .slot > .slot-copy > .feature-list[data-list-density="long"]) { --list-lh: 1.25; --list-gap: .82; }
  .slide-content:has(> .feature-list[data-list-density="dense"]),
  .slide-content:has(> .slot > .slot-copy > .feature-list[data-list-density="dense"]) { --list-lh: 1.18; --list-gap: .64; }
  /* A source line with italics, bold or a link keeps its text in ONE flex item (the quote renderer wraps it),
     so it reads as a flowing line that wraps beside the bar. */
/* QUOTE FORMS: colour and type (geometry: layouts/quote.css). The interface face inside a drawn
   interface is the system stack, as on the X post card, and quoted words are weight 400 in every
   form (never bold). The card is X's light theme; there is no dark skin yet. The small chrome inside
   it (24 to 42 px) sits outside the type floor like .sim (ADR-0038). */
  /* === Ticket 21 — TABLE FILLS THE BAND (Dominik: "adjust table size to minimise vertical white
     space"). Row padding scales with the room the band leaves: --table-band is a conservative
     estimate of the title-to-footer band (stage minus the 6cqh title offset, the title bar, the
     slide margins and the 59px footer band, ~85% of the real band at 1600x900 and 1280x720), and
     --table-rows is stamped by the compiler. The padding is clamped so a two-row table never
     balloons (1.1em) and a crowded one never crushes (.45em); the auto margins the top regime gives
     the first/last child keep the table centred with equal air above and below. A table taller than
     the band is measured by the presenter runtime (fitLists, the Ticket 18 seam): --list-lh steps
     the cell leading, --list-gap the padding, then --fs-body the type, never below the floor. */
  .slide-table thead th,
  .slide-table tbody td,
  .slide-table tbody th {
    padding-top: calc(var(--table-row-pad) * var(--list-gap, 1));
    padding-bottom: calc(var(--table-row-pad) * var(--list-gap, 1));
    /* Slide round 2 (0.37): cells give up side padding (was .8em) so the width goes to the text. */
    padding-left: .9cqw;
    padding-right: .9cqw;
    line-height: var(--list-lh, 1.35);
    vertical-align: middle;
  }
  /* {table-columns=off}: hairline rules between rows only — no column dividers, no side borders. */
  /* {table-header=off}: the compiler renders the first row inside tbody, so it already reads as a
     plain row; the table keeps its top hairline where the tinted header used to sit. */
  /* Compile-time density for tables — the same two properties the list seam and fitLists write. */
  .slide-content:has(> .slide-table[data-list-density="dense"]) { --list-lh: 1.18; --list-gap: .64; }
  /* === Ticket 21 — GROUPED / KEY-VALUE LISTS (Dominik: "smaller between-list spacing using subtle
     division lines"). A plain list whose items carry sub-lists is a run of groups: the groups sit
     in a tight hairline-separated rhythm — ~.5em above and below each group, a hairline between
     them and closing the run — instead of the open 14px + 2.8cqh row gaps a flat list keeps. Items
     inside a group keep the Ticket 18 leading (--list-lh) and their own 4px sub-list gap. */
  .slide-content > .feature-list.fl-has-children:not(:has(.fl-icon)) > li {
    border-top: 1px solid var(--hairline);
    padding: calc(.5em * var(--list-gap, 1)) 0;
  }
  .slide-content > .feature-list.fl-has-children:not(:has(.fl-icon)) > li:last-child {
    border-bottom: 1px solid var(--hairline);
  }
  /* === Ticket 21 — SLOT BULLETS (Dominik: "bullet formatting needs to be better visually").
     A plain list beside media renders as the list layout's rows (mockup .icon-list .item:
     hairline-separated rows, no card chrome) instead of bare text lines: hairline above every
     item and below the last, the same .55em row padding on the --list-gap seam, the Ticket 18
     leading. Nested items keep the global .fl-sublist marker and its .45em column gap. */
  .slot > .slot-copy > .feature-list:not(:has(.fl-icon)) > li {
    border-top: 1px solid var(--hairline);
    padding: calc(.55em * var(--list-gap, 1)) 0;
    font-weight: 400;
  }
  .slot > .slot-copy > .feature-list:not(:has(.fl-icon)) > li:last-child {
    border-bottom: 1px solid var(--hairline);
  }
  /* === Ticket 21 — IMAGE + CLAIM: the picture takes the slot's 38% media width and the claims
     read at 1.15x the body token (the ADR-0023 §4 claim step; Dominik: "prefer larger text next
     to images"). The band centres the pair like every other text-beside-media composition. */
  .slide-content.layout-image-claim .callouts li {
    font-size: max(calc(var(--type-floor) * 1.15), calc(var(--fs-body) * 1.15));
    line-height: 1.25;
    padding: .2em 0 .2em .4em;
  }
  /* The visible footer band starts 61px above the stage bottom (headless Chromium, 2026-09-13:
     .footer rect top = 839 at 900; media.css @order 0280 reserves the band the same way for a lone
     figure): reserve what the slide margin does not already clear, and replace the title bar's
     fixed gap with the same 2cqh on both sides so the top regime's auto margins split the exact
     title-to-footer band — equal air above and below the table. */
  /* 2cqh is the minimum air on both sides: a table that needs the whole band never touches the
     title rule or the footer. The head's margin sits inside the span fitLists measures. */
  /* The slot fills the band (flex-basis 0 above), so the band must stop above the footer, whose
     band starts 61px above the stage bottom (.footer rect top = 839 at 900): reserve what the slide
     margin does not already clear (the reservation media.css @order 0280 makes for a lone figure).
     Without it the last hairline row sat under the footer. */
.slide[data-title-layout="hidden"] .slide-content.layout-media:has(> figure.slide-embed),
.slide[data-title-layout="hidden"] .slide-content.layout-media > figure.slide-embed { height: 100%; }
  .slide:has(> .slide-content.layout-timeline) {
    --tl-footer-band: 61px;
    --tl-head-gap: max(2.2cqh, 2.6cqw);
    padding-bottom: calc(var(--tl-footer-band) + var(--tl-head-gap));
  }
  .slide:has(> .slide-content.layout-timeline) > .slide-content.layout-timeline {
    min-height: 0;
    height: 100%;
    /* The slide's own padding above reserves the footer band and the air under the track, so the
       shared content band (skin/slide-foundations.css) adds nothing more. */
    --band-footer: 0px;
    --band-air: 0px;
  }
  /* Timeline only: the gap under the title rule is at least 2.4cqw (ticket 09, ADR-0033 §8). The shared compact
     title spacing (stage.css @order 1368/1680, 2.2cqh) is unchanged for every other layout. */

  /* RAIL over stops (ADR-0028 §3, round-2 timeline B): one hairline rail, a ring dot per STOP, the
     bold sans date BESIDE its text (skin/timeline.css @order 1446-1455). Five stops must fit the
     band at both stages: the text sits on the body size (--fs-body, 3.2cqw; ADR-0033 §8) and each stop is one
     row, so five one-line stops take 5 x ~1.9em inside the ~600px band under a two-line head. */
  .timeline.timeline-rail[data-tl-stops] { font-size: var(--fs-body); }
  .timeline.timeline-rail[data-tl-stops] .tl-group { padding: .3em 0 .3em 1.9em; }
  .timeline.timeline-rail[data-tl-stops] .tl-group + .tl-group { margin-top: 0; }
  .timeline.timeline-rail[data-tl-stops] .tl-group::before { top: calc(1.02em - 7px); }
  .timeline.timeline-rail[data-tl-stops] .tl-group-head { margin: 0; line-height: 1.15; }
  .timeline.timeline-rail[data-tl-stops] .tl-entries { gap: .2em; }
  /* One marker per stop: the skin's ring dot on the rail (mockup). The layout sheet's filled dot
     on the group head (@order 0960) would draw a second dot beside the date. */
  .timeline.timeline-columns[data-tl-stops] {
    grid-template-columns: repeat(var(--tl-cols, 2), minmax(0, 1fr));
    gap: 1em 1.4em; font-size: max(var(--type-floor), 2.2cqw);
  }
  .timeline.timeline-columns[data-tl-stops] .tl-group-head { font-size: max(var(--type-floor), .62em); margin-bottom: .45em; }
  .timeline.timeline-columns[data-tl-stops] li { display: block; }

  /* HORIZONTAL over stops (ADR-0028 §3): the bold sans label reads above its text, the text wraps

.preview .remote-preview-tools .embed-interact-chip {
  position: static; display: inline-flex; transform: none; margin: 0; max-width: 100%;
}
/* A live web page (decks TalkWeaver opens itself, ?livepage=1): main lays the page, a separate view,
   over the slot (src/main/live-page-host.ts). The slot shows the page's state while that view is
   hidden: loading, failed, blocked. In the slide, the never-loaded frame stays as the layout box. */
.live-page-figure { position: relative; }
.live-page-figure > iframe[data-live-page] { visibility: hidden; }
.live-page-figure > .embed-interact-chip { display: none; }
.live-page-slot {

/* Saved views of a web page (the capture gallery, lib/live-page-captures.mjs). Where the page is not

   is never loaded there. */
.slide-embed.has-saved-views { position: relative; }

}

.embed-saved-view > img { flex: 1 1 auto; min-height: 0; width: 100%; height: auto; object-fit: contain; object-position: top center; background: #fff; }

.live-page-frozen > img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center; }

.live-page-tools .live-page-gallery[aria-pressed="true"] { background: var(--accent, #0b6bcb); color: #fff; }
.live-page-tools .live-page-capture-note { display: block; font-size: 12px; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Title in a left panel (data-title-layout="left") on a slide that also shows the section's
   contents rail (.ct-rail-host, painted by the deck runtime): the rail owns the leftmost strip,
   so the title column starts where the rail ends: rail, title column, body.

   The title column keeps its own tint but the tint no longer starts at the slide edge, so there
   is no second band behind the rail. Column widths are the Placement values (30, 35, 40, 50)
   measured on the space to the right of the rail: --ct-title-w = share * (100cqw - --ct-rail-w).
   Measured on the whole slide the 50 column would leave the body about 330px at 1280 wide.
   Every selector is scoped to .ct-rail-host, so slides outside a contents section are untouched.

   Specificity beats stage.css without !important, except grid-template-columns, which
   stage.css sets with !important.

   Not in print: base.css hides the rail there and removes the content padding, so the print
   page keeps the plain title panel. */
@media not print {
  .slide.ct-rail-host[data-title-layout="left"] { --ct-title-w: calc((100cqw - var(--ct-rail-w)) * .26); }
  .slide.ct-rail-host[data-title-layout="left"][data-split="30"] { --ct-title-w: calc((100cqw - var(--ct-rail-w)) * .30); }
  .slide.ct-rail-host[data-title-layout="left"][data-split="35"] { --ct-title-w: calc((100cqw - var(--ct-rail-w)) * .35); }
  .slide.ct-rail-host[data-title-layout="left"][data-split="35"]:has(> .slide-content > .fl-annotated) { --ct-title-w: calc((100cqw - var(--ct-rail-w)) * .26); }
  .slide.ct-rail-host[data-title-layout="left"][data-split="40"] { --ct-title-w: calc((100cqw - var(--ct-rail-w)) * .40); }
  .slide.ct-rail-host[data-title-layout="left"][data-split="50"] { --ct-title-w: calc((100cqw - var(--ct-rail-w)) * .50); }

  .slide.ct-rail-host[data-title-layout="left"]:has(> .slide-content > .slide-head:not(.slide-head-quiet)) {
    background: linear-gradient(to right, transparent 0, transparent var(--ct-rail-w), var(--tint) var(--ct-rail-w), var(--tint) calc(var(--ct-rail-w) + var(--ct-title-w)), transparent calc(var(--ct-rail-w) + var(--ct-title-w)));
  }
  .slide.ct-rail-host[data-title-layout="left"]:has(> .slide-content > .slide-head:not(.slide-head-quiet)) > .slide-content {
    grid-template-columns: var(--ct-title-w) 1fr !important;
  }
  /* The head is positioned against the slide-content padding box, which starts at the slide edge:
     move it right by the rail width so it sits in the first grid column. */
  .slide.ct-rail-host[data-title-layout="left"] > .slide-content:has(> *:not(.slide-head)) > .slide-head:not(.slide-head-quiet) {
    left: var(--ct-rail-w);
    width: var(--ct-title-w);
  }
}
/* Embedded local page (0.38 ticket 11): the labelled box shown wherever the page is not running.
   The compiler writes it into the figure beside an empty sandboxed frame (embed-frame.mjs); the
   deck runtime sets data-embed-state="live" on the figure only while its slide is being presented.
   Everything here is CSS on compiled markup, so previews, thumbnails, print and a page with no
   script show the box. It covers the frame's own area (the frame keeps its place in the layout,
   hidden), so a slide is laid out the same whether the page runs or not. */
.embed-poster { display: none; }
figure.slide-embed[data-embed="local"]:not([data-embed-state="live"]) > iframe { visibility: hidden; }
figure.slide-embed[data-embed="local"]:not([data-embed-state="live"]) > .embed-interact-chip { display: none; }
figure.slide-embed[data-embed="local"]:not([data-embed-state="live"]) > .embed-poster {
  position: absolute;
  inset: 0;
  z-index: 1;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.5em;
  padding: 1em 1.5em;
  overflow: hidden;
  text-align: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
  color: var(--ink);
  font-family: inherit;
  line-height: 1.25;
}
.embed-poster-icon { display: inline-flex; color: var(--accent); }
.embed-poster-icon svg { display: block; width: clamp(24px, 3.2cqw, 56px); height: clamp(24px, 3.2cqw, 56px); }
.embed-poster-kind {
  font-size: clamp(11px, 1.2cqw, 20px);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}
.embed-poster-title {
  max-width: 100%;
  font-size: clamp(16px, 2.3cqw, 40px);
  font-weight: 650;
  overflow-wrap: anywhere;
}
.embed-poster-note { font-size: clamp(11px, 1.3cqw, 22px); color: var(--muted); }
/* A page stopped by the focus budget (runtime/embed-focus.js): the placeholder says so. */
figure.slide-embed[data-embed="local"][data-embed-stopped] > .embed-poster .embed-poster-note { display: none; }
figure.slide-embed[data-embed="local"][data-embed-stopped] > .embed-poster::after {
  content: "Stopped: a page on this slide kept taking the keyboard";
  font-size: clamp(11px, 1.3cqw, 22px);
  color: var(--muted);
}
/* A stopped page keeps its Interact chip: it is how the person runs that one page again. (Not on
   the audience display, in a preview or in print, where the chip never shows.) */
body:not(.audience-mode) figure.slide-embed[data-embed="local"][data-embed-stopped] > .embed-interact-chip { display: inline-flex; }
.preview figure.slide-embed[data-embed="local"][data-embed-stopped] > .embed-interact-chip { display: none; }
@media print { figure.slide-embed[data-embed="local"][data-embed-stopped] > .embed-interact-chip { display: none; } }
/* Print hides every embed frame, so the box stands in the flow there, live or not. */
@media print {
  figure.slide-embed[data-embed="local"] > .embed-poster {
    position: static;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5em;
    min-height: 9em;
    padding: 1em 1.5em;
    text-align: center;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
}

/* Embedded page full screen (0.38 ticket 13), like the image zoom: the page's figure covers the
   whole slide, title and text behind it. It is the slide stage, not the browser's full screen, and
   it is a size change only: the figure and its frame stay where they are in the document, so the
   page keeps running. Every box between the slide and the figure stops being a positioning or
   clipping context, so the figure's box is the slide's. */
.slide.embed-full-screen :has(figure.slide-embed.embed-stage-expanded) { position: static !important; zoom: 1 !important; transform: none !important; contain: none !important; container-type: normal !important; overflow: visible !important; filter: none !important; }
.slide.embed-full-screen figure.slide-embed.embed-stage-expanded { position: absolute !important; inset: 0 !important; border: 0 !important; border-radius: 0 !important; padding: 0 !important; z-index: 20; box-sizing: border-box; width: 100% !important; height: 100% !important; max-width: none !important; max-height: none !important; margin: 0 !important; background: var(--paper, #fff); }
.slide.embed-full-screen figure.slide-embed.embed-stage-expanded > iframe { width: 100% !important; height: 100% !important; max-height: none !important; min-height: 0 !important; border: 0 !important; border-radius: 0 !important; }

/* The presenter's Current pane (ticket 11.2, after the security review): a cover over the live
   page takes the first press, in the deck's own document, which is how the deck knows the person
   chose to use the page. It steps aside while the pane is engaged. */
.preview.preview-live-sim .live-sim-cover {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: flex-start;
  justify-content: flex-end;
  margin: 0;
  padding: 8px 10px;
  border: 0;
  background: transparent;
  cursor: pointer;

.preview.preview-live-sim.embed-engaged .live-sim-cover { display: none; }
/* A page stopped by the focus budget: the cover stands for the page and says so. */
.preview.preview-live-sim.embed-stopped .live-sim-cover {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--paper, #fff);
}
.preview.preview-live-sim.embed-stopped > iframe.live-sim-frame { visibility: hidden; }
/* The pane shows the slide around the page (0.38 ticket 13): the slide's picture is the pane's
   first frame, the page's frame lies over its place in it (the deck sets the box), and the
   full-screen button sits inside the page's top-right corner, under the cover's label. */
.preview.preview-live-sim > iframe.live-sim-frame[data-embed-local] { z-index: 1; }
.preview.preview-live-sim > .embed-stage-fullscreen {
  position: absolute;
  z-index: 3;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: rgba(11, 17, 23, 0.82);
  color: #fff;
  cursor: pointer;
}
.preview.preview-live-sim > .embed-stage-fullscreen:hover,
.preview.preview-live-sim > .embed-stage-fullscreen[aria-pressed="true"] { background: rgba(11, 17, 23, 0.95); }
.preview.preview-live-sim > .embed-stage-fullscreen:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.preview.preview-live-sim > .embed-stage-fullscreen > .tw-btn-label { display: none; }
.live-sim-cover-note { font: 500 12px/1.3 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--muted, #555); }
.live-sim-cover-label {
  font: 600 12px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #fff;
  background: rgba(11, 17, 23, 0.78);
  padding: 5px 10px;
  border-radius: 999px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
}
.live-sim-cover:hover .live-sim-cover-label { background: rgba(11, 17, 23, 0.95); }
.live-sim-cover:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* === Emphasis appears on Next (0.38 ticket 02) ===
     On a slide with {emphasis-steps} the compiler marks every bold, underline, strikethrough and
     highlight in the body with data-emph-step, and the runtime writes data-emph-state="off" on a
     span whose step has not come ("on", or no attribute, shows the emphasis: handouts, print,
     thumbnails and previews of other slides never carry "off").

     NOTHING HERE CHANGES LAYOUT. A span that is off keeps every box it has when on, and only its
     paint differs, so no word moves when emphasis turns on and the slide fit measures one geometry.
       highlight   the marker sweep has no width yet
       underline   bold, using the same paint-only reveal as strong (owner, 17 Nov 2026)
       strike      the line is transparent and the text is at full strength
       bold        the <strong> keeps its weight, padding and box; its colour, background and
                   shadow fall back to the surrounding text's, the bold glyphs are not filled, and
                   each word (.es-w, one span per unbreakable piece) draws its own text over
                   itself at the weight of the text around the bold (--emph-plain-weight, read
                   from the parent by the runtime; 400 until then). The copy is centred on the
                   bold word's box, which is the wider of the two.
     Screen only: print shows all emphasis whatever state the page was left in. */
  .es-w { position: relative; white-space: nowrap; }
  @media screen {
    :is(strong, u)[data-emph-step] .es-w::before {
      content: attr(data-w);
      content: attr(data-w) / "";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: var(--emph-plain-weight, 400);
      line-height: normal;
      white-space: nowrap;
      -webkit-text-fill-color: currentColor;
      opacity: 0;
      pointer-events: none;
      user-select: none;
    }
    :is(strong, u)[data-emph-state="off"] {
      color: inherit !important;
      background-color: transparent !important;
      background-image: none !important;
      box-shadow: none !important;
      text-shadow: none !important;
      border-color: transparent !important;
    }
    :is(strong, u)[data-emph-state="off"] .es-w { -webkit-text-fill-color: transparent; }
    :is(strong, u)[data-emph-state="off"] .es-w::before { opacity: 1; }

    mark.ink-marker[data-emph-step] { background-repeat: no-repeat; background-size: 100% 100%; }
    mark.ink-marker[data-emph-state="off"] { background-size: 0% 100%; }
    s[data-emph-state="off"] { text-decoration-color: transparent; opacity: 1; }

       paint, so arriving on a slide never animates its emphasis away. */
    .slide.emph-anim [data-emph-step] {

    .slide.emph-anim :is(strong, u)[data-emph-step] .es-w::before { transition: opacity 200ms ease; }

    .slide.emph-anim [data-emph-step],
    .slide.emph-anim :is(strong, u)[data-emph-step] .es-w,
    .slide.emph-anim :is(strong, u)[data-emph-step] .es-w::before { transition: none; }
  }
  /* === Key caps and practice quotations (onboarding 0.38.1, ticket 05) ===
     `<kbd>⌘K</kbd>` in outline text renders as <kbd class="key-cap"> (renderInline and the phone
     text view; the class is constant, never authored). The face is the UI sans, not the deck face
     and never a monospace: the letter O and the digit 0 must read differently ("the letter O"
     was drawn as a zero by the mono face in the 9 October drawing). Modifier glyphs show as
     typed. Colours follow the text colour, so a key cap reads on light and dark slides alike;
     on paper they match the drawing (states 05 to 07). The type never drops below 12px. */
  kbd.key-cap {
    display: inline-block;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-style: normal;
    font-weight: 500;
    font-size: max(12px, .8em);
    line-height: 1.3;
    letter-spacing: .02em;
    padding: .04em .36em .02em;
    margin: 0 .04em;
    border: 1px solid color-mix(in srgb, currentColor 24%, transparent);
    border-bottom-width: 2px;
    border-radius: .24em;
    background: color-mix(in srgb, currentColor 6%, transparent);
    color: color-mix(in srgb, currentColor 82%, transparent);
    vertical-align: .06em;
    white-space: nowrap;
    text-transform: none;

     quotation mark, no tint and no cite. Quotations without a key cap keep the quote device. */
  .slide-content > blockquote.practice-quote,
  .slide-content blockquote.practice-quote {
    max-width: 46ch;
    margin: clamp(18px, 3.4cqh, 34px) 0 0;
    padding: .08em 0 .08em .85em;
    border-left: max(4px, .5cqw) solid var(--accent);
    background: none;
    box-shadow: none;
    font-family: var(--sans);
    font-style: normal;
    line-height: 1.5;
    color: var(--ink);
  }
  .slide-content blockquote.practice-quote::before { content: none; display: none; }
  .slide-content blockquote.practice-quote p { margin: 0 0 .3em; font-style: normal; }
  .slide-content blockquote.practice-quote p:last-of-type { margin-bottom: 0; }
  /* Plain bold in ink: not the accent colour of quote bold, not the statement layout's box. */
  .slide-content blockquote.practice-quote strong { color: inherit; font-weight: 700; background: none; padding: 0; border-radius: 0; }

  /* Cards keep no gap under a plain top title; the shared content band (skin/slide-foundations.css)
     mirrors that under the cards, so they centre between the title and the footer band. */
  .slide[data-title-layout="top"]:not([data-title-look]) > .slide-content.layout-cards { --band-air: 0px; }
  /* Cards cap their height to the stage and scroll INTERNALLY when content still overflows
     after the dense step — so a long quote is always fully reachable, never silently clipped.
     A bottom gradient fade (the ::after, shown only while .is-scrollable) signals "more below". */

  /* ADR-0023 §2 + ADR-0005 (whitespace balance on BOTH axes): the parent carousel slide now takes
     the `top` regime, so its title owns the top band and the stepped frames own the rest. A
     sub-slide is ONE block — its own title and its body together — vertically centred in that
     band, never a title pinned under the slide title with the body floating mid-stage. The
     sub-slide title reads one step below the slide title (--fs-rail under --fs-title) so the two
     never compete. */
  .card-gallery.carousel .card.carousel-subslide > .slide-content {
    display: flex !important;
    flex-direction: column;
    justify-content: center;
    align-items: stretch;
    gap: clamp(10px, 1.8cqh, 24px);
  }
  /* The band under a top title (the carousel's own regime, ADR-0023). A side-title carousel keeps its 0.44 drawing, and
     so does a carousel the fitter marks data-carousel-legacy (a card that cannot be fitted; see the end of this block).
     - Every child of a top-title slide is `flex: 0 1 auto` (stage.css), so the gallery was only as tall as its card,
       and the card's slide min-height (86cqh, base.css) stood in for the band: the card was taller than the room
       between the title and the dots and ran over them. The gallery now takes that room and the card fills it.
     - `safe center`: a card, or an item's copy, taller than the band starts at its top instead of spilling over the
       slide title. A card that needs more than the band is the fitter's (runtime/slide-fit.js fitCarouselCard).
     - A carousel card is not a scroll box, so the "more below" fade of a scrollable stepped card (densifyActiveCards,
       .is-scrollable) would only paint over its words. */
  .slide[data-title-layout="top"] > .slide-content.layout-carousel:not([data-carousel-legacy]) > .card-gallery.carousel { flex: 1 1 auto; min-height: 0; }
  .slide[data-title-layout="top"] > .slide-content.layout-carousel:not([data-carousel-legacy]) > .card-gallery.carousel > .card.carousel-subslide > .slide-content {
    justify-content: safe center;
    min-height: 0;
  }
  .slide[data-title-layout="top"] > .slide-content.layout-carousel:not([data-carousel-legacy]) > .card-gallery.carousel > .card.carousel-subslide > .slide-content > .slot { align-items: safe center; }
  .slide[data-title-layout="top"] > .slide-content.layout-carousel:not([data-carousel-legacy]) > .card-gallery.carousel > .card.carousel-subslide.is-scrollable::after { content: none; }
  /* A carousel one of whose cards needs the dots' band (fitCarouselCard): the dots sit in the slide's foot padding,
     clear of the content, and the gallery takes the whole band. While the deck's control bar shows, the dots rise
     clear of it (--carousel-chrome-clear: how far the bar reaches into the slide, canvas px, set by the fitter) so
     they stay visible and take their own clicks. */
  .slide[data-title-layout="top"] > .slide-content.layout-carousel:not([data-carousel-legacy])[data-carousel-dots="foot"] > .gallery-nav {
    position: absolute; left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 0;
    width: auto; height: var(--slide-pad-y); margin: 0;
    transition: bottom 300ms ease;
  }

 /* ADR-0030: 1180px of the 1280px canvas */

/* SCREENSHOT ROW (ADR-0033 §4). Two or three images in an {image-grid}, or a run of two or three

     data-shot-row="frames"  --sr-fh frame height (bar included), --sr-z zoom of the picture
     data-shot-row="fanned"  --sr-ph print height, --sr-ov overlap (a negative margin)

.slide-content.layout-media > .figure-row[data-shot-row] {

  margin: auto 0 !important; align-self: center !important; contain: none !important;
}
.slide-content.layout-image-grid > .image-grid[data-shot-row] { padding: 0; }
.image-grid[data-shot-row] .ig-cell { background: none; border: 0; border-radius: 0; overflow: visible; min-width: 0; }
.image-grid[data-shot-row] .ig-note { padding: 12px 2px 0; }

.slide-content.layout-media > .figure-row[data-shot-row="frames"] > figure,
.slot[data-slot-arrange="beside"][data-slot-frame="frames"] > .slot-media > figure.slide-figure {
  position: relative; display: block !important; height: var(--sr-fh) !important; max-height: none !important; width: auto !important;
  margin: 0; background: #fff; border: 1px solid rgba(15,23,42,.16); border-radius: 10px; overflow: hidden;
  box-shadow: 0 1px 2px rgba(15,23,42,.10), 0 10px 26px rgba(15,23,42,.13);
}
.image-grid[data-shot-row="frames"] .ig-media::before,
.slide-content.layout-media > .figure-row[data-shot-row="frames"] > figure::before,

.slide-content.layout-media > .figure-row[data-shot-row="frames"] > figure > img,

}

  padding: 8px; background: #fff; border-radius: 3px;

.slide-content.layout-media > .figure-row[data-shot-row="fanned"] > figure > img {
  display: block; width: auto !important; height: var(--sr-ph) !important; aspect-ratio: auto !important; max-height: none !important; max-width: none !important;
}

/* SCREENSHOTS BESIDE A LIST (ADR-0033 §4). A .slot whose lines each carry one screenshot (two or three,
   one short line per image; compiler: slot-composition.mjs) is stamped data-slot-arrange="beside|stacked"
   and data-slot-frame="frames|fanned" (the slide's screenshot treatment). The copy and media columns
   dissolve (display: contents) so each thumbnail and its line share a grid row (Beside) or a grid column
   (Stacked); the 38% media column and its absolute-inset rules above no longer apply.
   Beside lines: equal 3:2 thumbnails cropped from the top-left, all the same size; the frame is the
   window frame of the screenshot row above (its bar, hairline, radius and shadow rules list this
   selector) or, for the fanned treatment, the neutral print frame.
   Stacked: one column per image (three stay ONE row), the image above its caption, bottoms aligned. */
.slot[data-slot-arrange][data-slot-side] { --m-col: 1; --c-col: 2; --sr-z: 1.25; --sr-fh: auto; }
.slot[data-slot-arrange][data-slot-side="right"] { --m-col: 2; --c-col: 1; }
.slot[data-slot-arrange] > .slot-copy,
.slot[data-slot-arrange] > .slot-media { display: contents; }
.slot[data-slot-arrange] > .slot-copy > .feature-list { margin: 0; min-width: 0; }

/* Beside lines */
.slot[data-slot-arrange="beside"][data-slot-side] {
  --thumb-w: 19.5cqw;
  grid-template-columns: min(var(--thumb-w), 45%) minmax(0, 1fr);
  grid-template-rows: none; grid-auto-rows: minmax(0, 1fr);
  column-gap: 2.2cqw; row-gap: 0; align-items: center;
  /* Beside lines take the height the locked drawing gave them: the rows share it equally. */
  height: 80cqh; max-height: 100%; align-self: center;
}
.slot[data-slot-arrange="beside"][data-slot-media-count="2"] { --thumb-w: 23.4cqw; }
.slot[data-slot-arrange="beside"][data-slot-side="right"] { grid-template-columns: minmax(0, 1fr) min(var(--thumb-w), 45%); }
.slot[data-slot-arrange="beside"] > .slot-media > figure.slide-figure {
  position: relative; display: block; grid-column: var(--m-col); width: 100%; height: auto; max-height: 100%;
  aspect-ratio: 3 / 2; margin: 0; align-self: center; overflow: hidden; background: #fff;
}
.slot[data-slot-arrange="beside"] > .slot-copy > .feature-list { grid-column: var(--c-col); align-self: center; }
.slot[data-slot-arrange="beside"] > .slot-media > figure:nth-child(1), .slot[data-slot-arrange="beside"] > .slot-copy > .feature-list:nth-child(1) { grid-row: 1; }
.slot[data-slot-arrange="beside"] > .slot-media > figure:nth-child(2), .slot[data-slot-arrange="beside"] > .slot-copy > .feature-list:nth-child(2) { grid-row: 2; }
.slot[data-slot-arrange="beside"] > .slot-media > figure:nth-child(3), .slot[data-slot-arrange="beside"] > .slot-copy > .feature-list:nth-child(3) { grid-row: 3; }
/* neutral print frame (fanned treatment): hairline, radius, soft shadow; the picture is the same top-left crop */
.slot[data-slot-arrange="beside"][data-slot-frame="fanned"] > .slot-media > figure.slide-figure {
  border: 1px solid rgba(15,23,42,.10); border-radius: 6px; box-shadow: 0 1px 2px rgba(15,23,42,.14), 0 8px 20px rgba(15,23,42,.13);
}
.slot[data-slot-arrange="beside"][data-slot-frame="fanned"] > .slot-media > figure.slide-figure > img {
  position: absolute; inset: 0; margin: 0; width: 100%; height: 100%; max-width: none; max-height: none; object-fit: cover; object-position: left top;
}

/* Stacked */
.slot[data-slot-arrange="stacked"][data-slot-side] {
  --n: 2;
  grid-template-columns: repeat(var(--n), minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr) auto;
  column-gap: 2.2cqw; row-gap: 12px; align-items: end;
}
.slot[data-slot-arrange="stacked"][data-slot-media-count="3"] { --n: 3; }
.slot[data-slot-arrange="stacked"] > .slot-media > figure.slide-figure {
  position: relative; display: flex; align-items: flex-end; justify-content: center; grid-row: 1; width: 100%; height: 100%; min-height: 0; margin: 0;
}
.slot[data-slot-arrange="stacked"] > .slot-media > figure.slide-figure > img {
  position: static; inset: auto; margin: 0; width: 100%; height: auto; max-width: 100%; max-height: 100%; min-height: 0; align-self: flex-end; object-fit: contain; object-position: center bottom;
}
.slot[data-slot-arrange="stacked"] > .slot-copy { --copy-size: max(var(--type-floor), calc(var(--fs-body) * .8)); }
.slot[data-slot-arrange="stacked"] > .slot-copy > .feature-list { grid-row: 2; align-self: start; }
.slot[data-slot-arrange="stacked"] > .slot-copy > .feature-list:not(:has(.fl-icon)) > li,
.slot[data-slot-arrange="stacked"] > .slot-copy > .feature-list:not(:has(.fl-icon)) > li:last-child { border: 0; padding: 0; }
.slot[data-slot-arrange="stacked"] > .slot-media > figure:nth-child(1), .slot[data-slot-arrange="stacked"] > .slot-copy > .feature-list:nth-child(1) { grid-column: 1; }
.slot[data-slot-arrange="stacked"] > .slot-media > figure:nth-child(2), .slot[data-slot-arrange="stacked"] > .slot-copy > .feature-list:nth-child(2) { grid-column: 2; }
.slot[data-slot-arrange="stacked"] > .slot-media > figure:nth-child(3), .slot[data-slot-arrange="stacked"] > .slot-copy > .feature-list:nth-child(3) { grid-column: 3; }

/* A slide with an embedded page beside text (0.38 ticket 13): the page takes seven parts of the
   slide's width and the text three (70/30). The side is the authored one. A slide with a picture and
   no page keeps the widths above; the picture arrangements ([data-slot-arrange]) are not touched;
   on a narrow stage the columns stack as every slot does (the 950px rule above). This is CSS on
   compiled markup, so every rendering of the slide follows it. */
@container (min-width: 951px) {
  .slot:not([data-slot-arrange]):has(> .slot-media figure.slide-embed[data-embed="local"]) { grid-template-columns: minmax(0, 3fr) minmax(0, 7fr); }
  .slot:not([data-slot-arrange])[data-slot-side="left"]:has(> .slot-media figure.slide-embed[data-embed="local"]) { grid-template-columns: minmax(0, 7fr) minmax(0, 3fr); }
  /* Per-slide page width ({page-60} / {page-80}): data-embed-split is only ever 60, 70 or 80. */
  .slot[data-embed-split="60"]:not([data-slot-arrange]):has(> .slot-media figure.slide-embed[data-embed="local"]) { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); }
  .slot[data-embed-split="60"]:not([data-slot-arrange])[data-slot-side="left"]:has(> .slot-media figure.slide-embed[data-embed="local"]) { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
  .slot[data-embed-split="80"]:not([data-slot-arrange]):has(> .slot-media figure.slide-embed[data-embed="local"]) { grid-template-columns: minmax(0, 1fr) minmax(0, 4fr); }
  .slot[data-embed-split="80"]:not([data-slot-arrange])[data-slot-side="left"]:has(> .slot-media figure.slide-embed[data-embed="local"]) { grid-template-columns: minmax(0, 4fr) minmax(0, 1fr); }
}

/* Hidden titles have no title/content grid to supply a definite iframe height. */

  .slide:has(> .slide-content.layout-quote) {
    --quote-chrome-band: 59px;
    padding-bottom: calc(var(--slide-pad-y) + var(--quote-chrome-band));
  }
  .slide-content.layout-quote > blockquote cite > .cite-text { min-width: 0; overflow-wrap: anywhere; }
  .slide-content.layout-quote > blockquote .quote-continuation {
    position: absolute;
    right: .6em;
    bottom: .42em;
    font-family: var(--mono);
    font-size: .34em;
    font-weight: 500;
    letter-spacing: .04em;
    line-height: 1;
    color: var(--ink);
    opacity: .62;
  }

  /* ADR-0028 §2 — a quote BESIDE THE RAIL ([data-title-layout="left"] with a visible head) drops
     the ADR-0023 panel: no tint, no accent rule, no panel padding; the quotation mark hangs in the
     gutter between the rail and the text, and the rail/content gap widens to hold it (stage.css
     @order 1341 gives clamp(40px, 5cqw, 96px)). Type is unchanged (max(31px, 3.4cqw), line-height
     1.42). Quote-only slides are not matched and keep the panel above byte for byte. An authored
     {bg=…} still paints the slide: nothing here touches the slide background. */
  .slide[data-title-layout="left"]:has(> .slide-content.layout-quote > .slide-head:not(.slide-head-quiet)) > .slide-content {
    column-gap: clamp(56px, 7cqw, 128px);
  }
  .slide[data-title-layout="left"] > .slide-content.layout-quote:has(> .slide-head:not(.slide-head-quiet)) > blockquote {
    background: none;
    border-left: 0;
    padding: 0;
    width: 100%;
    max-width: 24em;
    justify-self: start;
  }
  .slide[data-title-layout="left"] > .slide-content.layout-quote:has(> .slide-head:not(.slide-head-quiet)) > blockquote::before {
    left: -.68em;
    top: -.12em;
  }
/* QUOTE FORMS (docs/design/2026-10-11-source-styled-quote-slides, ADR-0038). A quote whose source
   line names a post on X, a video, a book, a paper or a web page draws as that source: <figure
   class="qf …"> built by compiler/scripts/lib/quote-forms.mjs. The form is full-bleed over the
   slide (it ignores --slide-pad-*) and centres its content on both axes. GEOMETRY lives here, colour
   and type in skin/quote.css. Sizes were drawn at 1920 × 1080 and are emitted as cqw (px ÷ 19.2).
   The words take the largest step that fits (data-step 1 to 4, the compiler's estimate; the presenter
   runtime checks the real box); below step 4 the form refuses and the slide is a Plain quote. */
  .qf {
    --qf-step-1: 3.4cqw;
    --qf-step-2: 3cqw;
    --qf-step-3: 2.6cqw;
    --qf-step-4: 2.3cqw;
    position: absolute; inset: 0; margin: 0;
    display: flex; align-items: center; justify-content: center;
  }
  /* stage.css @order 1355 and 1360 put every direct child of a title-less slide into grid column 1 or 2
     (!important), which would also make that grid area the form's containing block. The form is over the
     whole slide: take it out of the grid. The repeated class outweighs the :has() rules there. */
  .slide .slide-content.layout-quote > figure.qf.qf.qf {
    grid-column: auto !important;
    grid-row: auto !important;
    place-self: stretch;
    max-width: none;
    margin: 0 !important;
  }
  .qf[data-step="1"] { --qf-words: var(--qf-step-1); }
  .qf[data-step="2"] { --qf-words: var(--qf-step-2); }

  .qf-web-bar { flex: none; min-height: 4.7917cqw; display: flex; align-items: center; justify-content: center; padding: 0.8333cqw 1.875cqw; border-bottom-width: 0.157cqw; border-bottom-style: solid; }

  .qf-web-pill .qf-ic, .qf-web-domain .qf-ic { width: 1.5625cqw; height: 1.5625cqw; }

  .qf-web-by { display: flex; align-items: center; gap: 0.8333cqw; margin-top: 1.0417cqw; line-height: 1.2; min-width: 0; }
  .qf-web-by:first-child { margin-top: 0; }
  .qf-web-by > span, .qf-web-by > b { min-width: 0; overflow-wrap: anywhere; }
  .qf-avatar-xs { width: 2.5cqw; height: 2.5cqw; }

  .qf-web.qf-full .qf-words { line-height: 1.4; }
  .qf-web-domain { display: flex; align-items: center; gap: 0.7292cqw; margin-top: 2.0833cqw; line-height: 1.25; }

  /* With a picture: the address bar tops the left panel and the picture fills the rest of it. */

  /* Over a video's picture: the YouTube base, lozenge, time pill and progress bar (spec 6.3). */
  .qf-yt-base { position: absolute; left: 0; right: 0; bottom: 0; height: 13.5417cqw; z-index: 1; }
  .qf-yt-base .qf-yt-mark { position: absolute; left: 1.875cqw; bottom: 3.9583cqw; width: 5.4167cqw; height: 3.8542cqw; }

  .qf-yt-captions.qf-ph-words { justify-content: center; min-height: 9.8958cqw; padding: 0 2.0833cqw; line-height: 1.3; }

  /* Handout, share, venue and print: the written-out source link (spec 9). The stage never carries it.
     The video player's link takes the channel row's right end, where the Subscribe and like pills were. */
  .qf-source-link { overflow-wrap: anywhere; }
  .qf-yt-link { margin-left: auto; font-size: 1.4583cqw; text-align: right; }
  .qf-yt-channel > .qf-yt-link:first-child { margin-left: 0; }
/* AI chat and terminal simulation slides: {chat}, {chat-lanes}, {terminal}, {terminal-agent}.
   Spec and drawings: docs/design/2026-10-08-ai-chat-and-terminal-simulation-designs/
   (ai-chat-and-terminal-simulation-locked-spec.md, ...-locked-mockup.html, locked-*.png).

   SIZES. Every length is calc(N * var(--u)) or calc(N * var(--fz)): N is pixels on a 1920-wide slide,
   --u is 100cqw / 1920 (the stage is a 1280 x 720 container, so 1px at 1920 = 0.667px at the stage).
   --u carries the window geometry. --fz is --u times --z and carries everything that sits around text.
   Compact (default) is --z: 1, the drawn sizes. size=large sets --z so that the running text is the
   ADR-0005 type floor (stage.css: --type-floor: 1.9375cqw, 31px on the 1600px reference stage):
     chat:      28px running text -> 1.9375cqw   z = 1.9375 * 19.2 / 28 = 1.32857
     terminals: 26px text         -> 1.9375cqw   z = 1.9375 * 19.2 / 26 = 1.43077
   scripts/test-simulation-layout.mjs recomputes both from stage.css. Compact is a recorded exemption
   from the floor (these are drawings of an interface, like {trace}); scripts/layout-doctor-render.mjs
   lists .sim under smallChromeSelectors.

   Everything on a slide of these layouts paints its own surface (window, card, tint block, terminal),
   so no text colour depends on the deck palette, accent or slide background. */
/* The simulation is full-bleed: it ignores the slide padding and the content column. The content box is
   pinned to the whole slide so .sim (absolute, inset 0) has a real containing block; against the
   slide's own grid it would collapse to the grid area. */
.slide-content.layout-chat, .slide-content.layout-chat-lanes, .slide-content.layout-terminal, .slide-content.layout-terminal-agent {
  position: absolute; inset: 0; width: auto; min-height: 0; margin: 0; display: block;
}
/* The title-regime rule `.slide[data-title-layout=hidden] > .slide-content > :not(.slide-head)` centres its
   children (align-self); an absolutely positioned child with both insets set would shrink to nothing. */
.slide > .slide-content > .sim[class][class] { align-self: stretch; justify-self: stretch; margin: 0; max-width: none; width: auto; }
.sim *, .sim *::before, .sim *::after { box-sizing: border-box; }
.sim :where(p, ul, pre) { margin: 0; padding: 0; }
.sim :where(ul) { list-style: none; }
.sim pre, .sim code { font-family: var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.sim-chat.sim-large { --z: 1.32857; }
.sim-terminal.sim-large { --z: 1.43077; }
.sim-ic { flex: none; width: calc(28 * var(--fz)); height: calc(28 * var(--fz)); fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sim-ic-flip { transform: scaleY(-1); }

.sim-part { --k: var(--k-reasoning); }
.sim-part.sim-context { --k: var(--k-context); }
.sim-part.sim-tool { --k: var(--k-call); }
.sim-part.sim-result-only { --k: var(--k-result); }

/* disclosure control: a real button; the deck runtime adds .is-closed to the part */
.sim-toggle { font: inherit; color: inherit; background: none; border: 0; margin: 0; cursor: pointer; text-align: left; }
.sim-toggle:focus-visible { outline: calc(5 * var(--u)) solid var(--sim-focus); outline-offset: calc(3 * var(--u)); }
.sim-body { display: block; }
.is-closed .sim-body { display: none; }
.sim-toggle[aria-expanded="true"] .sim-when-closed, .sim-toggle[aria-expanded="false"] .sim-when-open { display: none; }
.sim-chevron { width: calc(26 * var(--fz)); height: calc(26 * var(--fz)); transition: transform .15s; }
.sim-toggle[aria-expanded="true"] .sim-chevron { transform: rotate(90deg); }

/* ================= Chat window (both chat designs) ================= */
.sim-chat {
  --win-x: 60; --win-y: 40; --win-w: 1800; --win-h: 1000;
  --side-w: 250; --col-w: 1080; --top-h: 72; --composer-h: 84; --composer-pad: 26;
  --col-x: calc(var(--win-x) + var(--side-w) + (var(--win-w) - var(--side-w) - var(--col-w)) / 2);
}
.sim-chat[data-sidebar="off"] { --side-w: 0; }
.sim-window {
  position: absolute; left: calc(var(--win-x) * var(--u)); top: calc(var(--win-y) * var(--u));
  width: calc(var(--win-w) * var(--u)); height: calc(var(--win-h) * var(--u));
  background: var(--sim-surface); border-radius: calc(26 * var(--u)); overflow: hidden;
  box-shadow: 0 0 0 calc(2 * var(--u)) var(--sim-line), 0 calc(14 * var(--u)) calc(40 * var(--u)) #17202a26;
}
.sim-sidebar {
  position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--side-w) * var(--u));
  background: var(--sim-side); padding: calc(20 * var(--u)) calc(16 * var(--u)); display: flex; flex-direction: column; gap: calc(6 * var(--u));
}
.sim-newchat {
  display: flex; align-items: center; gap: calc(8 * var(--fz)); background: var(--sim-surface);
  border: calc(2 * var(--u)) solid #c9ced4; border-radius: calc(14 * var(--u)); padding: calc(10 * var(--fz)) calc(12 * var(--fz)); font-size: calc(24 * var(--fz)); margin-bottom: calc(18 * var(--u)); white-space: nowrap;
}
.sim-recent-label { font-size: calc(24 * var(--fz)); font-weight: 700; color: #4b535c; margin: 0 0 calc(4 * var(--u)) calc(10 * var(--u)); }
.sim-recent { font-size: calc(24 * var(--fz)); color: var(--sim-muted); padding: calc(8 * var(--fz)) calc(12 * var(--fz)); border-radius: calc(10 * var(--u)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sim-recent-current { background: #e1e4e9; color: var(--sim-ink); }
.sim-topbar {
  position: absolute; left: calc(var(--side-w) * var(--u)); right: 0; top: 0; height: calc(var(--top-h) * var(--u));
  display: flex; align-items: center; padding: 0 calc(28 * var(--u));
}
.sim-model { display: flex; align-items: center; gap: calc(8 * var(--fz)); font-size: calc(26 * var(--fz)); font-weight: 700; padding: calc(6 * var(--fz)) calc(14 * var(--fz)); }

  /* Ticket 10 — a statement slide with a screenshot. The rail rule puts every non-head child on
     row 1 / span 99 of the content column, so the figure took the whole column at the image's
     natural height and the caption paragraph fell on an auto row BELOW the slide edge (whole-slide
     zoom 0.81 did not bring it back). Stack them instead: the figure takes the height left after
     the caption (`minmax(0, 1fr)`), the caption sits on its own row, and the column is exactly the
     slide tall so nothing can overflow. The image is scaled down into its cell, never clipped. */
  .slide:is([data-title-layout="left"], [data-title-layout="hidden"]) > .slide-content.layout-statement:has(> .slide-figure) {
    height: 100%;
    min-height: 0;
    grid-template-rows: minmax(0, 1fr) auto !important;
    row-gap: clamp(12px, 2.4cqh, 32px);
  }
  /* The rail head spanned 99 rows; with a row-gap that is 98 gaps of dead space. Two rows now. */
  .slide:is([data-title-layout="left"], [data-title-layout="hidden"]) > .slide-content.layout-statement:has(> .slide-figure) > .slide-head {
    grid-row: 1 / span 2 !important;
  }
  .slide:is([data-title-layout="left"], [data-title-layout="hidden"]) > .slide-content.layout-statement:has(> .slide-figure) > .slide-figure {
    grid-row: 1 !important;
    align-self: stretch;
    min-height: 0;
    min-width: 0;
  }
  .slide:is([data-title-layout="left"], [data-title-layout="hidden"]) > .slide-content.layout-statement:has(> .slide-figure) > .slide-figure > img,
  .slide:is([data-title-layout="left"], [data-title-layout="hidden"]) > .slide-content.layout-statement:has(> .slide-figure) > .slide-figure > video {
    max-height: 100%;
    min-height: 0;
    min-width: 0;
  }
  .slide:is([data-title-layout="left"], [data-title-layout="hidden"]) > .slide-content.layout-statement:has(> .slide-figure) > .slide-figure ~ *:not(.slide-head) {
    grid-row: 2 !important;
    margin-top: 0;
  }




  /* ── Ticket 22: five stops in every mode, centred in the band, clear of the footer ───────────
     The fixed footer occupies the bottom 61px of the stage (56px bar + 3px tick + its border, as
     measured). The timeline slide adds that band to its bottom padding PLUS the gap the top-title
     regime leaves under the title (stage.css @order 1368: 2.2cqh), and the
     content box fills the padded slide exactly, so the top regime's auto margins (@order 1370/1371)
     leave the SAME air between title and track as between track and footer — both axes balanced
     (ADR-0005), nothing under the footer. Timeline layout only (T21 finding: other top-regime
     layouts still overlap the footer; they are not touched here). */
  .slide[data-title-layout="top"] > .slide-content.layout-timeline > .slide-head { margin-bottom: var(--tl-head-gap) !important; }
  .slide[data-title-layout="top"] > .slide-content.layout-timeline > .timeline { flex: 0 1 auto; min-height: 0; margin-top: 0; }
  .timeline.timeline-rail[data-tl-stops] .tl-group-head::before { display: none; }
  .timeline.timeline-horizontal[data-tl-stops] .tl-entries { display: block; border-top: 0; padding-top: 0; }
  .timeline-pills[data-tl-stops] .tl-spine-track { min-height: 0; }
  .timeline .tl-spine-card ol.tl-spine-events > li { font-size: inherit; line-height: inherit; border: 0; padding: 0; }
  .timeline-dynamic[data-tl-stops] .tl-dyn-w { display: block; font-size: max(var(--type-floor), 2cqw); line-height: 1.25; }
  .timeline .tl-dyn-list ol.tl-dyn-entries > li { font-size: inherit; line-height: inherit; }
/* Plain view ticket 07 (spec T14) - an icon on a slide title and an icon beside a paragraph.
   Drawing: docs/plans/plain-editing-view/locked/icons-on-slides-locked.html.

   Title. The compiler writes the icon INSIDE the painted h1 (07-assembly renderSlideHead):
     h1 > .title-with-icon[data-title-icon="before|above"] > .fl-icon.title-icon + .title-text
   (and the same span inside the statement paragraph that paints a bodyless heading, and inside
   a poster's visible h2.tp-title: the opening slide and an authored {title} / {closing} slide)
   so every title rule, in every title placement and look, still addresses one h1, and the runtime
   title fit (slide-fit.js) measures the icon's width together with the words. Sizes are in em of
   the title, taken from the drawing: before = a 76px icon and a 26px gap on a 72px title; above =
   a 116px icon and a 30px gap on an 88px title. The icon keeps the .fl-icon colour (the accent).

   Paragraph. A `.content-p` carrying data-para-icon (06-block-renderers) is two columns: the icon
   in a column 15% of the paragraph's width (never wider than 4em of its text), the text beside it,
   both starting at the first line. Where a slide sets its paragraphs at different sizes, the
   runtime (slide-fit.js alignParagraphIcons) gives the later ones the first one's column through
   --para-icon-col, --para-icon-inset and --para-icon-size, so the icon columns line up.

   Unmarked block: sorts after every migrated rule. Every selector here names a class or attribute
   that only the new syntax emits, so a slide without it is styled exactly as before. */
.slide-content :is(h1, h2.tp-title, p) > .title-with-icon {
  display: inline-flex;
  align-items: flex-start;
  gap: .36em;
  max-width: 100%;
  vertical-align: top;
}
.slide-content :is(h1, h2.tp-title, p) > .title-with-icon > .title-text { min-width: 0; }
.slide-content :is(h1, h2.tp-title, p) > .title-with-icon > .title-icon {
  width: 1.06em;
  height: 1.06em;
  /* centred on the title's first line; the plain offset is for a browser without the lh unit */
  margin-top: .03em;
  margin-top: calc((1lh - 1.06em) / 2);
}
.slide-content :is(h1, h2.tp-title, p) > .title-with-icon[data-title-icon="above"] {
  flex-direction: column;
  gap: .34em;
}
.slide-content :is(h1, h2.tp-title, p) > .title-with-icon[data-title-icon="above"] > .title-icon {
  width: 1.32em;
  height: 1.32em;
  margin-top: 0;
}

.slide-content p.content-p[data-para-icon] {
  display: grid;
  grid-template-columns: var(--para-icon-col, min(15%, 4em)) minmax(0, 1fr);
  align-items: start;
  text-align: left;
}
.slide-content p.content-p[data-para-icon] > .para-icon {
  width: var(--para-icon-size, 83.4%);
  height: auto;
  aspect-ratio: 1;
  margin-top: .2em;
  margin-left: var(--para-icon-inset, 0px);
}
.slide-content p.content-p[data-para-icon] > .para-icon-text { min-width: 0; }

/* The Tab title look paints the title on the accent: the icon takes the title's own colour there. */
.slide[data-title-look="tab"] .slide-content h1 > .title-with-icon > .title-icon { color: inherit; }

  /* ADR-0028 §7: the head is ONE grid item, so the block (kicker + title) is centred on the stage
     while the kicker — the parent-section label on a subsection divider — shares the title's left
     edge. As separate items, justify-items: center centred the kicker over the title. */
  .slide-content.layout-section-title > .slide-head { display: block; }
  .slide-code code {
    display: block;
    width: 100%;
    min-width: 0;
    padding-left: 1.5em;
    text-indent: -1.5em;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font: inherit;
    color: inherit;
  }
/* Play as a step (0.38 ticket 05): `![alt](clip.mp4){play-on-next}` / `![Title](clip.mp3){play-on-next}`.
   Two small controls, neither on the audience's screen in the ordinary case:
     .media-step-mark  the presenter's current-slide preview only: "plays on Next" on a file whose
                       step has not come, "playing" on a video at its step (runtime/media-steps.js,
                       paintMediaStepMarks). Never written on the projector or the venue screen.
     .media-step-tap   a display whose browser refused to start the file without a gesture: "Tap for
                       sound" on a video that is playing muted, "Tap to play" on an audio chip.
   Both use the audio chip's pill, in the slide's own type and accent colour. */
.media-step-mark,
.media-step-tap {
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  gap: 0.4em;
  flex: none;
  padding: 0.25em 0.7em;
  border: 1px solid var(--accent);
  border-radius: 999px;
  font-family: inherit;
  font-size: clamp(12px, 1.2cqw, 18px);
  font-weight: 600;
  line-height: 1.2;
  white-space: nowrap;
}
.media-step-mark { background: var(--paper); color: var(--ink); pointer-events: none; }
.media-step-mark svg { width: 1.1em; height: 1.1em; display: block; flex: none; color: var(--accent); }
.media-step-tap { background: var(--accent); color: var(--paper); cursor: pointer; }
.media-step-tap:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
/* On a video the control sits over the picture; on a chip it is one more item in the pill's row. */
figure.slide-figure.slide-video > .media-step-mark { position: absolute; top: 8px; left: 8px; z-index: 2; }
figure.slide-figure.slide-video > .media-step-tap { position: absolute; left: 50%; bottom: 12%; z-index: 3; transform: translateX(-50%); }
.slide-audio > .media-step-mark,
.slide-audio > .media-step-tap { font-size: 0.8em; margin-left: 0.2em; }
@media print {
  .media-step-mark, .media-step-tap { display: none !important; }
}

/* Poll frame (Ticket 5) — the compiled, at-rest rendering of an authored poll, painted on the slide
