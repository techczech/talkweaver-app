  /* Match the main app's button language (radius, clean bordered secondary, oxford-blue primary),
     adapted to the presenter's dark chrome. */
  .presenter-controls .btn, .presenter-header-actions .btn {
    background: #1f2a37;
    border: 1px solid #ffffff26;
    color: #e7edf4;
    border-radius: 7px;

    font-weight: 500;
  }

  .presenter-controls .btn.primary { background: #2f6db5; border-color: #2f6db5; color: #fff; font-weight: 600; }
  .presenter-controls .btn.primary:hover { background: #3a7cc6; border-color: #3a7cc6; }
  .tw-btn-ico { margin-right: 6px; opacity: 0.85; font-size: 0.95em; }
  /* Single top clock (2026-06-30, presenter QoL): ONE always-visible clock at the top of the
     presenter view with explicit Start / Pause / Resume + a duration setter. Urgency is colour
     (amber warn, dark-amber urgent) plus a red pulse once the talk overruns; idle/paused read
     muted. Colours use the deck's own accent tokens where a suitable one exists. */
  /* Clock lives INSIDE the header flex row (title · clock · actions); relative so the setter anchors to it. */
  .tw-clock-bar { position: relative; display: flex; align-items: center; gap: 10px; flex: 0 0 auto; z-index: 5; }
  #presenterTitle { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The time is a bold pill: white on green while on-track; the background shifts to amber →
     dark-amber → red as the end nears; neutral grey before Start. */
  .tw-clock { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 1.5rem; letter-spacing: 0.01em; color: #fff; background: #1f9d55; padding: 2px 12px; border-radius: 8px; }
  .tw-clock[data-status="idle"] { background: #37475a; color: #dbe4ee; }
  .tw-clock[data-status="paused"] { opacity: 0.7; }
  .tw-clock[data-level="warn"] { background: #c99a1f; }
  .tw-clock[data-level="urgent"] { background: #b3620a; }
  .tw-clock[data-level="over"] { background: var(--accent-2, #9f1239); animation: tw-clock-pulse 1s ease-in-out infinite; }
  @keyframes tw-clock-pulse { 50% { opacity: 0.45; } }
  .tw-clock-elapsed { opacity: 0.4; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .tw-clock-btn { background: #1f9d55; color: #fff; border: 0; border-radius: 6px; padding: 4px 10px; font-weight: 700; cursor: pointer; }
  .tw-clock-btn:hover { filter: brightness(1.08); }
  /* Once running, the button steps back so the time leads. */
  .tw-clock-btn.tw-running { background: rgba(255, 255, 255, 0.07); color: #cdd6e0; border: 1px solid #ffffff2e; font-weight: 600; }
  .tw-clock-btn.tw-running:hover { background: rgba(255, 255, 255, 0.14); filter: none; }
  .tw-duration-btn { background: none; border: 1px solid #ffffff24; color: #f7f3ea; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  .tw-duration-btn:hover { border-color: #ffffff44; background: #243445; }
  .tw-duration-setter { position: absolute; top: calc(100% + 10px); left: 50%; transform: translateX(-50%); z-index: 30;
    background: #1a2530; border: 1px solid #ffffff26; border-radius: 10px; padding: 12px; width: 244px;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; gap: 9px; color: #f7f3ea; text-align: left; }
  .tw-duration-setter[hidden] { display: none; }
  .tw-setter-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; opacity: 0.6; font-weight: 800; }
  .tw-setter-sub { text-transform: none; letter-spacing: 0; opacity: 0.85; font-weight: 500; }
  .tw-setter-input { display: flex; align-items: center; gap: 6px; }
  .tw-setter-input input { width: 64px; text-align: center; background: #0f1620; color: #f7f3ea; border: 1px solid #ffffff2e; border-radius: 6px; padding: 6px; font-size: 1rem; font-variant-numeric: tabular-nums; }
  .tw-setter-unit { opacity: 0.6; font-size: 0.85rem; }
  .tw-step { width: 30px; height: 30px; border-radius: 6px; border: 1px solid #ffffff2e; background: #243445; color: #f7f3ea; font-size: 1.1rem; line-height: 1; cursor: pointer; }
  .tw-step:hover { filter: brightness(1.15); }
  .tw-duration-presets, .tw-reminder-presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .tw-duration-presets button, .tw-reminder { padding: 5px 11px; border-radius: 999px; border: 1px solid #ffffff26; background: #243445; color: #f7f3ea; font-size: 0.85rem; cursor: pointer; font-variant-numeric: tabular-nums; }
  .tw-duration-presets button:hover, .tw-reminder:hover { filter: brightness(1.15); }
  .tw-duration-presets button.on { background: #1f9d55; border-color: #1f9d55; color: #fff; font-weight: 700; }
  .tw-reminder.on { background: var(--accent-2, #9f1239); border-color: var(--accent-2, #9f1239); color: #fff; font-weight: 700; }
  .tw-resume { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.55); }
  .tw-resume[hidden] { display: none; }
  .tw-resume-card { background: #1a2530; border: 1px solid #ffffff26; border-radius: 12px; padding: 20px 22px; width: min(360px, 90cqw); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); color: #f7f3ea; text-align: center; }
  .tw-resume-text { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; }
  .tw-resume-reset { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; opacity: 0.85; margin-bottom: 16px; cursor: pointer; }
  .tw-resume-actions { display: flex; gap: 10px; justify-content: center; }
  /* Fast, key-only hover tooltip (JS-positioned; shows just the shortcut). */
  .tw-tip { position: fixed; transform: translate(-50%, -100%) translateY(-6px); background: #0b1118; color: #eaf1f8; border: 1px solid #ffffff2e; border-radius: 5px; padding: 3px 7px; font-size: 0.78rem; font-weight: 700; font-variant-numeric: tabular-nums; z-index: 60; pointer-events: none; white-space: nowrap; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5); }
  .tw-tip[hidden] { display: none; }
  .tw-shortcuts { position: fixed; inset: 0; z-index: 55; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.55); }
  .tw-shortcuts[hidden] { display: none; }
  .tw-shortcuts-card { background: #1a2530; border: 1px solid #ffffff26; border-radius: 12px; padding: 18px 22px; width: min(520px, 92cqw); max-height: 80vh; overflow: auto; color: #f7f3ea; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); }
  .tw-shortcuts-head { font-size: 1.05rem; font-weight: 800; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .tw-shortcuts-head span { font-size: 0.75rem; font-weight: 500; opacity: 0.6; }
  .tw-shortcuts-section { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; opacity: 0.55; font-weight: 800; margin: 13px 0 5px; }
  .tw-shortcuts-row { display: grid; grid-template-columns: 200px 1fr; gap: 12px; align-items: baseline; padding: 3px 0; }
  .tw-shortcuts-keys { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.8rem; background: #0f1620; border: 1px solid #ffffff24; border-radius: 4px; padding: 2px 6px; color: #cfe3ff; white-space: nowrap; justify-self: start; }
  /* E8: media control row — appears only when the current slide carries an embed/video. */
  .presenter-media {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 1 1 auto;
    justify-content: center;
  }
  .presenter-media[hidden] { display: none; }
  .presenter-media-label {
    color: #b8c6d2;
    font-size: 0.82rem;
    max-width: 26ch;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .presenter-media-select {
    color: #f7f3ea;
    background: #243445;
    border: 1px solid #ffffff24;
    border-radius: 7px;
    padding: 6px 8px;
    max-width: 18ch;
  }
  .presenter-media-select[hidden] { display: none; }
  .presenter-meta { color: #b8c6d2; font-size: 0.9rem; }
  .presenter-search {
    width: 100%;
    color: #f7f3ea;
    background: #243445;
    border: 1px solid #ffffff24;
    border-radius: 7px;
    padding: 8px;
  }
  .presenter-outline {
    min-height: 0;
    overflow: auto;
    margin-top: 10px;
    padding-right: 4px;
  }
  /* The presenter drawer now hosts the SHARED overview rows (.section-head / .subsection-head /
     .slide-link), whose default colours (var(--ink)/var(--accent)) are near-black and unreadable
     on this dark drawer. These presenter-scoped overrides restore legibility. Visual polish is
     eyeballed live; the bar here is readable + not-broken-looking. */
  .presenter-outline .section-head {
    color: #8fa6b8;
    letter-spacing: 0.12em;
  }
  .presenter-outline .section-head:hover { background: #243445; }
  .presenter-outline .subsection-head {
    color: #b8c6d2;
    border-left-color: color-mix(in srgb, #8fa6b8 55%, transparent);
  }
  .presenter-outline .subsection-head:hover { background: #ffffff10; }
  .presenter-outline .slide-link {
    color: #f7f3ea;
    border: 1px solid transparent;
  }
  .presenter-outline .slide-link:hover,
  .presenter-outline .slide-link.current {
    background: #2c4054;
    border-color: #ffffff24;
  }
  .presenter-outline .slide-link.current { border-color: var(--accent-2); font-weight: 700; }
  .presenter-outline .slide-link.tw-highlight { outline: 2px solid #4a9eff; }
  /* Expanded-grid thumbs: readable frame on the dark drawer. */
.presenter-outline .slide-sublink { color: #b8c6d2; }
  .presenter-outline .tw-thumb { border-color: rgba(255,255,255,0.18); }
  /* "⊞ Previews" toggle in the presenter drawer header — dark-drawer variant of .tw-overview-expand. */
  .presenter-outline-expand {
    margin-left: auto;
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 4px 9px;
    border: 1px solid #ffffff24;

    background: transparent;
