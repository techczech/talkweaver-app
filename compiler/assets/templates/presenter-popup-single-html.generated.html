}

/* Deeper authored bullets stay inside their side and inherit the stage's type scale. */
.slide .contrast-grid .vs-children { margin: .35em 0 0; padding-left: 1.1em; font-size: .85em; }
.slide .contrast-grid .vs-children li { margin: .2em 0; }
/* Cycle, equation and timeline adopt the animated-scene drawings (ADR-0039, 0.41 ticket 07).
   Values from docs/design/2026-10-16-slide-scene-formatting/after/09-cycle.html, 08-equation-circle.html and
   10-timeline.html (drawn at 1920 x 1080, written here in cqw = px / 19.2). Unmarked block: it sorts after every
   migrated block, so it wins where it meets skin/cycle.css, skin/equation.css and layouts/timeline.css.

   Cycle. Subtle neutral boxes on a ring; each connector is an arc of that ring from the border where it leaves
   one box to the border where it enters the next (the compiler works the ends out from the box rectangles,
   06-block-renderers.mjs cycleGeometry), with a whole arrowhead whose tip lands on the border. The ring box is
   the ring is drawn --cy-w wide (a stage-relative length, deliberately not a size container: base.css's
   narrow-slide @container rule would then fire on it); every length inside is its drawing value times --cy-u
   (the ring's width over --cy-vw, the drawing's own width), so box sizes and arc ends stay in step at any stage size.

   Equation. Terms are circles in the section hue, then the next two hues of the palette (ADR-0039 amends
   ADR-0005's one accent); the result is a filled disc in the section accent; operators are muted and regular.
   --eq-n (terms plus result) sizes the circles so a longer equation still fits on one row.

   Timeline (spine and pills, the track-and-pill drawings). One ink track; each dated stop is a pill on it in
   its hue (accent, hue-2, hue-3), with a stem to its text, alternating above and below (spine) or all below
   (pills). The text is regular; a stop's sub-points stay, in the scene's smaller muted lines under the text.
   Stops are spread over the track with the first and last inset by half a text width, so no text leaves the
   safe area. --tl-i (the stop's index, set by the compiler) places each stop. */

/* ---- Cycle ---- */
.slide .slide-content.layout-cycle .cycle-diagram {
  --cy-w: calc(min(87.5cqw, 128cqh) * var(--cy-vw, 1680) / 1680);
  --cy-u: calc(var(--cy-w) / var(--cy-vw, 1680));
  width: var(--cy-w);
  max-width: none;
  aspect-ratio: var(--cy-vw, 1680) / var(--cy-vh, 760);
  margin: 0 auto;
}
/* Beside a rail the ring is the content column at most, never wider (the right node ran off the slide; the old
   ring capped itself at 100% for the same reason). Column = stage - rail - column gap (stage.css) - right inset. */
.slide[data-title-layout="left"] .slide-content.layout-cycle .cycle-diagram {
  --cy-w: min(
    calc(min(87.5cqw, 128cqh) * var(--cy-vw, 1680) / 1680),
    calc(100cqw - var(--rail-w, 0px) - clamp(40px, 5cqw, 96px) - var(--slide-pad-x, 48px))
  );
}
.slide .cycle-diagram .cycle-node {
  box-sizing: border-box;
  width: calc(var(--cy-nw, 450) / var(--cy-vw, 1680) * 100%);
  max-width: none;
  min-height: calc(var(--cy-nh, 164) * var(--cy-u));
  height: calc(var(--cy-nh, 164) * var(--cy-u));
  padding: calc(18 * var(--cy-u)) calc(26 * var(--cy-u)) calc(20 * var(--cy-u));
  border-radius: calc(18 * var(--cy-u));
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  gap: 0;
  box-shadow: none;
  text-align: left;
  font-weight: 400;
  font-size: calc(37.2 * var(--cy-u));
  line-height: 1.15;
  color: var(--ink);
  white-space: normal;
  z-index: 2;
}
.slide .cycle-diagram .cycle-node:last-of-type { border-color: rgb(16 20 24 / .26); color: var(--ink); }
.slide .cycle-diagram .cycle-stage {
  font-family: var(--mono);
  font-size: calc(24 * var(--cy-u));
  letter-spacing: .12em;
  text-transform: uppercase;
  line-height: 1.25;
  color: var(--accent);
  margin-bottom: calc(8 * var(--cy-u));
}
.slide .cycle-diagram .cycle-cap { font-size: inherit; font-weight: 400; color: var(--ink); line-height: 1.15; }
.slide .cycle-diagram .cycle-arc-svg { overflow: visible; z-index: 1; }
.slide .cycle-diagram .cycle-arc { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: butt; vector-effect: none; }
.slide .cycle-diagram .cycle-head { fill: var(--ink); stroke: none; }

/* ---- Equation ---- */
.slide .equation-row {
  --eq-d: min(14.5833cqw, calc((87.5cqw - 7.3cqw * (var(--eq-n, 4) - 1)) / var(--eq-n, 4)));
  --eq-gap: 2.0833cqw;
  flex-wrap: wrap;
  gap: 1.6cqw var(--eq-gap);
  max-width: none;
  width: 100%;
  margin: 0 auto;
}
.slide .equation-row.equation-circle { flex-wrap: nowrap; }
.slide .equation-row .eq-unit { gap: var(--eq-gap); }
.slide .equation-row .eq-unit:nth-child(3n + 1) { --c: var(--accent); }
.slide .equation-row .eq-unit:nth-child(3n + 2) { --c: var(--hue-2); }
.slide .equation-row .eq-unit:nth-child(3n) { --c: var(--hue-3); }
.slide .equation-row .eq-term {
  box-sizing: border-box;
  border: .3125cqw solid var(--c, var(--accent));
  color: var(--c, var(--accent));
  background: var(--paper);
  font-weight: 700;
  font-size: max(var(--type-floor), calc(var(--eq-d) * .1929));
  line-height: 1.1;
  white-space: normal;
  text-align: center;
  overflow-wrap: anywhere;
  position: relative;
}
.slide .equation-row.equation-circle .eq-term {
  width: var(--eq-d);
  min-width: 0;
  height: var(--eq-d);
  aspect-ratio: auto;
  padding: .6cqw;
  border-radius: 50%;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
.slide .equation-row.equation-circle .eq-term.eq-result { width: calc(var(--eq-d) * 1.1429); height: calc(var(--eq-d) * 1.1429); font-size: max(var(--type-floor), calc(var(--eq-d) * .2214)); }
.slide .equation-row .eq-term.eq-result { background: var(--accent); border-color: var(--accent); color: #fff; }
.slide .equation-row .eq-op {
  font-weight: 400;
  font-size: calc(var(--eq-d) * .3);
  line-height: 1;
  color: var(--muted);
  width: 3.125cqw;
  text-align: center;
}

/* ---- Timeline: spine and pills ---- */
.slide .timeline-spine,
.slide .timeline-pills {
  --tl-w: min(25cqw, calc(166cqw / (var(--tl-spine-cols, 3) + 1.1)));
  --tl-axis: calc((var(--tl-above, 8) + 5.4167) * 1cqw);
  --tl-m: calc(var(--tl-w) / 2);
  width: 87.5cqw;
  max-width: 100%;
  margin: 0 auto;
}
.slide .timeline-spine .tl-spine-track,
.slide .timeline-pills .tl-spine-track {
  display: block;
  position: relative;
  width: 100%;
  height: calc((var(--tl-above, 8) + var(--tl-below, 8) + 10.8333) * 1cqw);
  min-height: 0;
  padding: 0;
  align-items: initial;
}
.slide .timeline-spine .tl-spine-track::before,
.slide .timeline-pills .tl-spine-track::before {
  display: block;
  content: "";
  position: absolute;
  left: 1.0417cqw;
  right: 1.0417cqw;
  top: var(--tl-axis);
  transform: translateY(-50%);
  height: .4167cqw;
  border-radius: .2083cqw;
  background: var(--ink);
  z-index: 0;
}
.slide .timeline .tl-spine-stop {
  --c: var(--accent);
  position: absolute;
  left: calc(var(--tl-m) + var(--tl-i, 0) * (100% - 2 * var(--tl-m)) / max(1, var(--tl-spine-cols, 3) - 1));
  top: var(--tl-axis);
  width: 0;
  height: 0;
  display: block;
  min-width: 0;
}
.slide .timeline .tl-spine-stop:nth-child(3n + 2) { --c: var(--hue-2); }
.slide .timeline .tl-spine-stop:nth-child(3n) { --c: var(--hue-3); }
/* The pill on the track. */
.slide .timeline .tl-spine-stop[data-side] .tl-spine-date,
.slide .timeline .tl-spine-stop[data-side] .tl-spine-pill {
  position: absolute;
  left: 0;
  top: 0;
  bottom: auto;
  transform: translate(-50%, -50%);
  box-sizing: border-box;
  min-width: 9.8958cqw;
  max-width: var(--tl-w);
  min-height: 3.3333cqw;
  margin: 0;
  padding: .4cqw 1.4cqw;
  display: flex;
  align-items: center;
  justify-content: center;
  border: .2604cqw solid var(--c);
  border-radius: 1.6667cqw;
  background: var(--paper);
  color: var(--c);
  font-family: var(--mono);
  font-weight: 700;
  font-size: max(var(--type-floor), 1.4583cqw);
  line-height: 1.1;
  white-space: normal;
  text-align: center;
  overflow-wrap: anywhere;
  z-index: 2;
}
/* The stem and the text. */
.slide .timeline .tl-spine-dot { display: none; }
.slide .timeline .tl-spine-leader {
  display: block;
  position: absolute;
  left: 0;
  transform: translateX(-50%);
  width: .2083cqw;
  height: 3.75cqw;
  border: 0;
  background: var(--c);
  z-index: 1;
}
.slide .timeline .tl-spine-stop[data-side="above"] .tl-spine-leader { top: -5.4167cqw; }
.slide .timeline .tl-spine-stop[data-side="below"] .tl-spine-leader { top: 1.6667cqw; }
.slide .timeline .tl-spine-card {
  position: absolute;
  left: calc(var(--tl-w) / -2);
  transform: none;
  box-sizing: border-box;
  width: var(--tl-w);
  margin: 0;
  padding: .5208cqw .8333cqw;
  border: 0;
  border-radius: .625cqw;
  background: none;
  box-shadow: none;
  text-align: center;
  font-size: max(var(--type-floor), calc(2.2917cqw * var(--tl-spine-scale, 1)));
  line-height: 1.2;
  color: var(--ink);
}
.slide .timeline .tl-spine-stop[data-side="above"] .tl-spine-card { top: auto; bottom: 5.4167cqw; }
.slide .timeline .tl-spine-stop[data-side="below"] .tl-spine-card { bottom: auto; top: 5.4167cqw; }
.slide .timeline .tl-spine-card .tl-spine-events { gap: .3em; }
.slide .timeline .tl-spine-card ol.tl-spine-events > li { font-size: inherit; line-height: inherit; font-weight: 400; color: var(--ink); }
.slide .timeline .tl-spine-card .tl-spine-events li::before { content: none; }
/* Sub-points: the stop's detail lines, kept, smaller and muted under the event text. */
.slide .timeline .tl-spine-card ol.tl-spine-events > li:not([data-tl-text]) {
  font-size: max(var(--type-floor), .72em);
  color: var(--muted);
  line-height: 1.25;
}
.slide .timeline .tl-spine-card .tl-spine-events strong { color: var(--c); }
/* Icon list and numbered list rows adopt the animated-scene list formatting (ADR-0039, 0.41 ticket 05).
   Values from docs/design/2026-10-16-slide-scene-formatting/after/04-iconlist.html and 05-numbered.html
   (drawn at 1920 x 1080, written here in cqw = px / 19.2). Unmarked block: it sorts after every migrated
   block and after skin/list.css, so it wins where it meets the ADR-0028 row rules there. It styles the ROW
   forms (`.fl-iconlist-list`: icon lists above three items or pinned {iconlist=list}, and the numbered
   lists that take the same rows); cards (boxes, numbered cards) are the cards ticket's. Type size stays on
   --fs-body, so the runtime fit (slide-fit.js) still steps spacing before type.

   What changes:
   - Rows are separated by solid hairlines above the first row, between rows and below the last (was a
     dotted line between rows only). The lines are strokes on the list and its items (not borders), so a
     rounded highlight never bends them.
   - Each row carries 28px (1.4583cqw) of padding on both sides: the room a highlight needs.
   - The icon or number is a box one text line tall, so it sits on the FIRST line of its item (was
     centred on the whole item). The icon is 1.25em; the gap to the text .7em.
   - The default number loses its outlined square: a mono numeral in the accent, 0.9em of the text.
     {numbered=plain} and {numbered=styled} are explicit author choices and keep their own look.
   - The same rows style a list beside a picture (`.slot-copy`), so a numbered list that keeps its image
     reads the same way.
   - The title stays in the left column beside the list (the existing left regime, no line above it).
     Under a top title the list is one column, centred under it, 57-81cqw wide (the drawing's
     1100-1560px), replacing the 0.37 two-column short-list form. */


.slide :is(.slide-content, .slot-copy) > .feature-list.fl-iconlist-list:not(.fl-annotated) {
  position: relative;
  gap: 0;
}
/* Hairline above the first row. */
.slide :is(.slide-content, .slot-copy) > .feature-list.fl-iconlist-list:not(.fl-annotated)::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: max(1px, .1563cqw);
  background: var(--hairline);
}
.slide :is(.slide-content, .slot-copy) > .feature-list.fl-iconlist-list:not(.fl-annotated) > li,
.slide :is(.slide-content, .slot-copy) > .feature-list.fl-wide.fl-iconlist-list:not(.fl-annotated) > li {
  position: relative;
  align-items: start;
  column-gap: .7em;
  row-gap: calc(8px * var(--list-gap, 1));
  padding: calc(.55em * var(--list-gap, 1)) 1.4583cqw;
  border-radius: .5208cqw;
  border: 0;
}
/* Hairline below every row (between rows, and under the last). */
.slide :is(.slide-content, .slot-copy) > .feature-list.fl-iconlist-list:not(.fl-annotated) > li::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: max(1px, .1563cqw);
  background: var(--hairline);
}
.slide :is(.slide-content, .slot-copy) > .feature-list.fl-iconlist-list:not(.fl-annotated) > li + li,
.slide :is(.slide-content, .slot-copy) > .feature-list.fl-wide.fl-iconlist-list:not(.fl-annotated) > li + li {
  border-top: 0;
}

/* The icon: a box one text line tall, the glyph centred in it. */
.slide :is(.slide-content, .slot-copy) > .feature-list.fl-iconlist-list:not(.fl-annotated) > li > .fl-icon {
  display: grid;
  place-items: center;
  width: 1.25em;
  height: calc(var(--list-lh, 1.35) * 1em);
  color: var(--accent);
}
.slide :is(.slide-content, .slot-copy) > .feature-list.fl-iconlist-list:not(.fl-annotated) > li > .fl-icon > svg {
  width: 1.25em;
  height: 1.25em;
  stroke-width: 1.5;
}

/* The default number: a mono numeral in the accent, centred in the same one-line box. */
.slide :is(.slide-content, .slot-copy) > .feature-list.fl-iconlist-list.fl-numbered:not(.fl-annotated):not(.fl-numbered-plain):not(.fl-numbered-styled) > li > .fl-icon.fl-num {
  border: 0;
  border-radius: 0;
  background: none;
  font-family: var(--mono);
  font-weight: 400;
  line-height: 1;
  width: calc(1.25em / .9);
  height: calc(var(--list-lh, 1.35) * 1em / .9);
  box-sizing: border-box;
}
/* The numeral is .9 of the item's text size; beside a picture that size is the slot's --copy-size. */
.slide .slide-content > .feature-list.fl-iconlist-list.fl-numbered:not(.fl-annotated):not(.fl-numbered-plain):not(.fl-numbered-styled) > li > .fl-icon.fl-num {
  font-size: .9em;
}
.slide .slot-copy > .feature-list.fl-iconlist-list.fl-numbered:not(.fl-annotated):not(.fl-numbered-plain):not(.fl-numbered-styled) > li > .fl-icon.fl-num {
  font-size: calc(.9 * var(--copy-size));
}
/* The plain numeral keeps its text-size look; only its row and box line up with the new rows. */
.slide :is(.slide-content, .slot-copy) > .feature-list.fl-iconlist-list.fl-numbered-plain:not(.fl-annotated) > li > .fl-icon.fl-num {
  display: block;
  height: auto;
  width: 1.4em;
}
/* The styled numeral is two lines tall and stays centred on its item, as drawn for it in ADR-0028 §6. */
.slide :is(.slide-content, .slot-copy) > .feature-list.fl-iconlist-list.fl-numbered-styled:not(.fl-annotated) > li,
.slide :is(.slide-content, .slot-copy) > .feature-list.fl-wide.fl-iconlist-list.fl-numbered-styled:not(.fl-annotated) > li {
  align-items: center;
}
.slide :is(.slide-content, .slot-copy) > .feature-list.fl-iconlist-list.fl-numbered-styled:not(.fl-annotated) > li > .fl-icon.fl-num {
  display: block;
  height: auto;
}

/* A warning row (the drawing's red row) is not an authoring form yet; nothing to style here. */

/* Sub-items sit under the text, not the icon. */
.slide :is(.slide-content, .slot-copy) > .feature-list.fl-iconlist-list:not(.fl-annotated) > li > .fl-sublist { grid-column: 2; }

/* ---- Under a top title: one centred column, as drawn (replaces the 0.37 two-column short list) ---- */
.slide[data-title-layout="top"] > .slide-content > .feature-list.fl-iconlist-list:not(.fl-annotated),
.slide[data-title-layout="top"] > .slide-content > .feature-list.fl-iconlist-list.fl-short-lines:not(.fl-annotated) {
  display: grid;
  columns: auto;
  width: fit-content;
  min-width: min(57.3cqw, 100%);
  max-width: min(81.25cqw, 100%);
  margin-left: auto;
  margin-right: auto;
  align-self: center;
}
.slide[data-title-layout="top"] > .slide-content > .feature-list.fl-iconlist-list.fl-short-lines:not(.fl-annotated) > li {
  break-inside: auto;
  margin-bottom: 0;
}
.slide[data-title-layout="top"]:not([data-font-body]) > .slide-content:has(> .feature-list.fl-iconlist-list.fl-short-lines) {
  --fs-body: max(var(--type-floor), 2.8125cqw);
}

/* Left title column: the list fills the space beside it. */
.slide[data-title-layout="left"] > .slide-content.layout-list > .feature-list.fl-iconlist-list:not(.fl-annotated) {
  width: 100%;
  min-width: 0;
  max-width: none;
}
/* Icon row, process and steps adopt the animated-scene drawings (ADR-0039, 0.41 ticket 06).
   Values from docs/design/2026-10-16-slide-scene-formatting/after/06-iconrow.html and 11-process.html
   (drawn at 1920 x 1080, written here in cqw = px / 19.2). Unmarked block: it sorts after every migrated
   block and after skin/icon-row.css and skin/narrow-columns.css, so it wins where it meets their rules.
   Class names the older rules and tests read (.ir-item, .ir-label, .ir-desc > li, .proc-step ...) stay.

   Icon row. Each column is a mono head (icon, label) over an accent rule, then one subtle box per line,
   one icon each. The columns share ONE grid (a head row and --ir-rows item rows, each column a subgrid
   over them), so a box that wraps keeps its neighbour in the next column level. A link of the column's
   hue joins each box to the next, from the outer bottom border to the outer top border (its height is
   the row gap). Text is regular, as large as the boxes allow. Columns take the section accent, then the
   deck palette's next two hues (hue-2, hue-3), not the drawing's literal colours (ADR-0039 amends ADR-0005).

   Process. A row of subtle boxes, each with its number and icon, joined by arrows. The arrow is an element
   in the row (.proc-arrow) whose width IS the gap, so its shaft starts on the left box's border and its
   head tip lands on the right box's border; the head is whole (svg, overflow visible). Under a screenshot
   row the boxes shrink to their content so the row of pictures keeps its band. Steps (stairs) take the
   same boxes and arrows, the arrow as tall as the lower box and centred in it. */

/* ---- Icon row ---- */
.slide .icon-row {
  --ir-gap: calc(1.3542cqw * var(--list-gap, 1));
  --ir-type: var(--fs-body);
  font-size: max(var(--type-floor), var(--ir-type)) !important;
  grid-template-columns: repeat(var(--ir-cols, 2), minmax(0, 1fr));
  grid-template-rows: auto repeat(var(--ir-rows, 4), auto);
  column-gap: 4.1667cqw;
  row-gap: var(--ir-gap);
  width: 100%;
  max-width: none;
  margin: 0 auto;
  align-items: start;
}
.slide .icon-row.count-1 { --ir-cols: 1; }
.slide .icon-row.count-2 { --ir-cols: 2; }
.slide .icon-row.count-3 { --ir-cols: 3; --ir-type: min(var(--fs-body), 2.6cqw); }
.slide .icon-row.count-4 { --ir-cols: 4; --ir-type: min(var(--fs-body), 2.0833cqw); column-gap: 2.5cqw; }
.slide .icon-row.count-3 { column-gap: 3cqw; }
.slide .icon-row .ir-item {
  --box-hue: var(--accent);
  grid-row: span calc(var(--ir-rows, 4) + 1);
  grid-template-rows: subgrid;
  grid-template-columns: auto minmax(0, 1fr);
  column-gap: 0;
  row-gap: var(--ir-gap);
  align-items: stretch;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: none;
  box-shadow: none;
}
.slide .icon-row .ir-item.hue-2 { --box-hue: var(--hue-2); }
.slide .icon-row .ir-item.hue-3 { --box-hue: var(--hue-3); }

/* The head: icon and label share the rule under them. */
.slide .icon-row .ir-item > .ir-icon,
.slide .icon-row .ir-item > .ir-label {
  align-self: stretch;
  display: flex;
  align-items: center;
  grid-row: 1;
  grid-column: 1;
  padding-bottom: calc(.625cqw + var(--subtle-box-line));
  color: var(--box-hue);
}
/* The rule under the head runs across both cells. */
.slide .icon-row .ir-item::before {
  content: "";
  display: block;
  grid-row: 1;
  grid-column: 1 / -1;
  align-self: end;
  height: var(--subtle-box-line);
  background: var(--box-hue);
}
.slide .icon-row .ir-item > .ir-icon {
  width: auto;
  height: auto;
  margin: 0;
  gap: 0;
  box-sizing: border-box;
}
.slide .icon-row .ir-item > .ir-icon > svg { width: 1.6667cqw; height: 1.6667cqw; flex: none; }
.slide .icon-row .ir-item > .ir-icon.ir-num {
  border-radius: 0;
  background: none;
  font-family: var(--mono);
  font-weight: 400;
  font-size: 1.3542cqw;
  letter-spacing: .12em;
}
.slide .icon-row .ir-item > .ir-label {
  grid-column: 2;
  font-family: var(--mono);
  font-size: 1.3542cqw;
  font-weight: 400;
  letter-spacing: .12em;
  text-transform: uppercase;
  line-height: 1.25;
  padding-left: .7292cqw;
  gap: 0;
}
.slide .icon-row .ir-item > .ir-icon.ir-num + .ir-label { padding-left: .7292cqw; }

/* The boxes: direct rows of the shared grid (the list itself draws nothing). */
.slide .icon-row .ir-item > .ir-desc { display: contents; }
.slide .slide-content .icon-row .ir-item .ir-desc.ir-desc > li {
  grid-column: 1 / -1;
  position: relative;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: 1.3542cqw;
  min-height: calc(6.4583cqw * var(--list-gap, 1));
  margin: 0;
  padding: calc(1.1458cqw * var(--list-gap, 1)) 1.7708cqw;
  border-radius: .8333cqw;
  font-size: max(var(--type-floor), var(--ir-type, var(--fs-body)));
  font-weight: 400;
  line-height: 1.2;
  color: var(--ink);
  text-align: left;
}
.slide .icon-row .ir-item .ir-desc > li > .ir-li-icon {
  flex: none;
  display: grid;
  place-items: center;
  width: 2.2917cqw;
  height: 2.2917cqw;
  color: var(--box-hue);
}
.slide .icon-row .ir-item .ir-desc > li > .ir-li-icon > svg { width: 100%; height: 100%; stroke-width: 1.5; }
.slide .icon-row .ir-item .ir-desc > li > .ir-li-text { min-width: 0; overflow-wrap: break-word; }
/* The chain link: from the box's outer bottom edge to the next box's outer top edge (the row gap). */
.slide .icon-row .ir-item .ir-desc > li > .ir-link {
  position: absolute;
  left: 2.8125cqw;
  top: 100%;
  width: .1563cqw;
  height: var(--ir-gap);
  margin: 0;
  background: color-mix(in srgb, var(--box-hue) 45%, #fff);
  pointer-events: none;
}

/* Rows of columns (five or more, narrow-columns.mjs): no shared rows across the wrapped rows, each column
   stacks its own boxes with the same gap. */
.slide-content > .icon-row.ir-rows {
  --ir-gap: calc(1.3542cqw * var(--list-gap, 1));
  column-gap: 3cqw !important;
  row-gap: 2.2cqw !important;
}
.slide-content > .icon-row.ir-rows .ir-item {
  grid-row: auto;
  grid-template-rows: none;
  grid-template-columns: auto minmax(0, 1fr);
  align-content: start;
}
.slide-content > .icon-row.ir-rows .ir-item > .ir-desc {
  display: flex;
  flex-direction: column;
  gap: var(--ir-gap);
  grid-column: 1 / -1;
}
.slide-content > .icon-row.ir-rows .ir-item .ir-desc > li { min-height: 0; }
.slide-content > .icon-row.ir-rows .ir-item > .ir-label { white-space: normal; }
@container (max-width: 950px) {
  .slide-content > .icon-row:not(.ir-rows) { grid-auto-flow: column; grid-template-columns: repeat(var(--ir-cols, 2), minmax(0, 1fr)); }
}

/* ---- Process ---- */
.slide .process-strip {
  align-items: stretch;
  justify-content: stretch;
  flex-wrap: nowrap;
  width: 100%;
  max-width: none;
  margin: 0 auto;
  --proc-type: 2.3958cqw;
}
.slide .process-strip.count-5 { --proc-type: 2cqw; }
.slide .process-strip.count-6 { --proc-type: 1.7cqw; }
.slide .process-strip:is(.count-7, .count-8, .count-9, .count-10) { --proc-type: 1.5cqw; }
.slide .process-strip .proc-step {
  --box-hue: var(--accent);
  flex: 1 1 0;
  min-width: 0;
  box-sizing: border-box;
  min-height: calc(14.0625cqw * var(--list-gap, 1));
  padding: 1.25cqw 1.3542cqw;
  border-radius: .9375cqw;
  align-items: flex-start;
  justify-content: center;
  text-align: left;
  font-size: max(var(--type-floor), min(var(--fs-body), var(--proc-type)));
  line-height: 1.16;
  font-weight: 400;
  color: var(--ink);
}
.slide .process-strip .proc-step.hue-2 { --box-hue: var(--hue-2); }
.slide .process-strip .proc-step.hue-3 { --box-hue: var(--hue-3); }
.slide .process-strip .proc-step::before { content: none; display: none; }
.slide .process-strip .proc-head {
  display: flex;
  align-self: stretch;
  justify-content: space-between;
  align-items: center;
  margin-bottom: .6250cqw;
}
.slide .process-strip .proc-num {
  width: auto;
  height: auto;
  display: block;
  border-radius: 0;
  background: none;
  box-shadow: none;
  font-family: var(--mono);
  font-weight: 400;
  font-size: 1.3542cqw;
  letter-spacing: .1em;
  color: var(--box-hue);
}
.slide .process-strip .proc-icon { display: grid; place-items: center; width: 2.0833cqw; height: 2.0833cqw; color: var(--box-hue); }
.slide .process-strip .proc-icon > svg { width: 100%; height: 100%; stroke-width: 1.5; }
.slide .process-strip .proc-label { margin: 0; font-weight: 400; font-size: 1em; line-height: 1.16; overflow-wrap: break-word; max-width: 100%; }
.slide .process-strip .proc-time { font-size: max(var(--type-floor), 1.5cqw); font-weight: 400; color: var(--box-hue); margin-top: .5em; }
.slide .process-strip .proc-details { margin-top: .5em; }
.slide .slide-content.layout-process .process-strip .proc-details.proc-details > li { font-size: max(var(--type-floor), 1.5cqw); line-height: 1.25; color: var(--ink); }
.slide .process-strip .proc-details li::before { color: var(--box-hue); }
/* The arrow fills the gap exactly: its box is the gap, its shaft starts at the left edge, the head tip is at the right. */
.slide .process-strip > .proc-arrow,
.slide .steps-diagram > .step-arrow {
  flex: none;
  display: flex;
  align-items: center;
  width: 3.9583cqw;
  color: var(--ink);
  margin: 0;
  padding: 0;
}
.slide .process-strip > .proc-arrow { align-self: center; height: .9375cqw; }
.slide .process-strip > .proc-arrow > svg,
.slide .steps-diagram > .step-arrow > svg { display: block; width: 100%; height: auto; overflow: visible; }
/* Pictures above the steps: the steps take their content height. */
.slide .slide-content:has(> .img-row, > .slide-figure, > .figure-row) > .process-strip .proc-step { min-height: 0; }
.slide .slide-content:has(> .img-row, > .slide-figure, > .figure-row) > .process-strip { margin-top: 1.6cqw; }

/* ---- Steps (stairs) ---- */
.slide .steps-diagram {
  gap: 0;
  width: 100%;
  max-width: none;
  margin: 0 auto;
}
.slide .steps-diagram .step-col {
  --box-hue: var(--accent);
  flex: 1 1 0;
  min-width: 0;
  border-radius: .9375cqw;
  padding: 1.25cqw 1.3542cqw;
  align-items: flex-start;
  justify-content: flex-start;
  text-align: left;
  color: var(--ink);
}
.slide .steps-diagram .step-col.hue-2 { --box-hue: var(--hue-2); }
.slide .steps-diagram .step-col.hue-3 { --box-hue: var(--hue-3); }
.slide .steps-diagram .step-col:is(:last-child, :nth-last-child(2), :nth-last-child(3)) { color: var(--ink); }
.slide .steps-diagram .step-label { font-weight: 400; font-size: max(var(--type-floor), min(var(--fs-body), 2.3958cqw)); line-height: 1.16; }
.slide .steps-diagram .step-cap { font-size: max(var(--type-floor), 1.5cqw); opacity: 1; color: var(--ink); }
.slide .steps-diagram > .step-arrow { align-self: flex-end; }
/* The older stair tint ramp (base.css, nth-last-child) is a heavier fill; the subtle box replaces it. */
.slide .steps-diagram .step-col.subtle-box {
  background: color-mix(in srgb, var(--box-hue) 5%, #fff);
  border: var(--subtle-box-line) solid color-mix(in srgb, var(--box-hue) 34%, #fff);
}

/* A single screenshot on a process or steps slide keeps its place above the boxes at a size that leaves them
   their band (it used to fill the whole content area and push the steps off the stage). */
.slide .slide-content:is(.layout-process, .layout-steps) > .slide-figure {
  flex: 0 1 auto;
  min-height: 0;
  max-height: 46cqh;
  align-self: center;
  margin: 0 auto 1.6cqw;
}
.slide .slide-content:is(.layout-process, .layout-steps) > .slide-figure img { max-height: 46cqh; width: auto; max-width: 100%; object-fit: contain; }
/* Section, statement and quote slides adopt the animated-scene formatting (ADR-0039, 0.41 ticket 04).
   Values from docs/design/2026-10-16-slide-scene-formatting/after/01-section.html, 02-statement.html and
   03-quote.html, drawn at 1920 x 1080 and written here in cqw (px / 19.2). Unmarked block: it sorts after
   every migrated block and, by its `zz-` name, after every other unmarked file (skin/statement.css among them), so
   it wins where it meets the older rules in layouts/title.css, layouts/statement.css, skin/statement.css and
   layouts/quote.css. The source-styled quote forms (ADR-0038, figure.qf) keep their own look: nothing
   here reaches a figure.qf, and the quote rules name `blockquote` (the Plain form) alone. */

/* ---- 1. Section card: the accent bar is the title block's own left edge ----
   The block (an authored kicker, if any, and the title) is one column at 160px from the left edge; the
   bar runs its full height, inset 6px top and bottom as drawn. No automatic line above the title. */
.slide-content.layout-section-title {
  justify-items: start;
}
.slide-content.layout-section-title > .slide-head {
  position: relative;
  margin-left: calc(8.3333cqw - var(--slide-pad-x));
  padding-left: 3.3333cqw;
}
.slide-content.layout-section-title > .slide-head::before {
  content: "";
  position: absolute;
  left: 0;
  top: .3125cqw;
  bottom: .3125cqw;
  width: .625cqw;
  background: var(--accent);
}
.slide-content.layout-section-title h1 {
  font-size: max(38px, 6.25cqw);
  line-height: 1.12;
  letter-spacing: -.02em;
  max-width: 10.33em;
}

/* ---- 2. Quote: no box, pale mark, regular-weight words, coloured source line ---- */
/* Authored emphasis is bold on the regular quote text (owner, 17 Nov 2026). */
.slide-content.layout-quote > blockquote strong { font-weight: var(--weight-emphasis); }
/* The source line: mono caps in the accent, led by a short rule (shared by every placement). */
.slide-content.layout-quote > blockquote cite,
.slide-content.layout-quote > blockquote + cite {
  font-family: var(--mono);
  font-weight: 400;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: .1em;
}
.slide-content.layout-quote > blockquote cite::before { height: 2px; background: currentColor; }
/* The mark is pale in every placement. */
.slide-content.layout-quote > blockquote::before {
  color: color-mix(in srgb, var(--accent) 30%, #fff);
}

/* Quote on its own (no painted title, no picture): the open drawing, centred on the slide. Beside a title
   rail or a picture the older geometry stays (ADR-0028 §2) and only the finish above applies.
   Geometry mirrored in compiler/scripts/lib/quote-layout.mjs: words 4.1667cqw (80px), width 71.875cqw
   (1380px), line height 1.24, the mark's 1.5em block over the words, source .6em under them. */
.slide-content.layout-quote:not(:has(> .slide-head:not(.slide-head-quiet), > .slide-figure)) > blockquote {
  background: none;
  border-left: 0;
  padding: 0;
  width: min(71.875cqw, 100%);
  --quote-fitted-size: max(31px, 4.1667cqw);
  line-height: 1.24;
}
.slide-content.layout-quote:not(:has(> .slide-head:not(.slide-head-quiet), > .slide-figure)) > blockquote::before {
  position: static;
  display: block;
  font-size: 3.25em;
  line-height: .7;
  height: .4615em;      /* the drawing's 120px block, in this 260px mark's em */
  margin-left: -.5em;   /* hangs 130px left of the words */
}
.slide-content.layout-quote:not(:has(> .slide-head:not(.slide-head-quiet), > .slide-figure)) > blockquote cite,
.slide-content.layout-quote:not(:has(> .slide-head:not(.slide-head-quiet), > .slide-figure)) > blockquote + cite {
  margin-top: calc(.6 * var(--quote-fitted-size));
  font-size: max(var(--type-floor), .35em);
  gap: .7857em;
}
.slide-content.layout-quote:not(:has(> .slide-head:not(.slide-head-quiet), > .slide-figure)) > blockquote cite::before {
  width: 2.2857em;
}

/* ---- 3. Statement: the accent bar is the text block's own left edge ----
   The bar is a left border on each statement paragraph; a following paragraph takes its gap as padding
   (not margin), so the bar runs unbroken from the top of the first to the bottom of the last: exactly as
   tall as the text block, and it moves with it. Regular weight everywhere: the lead paragraph is told
   from the quieter ones by ink alone. Replaces ADR-0028 §10's "no bar on the statement". The Rule
   background keeps its short rule above the text instead of the bar (one device, not two). */
.slide[data-layout="statement"]:has(> .slide-content.layout-statement) {
  --stmt-lead-weight: 400;
  --stmt-bar-w: .625cqw;
  --stmt-bar-gap: 3.0208cqw;
  --stmt-bar-ink: var(--accent);
}
.slide[data-layout="statement"]:has(> .slide-content.layout-statement.statement-bg-strong) { --stmt-bar-ink: #fff; }
.slide[data-layout="statement"] > .slide-content.layout-statement > p:not(.kicker):not(.slide-source) {
  font-weight: 400;
  border-left: var(--stmt-bar-w) solid var(--stmt-bar-ink);
  padding-left: var(--stmt-bar-gap);
}
.slide[data-layout="statement"] > .slide-content.layout-statement > p:not(.kicker):not(.slide-source) + p:not(.kicker):not(.slide-source) {
  margin-top: 0;
  padding-top: var(--stmt-para-gap);
}
/* Rule keeps its short rule above the text instead of the bar: the bar and its gap are zero there. */
.slide[data-layout="statement"]:has(> .slide-content.layout-statement.statement-bg-rule) {
  --stmt-bar-w: 0px;
  --stmt-bar-gap: 0px;
}
/* The [Action: …] buttons line up with the words, not the bar. */
.slide[data-layout="statement"] > .slide-content.layout-statement:not(.statement-centred) > .slide-actions {
  padding-left: calc(var(--stmt-bar-w) + var(--stmt-bar-gap));
}

/* Statement with its picture: the picture stays, beside a vertically centred text block (the drawing's
   760px picture, 96px gap, 160px side margins). The compiler stamps `statement-picture` (07-assembly) on
   the two authored shapes that carry a picture without a separate title: the heading IS the statement (a
   visible head, no statement paragraph), or the head is the quiet nav-only one and the statement is the
   paragraph (the picture may come before or after it in the source; it is always drawn on the right).
   A statement with BOTH a painted title and a paragraph keeps its own title-panel arrangement. */
.slide[data-layout="statement"]:has(> .slide-content.layout-statement.statement-picture) {
  padding-left: 0 !important;
  padding-right: 0 !important;
}
.slide[data-layout="statement"] > .slide-content.layout-statement.statement-picture.statement-picture {
  display: grid !important;
  grid-template-columns: minmax(0, 1fr) 39.5833cqw !important;
  grid-template-rows: minmax(0, 1fr) !important;
  column-gap: 5cqw;
  align-items: center;
  align-content: center;
  justify-items: stretch;
  width: 100%;
  max-width: none;
  height: 100%;
  min-height: 0;
  margin: 0;
  padding-left: 8.3333cqw;
  padding-right: 8.3333cqw;
}
.slide[data-layout="statement"] > .slide-content.layout-statement.statement-picture.statement-picture > :is(.slide-head:not(.slide-head-quiet), p:not(.kicker):not(.slide-source)) {
  grid-column: 1 !important;
  grid-row: 1 !important;
  align-self: center !important;
  justify-self: start;
  height: auto !important;
  min-width: 0;
  margin: 0 !important;
  max-width: 100%;
}
.slide[data-layout="statement"] > .slide-content.layout-statement.statement-picture.statement-picture > .slide-figure {
  grid-column: 2 !important;
  grid-row: 1 !important;
  align-self: center;
  justify-self: stretch;
  width: 100%;
  max-width: none;
  min-width: 0;
  min-height: 0;
  margin: 0;
}
.slide[data-layout="statement"] > .slide-content.layout-statement.statement-picture.statement-picture > .slide-figure img {
  width: 100%;
  max-width: none;
  max-height: 100%;
  border-radius: .9375cqw;
  border: .105cqw solid var(--hairline, #e3e2dc);
  background: #fff;
}
.slide[data-layout="statement"] > .slide-content.layout-statement.statement-picture.statement-picture > p:not(.kicker):not(.slide-source) { width: auto !important; }
/* The statement is the heading: it takes the statement's look (regular weight, the bar as the block's edge). */
.slide[data-layout="statement"] > .slide-content.layout-statement.statement-picture.statement-picture > .slide-head:not(.slide-head-quiet) {
  display: block !important;
  position: static !important;  /* the rail panel's absolute placement (stage.css) goes: the head is one grid cell here */
  min-height: 0 !important;
  width: 100% !important;       /* (the :is rule above sits at the same weight, hence the !important) a definite column, so the title fit can see when a line is too wide */
  background: none;
  border-left: var(--stmt-bar-w) solid var(--stmt-bar-ink);
  padding: 0 0 0 var(--stmt-bar-gap);
}
.slide[data-layout="statement"] > .slide-content.layout-statement.statement-picture.statement-picture > .slide-head > h1 {
  font-weight: 400;
  font-size: calc(var(--fs-body) * 1.3672);
  line-height: 1.14;
  letter-spacing: -.01em;
  max-width: none;
  margin: 0;
}
/* With a picture beside it the paragraph is set at the drawing's 84px (4.375cqw), not the full-width 104px. */
.slide[data-layout="statement"] > .slide-content.layout-statement.statement-picture.statement-picture > p:not(.kicker):not(.slide-source) {
  font-size: calc(var(--fs-body) * 1.3672);
  line-height: 1.14;
}
/* Stats, line chart and table adopt the animated-scene drawings (ADR-0039, 0.41 ticket 10).
   Values from docs/design/2026-10-16-slide-scene-formatting/after/15-stats.html, 16-linechart.html, 20-table.html and
   20-table-long.html (drawn at 1920 x 1080, written here in cqw = px / 19.2). Unmarked block: it sorts after every
   migrated block, so it wins where it meets skin/stats.css, skin/table.css, layouts/charts.css and base.css.

   Stats. A row of figures, centred in the band: each figure is a heavy accent number (the picture, not running text),
   a short accent mark under it and the label under that, regular and larger. The figure steps down as the row gets
   longer (one, two, three, four, five or more) so a long figure still fits its column. The caption stays, small and muted.

   Line chart. One accent line with dots, the value over each dot and the label under the axis, all regular weight.
   The compiler draws the chart as a 1000 x 430 picture; it is shown --lc-w wide, a stage-relative length (so the
   picture's scale is fixed at --lc-s, 1.6 stage px to a picture unit) and every length inside is the drawing's value
   divided by that scale. Linear scale from zero, as the scene; no gridlines.

   Table. The scene's open table: a mono uppercase head over an ink rule, hairline rules between rows, every second row
   banded in a light ink tint (a long table keeps the banding), the first column in the section accent at regular weight.
   No cell is bold. The column head reads at the type floor (the drawing's 26px is under it). The row padding, the
   density steps and the fitting seam of skin/table.css are unchanged. */

/* ---------- Stats ---------- */
.slide .stats-row {
  --st-fig: 7.8125cqw;
  --st-lab: 2.5cqw;
  display: flex;
  flex-wrap: nowrap;
  justify-content: center;
  align-items: flex-start;
  --st-n: 2;
  --st-gap: 5cqw;
  gap: var(--st-gap);
  width: 100%;
  max-width: none;
  margin: 0;
}
.slide .stats-row.stats-1 { --st-fig: 11cqw; --st-lab: 3cqw; --st-n: 1; }
.slide .stats-row.stats-3 { --st-fig: 6.4cqw; --st-lab: 2.2cqw; --st-n: 3; --st-gap: 3.5cqw; }
.slide .stats-row.stats-4 { --st-fig: 5.2cqw; --st-lab: 2.1cqw; --st-n: 4; --st-gap: 3cqw; }
.slide .stats-row:is(.stats-5, .stats-6, .stats-7, .stats-8, .stats-9) { --st-fig: 4.4cqw; --st-lab: 2.1cqw; --st-n: 5; --st-gap: 2.5cqw; }
.slide .stats-row .stat {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center !important;
  background: none !important;
  border: none !important;
  box-shadow: none !important;
  padding: 0 !important;
  gap: 0;
}
.slide .stats-row .stat-value {
  display: block;
  max-width: 100%;
  /* the drawn size, or less when the longest figure would not fit its column on one line (.6em a character) */
  font-size: min(var(--st-fig), calc((88cqw - (var(--st-n, 2) - 1) * var(--st-gap, 5cqw)) / var(--st-n, 2) / (var(--st-len, 6) * .6)));
  font-weight: 700;
  line-height: 1;
  letter-spacing: -.03em;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
/* the short accent mark under a figure */
.slide .stats-row .stat-value::after {
  content: "";
  display: block;
  width: 2.2917cqw;
  height: .4167cqw;
  margin: 1.7708cqw auto 0;
  background: var(--accent);
}
.slide .stats-row .stat-label {
  display: block;
  max-width: 100%;
  margin-top: 1.25cqw;
  font-size: max(var(--type-floor), var(--st-lab));
  font-weight: 400;
  line-height: 1.2;
  color: var(--ink);
}
.slide .stats-row .stat-value:empty + .stat-label,
.slide .stats-row .stat:not(:has(.stat-value)) .stat-label { margin-top: 0; }
.slide .stats-row .stat-cap {
  display: block;
  max-width: 100%;
  margin-top: .8cqw;
  font-size: max(var(--type-floor), 1.9cqw);
  font-weight: 400;
  line-height: 1.25;
  color: var(--muted);
}

/* ---------- Line chart ---------- */
.slide .chart-line {
  --lc-s: 1.6;
  --lc-w: 83.3333cqw;
  width: min(var(--lc-w), 100%);
  min-width: 0;
  max-width: 100%;
  margin: 0 auto;
}
.slide .chart-line svg { display: block; width: 100%; height: auto; overflow: visible; }
.slide .chart-line .chart-baseline { stroke: var(--ink); stroke-width: 2.5px; }
.slide .chart-line .chart-poly { stroke: var(--accent); stroke-width: 4.4px; }
.slide .chart-line .chart-dot { fill: var(--accent); stroke: none; r: 8.75px; }
.slide .chart-line .chart-val-svg { font: 400 27.5px/1 var(--sans, system-ui); fill: var(--ink); }
.slide .chart-line .chart-label-svg { font: 400 23.5px/1 var(--sans, system-ui); fill: var(--muted); }

/* ---------- Table ---------- */
.slide .slide-table {
  border: 0;
  border-collapse: collapse;
}
.slide .slide-table thead th {
  background: none;
  font-family: var(--mono);
  font-size: max(var(--type-floor), 1.35cqw);
  font-weight: 400;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: left;
  border: 0;
  border-bottom: .1563cqw solid var(--ink);
  padding-top: 0;
  padding-bottom: calc(.8333cqw * var(--list-gap, 1));   /* steps with the rows when the table is fitted */
}
.slide .slide-table tbody td,
.slide .slide-table tbody th {
  border: 0;
  border-bottom: .1042cqw solid var(--hairline);
  font-weight: 400;
}
.slide .slide-table tbody td:first-child,
.slide .slide-table tbody th:first-child {
  font-family: var(--sans);
  font-size: max(var(--type-floor), 1em);
  letter-spacing: 0;
  text-transform: none;
  color: var(--accent);
  font-weight: 400;
}
/* {table-first-column=off}: the first column reads like the others (ink, not the accent) */
.slide .slide-table.table-plain-first tbody td:first-child,
.slide .slide-table.table-plain-first tbody th:first-child { color: inherit; }
.slide .slide-table tbody tr:nth-child(even) > * { background: color-mix(in srgb, var(--ink) 4.5%, transparent); }
/* A long or dense table (the compiler stamps data-list-density from seven rows) gives up rule weight first: its rules are
   1px and the head's rule 2px, so the rows keep the room (the fitting ladder in fitLists steps padding, then type). Its head stays on one line:
   wrapped, a head would make the head row as tall as two body rows, which the ladder cannot take back. */
.slide .slide-table[data-list-density] thead th { border-bottom-width: max(1px, .1042cqw); white-space: nowrap; }
.slide .slide-table[data-list-density] tbody td,
.slide .slide-table[data-list-density] tbody th { border-bottom-width: 1px; }
/* {table-header=off}: the first row is a plain body row; rules and bands as for any other */
.slide .slide-table.table-noheader tbody tr:first-child td { border-bottom: .1042cqw solid var(--hairline); }
/* {table-columns=off} already carries no column rules; the scene's table never has any */
.slide .slide-table.table-nocolumns,
.slide .slide-table.table-nocolumns thead th,
.slide .slide-table.table-nocolumns tbody td,
.slide .slide-table.table-nocolumns tbody th { border-left: 0; border-right: 0; }
/* A table that builds row by row (Reveal): the newest row shown is tinted in the section tint while the table builds
   (20-table.html, tr.now). The runtimes already mark that row: data-mode-state="current" on its .mode-el (deck, presenter
   preview clone and handout write the same states). The newest row is tinted at every build step, the last row included;
   at the all-shown step after the last row ("full") no row is tinted, nor in a static view or handout (no mode, no state).
   A banded row that is not the newest keeps its band. */
.slide.mode-reveal .slide-table tbody tr.mode-el[data-mode-state="current"] > * { background: var(--tint); }
/* Trace in the scene design (ADR-0039, 0.41 ticket 11: "TalkWeaver's trace design at the scene's larger text; scrolls by
   whole turns, never truncates"). Values from docs/design/2026-10-16-slide-scene-formatting/after/18-trace.html (drawn at
   1920 x 1080, written here in cqw = px / 19.2). Unmarked block: it sorts after every migrated block, so it wins where it
   meets base.css, layouts/trace.css and skin/base.css.

   The window. A dark panel (#0b0e13, 20px corners, a soft shadow) as wide as the content band, as tall as its turns and
   never taller than the band under the title. The text is the scene's: mono 36px at line height 1.5. It is never shrunk to fit and nothing is cut:
   the runtime (runtime/trace-window.js) sets the panel's scroll position by whole turns, so the newest turn is complete
   and no turn shows half-way at the top. The vertical padding is a border in the panel colour: the scroll box ends
   inside it, so a turn scrolled above the window never shows through the padding. On a slide the panel has no scrollbar (the drawing has
   none) and scrolls by hand only when its turns do not all fit (the runtime marks it data-trace-overflow), so a turn
   taller than the window, or the start of a long trace shown with no mode, is never out of reach. The handout keeps
   its scroll box and thin scrollbar, as before, for a reader who scrolls by hand.

   Screen only: print keeps the trace as it was before this design (ADR-0039 leaves handout and print alone).

   The turns (TalkWeaver's terminal-agent look, layouts/simulation.css .sim-terminal-agent): a small route label in grey
   capitals over each turn; the user's prompt in an outlined box led by a white ">"; a model's call with an orange dot
   and its name in bold; a result in magenta under an elbow; the model's answer in teal with a teal dot; reasoning in
   violet italic. A speaker that is not one of those roles keeps its own label colour (the speaker buckets of base.css)
   over plain text. Under reveal the turns already shown stay at full strength (the drawing marks no newest turn). */

@media screen {
  .slide[data-title-layout] > .slide-content.layout-trace {
    max-width: none;
    width: 100%;
    min-height: 0;
  }
  /* The band: the trace owns the content height under the title, as code and media do (layouts/trace.css under the plain
     title; title-look.css and slide-foundations.css under a look). */
  .slide[data-title-layout="top"] > .slide-content.layout-trace {
    height: min(820px, 86cqh);
    padding-bottom: max(0px, calc(59px - var(--slide-pad-y)));
  }
  .slide[data-title-layout="top"] > .slide-content.layout-trace > .slide-head { margin-bottom: 0 !important; }
  .slide[data-title-layout="top"][data-title-look] > .slide-content.layout-trace {
    height: calc(100cqh - var(--titlelook-top) - var(--titlelook-height) - var(--titlelook-clear) - var(--slide-pad-y)) !important;
    padding-bottom: calc(var(--band-footer) + var(--band-air));
  }

  .slide .trace {
    --trace-bg: #0b0e13;
    position: relative;
    box-sizing: border-box;
    /* Sized to its content up to the band (ADR-0039: windows are sized to their content), centred in the band; a longer
       trace is held at the band's height and scrolls. Turns still to come keep their space under reveal, so the window
       does not change size as they arrive. */
    flex: 0 1 auto;
    width: 100%;
    height: auto;
    min-height: 0;
    max-height: none;
    margin: 0;
    padding: 0 2.5cqw;
    border: 1.7708cqw solid var(--trace-bg);
    border-left-width: 0;
    border-right-width: 0;
    border-radius: 1.0417cqw;
    background: var(--trace-bg);
    box-shadow: 0 1.0417cqw 2.6042cqw #0004;
    color: #d4dce6;
    font: 400 1.875cqw/1.5 var(--mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
    letter-spacing: 0;
    /* hidden, not auto, while the turns fit: the runtime still sets scrollTop, and a rounded scroll box leaves a hairline
       seam at its lower edge on the scaled stage. auto when they do not all fit (data-trace-overflow), so nothing is out
       of reach. The handout keeps auto (below). */
    overflow-x: hidden;
    overflow-y: hidden;
    overflow-anchor: none;
    scroll-behavior: auto;
    scrollbar-width: none;
  }
  .slide .trace::-webkit-scrollbar { display: none; }
  .slide .trace[data-trace-overflow] { overflow-y: auto; }
  .share-shell .slide .trace { overflow-y: auto; scrollbar-width: thin; scrollbar-color: #3a4757 transparent; }
  .share-shell .slide .trace::-webkit-scrollbar { display: block; width: 8px; }

  .slide .trace .turn { margin: 0 0 1.3542cqw; }
  .slide .trace .turn:last-child { margin-bottom: 0; }
  .slide .trace .turn:not(.trace-speaker) .role { color: #7f8ea3; }
  .slide .trace .role {
    margin: 0;
    font: 400 1.1458cqw/1.7708cqw var(--mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  /* Any other speaker: the label keeps its speaker colour (base.css buckets), the text sits flush under it. */
  .slide .trace .turn.trace-speaker .role { font-weight: 700; }
  .slide .trace .turn.trace-speaker .body { padding-left: 0; }
  .slide .trace .body {
    position: relative;
    padding-left: 1.6em;
    font-size: 1em;
    line-height: 1.5;
    letter-spacing: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: normal;
    color: #d4dce6;
  }
  /* The user's prompt: an outlined box led by a white ">" */
  .slide .trace .trace-prompt .body {
    display: flex;
    gap: .6em;
    padding: .5208cqw 1.1458cqw;
    border: .1042cqw solid #5a6676;
    border-radius: .7292cqw;
    color: #7cc4f5;
  }
  .slide .trace .trace-prompt .body::before { content: ">"; flex: none; color: #fff; font-weight: 700; }
  /* A model's call and its answer: a dot at the first line */
  .slide .trace :is(.trace-call, .trace-answer) .body::before {
    content: "";
    position: absolute;
    left: .35em;
    top: .5em;
    width: .5em;
    height: .5em;
    border-radius: 50%;
    background: #fbbf64;
  }
  .slide .trace .trace-call .trace-fn { color: #fbbf64; font-weight: 700; }
  .slide .trace .trace-answer .body { color: #5eead4; }
  .slide .trace .trace-answer .body::before { background: #5eead4; }
  /* A result: magenta under an elbow at its first line */
  .slide .trace .trace-result .body { color: #f0abfc; }
  .slide .trace .trace-result .body::before { content: "\23BF"; position: absolute; left: .35em; top: 0; color: #c78ccc; }
  .slide .trace .trace-thinking .body { color: #c4b5fd; font-style: italic; }

  /* Reveal: shown turns stay at full strength; only the turns still to come are hidden. */
  .slide.mode-reveal .trace .turn.mode-el[data-mode-state="soft"] { opacity: 1; }
}
/* 0.44 slide redesign, step 1: layouts that were broken in every look (current-state faults,
   docs/design/2026-11-10-native-slide-redesign/current-state/current-state-faults.md). These rules apply
   to the classic look too: they repair, they do not restyle. Named zz-w… so it sorts after zz-scene-*. */

/* flow=vertical: the connector between two stacked boxes had no height, so the rotated arrow
   (drawn 30-64px long) lay on top of the boxes' text. The connector now owns the arrow's length. */
.flow.flow-vertical { gap: 0; }
.flow.flow-vertical .flow-node { width: min(820px, 100%); max-width: none; align-self: center; font-size: max(var(--type-floor, 31px), 1.1em); padding: .55em 1em; }
.flow.flow-vertical .flow-connector { align-self: center; padding: 0; height: calc(clamp(30px, 4cqw, 64px) + 12px); width: auto; }

/* flow=branch: one root fanning out to two to six branches (the reported flat-list case, which the compiler
   now reads as a root and its branches, and the same shape written nested): the root sits centred above its
   branches, one row, each branch with its own stem up to the shared bar. A wider fan (seven or more), a
   branch with several roots, or a fan whose branches carry detail lines keeps the 0.43 drawing exactly:
   its children wrap onto rows under one bar, so nothing a branch says is squeezed out of the stage. */
.flow.flow-branch:has(> .flow-item:only-child):not(:has(.flow-child:nth-child(7))):not(:has(.flow-detail-line)) { justify-content: center; width: 100%; }
.flow.flow-branch:has(> .flow-item:only-child):not(:has(.flow-child:nth-child(7))):not(:has(.flow-detail-line)) > .flow-item { width: 100%; }
.flow.flow-branch:has(> .flow-item:only-child):not(:has(.flow-child:nth-child(7))):not(:has(.flow-detail-line)) > .flow-item > .flow-node { max-width: min(560px, 100%); font-size: max(var(--type-floor, 31px), 1.1em); }
.flow.flow-branch:has(> .flow-item:only-child):not(:has(.flow-child:nth-child(7))):not(:has(.flow-detail-line)) .flow-fan { width: 100%; }
.flow.flow-branch:has(> .flow-item:only-child):not(:has(.flow-child:nth-child(7))):not(:has(.flow-detail-line)) .flow-stem { height: clamp(24px, 3cqw, 44px); width: 3px; }
.flow.flow-branch:has(> .flow-item:only-child):not(:has(.flow-child:nth-child(7))):not(:has(.flow-detail-line)) .flow-children {
  flex-wrap: nowrap; gap: clamp(16px, 2cqw, 32px); width: 100%; justify-content: space-between;
  border-top: 0; padding-top: 0; position: relative;
}
.flow.flow-branch:has(> .flow-item:only-child):not(:has(.flow-child:nth-child(7))):not(:has(.flow-detail-line)) .flow-children > .flow-child {
  flex: 1 1 0; min-width: 0; max-width: none; position: relative; margin-top: clamp(24px, 3cqw, 44px);
  font-size: max(var(--type-floor, 31px), 1em); text-align: center; justify-content: center; overflow-wrap: break-word;
}
/* the stem from the bar down to each branch */
.flow.flow-branch:has(> .flow-item:only-child):not(:has(.flow-child:nth-child(7))):not(:has(.flow-detail-line)) .flow-children > .flow-child::before {
  content: ""; position: absolute; left: 50%; top: calc(-1 * clamp(24px, 3cqw, 44px) - 1.5px); width: 3px;
  height: clamp(24px, 3cqw, 44px); background: var(--accent); transform: translateX(-50%);
}
/* the bar joins the first and the last branch centres (not the outer edges) */
.flow.flow-branch:has(> .flow-item:only-child):not(:has(.flow-child:nth-child(7))):not(:has(.flow-detail-line)) .flow-children::before {
  content: ""; position: absolute; top: 0; height: 3px; background: var(--accent);
  left: calc(50% / var(--fan-count, 3)); right: calc(50% / var(--fan-count, 3));
}
.flow.flow-branch:has(> .flow-item:only-child):not(:has(.flow-child:nth-child(7))):not(:has(.flow-detail-line)) .flow-children:has(> .flow-child:nth-child(2):last-child) { --fan-count: 2; }
.flow.flow-branch:has(> .flow-item:only-child):not(:has(.flow-child:nth-child(7))):not(:has(.flow-detail-line)) .flow-children:has(> .flow-child:nth-child(3):last-child) { --fan-count: 3; }
.flow.flow-branch:has(> .flow-item:only-child):not(:has(.flow-child:nth-child(7))):not(:has(.flow-detail-line)) .flow-children:has(> .flow-child:nth-child(4):last-child) { --fan-count: 4; }
.flow.flow-branch:has(> .flow-item:only-child):not(:has(.flow-child:nth-child(7))):not(:has(.flow-detail-line)) .flow-children:has(> .flow-child:nth-child(5):last-child) { --fan-count: 5; }
.flow.flow-branch:has(> .flow-item:only-child):not(:has(.flow-child:nth-child(7))):not(:has(.flow-detail-line)) .flow-children:has(> .flow-child:nth-child(6):last-child) { --fan-count: 6; }
.flow.flow-branch:has(> .flow-item:only-child):not(:has(.flow-child:nth-child(7))):not(:has(.flow-detail-line)) .flow-children:has(> .flow-child:only-child)::before { display: none; }

/* timeline=compact: read down the first column, then the second (chronological order), at the
   body size rather than the old 1.7cqw. */
.timeline.timeline-compact { font-size: max(var(--type-floor, 31px), 2.2cqw); width: 100%; }
.timeline.timeline-compact .tl-entries {
  grid-auto-flow: column;
  grid-template-rows: repeat(var(--tl-compact-rows, 3), auto);
  gap: .6em 2.4em;
}

/* the label inside a flow node takes the node's size (it carried a smaller one of its own) */
.flow.flow-vertical .flow-node .flow-label, .flow.flow-branch:has(> .flow-item:only-child):not(:has(.flow-child:nth-child(7))):not(:has(.flow-detail-line)) .flow-node .flow-label { font-size: inherit; }
/* 0.44 look ("ocean"): theme tokens. Design record: docs/design/2026-11-10-native-slide-redesign/
   (round verdicts 5 to 8 lock the colours; round 4 locks colour by count).

   The tokens also apply to data-look="ocean-safe" (a slide the runtime's fit-or-fall-back step returned to the 0.43
   structure: the look's colours, 0.43 sizes). Every other rule in the zz-x-ocean-* files is scoped to `.slide[data-look="ocean"]`, which the compiler
   stamps on each slide unless the talk sets `palette: classic` (or the old `palette: green`), so a classic
   talk renders exactly as in 0.43. Later design decisions (typeface, section colours, the companion's
   reach) are changes to these tokens, not to the layout files.

   Contrast (WCAG 2.1): white on Ocean 4.91:1, white on Deeper Ocean 7.06:1, near-black on amber 8.65:1,
   near-black on white 17.8:1, near-black on light 15.6:1, Deeper Ocean on light 6.19:1. White on amber is
   2.05:1, so amber always carries near-black type and icons; Ocean text on light (4.31:1) is used only at
   label size (30px and up). Amber text on white (2.05:1) is used only for display-size key words. */

.slide:is([data-look="ocean"], [data-look="ocean-safe"]) {
  /* colour */
  --look-main: var(--sec-accent, #1273C4);      /* Ocean, or the section's own accent */
  --look-deep: var(--sec-deep, #0D5A9E);        /* the second strength: white icon and label on it */
  --look-light: var(--sec-tint, #E8F1FC);       /* the light strength of the main colour */
  --look-companion: #FF9F1C;                    /* amber: the bold companion */
  --look-on-main: #FFFFFF;
  --look-on-deep: #FFFFFF;
  --look-on-companion: #16181D;
  --look-ink: #16181D;                          /* text and thin lines only, never a field */
  --look-muted: #4A5361;                        /* supporting text: 8.2:1 on white */
  --look-ground: #FFFFFF;
  --look-ground-neutral: #F2F4F7;
  --look-hairline: #D5DBE3;
  --look-line: 3px;                             /* figure lines */
  /* the three further strengths a pie of four or more slices draws with (zz-x-ocean-40-pie.css) */
  --look-pie-mid: #5B9BD8;
  --look-pie-pale: #A9CBEE;
  --look-pie-dark: #0A3F70;

  /* type: the deck's own faces until the typeface round decides (open decision; default today's) */
  --look-face-display: var(--sans);
  --look-face-text: var(--sans);
  /* item labels and supporting text follow the slide's text-size step ({font-body=…}, --fs-body: 3.2cqw at
     the default M step): label 0.8125 × (41.6px at 1600), supporting text 0.625 × (32px), never below the floor */
  --look-size-label: max(var(--type-floor, 31px), calc(var(--fs-body, 3.2cqw) * .8125));
  --look-size-body: max(var(--type-floor, 31px), calc(var(--fs-body, 3.2cqw) * .625));
  --look-size-statement: 6.4cqw;                 /* 102px at 1600; cqw only, so thumbnails scale */
  --look-icon: 6.8cqw;                           /* item icons: 109px at 1600 */

  /* colour by count and the companion level (open decisions, defaults per the locked verdicts) */
  --look-section: var(--look-main);              /* section colour: every section Ocean by default */
  --look-lead: var(--look-main);                 /* who fills single-idea slides (statement, divider) */
  --look-on-lead: var(--look-on-main);
  --look-tab-on-lead: var(--look-deep);          /* the title tab on a lead-coloured slide, white type on it */
  --look-keyword: var(--look-main);              /* key words of a light statement: Ocean on white, 4.91:1 */
  --look-current: var(--look-companion);         /* a marker: the current loop stop, a highlighted bar or slice, a timeline dot */
  --look-on-marker: var(--look-on-companion);    /* type on that marker: near-black on amber (8.65:1) */
  /* the current item of a list, row or tile in a reveal or {focus}: a full Ocean fill with white label and white icon
     (owner, 12 Nov, sampler S85 and S86: "full colour in blue not orange", "icon should not turn black but white");
     white on Ocean 4.91:1. Tokens, so Bold can differ later. */
  --look-current-fill: var(--look-main);
  --look-on-current: var(--look-on-main);
  --look-two-a: var(--look-light);               /* two things side by side: light half … */
  --look-two-b: var(--look-main);                /* … and the main colour (no orange halves by default) */
  --look-three-1: var(--look-main);              /* three things: strengths of one colour */
  --look-three-2: var(--look-deep);
  --look-three-3: var(--look-ground-neutral);     /* the light panel of three: the light neutral, as frame l4-4 */

  /* the legacy tokens every layout already reads */
  --paper: var(--look-ground);
  --ink: var(--look-ink);
  --muted: var(--look-muted);
  --hairline: var(--look-hairline);
  --line: var(--look-hairline);
  /* The legacy tint grounds of layouts the look has not redrawn carry Ocean text at running size (numbers, captions,
     labels): a lighter strength of the section's tint keeps that text at AA (Ocean on #F3F8FD 4.6:1; on #E8F1FC it was 4.31:1). The
     designed shapes keep --look-light. */
  --look-light-ground: color-mix(in srgb, var(--look-light) 55%, #FFFFFF);   /* #F3F8FD for Ocean */
  --tint: var(--look-light-ground);
  --hue-2: var(--look-deep);
  --hue-2-tint: var(--look-light-ground);
  --hue-3: var(--look-deep);                    /* text the classic layouts set in this hue reaches AA on the light grounds (was Ocean, 4.46:1 on #F2F4F7) */
  --hue-3-tint: var(--look-light-ground);
  /* No background here: a slide stays transparent so the stage behind it shows (stage-fit); layouts that
     want a field or the light neutral ground paint it themselves. */
}

/* Bold: amber leads the statement and divider slides; the detail slides stay blue. Key words on a light
   statement keep Ocean text in bold (amber type on white is 2.05:1). */
.slide:is([data-look="ocean"], [data-look="ocean-safe"])[data-companion="bold"] {
  --look-lead: var(--look-companion);
  --look-on-lead: var(--look-on-companion);
  --look-tab-on-lead: var(--look-main);
}

/* the size tokens re-resolve where a layout sets its own text step (--fs-body on .slide-content) */
.slide:is([data-look="ocean"], [data-look="ocean-safe"]) > .slide-content {
  --look-size-label: max(var(--type-floor, 31px), calc(var(--fs-body, 3.2cqw) * .8125));
  --look-size-body: max(var(--type-floor, 31px), calc(var(--fs-body, 3.2cqw) * .625));
}
/* Width compensation (0.44.5): each face's lines run within about 1% of Trebuchet MS, the face the Ocean look was
   fitted against in 0.44.0 (scripts/measure-typeface-widths.mjs; sampler and neutral fixtures, character-weighted).
   The compensation is a size-adjust descriptor on each face, not tracking: it scales the drawn glyphs whatever
   letter-spacing a layout sets, at every size, and leaves computed font sizes (and so the type floor) unchanged.
   Tracking declared on the slide would be inherited as a fixed length (too little on large text) and replaced by any
   layout's own letter-spacing. Inter 95.8% and Geist 98.5% bring both x-height and line width to Trebuchet's
   (0.523 em); Alegreya Sans (x-height 0.458 em) is drawn at 114% plus light tracking; Fraunces and the Inter and Geist
   headings take a small display tracking. Symbols outside the bundled subsets (arrows, ✓, ≤) fall back through
   0.44.0's own stack (Trebuchet MS, then the system UI face), so they draw as in 0.44.0.
   Vertical metrics: every bundled face gets Trebuchet's ascent and descent (0.939/0.222 em, no line gap) through
   ascent-/descent-/line-gap-override, divided by the face's size-adjust (Chromium scales overrides by it), so inline
   boxes (boxed key words, line-height: normal) are as tall as in 0.44.0. */
