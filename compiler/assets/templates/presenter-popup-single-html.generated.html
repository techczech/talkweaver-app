  font-weight: 700;
  line-height: var(--list-lh, 1.25);
  overflow-wrap: anywhere;
}
.poll-frame-matrix-number { color: var(--accent); }
.poll-frame-matrix-text { min-width: 0; }
.poll-frame-matrix-labels {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(var(--poll-frame-columns, 3), minmax(0, 1fr));
  gap: clamp(6px, .8cqw, 14px);
  margin-left: calc(max(24px, 2.4cqw) + clamp(8px, 1cqw, 18px));
}
.poll-frame-matrix-label {
  margin: 0;
  /* Chip padding steps down with the ladder's gap knob (the horizontal air stays put), and chip
     type rides --fs-body at the chip's own ratio with a 20px floor — chips keep at least one full
     line of label no matter how far the ladder steps. */
  padding: calc(clamp(4px, .7cqh, 10px) * var(--list-gap, 1)) clamp(6px, .8cqw, 14px);
  background: var(--tint);
  color: var(--ink);
  font-size: max(20px, calc(var(--fs-body, 3.2cqw) * .484));
  line-height: var(--list-lh, 1.25);
  overflow-wrap: anywhere;
}
/* A board (ADR-0032, round-3 A5): the instructions under the question, then the columns side by
   side — each under an accent rule with its name and card count, its hint while empty, and the
   dashed example card in the first column of an empty board. The live board (ticket 04) fills the
   same columns with cards. */
.poll-frame-board-instructions {
  margin: 0;
  max-width: 60ch;
  color: var(--ink);
  font-size: max(var(--type-floor), 1.5cqw);
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.poll-frame-board {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(var(--poll-frame-board-columns, 3), minmax(0, 1fr));
  gap: clamp(10px, 1.6cqw, 28px);
  align-self: start;
  align-items: start;
  min-height: 0;
}
.poll-frame-answers:has(> .poll-frame-board, > .poll-frame-board-empty) { align-self: stretch; }
.poll-frame-board-column {
  margin: 0;
  min-width: 0;
  display: grid;
  align-content: start;
  gap: clamp(6px, 1cqh, 14px);
  padding-top: clamp(6px, 1cqh, 14px);
  border-top: 3px solid var(--accent);
}
.poll-frame-board-name {
  margin: 0;
  display: flex;
  align-items: baseline;
  gap: .5em;
  font-size: max(var(--type-floor), 1.9cqw);
  font-weight: 700;
  line-height: 1.2;
  overflow-wrap: anywhere;
}
.poll-frame-board-count { color: var(--muted); font-size: .7em; font-weight: 400; font-variant-numeric: tabular-nums; }
.poll-frame-board-hint {
  margin: 0;
  color: var(--muted);
  font-size: max(var(--type-floor), 1.35cqw);
  line-height: 1.3;
  overflow-wrap: anywhere;
}
.poll-frame-board-cards { display: grid; gap: clamp(6px, 1cqh, 14px); min-width: 0; }
.poll-frame-board-card {
  margin: 0;
  min-width: 0;
  padding: clamp(8px, 1.2cqh, 16px) clamp(8px, .9cqw, 16px);
  background: var(--tint);
}
.poll-frame-board-card p { margin: 0; font-size: max(var(--type-floor), 1.5cqw); line-height: 1.3; overflow-wrap: anywhere; }
.poll-frame-board-card.is-example { background: transparent; border: 2px dashed var(--hairline); color: var(--muted); }
.poll-frame-board-card small {
  display: block;
  margin-top: .4em;
  font-family: var(--mono);
  font-size: max(12px, .9cqw);
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}
/* A LIVE board (ticket 04, round-2 S1-S10 with round 3's hints and example): the same columns filled
   with the worker's big-screen view. The frame keeps the height its slide gives it (the body row is
   minmax(0, 1fr) and clips), so a full board shrinks its cards instead of growing the slide;
   pollFrameFitBoard (poll-frame.mjs) picks --poll-frame-board-fs / --poll-frame-board-per-row, the
   largest card text at which no column overflows. Card text is in canvas units so the presenter's
   preview, the audience window and the venue screen agree (ADR-0030). */
.poll-frame[data-board-state] { grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; max-height: 100%; }
/* The slide's own content grid sizes its rows from what they hold, so a board that fills up would
   grow the frame, then the slide (the deck would then zoom everything down). A size-contained frame
   holds nothing that grows a row: the row stays the height the slide gives it, and the fit picks the
   card size that fills it. */
.poll-frame[data-board-state] { contain: size; }
.poll-frame[data-board-state] .poll-frame-question { max-width: none; font-size: max(34px, 2.9cqw); line-height: 1.1; }
.poll-frame[data-board-state] .poll-frame-body { display: block; overflow: hidden; }
.poll-frame[data-board-state] .poll-frame-answers { height: 100%; }
.poll-frame[data-board-state] .poll-frame-board { height: 100%; grid-template-rows: minmax(0, 1fr); align-items: stretch; align-self: stretch; }
.poll-frame[data-board-state] .poll-frame-board-column { display: flex; flex-direction: column; gap: 0; }
.poll-frame[data-board-state] .poll-frame-board-name { margin-bottom: clamp(6px, 1.1cqh, 14px); }
.poll-frame[data-board-state] .poll-frame-board-hint { padding: .8cqw 0; border-bottom: 1px dotted var(--hairline); }
.poll-frame[data-board-state] .poll-frame-board-cards {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  grid-template-columns: repeat(var(--poll-frame-board-per-row, 1), minmax(0, 1fr));
  align-content: start;
  gap: calc(var(--poll-frame-board-fs, var(--type-floor)) * .3);
}
.poll-frame[data-board-state] .poll-frame-board-card {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  align-items: start;
  gap: .5em;
  border: 1px solid var(--hairline);
  border-radius: .35cqw;
  background: #fff;
  color: var(--ink);
  font-size: var(--poll-frame-board-fs, var(--type-floor));
  padding: calc(var(--poll-frame-board-fs, var(--type-floor)) * .34) calc(var(--poll-frame-board-fs, var(--type-floor)) * .5);
  hyphens: auto;
  -webkit-hyphens: auto;
}
.poll-frame[data-board-state] .poll-frame-board-card p { font-size: inherit; line-height: 1.2; overflow-wrap: break-word; }
.poll-frame[data-board-state] .poll-frame-board-card.is-group { grid-template-columns: auto minmax(0, 1fr) auto; background: var(--tint); border-color: transparent; }
.poll-frame[data-board-state] .poll-frame-board-card.is-example { background: transparent; border: .2cqw dashed var(--muted); color: var(--muted); }
.poll-frame-board-num { min-width: 1.2em; color: var(--accent); font-family: var(--mono); font-size: .78em; font-weight: 700; line-height: 1.55; }
.poll-frame-board-x {
  align-self: start;
  padding: .1em .4em;
  border-radius: 1cqw;
  background: var(--accent);
  color: #fff;
  font-family: var(--mono);
  font-size: .7em;
  font-weight: 700;
  line-height: 1.5;
  white-space: nowrap;
}
.poll-frame-board-more { flex: none; margin: 0; padding-top: .6cqh; color: var(--muted); font-size: max(var(--type-floor) * .75, 1.45cqw); line-height: 1.3; }
.poll-frame-board-more b { color: var(--ink); font-weight: 700; }
.poll-frame-board-empty { display: grid; grid-template-columns: minmax(0, 1fr) 30%; grid-template-rows: minmax(0, 1fr); gap: 3cqw; height: 100%; align-items: center; }
.poll-frame-board-empty .poll-frame-board { height: auto; grid-template-rows: auto; align-self: stretch; }
.poll-frame-board-bigjoin { display: grid; gap: 1.2cqh; align-content: center; justify-items: start; min-width: 0; max-height: 100%; overflow: hidden; padding: 1.6cqw; background: var(--tint); }
.poll-frame-board-bigjoin .poll-frame-board-qr { width: min(100%, 17cqw); }
.poll-frame-board-bigjoin .poll-frame-board-join-label { font-size: max(var(--type-floor) * .8, 1.6cqw); color: var(--ink); }
.poll-frame-board-bigjoin .poll-frame-board-join-url { font-size: max(var(--type-floor), 2.6cqw); }
.poll-frame[data-board-state] .poll-frame-foot { display: flex; align-items: center; gap: 1.6cqw; }
.poll-frame[data-board-state] .poll-frame-chip { margin-left: auto; }
.poll-frame[data-board-state="open"] .poll-frame-chip { background: var(--accent); color: #fff; }
.poll-frame[data-board-state="frozen"] .poll-frame-chip { background: var(--ink); color: #fff; }
.poll-frame-board-qr { flex: none; display: block; width: 6.4cqw; background: #fff; }
.poll-frame-board-qr svg { display: block; width: 100%; height: auto; }
.poll-frame-board-join { display: grid; gap: .2cqh; min-width: 0; }
.poll-frame-board-join-label { color: var(--muted); font-size: max(var(--type-floor) * .7, 1.35cqw); line-height: 1.2; }
.poll-frame-board-join-url { color: var(--ink); font-size: max(var(--type-floor) * .9, 2.2cqw); font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
.poll-frame-board-note { color: var(--ink); font-size: max(var(--type-floor) * .7, 1.6cqw); line-height: 1.3; }
.poll-frame-board-note b { font-weight: 700; }
.poll-frame-prompt {
  margin: 0;
  max-width: 30ch;
  font-size: max(28px, 2.5cqw);
  line-height: 1.3;
}
.poll-frame-warning {
  margin: 0;
  max-width: 34ch;
  padding-left: clamp(10px, 1.1cqw, 18px);
  border-left: 4px solid var(--red);
  color: var(--ink);
  font-size: max(24px, 2cqw);
  line-height: 1.3;
}
.poll-frame-join.is-pending { padding: 0; background: transparent; }
.poll-frame-join-note { margin: 0; color: var(--ink); font-size: var(--fs-body); line-height: 1.3; }
.poll-frame-join-url { margin: clamp(6px, .9cqh, 12px) 0 0; font-size: max(18px, 1.5cqw); font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.poll-frame-qr { background: #fff; min-height: 0; }
.poll-frame-qr svg { display: block; width: 100%; height: auto; max-height: 100%; }
.poll-frame-foot {
  display: grid;
  justify-items: start;
  gap: clamp(8px, 1.2cqw, 20px);
  padding-top: clamp(8px, 1.2cqh, 18px);
  border-top: 1px solid var(--hairline);
  color: var(--muted);
  font-size: max(var(--type-floor), 1.35cqw);
  line-height: 1.3;
}
.poll-frame-chip {
  justify-self: start;
  padding: clamp(3px, .5cqh, 7px) clamp(7px, .8cqw, 14px);
  background: var(--tint);
  color: var(--accent);
  font-family: var(--mono);
  font-size: max(14px, 1.1cqw);
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.poll-frame-instruction { min-width: 0; }

/* Live state (Ticket 23) — the SAME frame with its slots filled by the runtime. Nothing below
   changes the layout the compiled frame set; it only paints counts, bars, response cards, the
   page marker and the open chip into the slots the grammar in poll-frame.mjs defines. */
.poll-frame-option { position: relative; isolation: isolate; }
.poll-frame-option.is-result { grid-template-columns: max(24px, 2.4cqw) minmax(0, 1fr) auto; }
.poll-frame-option:has(> .poll-frame-place) { grid-template-columns: max(60px, 6cqw) minmax(0, 1fr) auto; }
.poll-frame-options.has-joint > .poll-frame-option { grid-template-columns: max(120px, 12cqw) minmax(0, 1fr) auto; }
.poll-frame-place { white-space: nowrap; }
.poll-frame-count {
  min-width: 0;
  color: var(--muted);
  font-size: max(var(--type-floor), 1.5cqw);
  font-variant-numeric: tabular-nums;
  line-height: 1.25;
  text-align: right;
  /* Breaks only where the runtime put a newline (ranking: points / first places), never mid-phrase. */
  white-space: pre-line;
}
/* The bar sits BEHIND the option text, spanning the row above its hairline: results never leave
   the option rows for a second layout. */
.poll-frame-bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: var(--poll-option-padding-bottom);
  width: var(--poll-fill, 0%);
  max-width: 100%;
  background: color-mix(in srgb, var(--accent) 22%, transparent);
  z-index: -1;
  transition: width .3s ease-out;
}
.poll-frame-continued { font-size: .8em; color: var(--muted); }
/* The row's denominator sits at the end of the LABELS line, never on a line of its own and never
   crowding the item text, so a five-item matrix keeps the height the compiled frame gave it. */
.poll-frame-matrix-row:has(> .poll-frame-matrix-summary) { grid-template-columns: minmax(0, 1fr) auto; }
.poll-frame-matrix-row:has(> .poll-frame-matrix-summary) > .poll-frame-matrix-item { grid-column: 1 / -1; }
.poll-frame-matrix-row:has(> .poll-frame-matrix-summary) > .poll-frame-matrix-labels { grid-column: 1; grid-row: 2; }
.poll-frame-matrix-row:has(> .poll-frame-matrix-summary) > .poll-frame-matrix-summary { grid-column: 2; grid-row: 2; align-self: center; }
.poll-frame-matrix-summary {
  margin: 0;
  color: var(--muted);
  font-size: max(var(--type-floor), 1.3cqw);
  line-height: 1.25;
  white-space: nowrap;
}
/* Results keep each chip on ONE line — label, then count and share — so a five-item matrix stays
   the height the compiled frame gave it. */
.poll-frame-matrix-label { position: relative; isolation: isolate; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 .5em; }
.poll-frame-matrix-label-text { min-width: 0; }
.poll-frame-matrix-label.is-result::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--poll-fill, 0%);
  max-width: 100%;
  background: color-mix(in srgb, var(--accent) 26%, transparent);
  z-index: -1;
}
/* Seven narrow chips at 1280 leave ~75px inside a chip: the count may break between the number and
   its share rather than overflow the chip. */
.poll-frame-matrix-count { font-size: max(var(--type-floor), 1.4cqw); line-height: 1.2; }
.poll-frame-matrix-count small { font-weight: 400; }
.poll-frame-responses { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(10px, 1.4cqw, 22px); }
.poll-frame-responses.is-long-response { grid-template-columns: minmax(0, 1fr); }
.poll-frame-response { margin: 0; min-width: 0; padding: clamp(10px, 1.6cqh, 20px) clamp(10px, 1.2cqw, 20px); background: var(--tint); }
.poll-frame-response p { margin: 0; font-size: max(var(--type-floor), 1.9cqw); line-height: 1.35; white-space: pre-wrap; overflow-wrap: anywhere; }
.poll-frame-response small { display: block; margin-bottom: .4em; }
.poll-frame-empty { margin: 0; color: var(--muted); font-size: max(24px, 2cqw); line-height: 1.3; }
.poll-frame-total, .poll-frame-page { min-width: 0; }
.poll-frame-chip[data-poll-chip="open"] { background: var(--accent); color: #fff; }
/* A poll slide with no compiled frame (a carousel keeps its stepped body) carries the live frame on a
   paper host over the slide, at the slide's own margins. */
.slide > .poll-frame-host {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: grid;
  padding: var(--slide-pad-y) var(--slide-pad-x);
  background: var(--paper);
  container-type: size;
}
/* The Quick poll popup (audience-polls design: Quick polls remain temporary popups) is a bounded
   paper stage over the current slide; the frame inside it is the same frame. It is a size container
   so the frame's stage-relative type reads against the popup, and it is the ONLY overlay a poll may
   put over a slide — an authored poll never pops anything up. */
.poll-frame-popup {
  position: absolute;
  inset: 5%;
  z-index: 45;
  display: grid;
  box-sizing: border-box;
  padding: 4cqh 4cqw;
  background: var(--paper);
  color: var(--ink);
  border: 2px solid var(--hairline);
  box-shadow: 0 8px 44px #14263f44;
  container-type: size;
}
.poll-frame-popup[hidden] { display: none !important; }
.poll-frame-popup .poll-frame-option, .poll-frame-host .poll-frame-option { font-size: max(var(--type-floor), var(--fs-body, 2.6cqw)); line-height: 1.35; }
/* A poll heading with no body (an open-response poll) infers the statement layout, whose skin
   (skin/statement.css @order 1381–1383) centres every child at a 12em measure. The frame is the
   slide's stage: it keeps its full measure and stretches on every layout the slide may infer. */
.slide[data-title-layout] .slide-content.layout-statement:has(> .poll-frame),
.slide .slide-content.layout-statement:has(> .poll-frame) { align-content: stretch; justify-items: stretch; }
.slide[data-title-layout] .slide-content.layout-statement:has(> .slide-head-quiet) > .poll-frame,
.slide .slide-content.layout-statement > .poll-frame { max-width: none; justify-self: stretch; align-self: stretch; }
/* The board panel (ADR-0032 decision 4; feedback-boards ticket 05; drawn in
   docs/design/2026-09-28-feedback-boards/round-2/shots D1-D24). Beside the slide it lies over the
   Next and Then previews (placed by the template, like the questions tray); full screen it takes the
   presenter window below the top bar, with the slide as a monitor in its left rail; in its own window
   it fills that window. The presenter's calm-stage chrome (ADR-0031): the menu card's colours, the
   chrome type scale (13px meta, 14px labels and cards) and lucide icons. Card text, names and column
   labels are written with textContent only (compiler/assets/runtime/board-panel.js). */
.bp { position: fixed; z-index: 25; box-sizing: border-box; display: flex; gap: 12px; min-width: 0; min-height: 0;
  background: #0f1720; border: 1px solid #ffffff26; border-radius: 10px; color: #f7f3ea;
  --bp-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; font: 400 14px/1.3 var(--bp-ui);
  -webkit-font-smoothing: antialiased; --bp-accent: #c2410c; --bp-blue: #5b9bd5; --bp-yellow: #e9c46a; overflow: hidden; }
.bp[hidden] { display: none !important; }
.bp *, .bp *::before, .bp *::after { box-sizing: border-box; }
.bp svg { width: 16px; height: 16px; flex: none; }
.bp button { font: inherit; color: inherit; }
.bp button:focus-visible, .bp .bp-card:focus-visible, .bp .bp-col-name:focus-visible { outline: 2px solid var(--bp-blue); outline-offset: 1px; }
.bp-main { position: relative; display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; min-height: 0; }
.bp-layer { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.bp-layer > * { pointer-events: auto; }

/* Header: Board, counts, state; the primary action and the ways out. */
.bp-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; border-bottom: 1px solid #ffffff14; flex: none; min-width: 0; }
.bp-title { display: inline-flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; }
.bp-title > svg { color: var(--bp-yellow); }
.bp-title b { font-weight: 600; font-size: 14px; }
.bp-counts { font-size: 13px; color: #a3b3c2; overflow: hidden; text-overflow: ellipsis; }
.bp-new { color: var(--bp-yellow); }
.bp-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px; font-size: 13px; font-weight: 600; }
.bp-chip svg { width: 13px; height: 13px; }
.bp-chip.is-open { background: #16392a; color: #6fd39b; }
.bp-chip.is-closed { background: #2a3440; color: #c9d6e2; }
.bp-chip.is-frozen { background: #1d3552; color: #8ec3ff; }
.bp-chip.is-ready { background: #2a3440; color: #a3b3c2; }
.bp-spacer { flex: 1; }
.bp-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid #ffffff1c; border-radius: 7px; background: #1f2c39; cursor: pointer; white-space: nowrap; font-size: 14px; }
.bp-btn:hover, .bp-icon-btn:hover, .bp-mi:hover, .bp-chip-btn:hover { background: #283a4c; }
.bp-kbd { display: inline-block; min-width: 18px; padding: 1px 5px; border: 1px solid #ffffff2e; border-radius: 4px; color: #c9d6e2; font-size: 13px; line-height: 1.2; text-align: center; }
.bp-icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0; border: 1px solid #ffffff1c; border-radius: 7px; background: #1f2c39; cursor: pointer; }
.bp-icon-btn.is-small { width: 26px; height: 24px; }
.bp-link { border: 0; background: none; padding: 0; color: #8ec3ff; cursor: pointer; font-size: 13px; white-space: nowrap; flex: none; }

/* The big-screen strip (D1, D6-D12): what the room sees, and releasing what waits. */
.bp-strip { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; border-bottom: 1px solid #ffffff14; flex: none; min-width: 0; }
.bp-strip-words { display: inline-flex; align-items: center; gap: 4px; min-width: 0; flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; color: #c9d6e2; }
.bp-strip-words > svg { color: #a3b3c2; margin-right: 4px; }
.bp-strip-text { color: #f7f3ea; }
.bp-strip-waiting { color: var(--bp-yellow); font-weight: 600; }
.bp-strip-detail { color: #c9d6e2; }
.bp-strip-controls { display: inline-flex; align-items: center; gap: 6px; flex: none; }
.bp-strip.is-stacked { flex-direction: column; align-items: flex-start; border: 0; padding: 0; gap: 10px; }
.bp-strip.is-stacked .bp-strip-words { white-space: normal; }

/* The inbox (D1): new cards, not sorted yet, already on the big screen. */
.bp-inbox { margin: 8px; padding: 8px; border: 1px solid #ffffff26; border-radius: 8px; background: #121c26; flex: none; max-height: 34%; display: flex; flex-direction: column; min-height: 0; }
.bp-inbox-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 2px 6px; font-size: 13px; color: #a3b3c2; }
.bp-inbox-title { display: inline-flex; align-items: center; gap: 6px; }
.bp-inbox-title svg { color: var(--bp-yellow); }
.bp-inbox-title b { color: #f7f3ea; font-weight: 600; font-size: 14px; }
.bp-num-muted { color: #a3b3c2; font-size: 13px; margin-left: 4px; font-variant-numeric: tabular-nums; }
.bp-inbox-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: #3a4b5d transparent; }
.bp-inbox-list.is-one { grid-template-columns: minmax(0, 1fr); }
.bp-empty { margin: 4px 2px 6px; color: #a3b3c2; font-size: 14px; }

/* Columns (D1): a head with its count and waiting, its own menu, then groups, singles, waiting, hidden. */
.bp-cols { display: grid; grid-template-columns: repeat(var(--bp-columns, 3), minmax(0, 1fr)); gap: 8px; padding: 0 8px 8px; flex: 1 1 auto; min-height: 0; }
.bp-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #121c26; border-radius: 8px; border-top: 3px solid var(--bp-accent); }
.bp-col.is-drop-column { background: #1a2d40; box-shadow: inset 0 0 0 2px var(--bp-blue); }
.bp-col-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 8px 6px 10px; flex: none; }
.bp-col-name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; border-radius: 4px; }
.bp-col-name b { font-weight: 600; }
.bp-col-waiting { color: var(--bp-yellow); font-size: 13px; }
.bp-col-mode { color: #8ec3ff; font-size: 13px; }
.bp-col-list { display: flex; flex-direction: column; gap: 6px; padding: 2px 6px 8px; overflow-y: auto; min-height: 0; flex: 1 1 auto; scrollbar-width: thin; scrollbar-color: #3a4b5d transparent; }

/* A card, a group, and their states. */
.bp-card { position: relative; display: flex; align-items: flex-start; gap: 6px; padding: 8px 8px 8px 6px; border: 1px solid #ffffff14; border-radius: 6px; background: #1b2733; cursor: grab; user-select: none; min-width: 0; touch-action: none; }
.bp-card:hover { border-color: #ffffff33; }
.bp.is-frozen .bp-card { cursor: default; }
.bp-grip { color: #52606e; padding-top: 1px; }
.bp-grip svg { width: 14px; height: 14px; }
.bp-card-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 1 auto; }
.bp-card-line { display: flex; gap: 6px; min-width: 0; }
.bp-text { font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; min-width: 0; }
.bp-n { color: color-mix(in srgb, var(--bp-accent) 55%, #ffffff); font-weight: 700; font-variant-numeric: tabular-nums; }
.bp-x { flex: none; align-self: flex-start; padding: 1px 6px; border-radius: 9px; background: var(--bp-accent); color: #fff; font-size: 13px; font-weight: 700; line-height: 1.3; }
.bp-card.is-group { background: color-mix(in srgb, var(--bp-accent) 22%, #1b2733); border-color: color-mix(in srgb, var(--bp-accent) 45%, transparent); }
.bp-meta { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: #a3b3c2; }
.bp-meta svg { width: 13px; height: 13px; }
.bp-meta b { color: #c9d6e2; font-weight: 600; }
.bp-card.is-waiting { border: 1px dashed #e9c46a80; background: #161f29; }
.bp-meta.is-waiting-note { color: var(--bp-yellow); }
.bp-card.is-from-group { box-shadow: inset 3px 0 0 var(--bp-blue); }
.bp-meta.is-from { color: #8ec3ff; }
.bp-card.is-hidden { opacity: .55; background: transparent; border-style: dashed; cursor: default; }
.bp-card.is-hidden .bp-text { text-decoration: line-through; text-decoration-color: #a3b3c299; }
.bp-meta.is-name { color: #c9d6e2; }
.bp-card.is-drop-card { box-shadow: 0 0 0 2px var(--bp-blue); }
.bp-card.is-dragging { opacity: .35; }
.bp-card.is-picked { box-shadow: 0 0 0 2px var(--bp-yellow); }
.bp.is-picking .bp-card:not(.is-picked):not(.is-hidden):focus-visible, .bp.is-picking .bp-col-name:focus-visible { outline-color: var(--bp-yellow); }
.bp-ghost { position: absolute; z-index: 5; pointer-events: none; opacity: .95; transform: rotate(-2deg); box-shadow: 0 14px 34px rgba(0, 0, 0, .55); border-color: var(--bp-blue); }
.bp-drop-pill { position: absolute; z-index: 6; pointer-events: none; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 7px; background: #2f6fe0; color: #fff; font-weight: 600; font-size: 14px; box-shadow: 0 6px 18px rgba(0, 0, 0, .45); }
.bp.is-dragging, .bp.is-dragging * { cursor: grabbing !important; }

/* Menus (D4, D8, D10, D13). */
.bp-menu { position: absolute; z-index: 4; display: flex; flex-direction: column; padding: 6px; background: #16202a; border: 1px solid #ffffff26; border-radius: 10px; box-shadow: 0 18px 50px rgba(0, 0, 0, .55); }
.bp-mi { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 34px; padding: 6px 10px; border: 0; border-radius: 7px; background: none; text-align: left; cursor: pointer; font-size: 14px; }
.bp-mi .bp-label { flex: 1 1 auto; min-width: 0; }
.bp-mi:disabled { opacity: .45; cursor: default; }
.bp-mi.is-checked { background: #1f3346; }
.bp-mi-sub { color: #71849a; font-size: 13px; white-space: nowrap; }
.bp-mi-sec { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px 4px; color: #a3b3c2; font-size: 13px; }
.bp-mi-row { display: flex; flex-direction: column; gap: 2px; padding-bottom: 6px; border-top: 1px solid #ffffff14; margin-top: 4px; }
.bp-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 10px 0 34px; }
.bp-chip-btn { height: 28px; padding: 0 10px; border: 1px solid #ffffff26; border-radius: 6px; background: #1f2c39; cursor: pointer; font-size: 14px; }
.bp-chip-btn.is-current { border-color: var(--bp-blue); background: #1f3346; }

/* The toast after a change (D4, D5, D12, D14), and the keyboard's held card. */
.bp-toast { position: absolute; left: 12px; top: 58px; z-index: 40; display: inline-flex; align-items: center; gap: 10px; max-width: min(640px, calc(100vw - 32px)); padding: 8px 8px 8px 12px; border: 1px solid #ffffff26; border-radius: 9px; background: #16202a; box-shadow: 0 14px 40px rgba(0, 0, 0, .55); font-size: 14px; }
.bp-toast > svg { color: #6fd39b; }
.bp-toast.is-error > svg { color: #ff8a7a; }
.bp-toast-words { min-width: 0; }
.bp-toast-words b { font-weight: 600; }
.bp-toast-detail { color: #a3b3c2; }
.bp-btn.is-undo { background: #1d3552; border-color: #5b86b5; }
.bp-pickbar { flex: none; display: flex; align-items: center; gap: 6px; margin: 0 8px 8px; padding: 8px 10px; border-radius: 8px; background: #2a2412; border: 1px solid #e9c46a66; font-size: 14px; min-width: 0; }
.bp-pickbar svg { color: var(--bp-yellow); }
.bp-pick-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bp-pick-help { color: #a3b3c2; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Full screen in the presenter window (D22) and the board's own window (D23): the rail holds the
   monitor of what the room sees, the big-screen controls and the inbox. */
.bp[data-mode="full"], .bp[data-mode="window"] { padding: 12px; background: #111820; border: 0; border-radius: 0; }
.bp[data-mode="full"] .bp-toast, .bp[data-mode="window"] .bp-toast { left: 426px; top: auto; bottom: 20px; }
.bp[data-mode="full"] .bp-main, .bp[data-mode="window"] .bp-main { background: #0f1720; border: 1px solid #ffffff26; border-radius: 10px; }
.bp-rail { flex: 0 0 402px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.bp-rail-body { display: flex; flex-direction: column; gap: 0; flex: 1 1 auto; min-height: 0; background: #0f1720; border: 1px solid #ffffff26; border-radius: 10px; overflow: hidden; }
.bp-monitor-wrap { flex: none; padding: 8px; background: #0f1720; border: 1px solid #ffffff26; border-radius: 10px; }
.bp-monitor { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #fdfdfb; overflow: hidden; border-radius: 4px; }
.bp-screen { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #ffffff14; flex: none; }
.bp-screen-head { display: flex; align-items: center; gap: 8px; color: #c9d6e2; font-size: 14px; }
.bp-screen-head svg { color: var(--bp-blue); }
.bp-note { display: flex; gap: 8px; margin: 0; color: #a3b3c2; font-size: 13px; }
.bp-note svg { color: var(--bp-yellow); margin-top: 1px; }
.bp[data-mode="full"] .bp-inbox, .bp[data-mode="window"] .bp-inbox { max-height: none; flex: 1 1 auto; }
.bp-window-body { margin: 0; min-height: 100vh; background: #0b1118; overflow: hidden; }
.bp-window-body .bp { inset: 0; }

/* The board counter in the status bar (D1, D23): cards on the board, new ones, and where it is. */
#presenterTopBar .tw-st-board { display: inline-flex; align-items: center; gap: 6px; color: var(--tb-text, #f7f3ea); cursor: pointer; border-radius: 6px; padding: 0 6px; }
#presenterTopBar .tw-st-board .tw-ico { color: #e9c46a; }
#presenterTopBar .tw-st-board[hidden] { display: none; }
#presenterTopBar .tw-st-board-new { padding: 0 6px; border-radius: 5px; background: #3a3316; color: #e9c46a; font-size: 13px; }
#presenterTopBar .tw-st-board-new:empty { display: none; }
#presenterTopBar .tw-st-board-where { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 5px; background: #1d3552; color: #8ec3ff; font-size: 13px; }
#presenterTopBar .tw-st-board-where:empty { display: none; }
#presenterTopBar .tw-st-board.is-open { background: #2a3f55; box-shadow: 0 0 0 1px #5b86b5; }

/* Beside the slide (D1): the right column widens to the panel's width (600px at 1440, 520px at
   1280) and the slide takes the rest; Next and Then give way under the panel, and the notes stay
   under the slide. The id outranks each notes placement's own column widths. */
#presenterRoot[data-board="beside"]:not([data-notes-placement="camera-column"]) { grid-template-columns: minmax(0, 1fr) 8px clamp(520px, calc(520px + (100vw - 1280px) / 2), 600px); }
#presenterRoot[data-board="beside"] > .presenter-side > .presenter-panel:not(.presenter-notes) { display: none; }
#presenterRoot[data-board="beside"][data-notes-placement="bottom"] > .presenter-side > .presenter-notes { grid-column: 1; }

/* Edit the group's wording (D13). */
.bp-relabel { display: flex; flex-direction: column; gap: 8px; padding: 4px 10px 8px; }
.bp-relabel-input { width: 100%; height: 34px; padding: 0 10px; border: 1px solid #ffffff33; border-radius: 7px; background: #0f1720; color: #f7f3ea; font: 400 14px/1.3 var(--bp-ui); }
.bp-relabel-input:focus { outline: 2px solid var(--bp-blue); outline-offset: 0; }
.bp-relabel-row { display: flex; gap: 8px; flex-wrap: wrap; }
.bp-relabel .bp-note { font-size: 13px; }
/* Presenter bottom bar (ADR-0031 §4, presenter redesign ticket 05; drawn in
   docs/design/2026-09-26-presenter-redesign/round-2/, shots L1-*, menu-more-open, mode-*).
   One 40px row under a hairline: Outline on the left; Previous, Next (primary) and Skip next in
   the centre, centred on the window, with Return and the media and gallery controls after them
   when a slide has them; Quick poll, Instant slide, a divider, Focus and Highlight (amber and
   pressed while on), "…" More, a divider and the edit pencil on the right. Controls are 32px
   high (Skip next 32px square; More and the pencil 26px wide), labels 14px, icons 16px (the chrome type scale, ADR-0031 §5). The More menu opens upward
   and takes the top-bar menus' card and item styles (presenter-top-menus.css).
   When the row runs short, fitBottomBar() in the template adds n1-n3 in order until it fits:
   n1 centres the centre group between the side groups instead of on the window; n2 makes Focus
   and Highlight icon-only; n3 makes Quick poll and Instant slide icon-only. */
/* The frame's side padding is the drawn 12px (round-2 overrides: .presenter-root padding 10px
   12px): with it the three groups fit side by side at 1440x900 with nothing collapsed, as drawn;
   with the older 18px the right group ran 6px short and n1 applied at 1440 too. */
.presenter-root { padding-left: 12px; padding-right: 12px; }
#presenterBottomBar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  height: 40px;
  min-height: 40px;
  box-sizing: border-box;
  padding: 0;
  background: none;
  border: 0;
  border-top: 1px solid #ffffff10;
  border-radius: 0;
  position: relative;
  z-index: 40;
  font-family: var(--tb-ui);
  color: var(--tb-text);
  white-space: nowrap;
  -webkit-font-smoothing: antialiased;
}
#presenterBottomBar [hidden] { display: none !important; }
#presenterBottomBar .tw-nav-left,
#presenterBottomBar .tw-nav-mid,
#presenterBottomBar .tw-nav-right { display: flex; align-items: center; gap: 6px; min-width: 0; }
#presenterBottomBar .tw-nav-right { justify-content: flex-end; }
#presenterBottomBar .tw-nav-sep { width: 1px; height: 22px; margin: 0 4px; flex: none; background: #ffffff1a; }
#presenterBottomBar .tw-nav-edit { display: inline-flex; flex: none; }
#presenterBottomBar .tw-nav-edit:empty { display: none; }
#presenterBottomBar .tw-nav-sep:has(+ .tw-nav-edit:empty) { display: none; }

/* A control: icon and label, 32px high; icon-only controls are 32px square. */
#presenterBottomBar button,
#presenterBottomBar .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; flex: none;
  height: 32px; padding: 0 12px; margin: 0; box-sizing: border-box;
  border: 1px solid var(--tb-line); border-radius: 7px; background: var(--tb-ctl); color: var(--tb-text);
  font: 500 14px/1 var(--tb-ui); white-space: nowrap; cursor: pointer;
}
#presenterBottomBar button:hover { background: var(--tb-ctl-hover); border-color: var(--tb-line); }
#presenterBottomBar button:focus-visible { outline: 2px solid #6ea8e6; outline-offset: 1px; }
#presenterBottomBar .tw-ico,
#presenterBottomBar .tw-ico.tw-btn-ico { width: 16px; height: 16px; margin: 0; flex: none; vertical-align: middle; opacity: 1; }
#presenterBottomBar button:has(> .tw-btn-label[hidden]),
#presenterBottomBar #presenterMore { width: 32px; padding: 0; }
/* More and the pencil are narrower, as drawn (26px wide, 32px high). */
#presenterBottomBar #presenterMore,
#presenterBottomBar #twedit-btn { width: 26px; }
#presenterBottomBar .tw-nav-wide { min-width: 120px; }
#presenterBottomBar button.primary { background: #2f6db5; border-color: #2f6db5; color: #fff; font-weight: 600; }
#presenterBottomBar button.primary:hover { background: #3a7cc6; border-color: #3a7cc6; }
#presenterBottomBar button[aria-expanded="true"] { background: #2a3f55; border-color: #5b86b5; }
/* Focus and Highlight while on: pressed, in amber (the mode chip's colour). */
#presenterBottomBar .tw-nav-mode[aria-pressed="true"] { background: #4a4015; border-color: #ffe08a88; color: #fff0c2; }
#presenterBottomBar .tw-nav-mode[aria-pressed="true"] > .tw-ico { color: #ffe08a; }

/* Media and gallery controls, on slides that have them: in the centre group, after Skip next. */
#presenterBottomBar .presenter-media,
#presenterBottomBar .presenter-gallery { display: flex; align-items: center; gap: 6px; flex: none; min-width: 0; }
/* The runtime shows the media row on a slide with images only (for the gallery beside it); with no
   media control in it, it takes no room. */
#presenterBottomBar .presenter-media:not(:has(> button:not([hidden]))) { display: none; }
#presenterBottomBar .presenter-media-label { max-width: 22ch; font: 500 13px/1 var(--tb-ui); color: var(--tb-muted); overflow: hidden; text-overflow: ellipsis; }
#presenterBottomBar .presenter-media-select { height: 32px; box-sizing: border-box; padding: 0 8px; border: 1px solid var(--tb-line); border-radius: 7px; background: var(--tb-ctl); color: var(--tb-text); font: 500 13px/1 var(--tb-ui); }

/* The More menu opens upward, right-aligned on "…". */
#presenterBottomBar .tw-menu-anchor { position: relative; display: inline-flex; flex: none; }
#presenterBottomBar .tw-menu.tw-menu-up { top: auto; bottom: calc(100% + 8px); right: 0; width: 330px; box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.5); }
#presenterBottomBar .tw-menu[hidden] { display: none !important; }
#presenterBottomBar .tw-menu .tw-mi { height: auto; min-height: 34px; padding: 0 10px; border: 0; border-radius: 6px; background: none; justify-content: normal; }
#presenterBottomBar .tw-menu .tw-mi:has(.tw-mi-sub) { padding-top: 7px; padding-bottom: 7px; }
#presenterBottomBar .tw-menu .tw-mi:disabled { cursor: default; }

/* Collapse steps (fitBottomBar). */
#presenterBottomBar.n1 { display: flex; }
#presenterBottomBar.n1 .tw-nav-left,
#presenterBottomBar.n1 .tw-nav-right { flex: 1 1 0; min-width: max-content; }
#presenterBottomBar.n2 .tw-nav-mode,
#presenterBottomBar.n3 .tw-nav-tool { width: 32px; padding: 0; }
#presenterBottomBar.n2 .tw-nav-mode > .tw-btn-label,
#presenterBottomBar.n3 .tw-nav-tool > .tw-btn-label { display: none; }
/* Presenter chrome icons and tooltips (ADR-0031 §6, presenter redesign ticket 01). Icons are lucide
   SVGs placed by the presenter runtime from src/shared/presenter-controls.ts: one stroke width
   (the SVG's own stroke-width 2) and one size step, 16px, everywhere in the chrome. The layout of
   the bars is unchanged here; later tickets restyle them. The tooltip shows "Name  Shortcut" in
   the chrome's 13px text size, opening below the control when it sits in the top bar. */
.tw-ico {
  width: 16px;
  height: 16px;
  flex: none;
  vertical-align: -3px;
  stroke-width: 2;
}
.presenter-root .tw-ico.tw-btn-ico { margin: 0 6px 0 0; opacity: 1; font-size: inherit; }
.presenter-root .tw-btn-label + .tw-ico.tw-btn-ico { margin: 0 0 0 6px; }
.presenter-root .tw-btn-label[hidden] + .tw-ico,
.presenter-root .tw-ico.tw-btn-ico:has(+ .tw-btn-label[hidden]),
.presenter-root .tw-ico.tw-btn-ico:only-child { margin: 0; }
.presenter-root .tw-btn-label:empty + .tw-ico.tw-btn-ico,
.presenter-root .tw-ico.tw-btn-ico:has(+ .tw-btn-label:empty) { margin: 0; }
.presenter-root .tw-duration-btn,
.presenter-root .tw-step,
.presenter-root .presenter-poll-dismiss,
.presenter-root .live-go-panel-close,
.presenter-root .quick-poll-close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.presenter-root .tw-step .tw-ico { margin: 0; }
.presenter-root .live-go-panel-label .tw-ico { width: 16px; height: 16px; margin: 0 5px 0 0; vertical-align: -4px; }

.tw-tip {
  display: flex;
  align-items: center;
  gap: 10px;
  transform: translate(-50%, -100%);
  padding: 6px 9px;
  border-radius: 6px;
  border: 1px solid #ffffff30;
  font: 500 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  z-index: 300;
}
.tw-tip.below { transform: translate(-50%, 0); }
.tw-tip-key { color: #c9d6e2; }
.tw-tip-key[hidden] { display: none; }
/* End live with a board still open (feedback-boards ticket 06; drawn in
   docs/design/2026-09-28-feedback-boards/round-2/shots/D20-end-live-keep-open-1440x900.png):
   "End the live session?" with two choices, "Close the board now" and "Keep it open for late
   cards", then Cancel and End live. It opens under the top bar at its right, beside the Live menu,
   and is built by the live bridge (src/preload/present-end-live-boards.ts). */
#twEndLiveBoards {
  position: fixed;
  top: 46px;
  right: 16px;
  z-index: 90;
  width: 352px;
  max-width: calc(100vw - 32px);
  box-sizing: border-box;
  padding: 14px 14px 12px;
  border: 1px solid var(--tb-line, #ffffff1c);
  border-radius: 10px;
  background: #16212c;
  box-shadow: 0 18px 40px #00000073;
  color: var(--tb-text, #f7f3ea);
  font: 400 14px/1.35 var(--tb-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif);
}
#twEndLiveBoards[hidden] { display: none; }
#twEndLiveBoards .tw-elb-title { margin: 0 0 4px; font-weight: 600; font-size: 15px; }
#twEndLiveBoards .tw-elb-sub { margin: 0 0 10px; color: var(--tb-muted, #a3b3c2); font-size: 13px; overflow-wrap: anywhere; }
#twEndLiveBoards .tw-elb-choice {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  gap: 2px 10px;
  align-items: start;
  margin: 0 0 8px;
  padding: 10px 12px;
  border: 1px solid var(--tb-line, #ffffff1c);
  border-radius: 8px;
  background: #1b2835;
  cursor: pointer;
}
#twEndLiveBoards .tw-elb-choice:has(input:checked) { border-color: #6f9fe0; background: #1c2f45; }
#twEndLiveBoards .tw-elb-choice input { grid-row: 1 / span 2; margin: 2px 0 0; accent-color: #6f9fe0; }
#twEndLiveBoards .tw-elb-choice b { font-weight: 500; }
#twEndLiveBoards .tw-elb-choice small { grid-column: 2; color: var(--tb-muted, #a3b3c2); font-size: 13px; }
#twEndLiveBoards .tw-elb-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
#twEndLiveBoards .tw-elb-actions button {
  height: 32px;
  padding: 0 14px;
  border: 1px solid var(--tb-line, #ffffff1c);
  border-radius: 7px;
  background: var(--tb-ctl, #1f2c39);
  color: var(--tb-text, #f7f3ea);
  font: 500 14px/1 var(--tb-ui, system-ui, sans-serif);
  cursor: pointer;
}
#twEndLiveBoards .tw-elb-actions button:hover { background: var(--tb-ctl-hover, #283a4c); }
#twEndLiveBoards .tw-elb-actions .tw-elb-end { border-color: transparent; background: #b3261e; color: #fff; }
#twEndLiveBoards .tw-elb-actions .tw-elb-end:hover { background: #c7362c; }
/* Presenter notes placement (ADR-0028 §8 and §9, tickets 04 and 07). The presenter window's root
   carries data-notes-placement = off | bottom | sidebar | top-band | camera-column, set by
   setNotesPlacement(). The placement is one setting for all talks with a per-talk override (see
   the NOTES_PLACEMENT block in presenter-popup-single-html.html). These rules only move panels;
   the header, the controls bar and the current-slide panel (instant strip, go-live panel, poll
   panel, composers) keep their markup and their own styles. Each placement has its own
   side-column width for each Preview size, so large > medium > small > off holds in every
   placement (the old fr presets would make "small" wider than the slim medium columns below).
   The drag divider still overrides them inline where the placement has one.

   BOTTOM (default, drawn variant B): the current slide sits top-left at 16:9, Next and Then stack
   beside it, and Notes run full width under both. Then stays visible when a slide has notes. The
   Notes panel shows on every slide so the current slide does not change size as notes come and
   go. */
.presenter-root[data-notes-placement="bottom"] {
  grid-template-rows: auto auto auto minmax(0, 1fr) auto;
}
.presenter-root[data-notes-placement="bottom"]:not([data-preview-size]) {
  grid-template-columns: minmax(0, 1fr) 8px clamp(300px, 28vw, 440px);
}
.presenter-root[data-notes-placement="bottom"][data-preview-size="small"] {
  grid-template-columns: minmax(0, 1fr) 8px clamp(220px, 20vw, 320px);
}
.presenter-root[data-notes-placement="bottom"][data-preview-size="large"] {
  grid-template-columns: minmax(0, 1fr) 8px clamp(380px, 36vw, 600px);
}
.presenter-root[data-notes-placement="bottom"] > .presenter-main { grid-column: 1; grid-row: 2 / span 2; }
.presenter-root[data-notes-placement="bottom"] > .presenter-divider { grid-column: 2; grid-row: 2 / span 2; }
/* The side column dissolves so its three panels can take grid cells of the root. */
.presenter-root[data-notes-placement="bottom"] > .presenter-side { display: contents; }
.presenter-root[data-notes-placement="bottom"] > .presenter-side > .presenter-panel:first-child {
  grid-column: 3;
  grid-row: 2;
  align-self: start;
  grid-template-rows: auto auto;
}
.presenter-root[data-notes-placement="bottom"] > .presenter-side > .presenter-following {
  grid-column: 3;
  grid-row: 3;
  align-self: start;
  display: grid;
  grid-template-rows: auto auto;
}
.presenter-root[data-notes-placement="bottom"] > .presenter-side > .presenter-panel:not(.presenter-notes) .preview {
  height: auto;
  aspect-ratio: 16 / 9;
  /* In a short window the Next + Then stack, not the slide, would set the height of the slide
     rows; each preview gives up height (letterboxing) before the notes row does. */
  max-height: calc((100dvh - 350px) / 2 - 50px);
}
.presenter-root[data-notes-placement="bottom"] > .presenter-side > .presenter-notes {
  grid-column: 1 / -1;
  grid-row: 4;
  display: grid;
}
.presenter-root[data-notes-placement="bottom"] > .presenter-controls { grid-row: 5; }
.presenter-root[data-notes-placement="bottom"] .presenter-main > .presenter-panel:first-child {
  grid-template-rows: auto auto;
}
/* The slide is 16:9 at the column's width, but never so tall that the Notes row drops below the
   height it has at 1440x900 (on a wide 16:9 display the width alone would squeeze the notes to a
   line or two). Above the cap the box letterboxes and the slide fits its height. */
.presenter-root[data-notes-placement="bottom"] #currentPreview {
  height: auto;
  aspect-ratio: 16 / 9;
  max-height: calc(100dvh - 350px);
}
/* The notes are one column as wide as a column of the two-column layout, and become two
   balanced columns only when the runtime (layoutBottomColumns) has measured that the note does
   not fit one column, does fit two, and leaves at least two lines in the second: a short note
   never splits and leaves a word alone on the right. A note too long for two columns stays in one
   column and scrolls (J / ⇧J, wheel), with the "more" cue below while text is hidden. */
.presenter-root[data-notes-placement="bottom"] .presenter-notes-body {
  font-size: 1.08rem;
  line-height: 1.55;
  column-gap: 2.4em;
  max-width: max(24em, calc((100% - 2.4em) / 2));
}
.presenter-root[data-notes-placement="bottom"] .presenter-notes-body[data-notes-cols="2"] {
  columns: 2 24em;
  max-width: none;
}
/* While the poll panel or the instant-slide strip is up under the slide (ADR-0026: both stay in
   the current-slide panel), the slide gives up height to them as in the other placements: the
   slide rows become flexible, the preview letterboxes inside what is left, and the notes keep a
   140px row (their height at 1440x900). */
.presenter-root[data-notes-placement="bottom"]:has(.presenter-current-panel > :is(.presenter-poll-panel, .instant-strip):not([hidden])) {
  grid-template-rows: auto minmax(0, 1fr) minmax(0, 1fr) minmax(0, 140px) auto;
}
.presenter-root[data-notes-placement="bottom"]:has(.presenter-current-panel > :is(.presenter-poll-panel, .instant-strip):not([hidden])) .presenter-main > .presenter-panel:first-child {
  grid-template-rows: minmax(0, 1fr) auto;
}
.presenter-root[data-notes-placement="bottom"]:has(.presenter-current-panel > :is(.presenter-poll-panel, .instant-strip):not([hidden])) #currentPreview {
  height: 100%;
  aspect-ratio: auto;
  max-height: none;
}
/* An open poll panel (ADR-0028 §9): the notes hide and the slide keeps its no-poll size. The
   current-slide column takes the notes' row, and the poll panel fills what is left under the
   slide, scrolling inside itself. (Placed after the rule above, which it overrides when both
   match; the instant strip alone keeps that rule.) */
.presenter-root[data-notes-placement="bottom"]:has(.presenter-current-panel > .presenter-poll-panel:not([hidden])) {
  grid-template-rows: auto auto auto minmax(0, 1fr) auto;
}
.presenter-root[data-notes-placement="bottom"]:has(.presenter-current-panel > .presenter-poll-panel:not([hidden])) > .presenter-side > .presenter-notes {
  display: none;
}
.presenter-root[data-notes-placement="bottom"]:has(.presenter-current-panel > .presenter-poll-panel:not([hidden])) > .presenter-main {
  grid-row: 2 / span 3;
}
.presenter-root[data-notes-placement="bottom"]:has(.presenter-current-panel > .presenter-poll-panel:not([hidden])) > .presenter-divider {
  grid-row: 2 / span 3;
}
.presenter-root[data-notes-placement="bottom"]:has(.presenter-current-panel > .presenter-poll-panel:not([hidden])) .presenter-main > .presenter-panel:first-child {
  display: flex;
  flex-direction: column;
}
.presenter-root[data-notes-placement="bottom"]:has(.presenter-current-panel > .presenter-poll-panel:not([hidden])) #currentPreview {
  flex: none;
  height: auto;
  aspect-ratio: 16 / 9;
  max-height: calc(100dvh - 350px);
}
.presenter-root[data-notes-placement="bottom"]:has(.presenter-current-panel > .presenter-poll-panel:not([hidden])) .presenter-current-panel > .presenter-poll-panel {
  flex: 1 1 auto;
  min-height: 0;
  max-height: none;
}
/* Preview size "off" in this placement hides Next and Then only; the notes stay. */
.presenter-root[data-notes-placement="bottom"][data-preview-size="off"] > .presenter-side > .presenter-panel:not(.presenter-notes) {
  display: none;
}

/* SIDEBAR (drawn variant A): a slim side column holds a small Next at 16:9 with Notes filling the
   rest (Then in that space when a slide has no notes, as before). The current slide takes all the
   remaining width. */
.presenter-root[data-notes-placement="sidebar"]:not([data-preview-size]) {
  grid-template-columns: minmax(0, 1fr) 8px clamp(240px, 17vw, 340px);
}
.presenter-root[data-notes-placement="sidebar"][data-preview-size="small"] {
  grid-template-columns: minmax(0, 1fr) 8px clamp(190px, 13vw, 260px);
}
.presenter-root[data-notes-placement="sidebar"][data-preview-size="large"] {
  grid-template-columns: minmax(0, 1fr) 8px clamp(320px, 26vw, 480px);
}
.presenter-root[data-notes-placement="sidebar"] .presenter-side { grid-template-rows: auto minmax(0, 1fr); }
.presenter-root[data-notes-placement="sidebar"] .presenter-side > .presenter-panel:not(.presenter-notes) {
  grid-template-rows: auto auto;
  align-self: start;
}
.presenter-root[data-notes-placement="sidebar"] .presenter-side > .presenter-panel:not(.presenter-notes) .preview {
  height: auto;
  aspect-ratio: 16 / 9;
}

/* OFF: no notes panel. The side column narrows to thumbnails of Next and Then, and the current
   slide takes the freed width. */
.presenter-root[data-notes-placement="off"]:not([data-preview-size]) {
  grid-template-columns: minmax(0, 1fr) 8px clamp(180px, 14vw, 280px);
}
.presenter-root[data-notes-placement="off"][data-preview-size="small"] {
  grid-template-columns: minmax(0, 1fr) 8px clamp(150px, 10vw, 220px);
}
.presenter-root[data-notes-placement="off"][data-preview-size="large"] {
  grid-template-columns: minmax(0, 1fr) 8px clamp(280px, 22vw, 420px);
}
.presenter-root[data-notes-placement="off"] .presenter-side {
  grid-template-rows: auto auto;
  align-content: start;
}
.presenter-root[data-notes-placement="off"] .presenter-side > .presenter-panel:not(.presenter-notes) {
  grid-template-rows: auto auto;
}
.presenter-root[data-notes-placement="off"] .presenter-side > .presenter-panel:not(.presenter-notes) .preview {
  height: auto;
  aspect-ratio: 16 / 9;
}
.presenter-root[data-notes-placement="off"] .presenter-side > .presenter-notes { display: none; }
.presenter-root[data-notes-placement="off"] .presenter-side.has-notes > .presenter-following { display: grid; }

/* "More below" cue for the scrolling placements (bottom, sidebar, top band): while text is hidden
   under the panel's lower edge the runtime sets data-notes-more="1" on #presenterNotes; the last
   line fades and the cue shows in the corner. The cue is a real button (#presenterNotesMore):
   clicking it, or Enter / Space while it has keyboard focus, steps the notes as J does, and does
   not pause or resume the automatic scroll. The camera column has no cue: its reading line is
   the current paragraph, and every paragraph can scroll up to it. */
.presenter-root:is([data-notes-placement="bottom"], [data-notes-placement="sidebar"]) .presenter-notes { position: relative; }
.presenter-root:is([data-notes-placement="bottom"], [data-notes-placement="sidebar"], [data-notes-placement="top-band"]) .presenter-notes[data-notes-more="1"] .presenter-notes-body {
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 1.2em), transparent);
  mask-image: linear-gradient(to bottom, #000 calc(100% - 1.2em), transparent);
}
.presenter-notes-more { display: none; }
.presenter-root:is([data-notes-placement="bottom"], [data-notes-placement="sidebar"], [data-notes-placement="top-band"]) .presenter-notes[data-notes-more="1"] .presenter-notes-more {
  display: block;
  position: absolute;
  right: 12px;
  bottom: 10px;
  margin: 0;
  font: 600 12px/1 var(--sans);
  letter-spacing: 0.08em;
  white-space: pre;
  color: #9fb3c6;
  background: #243445;
  border: 1px solid #ffffff24;
  border-radius: 5px;
  padding: 5px 7px;
  cursor: pointer;
}
.presenter-root:is([data-notes-placement="bottom"], [data-notes-placement="sidebar"], [data-notes-placement="top-band"]) .presenter-notes[data-notes-more="1"] .presenter-notes-more:hover {
  color: #dce7f1;
  background: #2e4257;
  border-color: #ffffff40;
}
.presenter-notes-more:focus-visible {
  outline: 2px solid #7fb2ff;
  outline-offset: 2px;
}

/* TOP BAND (ADR-0028 §9, drawn variant A; docs/design/2026-09-25-teleprompter/, overrides/
   teleprompter-a-top-band.css). A notes band runs the full window width directly under the header,
   so the line being read sits about 115px below the top edge (the laptop camera). The text is one
   centred column of at most 58ch, in large type, with four full lines visible and a fifth peeking
   (faded) when there is more. The current slide and a 16:9 Next sit below the band; Then is not
   shown. The band keeps its height on every slide (no notes, open poll), so the slide never
   changes size as you move through the talk. Preview sizes change only column 3; off hides Next
   and gives column 3 to the slide. */
.presenter-root[data-notes-placement="top-band"] {
  /* 26px floor, 2vw (28.8px at 1440, 34.6px at 1728), 40px ceiling. */
  --tp-size: clamp(26px, 2vw, 40px);
  --tp-lh: 1.38;
  --tp-lines: 4;
  grid-template-columns: minmax(0, 1fr) 8px clamp(300px, 28vw, 520px);
  /* Four lines plus 0.45 of a fifth, so a longer note shows that it goes on. */
  grid-template-rows: auto calc(var(--tp-size) * var(--tp-lh) * (var(--tp-lines) + 0.45) + 30px) minmax(0, 1fr) auto;
}
.presenter-root[data-notes-placement="top-band"][data-preview-size="small"] {
  grid-template-columns: minmax(0, 1fr) 8px clamp(220px, 20vw, 380px);
}
.presenter-root[data-notes-placement="top-band"][data-preview-size="large"] {
  grid-template-columns: minmax(0, 1fr) 8px clamp(380px, 36vw, 640px);
}
.presenter-root[data-notes-placement="top-band"][data-preview-size="off"] {
  grid-template-columns: minmax(0, 1fr) 0 0;
}
.presenter-root[data-notes-placement="top-band"] > .presenter-main { grid-column: 1; grid-row: 3; }
.presenter-root[data-notes-placement="top-band"] > .presenter-divider { grid-column: 2; grid-row: 3; }
.presenter-root[data-notes-placement="top-band"] > .presenter-side { display: contents; }
.presenter-root[data-notes-placement="top-band"] > .presenter-side > .presenter-panel:first-child {
  grid-column: 3;
  grid-row: 3;
  align-self: start;
  grid-template-rows: auto auto;
}
.presenter-root[data-notes-placement="top-band"] > .presenter-side > .presenter-panel:first-child .preview {
  height: auto;
  aspect-ratio: 16 / 9;
}
.presenter-root[data-notes-placement="top-band"][data-preview-size="off"] > .presenter-side > .presenter-panel:first-child { display: none; }
.presenter-root[data-notes-placement="top-band"] > .presenter-side > .presenter-following { display: none; }
.presenter-root[data-notes-placement="top-band"] > .presenter-controls { grid-row: 4; }
/* The band. */
.presenter-root[data-notes-placement="top-band"] > .presenter-side > .presenter-notes {
  grid-column: 1 / -1;
  grid-row: 2;
  display: block;
  position: relative;
  padding: 15px 24px;
  background: #121b24;
}
/* The label moves into the band's left margin so it costs no text line. */
.presenter-root[data-notes-placement="top-band"] .presenter-notes > h2 {
  position: absolute;
  left: 16px;
  top: 14px;
  margin: 0;
  flex-direction: column;
  align-items: flex-start;
}
.presenter-root[data-notes-placement="top-band"] .presenter-notes-body {
  box-sizing: border-box;
  height: 100%;
  max-width: 58ch;
  margin-inline: auto;
  overflow: auto;
  scrollbar-width: none;
  font-family: var(--sans);
  font-size: var(--tp-size);
  line-height: var(--tp-lh);
  font-weight: 500;
  color: #f4f7fa;
  text-wrap: pretty;
}
.presenter-root[data-notes-placement="top-band"] .presenter-notes-body aside.notes > * { margin: 0 0 calc(var(--tp-size) * var(--tp-lh) * 0.35); }
.presenter-root[data-notes-placement="top-band"] .presenter-notes[data-notes-more="1"] .presenter-notes-body {
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - var(--tp-size) * var(--tp-lh) * 0.6), transparent);
  mask-image: linear-gradient(to bottom, #000 calc(100% - var(--tp-size) * var(--tp-lh) * 0.6), transparent);
}
.presenter-root[data-notes-placement="top-band"] .presenter-notes[data-notes-more="1"] .presenter-notes-more {
  right: 18px;
  bottom: 14px;
  font-size: 13px;
  padding: 6px 8px;
}
/* A slide without notes: the band stays (the slide keeps its size) and says so, quietly. */
.presenter-root[data-notes-placement="top-band"] .presenter-notes-body:empty::before {
  content: "No notes on this slide";
  display: block;
  color: #6f8294;
  font-weight: 400;
  font-size: calc(var(--tp-size) * 0.8);
}
/* Open poll / instant strip: they stay under the slide in the current-slide panel (ticket 23);
   the band keeps its four lines and the slide letterboxes into what is left. The base grid
   already gives the panel's second row to the poll, so no rule is needed. */

/* CAMERA COLUMN (ADR-0028 §9, drawn variant C; overrides/teleprompter-c-camera-column.css). The
   notes are one narrow column (about 36 characters a line) close to the horizontal centre of the
   window, directly under the laptop camera, from under the header to the controls bar. The
   current slide sits to the left and Next to the right, both at the top. The paragraph being
   spoken is the reading line: full white with an accent bar, pinned at the top of the column;
   paragraphs already spoken dim to 30%, the ones still to come to 60% (the runtime sets
   tp-current / tp-past). The column is shown on every slide, so nothing changes size. Preview
   sizes change columns 1 and 3 together; off hides Next. */
.presenter-root[data-notes-placement="camera-column"] {
  /* 28px floor, 2.3vw (33.1px at 1440, 39.7px at 1728), 44px ceiling. */
  --tp-size: clamp(28px, 2.3vw, 44px);
  --tp-lh: 1.42;
  --tp-accent: #3b82f6;
  grid-template-columns: clamp(300px, 27vw, 520px) minmax(0, 1fr) clamp(200px, 17vw, 340px);
  grid-template-rows: auto minmax(0, 1fr) auto;
}
.presenter-root[data-notes-placement="camera-column"][data-preview-size="small"] {
  grid-template-columns: clamp(240px, 21vw, 420px) minmax(0, 1fr) clamp(160px, 13vw, 260px);
}
.presenter-root[data-notes-placement="camera-column"][data-preview-size="large"] {
  grid-template-columns: clamp(360px, 33vw, 620px) minmax(0, 1fr) clamp(240px, 21vw, 420px);
}
.presenter-root[data-notes-placement="camera-column"][data-preview-size="off"] {
  grid-template-columns: clamp(300px, 27vw, 520px) minmax(0, 1fr) 0;
}
.presenter-root[data-notes-placement="camera-column"] > .presenter-main { grid-column: 1; grid-row: 2; align-self: start; }
.presenter-root[data-notes-placement="camera-column"] .presenter-main > .presenter-panel:first-child { grid-template-rows: auto auto; }
.presenter-root[data-notes-placement="camera-column"] #currentPreview { height: auto; aspect-ratio: 16 / 9; }
.presenter-root[data-notes-placement="camera-column"] > .presenter-divider { display: none; }
.presenter-root[data-notes-placement="camera-column"] > .presenter-side { display: contents; }
.presenter-root[data-notes-placement="camera-column"] > .presenter-side > .presenter-panel:first-child {
  grid-column: 3;
  grid-row: 2;
  align-self: start;
  grid-template-rows: auto auto;
}
.presenter-root[data-notes-placement="camera-column"] > .presenter-side > .presenter-panel:first-child .preview {
  height: auto;
  aspect-ratio: 16 / 9;
}
.presenter-root[data-notes-placement="camera-column"][data-preview-size="off"] > .presenter-side > .presenter-panel:first-child { display: none; }
.presenter-root[data-notes-placement="camera-column"] > .presenter-side > .presenter-following { display: none; }
.presenter-root[data-notes-placement="camera-column"] > .presenter-controls { grid-row: 3; }
/* The column. */
.presenter-root[data-notes-placement="camera-column"] > .presenter-side > .presenter-notes {
  grid-column: 2;
  grid-row: 2;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  /* The text column starts at the panel's left edge rather than centring in column 2: column 1
     is wider than column 3, so this puts the text's centre within about 35px of the window's
     centre line (the camera). */
  justify-items: start;
  position: relative;
  padding: 12px 22px 16px;
  background: #121b24;
}
.presenter-root[data-notes-placement="camera-column"] .presenter-notes > h2 { justify-self: start; margin: 0 0 6px; }
.presenter-root[data-notes-placement="camera-column"] .presenter-notes-body {
  width: 100%;
  /* 34ch of text; the side padding holds the reading-line bar inside the scroll box. */
  max-width: calc(34ch + 34px);
  padding-inline: 17px;
  overflow: auto;
  scrollbar-width: none;
  /* Room under the last paragraph so it, too, can scroll up to the reading line. */
  padding-bottom: 60vh;
  box-sizing: border-box;
  font-family: var(--sans);
  font-size: var(--tp-size);
  line-height: var(--tp-lh);
  font-weight: 500;
  color: #f4f7fa;
  text-wrap: pretty;
}
.presenter-root[data-notes-placement="camera-column"] .presenter-notes-body aside.notes > * {
  margin: 0 0 calc(var(--tp-size) * var(--tp-lh) * 0.5);
  padding-left: 14px;
  margin-left: -17px;
  border-left: 3px solid transparent;
  opacity: 0.6;
}
.presenter-root[data-notes-placement="camera-column"] .presenter-notes-body aside.notes > .tp-past { opacity: 0.3; }
.presenter-root[data-notes-placement="camera-column"] .presenter-notes-body aside.notes > .tp-current { opacity: 1; border-left-color: var(--tp-accent); }
/* A one-paragraph note has nothing to step through; it reads as plain text, no bar. */
.presenter-root[data-notes-placement="camera-column"] .presenter-notes-body aside.notes > :only-child { opacity: 1; border-left-color: transparent; }
/* No notes: the reading line names what comes next, quietly. */
.presenter-root[data-notes-placement="camera-column"] .presenter-notes-body:empty::before {
  content: "No notes on this slide.\A Next: " attr(data-next-title);
  white-space: pre-line;
  display: block;
  color: #6f8294;
  font-weight: 400;
  font-size: calc(var(--tp-size) * 0.8);
}
/* Open poll / instant strip: they stay under the current slide in column 1 (ADR-0026); the
   column is as tall as the window, so the slide keeps its size and the poll panel grows down. */
.presenter-root[data-notes-placement="camera-column"] .presenter-current-panel > .presenter-poll-panel { max-height: 52vh; }

/* Automatic scroll state, shown under the Notes label in the teleprompter placements only. A
   click on the notes pauses and resumes. */
.presenter-notes-auto { display: none; }
.presenter-root:is([data-notes-placement="top-band"], [data-notes-placement="camera-column"]) .presenter-notes[data-notes-auto] .presenter-notes-auto {
  display: inline-block;
  margin-top: 4px;
  padding: 3px 6px;
  border-radius: 4px;
  font-size: 0.66rem;
  letter-spacing: 0.08em;
  color: #9fb3c6;
  background: #1f2d3b;
  white-space: nowrap;
}
.presenter-root[data-notes-placement="camera-column"] .presenter-notes[data-notes-auto] .presenter-notes-auto { margin: 0 0 0 8px; }
.presenter-notes[data-notes-auto="paused"] .presenter-notes-auto { color: #f5c26b; }
.presenter-notes[data-notes-auto] { cursor: pointer; }

/* The Notes menu opens from the View menu since presenter redesign ticket 04; its styles are in
   presenter-top-menus.css. */
/* The presenter's outline drawer (ADR-0031 §5-6, presenter redesign ticket 08; drawn in
   docs/design/2026-09-26-presenter-redesign/round-2/, shot outline-open-1440x900.png). Heading:
   the list-tree icon and "Outline", the "O / Esc closes" hint, the Previews button and an × close
   button. Under the search row, the legend for the slide marks: Shown (green circle), Skipped
   (amber circle-slash), Not yet shown (grey circle-dashed). Each slide row starts with its mark.
   Chrome type scale: 14px heading, search and slide titles; 13px hint, Previews, Skipped only,
   legend and section heads. Scoped to the presenter drawer: the handout's overview (the same
   runtime, compiler/assets/runtime/overview.js) shows no marks and is not restyled. */
.presenter-outline-drawer {
  --ol-text: #f7f3ea;
  --ol-muted: #a3b3c2;
  --ol-dim: #71849a;
  --ol-line: #ffffff1c;
  --ol-ctl: #1f2c39;
  --ol-ctl-hover: #283a4c;
  --ol-shown: #3fb950;
  --ol-skipped: #d29922;
  --ol-unseen: #6e7681;
  --ol-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  font-family: var(--ol-ui);
  -webkit-font-smoothing: antialiased;
}
.presenter-outline-drawer .presenter-panel { grid-template-rows: auto auto auto minmax(0, 1fr); }
.presenter-outline-drawer .presenter-panel h2 {
  display: flex; align-items: center; gap: 8px; margin: 0 0 10px;
  font: 600 14px/1 var(--ol-ui); letter-spacing: 0; text-transform: none; color: var(--ol-text);
}
#presenterOutlineDrawer .tw-ico { width: 16px; height: 16px; margin: 0; flex: none; vertical-align: middle; }
.presenter-outline-drawer .presenter-outline-title { display: inline-flex; align-items: center; gap: 8px; }
.presenter-outline-drawer .presenter-outline-title > .tw-ico { color: var(--ol-muted); }
.presenter-outline-drawer .presenter-outline-hint {
  margin-left: 2px; font: 500 13px/1 var(--ol-ui); letter-spacing: 0; text-transform: none; color: var(--ol-dim);
}
.presenter-outline-drawer .presenter-outline-expand {
  margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; box-sizing: border-box;
  font: 500 13px/1 var(--ol-ui); letter-spacing: 0; text-transform: none;
  border: 1px solid var(--ol-line); border-radius: 6px; background: var(--ol-ctl); color: var(--ol-text);
}
.presenter-outline-drawer .presenter-outline-expand:hover { background: var(--ol-ctl-hover); }
#presenterOutlineDrawer .presenter-outline-expand .tw-ico { width: 14px; height: 14px; margin: 0; }
.presenter-outline-drawer .presenter-outline-close {
  display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; box-sizing: border-box;
  border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--ol-muted); cursor: pointer;
}
.presenter-outline-drawer .presenter-outline-close:hover { background: var(--ol-ctl-hover); color: var(--ol-text); }
.presenter-outline-drawer :is(.presenter-outline-expand, .presenter-outline-close):focus-visible { outline: 2px solid #6ea8e6; outline-offset: 1px; }
.presenter-outline-drawer .presenter-outline-controls { font: 500 14px/1.2 var(--ol-ui); }
.presenter-outline-drawer .presenter-outline-controls .presenter-search { height: 32px; box-sizing: border-box; padding: 0 8px; font: 400 14px/1.2 var(--ol-ui); }
.presenter-outline-drawer .presenter-outline-filter { font: 500 13px/1.2 var(--ol-ui); color: var(--ol-muted); }
.presenter-outline-legend {
  display: flex; gap: 14px; padding: 6px 2px 6px;
  font: 500 13px/1 var(--ol-ui); color: var(--ol-dim); white-space: nowrap;
}
.presenter-outline-legend > span { display: inline-flex; align-items: center; gap: 5px; }
#presenterOutlineDrawer .presenter-outline-legend .tw-ico { width: 13px; height: 13px; }
/* The list starts under the legend; its first section head drops its usual top margin (as drawn). */
.presenter-outline-drawer .presenter-outline { margin-top: 0; }
.presenter-outline-drawer .presenter-outline > .section-head:first-child { margin-top: 4px; }
.presenter-outline-drawer .presenter-outline .section-head,
.presenter-outline-drawer .presenter-outline .subsection-head { font: 600 13px/1.25 var(--ol-ui); letter-spacing: 0; }
.presenter-outline-drawer .presenter-outline .slide-link { font: 500 14px/1.3 var(--ol-ui); }
.presenter-outline-drawer .presenter-outline .slide-link.current { font-weight: 600; }
.presenter-outline-drawer .tw-status { display: inline-flex; vertical-align: -2px; margin-right: 8px; }
#presenterOutlineDrawer .tw-status .tw-ico { width: 14px; height: 14px; }
.presenter-outline-legend .tw-shown > .tw-ico, .presenter-outline-drawer .slide-link.tw-shown .tw-status { color: var(--ol-shown); }
.presenter-outline-legend .tw-skipped > .tw-ico, .presenter-outline-drawer .slide-link.tw-skipped .tw-status { color: var(--ol-skipped); }
.presenter-outline-legend .tw-unseen > .tw-ico, .presenter-outline-drawer .slide-link.tw-unseen .tw-status { color: var(--ol-unseen); }
/* Presenter overlays over the current slide: the Quick-poll and instant-slide composers and the
   go-live panel (ADR-0031, presenter redesign ticket 06; drawn in
   docs/design/2026-09-26-presenter-redesign/round-2/, shots quickpoll-composer, instant-composer,
   golive-panel). Dark cards on the chrome type scale (ADR-0031 §5): 16px card titles and the join
   link, 14px control labels and fields, 13px field labels, keys and hints.
   The composers are short-lived overlays: under a larger slide they may run down over the notes,
   to the bottom bar, and their Cancel / primary row is pinned to the card's foot, so the action is
   in view without scrolling however long the form is. The instant-slide runtime injects its own
   rules for the composer (compiler/assets/runtime/instant-slide.js); the rules here are scoped
   under .presenter-root to win over them. */

/* ---------- composers ---------- */
/* While a composer is open the current-slide panel lets it run past its foot. */
.presenter-root .presenter-current-panel:has(> .quick-poll-compose:not([hidden])) { overflow: visible; }
.presenter-root .quick-poll-compose {
  top: 12px; right: 12px; width: min(480px, calc(100% - 24px));
  max-height: calc(100dvh - 134px); overflow: auto;
  padding: 16px 16px 0;
  border: 1px solid #ffffff2a; border-radius: 12px; background: #16202a; color: #f7f3ea;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.presenter-root .quick-poll-compose .tw-ico { width: 16px; height: 16px; flex: none; margin: 0; }
.presenter-root .quick-poll-title-row { margin-bottom: 12px; }
.presenter-root .quick-poll-title { display: flex; align-items: center; gap: 8px; font: 600 16px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
.presenter-root .quick-poll-title .tw-ico { color: #a3b3c2; }
.presenter-root .quick-poll-close { width: 28px; height: 28px; border-radius: 6px; color: #a3b3c2; }
.presenter-root .quick-poll-close:hover { background: #ffffff10; color: #f7f3ea; }
.presenter-root .quick-poll-field { margin-bottom: 10px; }
.presenter-root .quick-poll-field > span,
.presenter-root .quick-poll-field > label:first-child {
  color: #71849a; font: 600 13px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; letter-spacing: 0; text-transform: none;
}
.presenter-root .quick-poll-segments button {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 32px; font: 500 13px/1.1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
}
.presenter-root .quick-poll-segments button .tw-ico { width: 14px; height: 14px; }
.presenter-root .quick-poll-presets button { padding: 6px 10px; font: 500 13px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
.presenter-root .quick-poll-compose input,
.presenter-root .quick-poll-compose textarea { font: 400 14px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
.presenter-root .quick-poll-compose input { min-height: 34px; }
.presenter-root .quick-poll-compose input[type="checkbox"] { min-height: 0; }
.presenter-root .instant-compose textarea { min-height: 72px; padding: 8px 10px; }
.presenter-root .quick-poll-option-row { margin-bottom: 6px; }
.presenter-root .quick-poll-actions button,
.presenter-root .quick-poll-add,
.presenter-root .quick-poll-remove {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 32px; min-height: 32px; padding: 0 12px; box-sizing: border-box;
  border: 1px solid #ffffff1c; border-radius: 7px; background: #1f2c39; color: #f7f3ea;
  font: 500 14px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; white-space: nowrap;
}
.presenter-root .quick-poll-remove { width: 32px; min-width: 32px; padding: 0; }
.presenter-root .quick-poll-add { width: max-content; }
.presenter-root .quick-poll-actions .tw-btn-label { display: inline-flex; align-items: center; gap: 7px; }
.presenter-root .quick-poll-actions .kbd { margin-left: 2px; color: inherit; opacity: .75; font: 500 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
.presenter-root .quick-poll-actions .quick-poll-open { border-color: #0f4bd8; font-weight: 600; }
/* The action row stays at the card's foot while the form scrolls above it. */
.presenter-root .quick-poll-compose .quick-poll-actions {
  position: sticky; bottom: 0; z-index: 1;
  margin: 6px -16px 0; padding: 12px 16px 14px;
  border-top: 1px solid #ffffff14; background: #16202a;
}

/* ---------- go-live panel ---------- */
.presenter-root .live-go-panel {
  top: 12px; right: 12px; width: 300px; padding: 14px;
  border: 1px solid #ffffff2a; border-radius: 12px; background: #16202a; color: #f7f3ea;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .55); text-align: left;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.presenter-root .live-go-panel-label {
  display: flex; align-items: center; gap: 7px;
  color: #f0645c; font: 600 14px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; letter-spacing: 0; text-transform: none;
}
.presenter-root .live-go-panel-label .tw-ico { margin: 0; }
.presenter-root .live-go-panel-qr { width: 150px; height: 150px; margin: 12px auto 10px; padding: 8px; box-sizing: content-box; border-radius: 8px; background: #fff; }
.presenter-root .live-go-panel-url { color: #9cc3f5; font: 600 16px/1.2 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace; text-align: center; }
.presenter-root .live-go-panel-venue { margin-top: 12px; padding-top: 10px; border-top-color: #ffffff1a; }
.presenter-root .live-go-panel-venue-heading { color: #71849a; font: 600 13px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
.presenter-root .live-go-panel-venue-row { gap: 8px; margin-top: 6px; }
.presenter-root .live-go-panel-venue-url { color: #9cc3f5; font: 500 13px/1.3 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.presenter-root .live-go-panel-copy {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  height: 28px; padding: 0 10px; box-sizing: border-box;
  border: 1px solid #ffffff1c; border-radius: 6px; background: #1f2c39; color: #f7f3ea;
  font: 500 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
}
.presenter-root .live-go-panel-copy .tw-ico { width: 14px; height: 14px; margin: 0; }
.presenter-root .live-go-panel-count { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: #7fd6a1; font: 500 13px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
.presenter-root .live-go-panel-count[hidden] { display: none; }
.presenter-root .live-go-panel-count .tw-ico { width: 15px; height: 15px; margin: 0; }
.presenter-root .live-go-panel-close { top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 6px; color: #a3b3c2; }
.presenter-root .live-go-panel-close:hover { background: #ffffff10; color: #f7f3ea; }
.presenter-root .live-go-panel-hint { margin: 10px 0 0; color: #71849a; font: 500 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
.presenter-root .live-go-panel-hint .kbd { padding: 1px 5px; border: 1px solid #ffffff30; border-radius: 4px; color: #f7f3ea; }
/* The presenter's command palette, ⌘⇧P (ADR-0031 §6, presenter redesign ticket 07; drawn in
   docs/design/2026-09-26-presenter-redesign/round-2/, shot palette-open-1440x900.png). A card
   640px wide, 72px from the top, over a light scrim: the search field with the count of commands
   on the right; the commands in their groups, each row icon · name · keys as key caps,
   right-aligned; a footer naming the keys. Rows that do not apply now are dimmed and skipped by
   ↑ ↓. Chrome type scale: 16px search, 14px names, 13px group heads, key caps, count and footer. */
.tw-palette-scrim { position: fixed; inset: 0; z-index: 250; background: #0a0f1566; }
.tw-palette-scrim[hidden], .tw-palette[hidden] { display: none !important; }
.tw-palette {
  --pal-text: #f7f3ea;
  --pal-muted: #a3b3c2;
  --pal-dim: #71849a;
  --pal-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  position: fixed; z-index: 260; left: 50%; top: 72px; transform: translateX(-50%);
  width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 110px);
  display: flex; flex-direction: column; box-sizing: border-box;
  background: #16202a; border: 1px solid #ffffff2a; border-radius: 12px; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6);
  overflow: hidden; font-family: var(--pal-ui); color: var(--pal-text); text-align: left;
  -webkit-font-smoothing: antialiased;
}
.tw-palette .tw-ico { width: 16px; height: 16px; margin: 0; flex: none; vertical-align: middle; }
.tw-pal-search { display: flex; align-items: center; gap: 10px; flex: none; height: 48px; padding: 0 16px; border-bottom: 1px solid #ffffff14; }
.tw-pal-search .tw-ico { width: 18px; height: 18px; color: var(--pal-muted); }
.tw-palette .tw-pal-input {
  flex: 1 1 auto; min-width: 0; height: 100%; padding: 0; margin: 0; border: 0; outline: 0; background: none;
  font: 400 16px/1 var(--pal-ui); color: var(--pal-text); box-shadow: none; -webkit-appearance: none; appearance: none;
}
.tw-palette .tw-pal-input::placeholder { color: var(--pal-dim); opacity: 1; }
.tw-palette .tw-pal-input::-webkit-search-cancel-button { display: none; }
.tw-pal-count { flex: none; font: 500 13px/1 var(--pal-ui); color: var(--pal-dim); white-space: nowrap; }
.tw-pal-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 6px; overscroll-behavior: contain; }
.tw-pal-sec { font: 600 13px/1 var(--pal-ui); color: var(--pal-dim); padding: 10px 10px 6px; }
.tw-pal-sec:first-child { padding-top: 6px; }
.tw-palette .tw-pal-row {
  display: grid; grid-template-columns: 16px minmax(0, 1fr) auto auto; align-items: center; gap: 12px;
