<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="deck-title" content="Single-file decks can still have a real presenter view">
<link rel="icon" href="data:,">
<title>Single-file decks can still have a real presenter view</title>
<style>
/*DECK_STYLES*/
  :root {
    /* ADR-0005 design language (locked 2026-07-09): light Swiss, warm white, section-coloured.
       The default uses the original system stack. Explicit modern font choices use the bundled faces
       in skin/zz-x-ocean-05-type.css. */
    --paper: #fdfdfb;        /* page — warm white */
    --ink: #101418;          /* text */
    --muted: #5c6570;        /* secondary text */
    --hairline: #e3e2dc;     /* rules/borders */
    /* Section accent + tint. Each carries a per-section fallback stamped inline by the generator
       (--sec-accent / --sec-tint on the slide <section>); the defaults here are section 1 (cobalt).
       Section cycle: 1 cobalt #0f4bd8/#e8eefc · 2 emerald #0a7a5c/#e4f3ee · 3 vermilion
       #c2410c/#fcece3 — then repeat. One swap point per section is the inline stamp. */
    --accent: var(--sec-accent, #0f4bd8);  /* section accent — cobalt default */
    --tint:   var(--sec-tint,   #e8eefc);  /* section tint — NEW */
    /* --panel kept as an alias of --tint so container-mode CSS keeps working until Task 5. */
    --panel: var(--tint);
    /* Legacy named tokens kept as aliases so the 4,300-line block still resolves. --accent-2
       (secondary, was crimson) now rides the section accent; fixed named hues stay available. */
    --accent-2: var(--accent);
    --line: var(--hairline);
    /* ADR-0005: the section accent carries ALL accent roles; green/red keep semantic
       (correct/incorrect) meaning only. */
    --oxford: var(--accent);
    --crimson: var(--accent);
    --green: #0a7a5c;
    --red: #b42318;
    --blue: var(--accent);
    --gold: var(--accent);
    --hairline-shadow: 0 1px 0 #00000008;
    --elevation: 0 24px 70px #17202a26;
    --shadow: 0 24px 70px #17202a26;
    --sans: "Trebuchet MS", system-ui, -apple-system, "Segoe UI", sans-serif; /* ADR-0005 face (locked 2026-07-11); options below */
    /* --serif stays defined (Georgia) but nothing may newly use it (ADR-0005). */
    --serif: Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    /* Consistent margins (2026-06-09 title spec): ONE slide safe-area / content inset, applied to
       every layout via .slide. Content sits the same distance from the slide edge regardless of
       layout — no more ad-hoc per-layout padding. Change here to reflow the whole deck's margins. */
    --slide-pad-y: 5cqh;
    --slide-pad-x: 5.6cqw;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--paper);
    overflow: hidden;
  }
  button, input, select { font: inherit; }

  .deck {
    /* ADR-0030: the deck is the slide's box — the whole window. The stage inside it is scaled to
       fit it (createStageFit), and what the scaled stage leaves uncovered is the letterbox, painted
       in the slide's background. ADR-0005 chrome policy: the control bar (.footer) is a fixed
       overlay that auto-hides, so content slides are full-bleed with no persistent chrome except
       the 3px accent progress tick. */
    position: relative;
    height: 100vh;
    overflow: hidden;
  }
  .stage {
    /* ADR-0030: the stage is the FIXED 1280×720 slide canvas. It is laid out at this size at every
       window size and scaled uniformly by a transform (createStageFit, runtime/stage-fit.js), the
       way the share page scales it — the slide is a composed artefact, never re-laid out for its
       window. Type-scale principle: type sizes are STAGE-relative (cqw), so they follow the canvas. */
    position: absolute;
    top: 0;
    left: 0;
    width: var(--slide-w, 1280px);
    height: var(--slide-h, 720px);
    transform-origin: 0 0;
    overflow: hidden;
    container-type: size;
  }
  .slide {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
    /* Single safe-area token — uniform across EVERY layout (consistent margins). */
    padding: var(--slide-pad-y) var(--slide-pad-x);
    overflow: hidden;
    /* Re-declare --tint ON the slide so it resolves against the slide's inline --sec-tint
       (the generator stamps --sec-accent/--sec-tint, and --accent, inline per section). The
       :root --tint only ever saw :root's absent --sec-tint, so it stayed the cobalt default
       for every section; declaring it here makes the section TINT track the section accent. */
    --tint: var(--sec-tint, #e8eefc);
  }
  .slide.active { display: grid; }
  .slide-content {
    /* ADR-0030: widths inside the slide are fractions of the canvas. The 1180px cap is retired as a
       px length and kept as the same fraction of the 1280px canvas (1180/1280 = 92.1875cqw): it
       still stops unbreakable content (a pre line, a long URL) from growing the slide's auto grid
       track past the band. */
    width: min(92.1875cqw, 100%);
    min-height: min(820px, 86cqh);
    margin: 0 auto;
    display: grid;
    align-content: center;
  }
  /* ADR-0005: all headings are the sans grotesque — nothing uses the serif any more. */
  h1, h2 {
    margin: 0;
    font-family: var(--sans);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.12;
  }
  h2 { font-size: max(34px, 5cqw); max-width: 17ch; }
  .columns {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 28px;
    margin-top: 34px;
  }
  /* ADR-0005 card (mockup .cards .card): flat, sharp, hairline-bordered on paper — no radius,
     no shadow, no tint fill. The accent appears in icons/numbers/keywords, not in chrome. */
  .card {
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-radius: 0;
    padding: clamp(18px, 2.6cqh, 28px) clamp(16px, 1.6cqw, 26px);
    box-shadow: none;
  }
  .card strong { display: block; margin-bottom: 8px; color: var(--ink); font-weight: 600; }
  /* Statement: the slide's main point as large prose. ONE treatment, shared by the authored
     `.statement` block class and by generated layout-statement paragraphs.
     ADR-0005 (mockup .t-statement): a single large sans phrase, centred both axes, NO left-bar.
     max-width 14em / line-height 1.5 are the binding readability measures (ADR-0028 §1, were 12em
     and 1.3); the line-height also lets boxed strong emphasis (below) sit clear of adjacent
     lines. */
  .statement,
  .slide-content.layout-statement > p:not(.kicker) {
    margin: 0;
    font-family: var(--sans);
    font-weight: 500;
    font-size: max(34px, 5.4cqw);
    line-height: 1.5;
    letter-spacing: -0.02em;
    color: var(--ink);
    max-width: 14em;
  }
  /* Boxed emphasis (mockup .box) for the structural big-type layouts: a filled accent chip with
     clone box-decoration so it never bleeds across a wrapped line. Statement/section hosts carry
     line-height ≥ 1.3; quote/image-quote define their own boxed strong beside their type rules. */
  .slide-content.layout-statement > p strong,
  .slide-content.layout-statement > .slide-head h1 strong,
  .slide-content.layout-section-title h1 strong {
    background: var(--accent); color: var(--paper);
    padding: 0.02em 0.18em; border-radius: 0.1em;
    box-decoration-break: clone; -webkit-box-decoration-break: clone;
  }
  /* === G6 — UNIVERSAL CONTENT PARAGRAPH ===
     Every generated content paragraph carries `.content-p` (one render-time class, see
     generate-presentation-bundle.mjs). This single rule is the comment/statement visual
     treatment for ALL containers — the accent-bar callout that reads as "the speaker's
     point", at a statement-adjacent scale. It replaces the previous per-container <p>
     paths (the bare copy-visual / list-visual / cards-media-split paragraph that rendered
     unstyled). Container tuning is done by descendant overrides below, NOT by new <p> paths.

     PRECEDENCE: the statement layout keeps its own bigger treatment. The `:not(.layout-statement *)`
     guard here means a statement paragraph (which is ALSO `.content-p`) takes ONLY the
     `.statement, .layout-statement > p` rule above — the two never fight. Card comments
     (`.content-p.card-comment`) take the card-scoped override (later in this sheet). */
  .slide-content:not(.layout-statement) .content-p:not(.card-comment):not(:where(.layout-statement *)) {
    margin: 0 0 .6em;
    padding-left: 22px;
    border-left: 5px solid var(--accent);
    font-family: var(--sans);
    font-size: var(--copy-size, max(var(--type-floor), 3.2cqw));
    line-height: 1.34;
    color: var(--ink);
    max-width: 46ch;
    /* Body copy may carry long emails/URLs (CTA contact lines); let them break so a long
       token never overflows the slide horizontally. (Titles keep overflow-wrap:normal.) */
    overflow-wrap: anywhere;
  }
  .slide-content:not(.layout-statement) .content-p:not(.card-comment):not(:where(.layout-statement *)):last-child { margin-bottom: 0; }
  .slide-content:not(.layout-statement) .content-p:not(.card-comment):not(:where(.layout-statement *)) strong { color: var(--accent); }
  /* [data-fragment] now lives ONLY on card-gallery cards (subslide stepping). Feature lists,
     quotes, figures and timeline entries no longer emit it — they render fully visible by
     default and only step when reveal/focus mode is on (see mode CSS near the runtime). */
  [data-fragment] {
    transition: opacity 180ms ease, transform 180ms ease;
  }
  [data-fragment].hidden-fragment {
    opacity: 0.12;
    transform: translateY(6px);
  }

  /* === layout blocks (markdown-outline-v2) === */
  /* Single source of truth for kicker / h1 / lead type scale (reference: KCL deck). */
  /* Text-supports-speech: content sits in a left-aligned band, key phrases pop in the
     section accent, body width is capped so the eye lands on the spoken point. */
  .slide-content { text-align: left; }
  /* Title group wrapper. By default it is transparent to layout (display:contents) so the
     kicker + h1 keep behaving as direct grid/flow children of .slide-content — every
     existing layout works unchanged. The two-column layouts (list/statement) override this
     to make .slide-head a real grid cell that vertically centres the title (see below). */
  .slide-head { display: contents; }
  /* Visually-hidden but kept for nav-title fallbacks / overview that read h1 text. */
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0);
    white-space: nowrap; border: 0;
  }
  .slide-content :is(p, li, blockquote, figcaption) strong,
  .slide-content .slide-head h1 strong { color: var(--accent); }
  .slide-content > p:not(.lead):not(.kicker) { max-width: 60ch; }
  .kicker {
    color: var(--accent);
    margin: 0 0 18px;
    font-family: var(--mono);
    font-size: max(13px, 1.05cqw);
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  /* 2026-06-09 title spec: default H1 = 60% of the old base clamp(42,6.7vw,86). Every per-layout
     H1 override below is scaled by the SAME ~0.605 factor so proportions hold across layouts. */
  h1 { font-size: max(25px, 4.02cqw); max-width: 18ch; }
  /* Title-fit contract: a title NEVER breaks a word mid-word and NEVER overflows its
     column. Words wrap on whitespace (overflow-wrap/word-break normal, hyphens off); the
     runtime title-fit pass (see fitTitles) then shrinks the font-size — via an inline
     px font-size that wins over every stylesheet rule — when a long single word still
     exceeds the column at the authored size. min-width:0 lets the title's grid/flow column
     actually shrink so clientWidth reports the true available width to measure against. */
  h1, h2 { overflow-wrap: normal; word-break: normal; hyphens: none; min-width: 0; }
  .slide-content.layout-image-claim h1 { font-size: max(21px, 2.66cqw); max-width: 19ch; }
  .slide-content.layout-cta-screenshots h1 { font-size: max(21px, 2.9cqw); max-width: 21ch; }
  .slide-content.layout-closing h1,
  .slide-content.layout-list h1,
  .slide-content.layout-grid h1,
  .slide-content.layout-system-map h1 { max-width: 16ch; }
  /* ADR-0005 section divider (mockup .t-section): the whole slide fills with the section TINT;
     a large sans title, with an authored kicker (if any) as a mono accent eyebrow above it. No
     automatic "Section" eyebrow (2026-09-24): the tint already says it is a divider. Block
     centred both axes, text left inside (whitespace rule). NO underline — the tint field is the
     "you are here" cue. */
  .slide:has(> .slide-content.layout-section-title) { background: var(--tint); }
  .slide-content.layout-section-title {
    justify-items: center;
    align-content: center;
    text-align: left;
  }
  .slide-content.layout-section-title h1 {
    font-family: var(--sans);
    font-weight: 700;
    max-width: 12em;
    font-size: max(38px, 5.6cqw);
    line-height: 1.24;
    letter-spacing: -0.025em;
  }
  .slide-content.layout-section-title .kicker {
    font-family: var(--mono);
    font-weight: 500;
    color: var(--accent);
  }

  /* === H2 subsection-title (level-2 interstitial) === */
  /* Progressive de-emphasis from a section title: noticeably smaller h1, LEFT-aligned (not
     centred), the PARENT section shown as an accent eyebrow above, a lighter/thinner underline.
     The slide's --accent is the parent section's accent (set inline, like section titles). */
  /* Subsection = a quieter section divider (ADR-0005 progressive de-emphasis): no tint field,
     smaller sans title, a mono accent parent-eyebrow. Block centred both axes, text left. */
  .slide-content.layout-subsection-title {
    justify-items: center;
    align-content: center;
    text-align: left;
  }
  .slide-content.layout-subsection-title .kicker {
    color: var(--accent);
    font-family: var(--mono);
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: max(13px, 1.1cqw);
    margin-bottom: 0.6em;
  }
  .slide-content.layout-subsection-title h1 {
    font-family: var(--sans);
    font-weight: 700;
    max-width: 14em;
    font-size: max(31px, 4.4cqw);
    line-height: 1.2;
    letter-spacing: -0.02em;
  }

  /* === E7 auto title slide (deck-title) === */
  /* Opening bookend. Asymmetric, left-anchored: an accent kicker (the event line), the deck
     title at the largest serif scale with an accent rule beneath it, then the author muted.
     Distinct from a section title (which is centred) — this opens the whole deck. */
  /* ADR-0005 poster title (mockup title-variations V1): white page, large sans title, mono
     accent event line above, author muted below. Block centred both axes, text left inside
     (whitespace rule). The accent gesture is a keyword underline on **bold** (mockup .under);
     the whole-title rule is dropped (poster underlines only the key phrase). */
  /* Poster assembly (title-variations V1): the title block owns the centre; the speaker line
     is PINNED to the bottom of the stage, led by a short accent rule; any kicker (series ·
     event) sits at the top in mono accent. Never a floating author line under the title. */
  .slide-content.layout-title {
    width: 100%;
    max-width: none;
    min-height: 100%;
    display: grid !important;
    grid-template-rows: auto 1fr auto;
    align-content: stretch;
    justify-items: start;
    padding-bottom: clamp(18px, 3.5cqh, 44px);
  }
  .slide-content.layout-title > .slide-head,
  .slide-content.layout-title > h1,
  .slide-content.layout-title > .slide-head > h1 {
    /* .slide-head is display:contents on title slides — the H1 itself is the grid item. */
    grid-row: 2;
    align-self: center;
    justify-self: center;
  }
  .slide-content.layout-title > .slide-head > .kicker,
  .slide-content.layout-title > .kicker { grid-row: 1; justify-self: start; }
  .slide-content.layout-title > p {
    grid-row: 3;
    justify-self: stretch;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 0.8em;
    max-width: none;
    font-size: max(17px, 1.5cqw);
    color: var(--ink);
    font-weight: 600;
  }
  .slide-content.layout-title > p::before {
    content: "";
    flex: 0 0 auto;
    width: 3em;
    height: 2px;
    background: var(--accent);
  }
  .slide-content.layout-title > .slide-head > .kicker,
  .slide-content.layout-title > .kicker {
    color: var(--accent);
    font-family: var(--mono);
    font-weight: 500;
    font-size: max(14px, 1.3cqw);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  .slide-content.layout-title h1 {
    font-family: var(--sans);
    font-weight: 700;
    max-width: 11em;
    font-size: max(38px, 6.5cqw);
    line-height: 1.14;
    letter-spacing: -0.035em;
  }
  /* Poster keyword underline: **bold** in the title gets the soft accent underline, upright. */
  .slide-content.layout-title h1 strong {
    color: inherit;
    font-weight: inherit;
    box-shadow: inset 0 -0.16em 0 color-mix(in srgb, var(--accent) 35%, transparent);
  }
  /* The title/closing bookends centre their text; the subtitle/author/CTA paragraphs are
     `.content-p`, which would otherwise pick up the universal vertical accent-bar (border-left).
     Drop it here so a centred line stays centred (no side bar floating left of centred text). */
  .slide-content.layout-title:not(.layout-statement) .content-p:not(.card-comment),
  .slide-content.layout-closing:not(.layout-statement) .content-p:not(.card-comment) {
    border-left: 0;
    padding-left: 0;
  }

  /* === E7 auto closing slide (deck-thanks) === */
  /* Closing bookend. Centred, statement-scale "Thank you"; the call-to-action (or the
     author/event tail) sits below, prominent — the CTA's bold runs already render in the
     accent (.slide-content … strong rule), so a `**…**` cta pops. */
  .slide-content.layout-closing {
    place-items: center;
    text-align: center;
  }
  .slide-content.layout-closing h1 {
    font-family: var(--sans);
    font-weight: 700;
    max-width: 12em;
    font-size: max(33px, 5.14cqw);
    line-height: 1.3;
    letter-spacing: -0.025em;
  }
  .slide-content.layout-closing > p,
  .slide-content.layout-closing > .slide-head + p {
    text-align: center;
    max-width: 40ch;
    margin: 28px auto 0;
    font-size: max(22px, 2.8cqw);
  }

  /* Lead paragraph: title/opening/closing layouts treat their first paragraph as a lead.
     (layout-statement is NOT a lead — see the statement layout below.) */
  p.lead,
  .slide-content.layout-title > p,
  .slide-content.layout-closing > p,
  .slide-content.layout-opening > p {
    max-width: 34ch;
    margin: 24px 0 0;
    font-size: max(21px, 2.5cqw);
    line-height: 1.34;
    color: var(--muted);
  }

  /* === list layout (D2): title left, iconed revealable feature-list right === */
  /* The slide-content becomes a two-column band — the kicker/h1/lead group anchors the
     left column, the feature-list fills the right. Items reveal one-by-one (each carries
     data-fragment), so the spoken point and its icon arrive together. */
  .slide-content.layout-list {
    grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
    column-gap: clamp(34px, 4cqw, 72px);
    align-content: center;
    align-items: center;
  }
  /* Title group: a single block cell in column 1, vertically centred against the whole
     slide regardless of the right column's height (Refinement 1). The kicker sits tight
     above the h1 inside it. */
  .slide-content.layout-list > p.lead,
  .slide-content.layout-list > p:not(.kicker) { grid-column: 1; max-width: 30ch; }
  .slide-content.layout-list > .feature-list {
    grid-column: 2;
    grid-row: 1 / span 99;
    align-self: center;
  }
  .feature-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: calc(14px * var(--list-gap, 1));
    counter-reset: feature;
    width: 100%;
  }
  /* Long lists (>6) split into two shallow columns inside the right cell. */
  .feature-list.fl-wide {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: calc(12px * var(--list-gap, 1)) 20px;
  }
  /* ADR-0005 list rows (mockup .icon-list .item): clean borderless rows — no panel, no bars,
     no radius, no shadow. The icon carries the accent; the type carries the weight. */
  .feature-list > li {
    counter-increment: feature;
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: 18px;
    padding: 12px 0;
    /* Type-scale principle: list rows sit at the deck's body token (Ticket 18 default 3.2cqw);
       --list-lh / --list-gap are the long-list fitting seam (runtime fitLists + compile-time
       data-list-density), so a crowded list tightens its leading and gaps before its type. */
    font-size: max(var(--type-floor), var(--fs-body));
    line-height: var(--list-lh, 1.35);
    color: var(--ink);
  }
  .feature-list.fl-wide > li { font-size: max(var(--type-floor), var(--fs-body)); padding: 10px 0; gap: 16px; }
  .fl-icon {
    display: grid;
    place-items: center;
    width: 1.15em;
    height: 1.15em;
    flex: none;
    color: var(--accent);
  }
  .feature-list.fl-wide .fl-icon { width: 1.1em; height: 1.1em; }
  /* Icon System v3: Lucide stroke icons use currentColor accent; brand SVGs keep their own fills.
     .fl-svg-lucide: stroke=currentColor inherits --accent from .fl-icon.
     .fl-svg-brand: sized to fill the box; no colour override (brand colours respected). */
  .fl-svg { width: 100%; height: 100%; }
  .fl-svg-brand { width: 100%; height: 100%; display: block; }
  /* Monogram fallback (logolist): an honest neutral chip with the company's first letter
     when no real brand mark exists — never a misleading generic shape, never plain. Fills
     the same .fl-icon box as a real logo so the list stays visually consistent. */
  .fl-svg-mono {
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
    border-radius: 7px;
    background: color-mix(in srgb, var(--ink) 7%, transparent);
    border: 1.5px solid color-mix(in srgb, var(--ink) 16%, transparent);
    color: color-mix(in srgb, var(--ink) 72%, transparent);
    font-family: var(--sans);
    font-weight: 600;
    font-size: 19px;
    line-height: 1;
    letter-spacing: 0;
  }
  .feature-list.fl-wide .fl-svg-mono { font-size: 16px; border-radius: 6px; }
  .fl-icon.fl-num {
    border-radius: 50%;
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border: 2px solid var(--accent);
    font-family: var(--sans);
    font-weight: 600;
    font-size: max(var(--type-floor), 18px);
    line-height: 1;
  }
  .feature-list.fl-wide .fl-icon.fl-num { font-size: max(var(--type-floor), 15px); }
  .fl-text { min-width: 0; }
  /* E6 — plain feature-list: no icon column. Name lists ("Minsky", "Abelson / Schank")
     and weak-match lists drop the icon entirely and keep only the panel + accent border.
     The single-column grid replaces the auto/1fr icon grid so the text sits flush at the
     card's left padding — intentional, not an amputated icon slot. */
  .feature-list.fl-plain > li {
    grid-template-columns: 1fr;
    gap: 0;
  }

  /* SD-17 — links layout: the URL echo in muted monospace beside the anchor text. */
  .link-url { font-size: max(var(--type-floor), 0.78em); font-family: monospace; opacity: 0.55; word-break: break-all; }

  /* === H1 — nested feature-list children === */
  /* A parent item carrying a nested sub-list reads as a single card: the parent text on top,
     a quieter indented sub-list beneath it inside the same card. The sub-list belongs to the
     parent (no icon, no reveal of its own — it appears with the parent fragment). */
  /* A list with children stays a single full-width column so each card has room for its
     sub-list (overrides the >6-items two-column split). */
  .feature-list.fl-has-children.fl-wide { grid-template-columns: 1fr; }
  /* The parent li becomes a top-anchored stack: icon+text on the first row, the sub-list
     spanning the full card width on the next row. */
  .feature-list.fl-has-children > li {
    align-items: start;
    row-gap: calc(8px * var(--list-gap, 1));
  }
  .feature-list.fl-has-children > li > .fl-icon { align-self: start; margin-top: 2px; }
  /* Sub-list alignment: in an iconed list it starts in the TEXT column (under the parent
     text, not under the icon) so it reads as a true sub-bullet; in a plain list (single
     column) it spans the card. 2026-06-09: was full-span with a dash marker — read as a
     detached sibling row rather than a sub-item. */
  .feature-list > li > .fl-sublist { grid-column: 1 / -1; }
  .feature-list:not(.fl-plain) > li > .fl-sublist { grid-column: 2; }
  .fl-sublist {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: calc(4px * var(--list-gap, 1));
  }
  .fl-sublist > li {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    column-gap: .45em;
    align-items: baseline;
    padding-left: 0;
    /* Nested bullets are content at BODY size (Ticket 18): hierarchy is carried by the marker,
       the indent and the parent lead's step up, never by shrinking the child. */
    font-size: max(var(--type-floor), var(--fs-body));
    line-height: var(--list-lh, 1.35);
    color: var(--ink);
    font-family: inherit;
  }
  /* Quiet round bullet marker, vertically centred on the first line. */
  .fl-sublist > li::before {
    content: "\2022";
    position: static;
    grid-column: 1;
    grid-row: 1;
    color: color-mix(in srgb, var(--ink) 45%, transparent);
  }
  /* Depth ≥2 may step down once more, but remains full-contrast running content. */
  .fl-sublist .fl-sublist {
    padding-left: 12px;
    grid-column: 2;
  }
  .fl-sublist .fl-sublist > li {
    font-size: max(var(--type-floor), var(--fs-body));
    color: var(--ink);
  }
  .fl-sublist .fl-sublist > li::before { content: "·"; }

  /* === SD-10 (Task 5): sub-bullet icons ({icons=all}) ===
     .fl-sublist-icons suppresses the dash marker; .fl-sub-icon is the icon slot — smaller
     than the top-level .fl-icon (22px vs 34px) and coloured with the secondary gold accent
     so sub-bullets read as a quieter tier alongside the primary icon column. */
  .fl-sublist-icons > li {
    /* T28 (Dominik, 2026-09-17): the in-flow icon + flex gap IS the indent — the old
       padding-left: 28px was a stale extra indent from when the icon sat outside the row. */
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .fl-sublist-icons > li::before { content: none; /* icon replaces the bullet */ }
  .fl-sub-icon {
    display: grid;
    place-items: center;
    width: 20px;
    height: 20px;
    flex: none;
    align-self: center;
    color: var(--gold);
    opacity: 0.85;
  }
  .fl-sub-icon .fl-svg { width: 100%; height: 100%; }
  .fl-sub-icon .fl-svg-lucide { stroke-width: 2; }

  /* === SD-9 {annotated} — shared-axis grid (Task 6, 2026-06-25) === */
  /* ONE grid for the whole list: column 1 = widest lead (max-content), so every annotation
     starts on the SAME left axis. display:contents on each <li> lifts the lead+ann pair into
     the parent grid without creating a nested grid per item.
     Replaces the old per-item card approach (old fl-has-aside 3-column grid per li). */
  .feature-list.fl-annotated {
    display: grid;
    grid-template-columns: max-content 1fr;
    /* Slide round 2 (0.37): rows align by their first line box, not the flex lead's synthesised baseline
       (the icon has none, so the label sat ~6px above the annotation). Label and annotation share
       font size and --list-lh, so their baselines meet. */
    align-items: start;
    /* Reset the default gap set on .feature-list; the row gap is the long-list fitting seam. */
    gap: calc(clamp(10px, 2.7cqw, 28px) * var(--list-gap, 1)) clamp(18px, 3.4cqw, 48px);
  }
  /* Each li becomes transparent to the grid — its children (lead + ann) lift into the parent grid. */
  .feature-list.fl-annotated > li {
    display: contents;
    /* Reset the card styles from the default .feature-list > li */
    padding: 0;
    border-left: none;
    border-radius: 0;
    background: none;
    box-shadow: none;
  }
  /* Column 1: the primary label (icon + text). white-space:nowrap keeps the lead on one line
     so all annotations snap to a shared axis regardless of label length. */
  .feature-list.fl-annotated > li > .fl-lead {
    display: flex;
    align-items: center;
    gap: clamp(8px, 1.2cqw, 16px);
    white-space: nowrap;
    font-size: max(var(--type-floor), var(--fs-body));
    font-weight: 650;
    /* Slide round 2 (0.37): label and annotation share --list-lh so their baselines meet. */
    line-height: var(--list-lh, 1.35);
    color: var(--ink);
  }
  .feature-list.fl-annotated > li > .fl-lead .fl-icon {
    width: clamp(22px, 2.2cqw, 32px);
    height: clamp(22px, 2.2cqw, 32px);
    flex: none;
    color: var(--accent);
    position: static;
  }
  .feature-list.fl-annotated > li > .fl-lead .fl-text { min-width: 0; }
  /* Column 2: the annotation. Left-aligned, capped width, muted, wraps naturally. */
  .feature-list.fl-annotated > li > .fl-ann {
    font-size: max(var(--type-floor), var(--fs-body));
    color: var(--ink);
    line-height: var(--list-lh, 1.35);
    align-self: start;
  }
  /* Sub-list in annotation column (col 2): indented bullets, muted, annotation-scale type.
     display:contents on <li> lifts .fl-sublist alongside .fl-lead into the shared grid;
     the sub-list sits in col 2 naturally without any extra grid-column override. */
  .feature-list.fl-annotated > li > .fl-sublist {
    align-self: start;
    font-size: max(var(--type-floor), var(--fs-body));
    color: var(--ink);
    margin: 0;
    padding-left: 0;
  }
  .fl-subtext { min-width: 0; grid-column: 2; grid-row: 1; }

  /* === SD-16 statement-beside-list layout (Task 6, 2026-06-25) === */
  /* Title across the top; body = .stmt-list flex container.
     Left column (.stmt, 42%): the claim, left-border accent bar = height of the TEXT.
     Right column (.list-side, flex:1): supporting list, icons allowed.
     align-items:center centres both columns vertically so the bar is text-height, not column-height. */
  .stmt-list {
    display: flex;
    gap: clamp(24px, 6cqw, 80px);
    align-items: center;
    height: 100%;
  }
  /* ADR-0005 (mockup .anchor .main p): the claim is plain large type — no bars; keyword
     emphasis is the boxed strong. The old accent bar + the universal content-p bar were
     doubling up. */
  .stmt-list .stmt {
    flex: 0 0 42%;
    border-left: 0;
    padding-left: 0;
    font-family: var(--sans);
    font-weight: 500;
    font-size: max(26px, 3cqw);
    line-height: 1.3;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .stmt-list .stmt.content-p, .stmt-list .content-p { border-left: 0; padding-left: 0; }
  .stmt-list .list-side {
    flex: 1;
    min-width: 0;
  }

  /* === statement layout (ADR-0005 mockup .t-statement) === */
  /* One idea, dead-centre: a single large sans phrase, block centred both axes, text left
     inside. The nav-only title (.slide-head-quiet / sr-only h1) is not drawn; when {title=show}
     restores a visible .slide-head it stacks (mono kicker + title) above the statement. */
  .slide-content.layout-statement {
    justify-items: center;
    align-content: center;
    align-items: center;
    text-align: left;
  }
  .slide-content.layout-statement > .slide-head-quiet { display: contents; }
  .slide-content.layout-statement > .slide-head:not(.slide-head-quiet) { display: block; }
  .slide-content.layout-statement > .slide-head > .kicker {
    font-family: var(--mono);
    font-weight: 500;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .slide-content.layout-statement > .slide-head > h1 {
    font-family: var(--sans);
    font-weight: 700;
    max-width: 12em;
    line-height: 1.2;
    margin-bottom: 0.5em;
  }
  /* Trailing paragraphs (multi-part statement) step down to a quieter muted line. */
  .slide-content.layout-statement > p:not(.kicker) ~ p:not(.kicker) {
    margin-top: 0.6em;
    font-size: max(22px, 3.2cqw);
    font-weight: 400;
    color: var(--muted);
  }
  .feature-list.fl-has-children > li > .fl-text {
    font-size: max(calc(var(--type-floor) * 1.111111), 1em);
  }
  .slide-content.layout-opening > ul,
  .slide-content.layout-opening > ol,
  .slide-content.layout-closing > ul,
  .slide-content.layout-closing > ol,
  .slide-content.layout-section-title > ul,
  .slide-content.layout-section-title > ol {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px 24px;
    margin: 42px 0 0;
    padding: 0;
    list-style: none;
    max-width: 980px;
    counter-reset: biglist;
  }
  .slide-content.layout-opening > ul > li,
  .slide-content.layout-opening > ol > li,
  .slide-content.layout-closing > ul > li,
  .slide-content.layout-closing > ol > li,
  .slide-content.layout-section-title > ul > li,
  .slide-content.layout-section-title > ol > li {
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    background: var(--tint);
    box-shadow: var(--hairline-shadow);
    padding: 14px 16px;
    font-size: max(20px, 2cqw);
    line-height: 1.24;
  }
  /* Nested lists (e.g. computational prehistory) stay quiet inside their parent card.
     Feature-list sub-lists (.fl-sublist) carry their own sub-bullet design — excluded. */
  .slide-content :is(ul, ol) :is(ul, ol):not(.fl-sublist) {
    display: block;
    margin: 10px 0 0;
    padding: 0;
    list-style: none;
    grid-template-columns: none;
  }
  .slide-content :is(ul, ol) :is(ul, ol):not(.fl-sublist) > li {
    border-left: 2px solid var(--line);
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    margin: 0 0 0 4px;
    padding: 4px 0 4px 14px;
    font-size: max(var(--type-floor), 0.9em);
    color: var(--ink);
  }
  .slide-content.layout-opening > ol > li,
  .slide-content.layout-closing > ol > li,
  .slide-content.layout-section-title > ol > li {
    counter-increment: biglist;
  }
  .slide-content.layout-opening > ol > li::before,
  .slide-content.layout-closing > ol > li::before,
  .slide-content.layout-section-title > ol > li::before {
    content: counter(biglist) ". ";
    color: var(--accent);
    font-weight: 800;
  }
  @container (max-width: 950px) {
    .slide-content.layout-list {
      grid-template-columns: 1fr;
      align-content: start;
      row-gap: 20px;
    }
    .slide-content.layout-list > .slide-head,
    .slide-content.layout-list > p.lead,
    .slide-content.layout-list > p:not(.kicker),
    .slide-content.layout-list > .feature-list { grid-column: 1; grid-row: auto; align-self: start; }
    .slide-content.layout-list > .slide-head > h1 { max-width: none; }
    .feature-list.fl-wide { grid-template-columns: 1fr; }
    /* Statement layout (D3) stacks the same way below 950px. */
    .slide-content.layout-statement {
      grid-template-columns: 1fr;
      align-content: start;
      row-gap: 20px;
    }
    .slide-content.layout-statement > .slide-head,
    .slide-content.layout-statement > p { grid-column: 1; grid-row: auto; align-self: start; }
    .slide-content.layout-statement > .slide-head > h1 { max-width: none; }
  }
  @container (max-width: 900px) {
    .slide-content.layout-opening > ul,
    .slide-content.layout-opening > ol,
    .slide-content.layout-closing > ul,
    .slide-content.layout-closing > ol,
    .slide-content.layout-section-title > ul,
    .slide-content.layout-section-title > ol { grid-template-columns: 1fr; }
  }

  /* contrast (D4): a real opposition device. Each pair is a panel that stacks the two terms
     with a strongly accented gold slash dividing them — the top term in ink (the familiar /
     inherited side), the bottom term in the section accent (the alternative the slide argues
     for). The slash is large and rides a hairline rule that spans the panel, so the eye reads
     "X — versus — Y" rather than a small list of word-pairs. Terms read large (clamp 26→40px),
     comfortably above the type floor. Two columns by default so each term gets a full line for
     long phrases; three only when the pairs are short (handled by the .count-3 helper). */
  .contrast-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
    gap: clamp(16px, 1.8cqw, 22px);
    margin-top: 40px;
  }
  /* {contrast} + #### groups (2026-06-09): static side-by-side comparison columns. All
     visible at once — the step-through exclusive gallery treatment does not apply here. */
  .contrast-cards {
    display: grid;
    grid-template-columns: repeat(var(--compare-cols, 2), minmax(0, 1fr));
    gap: clamp(16px, 2cqw, 28px);
    align-content: center;
    margin-top: 28px;
    min-height: 0;
  }
  .contrast-cards > .card {
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-top: 4px solid var(--accent);
    border-radius: 0;
    box-shadow: none;
    padding: clamp(16px, 2cqw, 28px);
    min-width: 0;
    display: grid;
    align-content: start;
    gap: 12px;
  }
  .contrast-cards > .card > h4 {
    margin: 0;
    font-family: var(--sans);
    font-size: max(20px, 1.9cqw);
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  /* Comparison columns carry compact lists: lighter card rows than a full feature-list. */
  .contrast-cards .feature-list { gap: 8px; }
  .contrast-cards .feature-list > li {
    font-size: max(16px, 1.35cqw);
    padding: 9px 12px;
    box-shadow: none;
  }
  /* Two-panel comparison (2026-06-10): a 5+-pair contrast renders as opposing panels —
     light vs ink, headers from the first pair — recovering the classic two-box diagram. */
  .contrast-panels {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(20px, 2.4cqw, 44px);
    align-content: center;
    margin-top: 28px;
  }
  .cpanel {
    border-radius: 12px;
    padding: clamp(18px, 2.2cqw, 34px);
    display: grid;
    gap: 4px;
    align-content: start;
    min-width: 0;
  }
  .cpanel-left { background: var(--tint); border: 1.5px solid var(--ink); box-shadow: var(--hairline-shadow); }
  .cpanel-right { background: var(--ink); color: var(--paper); }
  .cpanel-eyebrow {
    margin: 0;
    font-size: max(11px, 0.95cqw);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .cpanel-right .cpanel-eyebrow { color: color-mix(in srgb, var(--paper) 62%, transparent); }
  .cpanel-verb {
    margin: 0 0 10px;
    font-family: var(--sans);
    font-size: max(22px, 2.1cqw);
    line-height: 1.1;
  }
  .cpanel-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: clamp(5px, 0.7cqh, 10px);
  }
  .cpanel-list > li {
    position: relative;
    padding-left: 22px;
    font-size: max(15px, 1.3cqw);
    line-height: 1.3;
  }
  .cpanel-list > li::before {
    content: "\2192";
    position: absolute;
    left: 0;
    top: 0;
    color: var(--accent);
  }
  .cpanel-right .cpanel-list > li { color: color-mix(in srgb, var(--paper) 88%, transparent); }
  .cpanel-right .cpanel-list > li::before { color: color-mix(in srgb, var(--paper) 55%, transparent); }
  /* ADR-0005 contrast pair (mockup ledger): flat hairline panel; the NEGATIVE term is muted
     with an accent strike (the cross-out grammar); the POSITIVE term is ink, weight 600. */
  .contrast-pair {
    display: grid;
    grid-template-rows: 1fr auto 1fr;
    justify-items: center;
    align-content: center;
    gap: 10px;
    min-height: 0;
    border: 1px solid var(--hairline);
    border-radius: 0;
    background: var(--paper);
    padding: 22px 24px;
    box-shadow: none;
    text-align: center;
  }
  /* The two terms. First span = top (ink), last span = bottom (accent). Large, tight, balanced. */
  .contrast-pair span {
    font-size: max(21px, 2.3cqw);
    line-height: 1.16;
    font-weight: 600;
    letter-spacing: -0.01em;
    align-self: center;
    max-width: 16ch;
  }
  /* Neutral pair by default (left quieter, right carries the point). The don't/do CROSS-OUT
     grammar from the lock needs authored intent — proposed {contrast=strike}, decided at gate. */
  .contrast-pair span:first-of-type { color: var(--muted); font-weight: 500; }
  .contrast-pair span:last-of-type { color: var(--ink); font-weight: 600; }
  /* The divider: a big gold slash centred on a hairline rule that spans the panel width. */
  .contrast-pair strong {
    display: grid;
    place-items: center;
    width: 100%;
    color: var(--gold);
    font-family: var(--sans);
    font-size: max(34px, 3.6cqw);
    font-weight: 600;
    line-height: 1;
    position: relative;
  }
  .contrast-pair strong::before,
  .contrast-pair strong::after {
    content: "";
    position: absolute;
    top: 50%;
    width: calc(50% - 1.1em);
    height: 1px;
    background: var(--line);
  }
  .contrast-pair strong::before { left: 0; }
  .contrast-pair strong::after { right: 0; }

  /* Grid / tiles. A centred flex-wrap whose per-tile basis comes from `--tile-cols` (the balanced
     auto column count, or the author's explicit {blocks:RxC} cols). justify-content:center CENTRES
     an incomplete final row, so 5 tiles read 3+2 centred — never the old 4+1 dangling orphan. */
  .tile-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 42px;
    max-width: 1100px;
    margin-inline: auto;
  }
  .tile-grid > div {
    flex: 0 1 calc((100% - (var(--tile-cols, 4) - 1) * 12px) / var(--tile-cols, 4));
    min-width: 0;
    min-height: 112px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--tint);
    color: var(--ink);
    font-size: max(20px, 2.2cqw);
    font-weight: 500;
    text-align: center;
    padding: 14px;
  }

  .system-map {
    position: relative;
    margin-top: 42px;
    max-width: 900px;
    margin-inline: auto;
  }
  .system-map .system-centre {
    min-height: 96px;
    display: grid;
    place-items: center;
    border: 1px solid var(--ink);
    border-radius: 0;
    background: var(--ink);
    color: white;
    font-size: max(20px, 2.2cqw);
    font-weight: 760;
  }
  /* Connector lines (centre → satellites). An absolutely-positioned SVG overlay, sized + drawn at
     layout time (runtime drawSystemLinks), so a line runs from the centre's bottom edge to each
     satellite's top edge for ANY row count and re-draws on resize/print. It sits BEHIND the boxes. */
  .system-map .system-links {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: visible;
  }
  .system-map .system-links line { stroke: var(--accent); stroke-width: 2; }
  .system-map .system-centre,
  .system-map .system-sats { position: relative; z-index: 1; }
  /* Satellites: a centred flex-wrap. `--sat-cols` (set inline from the balanced column count) fixes
     each tile's basis so a full row holds exactly that many; justify-content:center then CENTRES an
     incomplete final row, so the block reads symmetrically under the centre (no ragged left shift). */
  .system-map .system-sats {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    margin-top: 28px;
  }
  /* {multicolour} (opt-in): colour each satellite — and its connector line — from a varied palette,
     cycling by position. The DEFAULT (no .system-multicolour) keeps every node + line on the single
     section accent. This only ADDS the option. Teal has been retired here too (2026-06-09 palette
     swap) in favour of the Oxford blue + crimson + green family.
     The line colour is read by the runtime from each satellite's --sat-c custom property. */
  .system-map.system-multicolour .system-sat:nth-child(6n+1) { --sat-c: #9f1239; }
  .system-map.system-multicolour .system-sat:nth-child(6n+2) { --sat-c: #0b3a6b; }
  .system-map.system-multicolour .system-sat:nth-child(6n+3) { --sat-c: #166534; }
  .system-map.system-multicolour .system-sat:nth-child(6n+4) { --sat-c: #c08a1d; }
  .system-map.system-multicolour .system-sat:nth-child(6n+5) { --sat-c: #7c3aed; }
  .system-map.system-multicolour .system-sat:nth-child(6n+6) { --sat-c: #be185d; }
  .system-map.system-multicolour .system-sat {
    border-color: var(--sat-c, var(--accent));
    border-top-width: 3px;
    color: var(--sat-c, var(--accent));
  }
  .system-map .system-sat {
    flex: 0 1 calc((100% - (var(--sat-cols, 3) - 1) * 14px) / var(--sat-cols, 3));
    min-width: 0;
    min-height: 96px;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 0;
    background: var(--tint);
    font-size: max(20px, 2.2cqw);
    font-weight: 760;
  }

  /* CONCEPT MAP ({conceptmap}). A labelled node-edge graph drawn as inline SVG from `A -label- B`
     relation lines. Nodes sit on a circle; accent edges carry their relation label on a small
     paper chip at the midpoint. Scales with the slide (viewBox + width:100%). */
  /* The conceptmap must FILL the content area, not shrink-wrap. Its slide-content is a 1-column
     grid whose implicit `auto` track let the block collapse to its min-content (~300px) — the
     "tiny in the centre" bug. justify-self:stretch + width:100% claim the full column; the SVG
     then scales to that width (viewBox preserves the graph) and uses the available height. */
  .conceptmap { margin: 18px auto 0; width: 100%; max-width: 92.1875cqw; justify-self: stretch; }
  .conceptmap svg { width: 100%; height: auto; max-height: 70cqh; display: block; }
  .conceptmap line.cm-edge, .conceptmap .cm-edge line { stroke: color-mix(in srgb, var(--accent) 55%, var(--line)); stroke-width: 2; }
  .conceptmap .cm-edge-label-bg { fill: var(--paper); stroke: color-mix(in srgb, var(--accent) 30%, var(--line)); stroke-width: 1; }
  .conceptmap .cm-edge-label { fill: var(--muted); font-family: var(--mono, inherit); font-size: 14px; letter-spacing: 0.04em; }
  .conceptmap .cm-node rect { fill: var(--paper); stroke: var(--accent); stroke-width: 2; }
  .conceptmap .cm-node text { fill: var(--ink); font-family: var(--sans, inherit); font-size: 19px; font-weight: 600; }

  /* COLUMNS layout ({columns} / {2col} / {3col}). The slide's top-level content nodes are dealt
     across N equal columns. Per-column vertical alignment (the columns rule): a column of purely
     image/video/paragraph content is vertically CENTRED (.col-align-middle); a column carrying
     any text-structural node — a subheading, sublist or feature-list — is aligned TOP
     (.col-align-top), so headed lists read from a common baseline while figures float centred. */
  .columns-grid {
    display: grid;
    gap: clamp(20px, 2.6cqw, 44px);
    margin-top: 30px;
    align-items: stretch;
  }
  .columns-grid.columns-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .columns-grid.columns-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .columns-grid.columns-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .columns-grid > .col {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .columns-grid > .col-align-top { justify-content: flex-start; }
  .columns-grid > .col-align-middle { justify-content: center; }
  /* Inside a column, headings/figures/lists already carry their own type styling; just make
     them flow naturally and never overflow the narrower column box. */
  .columns-grid > .col > * { margin-top: 0; max-width: 100%; }
  .columns-grid > .col h3 { margin: 0; color: var(--accent); font-size: max(20px, 1.9cqw); line-height: 1.1; }
  .columns-grid > .col .feature-list { margin-top: 6px; }
  .columns-grid > .col .slide-figure { margin: 0; }
  @container (max-width: 900px) {
    .columns-grid.columns-2,
    .columns-grid.columns-3,
    .columns-grid.columns-4 { grid-template-columns: 1fr; }
    .columns-grid > .col-align-middle { justify-content: flex-start; }
  }

  .evidence-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.38fr) minmax(280px, .72fr);
    gap: 28px;
    align-items: stretch;
    margin-top: 28px;
  }
  .slide-figure {
    margin: 0;
    display: grid;
    grid-template-rows: 1fr auto;
    min-height: 0;
    /* No frame: the image sits DIRECTLY on the slide background (no white box / border / radius),
       so a screenshot fills the space and reads as part of the slide rather than a pasted card. */
    background: transparent;
  }
  /* NEVER-UPSCALE contract: an image is shown at MOST at its intrinsic pixel size (1x) and
     only ever scaled DOWN to fit its box — never stretched up, which is what made small
     screenshots look "repeatedly recompressed". With the intrinsic width/height attributes the
     generator now emits, width:auto/height:auto resolve to the natural pixel size; the
     max-* caps then shrink it to fit the box and the vertical budget. object-fit:contain keeps
     aspect ratio in the rare case a box forces both caps. Centred in its grid cell. */
  .slide-figure img,
  .slide-figure video {
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: min(100%, 78cqh);
    object-fit: contain;
    justify-self: center;
    align-self: center;
    /* transparent: a PNG with transparency shows on the slide background, not a white plate */
    background: transparent;
  }
  /* Share-export stand-in for an over-limit local video (2026-06-10): poster (when authored)
     plus an honest note naming the file that plays in the app bundle. */
  .slide-figure.video-placeholder { grid-template-rows: auto auto; height: fit-content; align-self: center; }
  .video-placeholder-note {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.95rem;
  }
  .video-placeholder-note .vp-glyph {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border: 2px solid var(--accent);
    color: var(--accent);
    font-size: 13px;
  }
  .video-placeholder-note code { font-size: 0.82em; color: var(--ink); }
  .slide-figure figcaption {
    padding: 9px 12px 0;
    color: var(--muted);
    font-size: 0.86rem;
    text-align: center;
  }
  /* ── SD-4: figure.fig — centred caption layout ──────────────────────────────────────────────
     Adds flex-column centering to any image figure so the caption (when present) sits directly
     below the image and centred to it, not left-aligned. Combined with .slide-figure so all
     existing figure selectors (lightbox, copy-visual, lv-media) continue to work unchanged. */
  figure.slide-figure.fig {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(6px, 0.8cqw, 12px);
    margin: 0;
  }
  figure.slide-figure.fig figcaption {
    padding: 0;
    font-size: max(11px, 1.5cqw);
    color: var(--muted);
    text-align: center;
    line-height: 1.3;
    max-width: 100%;
  }
  /* ── SD-5: .img-row — 2-3 images as a flex row of captioned units ───────────────────────────
     Each figure.fig gets equal flex so they share the width; the caption wraps to its image
     width naturally (the figure is flex-column with align-items:center). */
  .img-row {
    display: flex;
    gap: clamp(12px, 4cqw, 48px);
    align-items: flex-start;
    margin: 0;
  }
  .img-row figure.slide-figure.fig {
    flex: 1;
    min-width: 0;
    margin: 0;
    max-height: 70cqh;
  }
  .img-row figure.slide-figure.fig img,
  .img-row figure.slide-figure.fig video { max-height: 60cqh; cursor: zoom-in; }
  /* The visible footer occupies the bottom 59px of the viewport. The slide's ordinary safe-area
     padding already clears most of it; reserve only the remainder, then remove the generic title
     gap so the row's auto margins split the exact title-to-footer media band equally. */
  .slide[data-title-layout="top"] > .slide-content.layout-media {
    height: min(820px, 86cqh);
    min-height: 0;
    padding-bottom: max(0px, calc(61px - var(--slide-pad-y)));
  }
  .slide[data-title-layout="top"] > .slide-content.layout-media > .slide-head {
    margin-bottom: 0 !important;
  }
  /* Ticket 17: a lone media figure owns the bounded title-to-footer band. Giving the figure a
     zero flex basis and its media a definite 100% box lets `object-fit:contain` shrink a portrait
     whose intrinsic height is taller than that band; intrinsic height must never expand the band. */
  .slide-content.layout-media > .figure-row {
    display: flex;
    flex: 0 1 auto !important;
    gap: clamp(14px, 1.6cqw, 24px);
    align-items: center;
    align-content: center;
    justify-content: center;
    align-self: center;
    width: 100%;
    min-width: 0;
    min-height: 0;
    max-height: 70cqh;
    margin-top: auto !important;
    margin-bottom: auto !important;
  }
  .slide-content.layout-media > .figure-row > figure {
    flex: var(--media-aspect, 1) 1 0;
    display: grid !important;
    grid-template-rows: auto auto;
    width: auto;
    height: auto;
    align-self: center;
    min-width: 0;
    min-height: 0;
    margin: 0;
    max-height: 72cqh;
  }
  .slide-content.layout-media > .figure-row > figure > img,
  .slide-content.layout-media > .figure-row > figure > video,
  .slide-content.layout-media > .figure-row > figure > iframe {
    width: 100%;
    height: auto;
    aspect-ratio: var(--media-aspect, 1);
    max-width: 100%;
    max-height: 70cqh;
    min-width: 0;
    min-height: 0;
    object-fit: contain;
  }
  /* ── ADR-0022 GALLERY — 4+ media figures on one slide reflow into a responsive grid ─────────
     The default .figure-row keeps 2-3 images side-by-side (one row). With 4+ images a single row
     would cram them illegibly, so .figure-row-gallery switches to a wrapping grid with a real
     column floor: as many columns as fit at >=220px each, the rest wrapping to further rows. Every
     image stays fully visible (object-fit:contain via .slide-figure img) and click-to-enlarge via
     the existing lightbox. Heights shrink so two rows still fit the slide. */
  .slide-content.layout-media > .figure-row.figure-row-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
    align-content: center;
    aspect-ratio: auto;
    max-height: 78cqh;
  }
  .slide-content.layout-media > .figure-row.figure-row-gallery > figure { max-height: 38cqh; }
  .slide-content.layout-media > .figure-row.figure-row-gallery > figure > img,
  .slide-content.layout-media > .figure-row.figure-row-gallery > figure > video,
  .slide-content.layout-media > .figure-row.figure-row-gallery > figure > iframe { max-height: 36cqh; }
  /* A click target reads as interactive: the gallery image lifts slightly on hover. */
  .slide-content.layout-media > .figure-row .slide-figure img { cursor: zoom-in; }
  /* QR directive ([QR: url | label]) — a build-time QR SVG sized clamp(140px,18vw,280px) with
     a caption beneath. Sits as a block on any layout (renders after other blocks); multiple QRs
     share the .figure-row grammar (side-by-side like images). The matrix is dark-on-white. */
  /* QR overhaul (refinement 6, 2026-06-09). The QR lives in the BOTTOM-LEFT corner of the slide,
     with NO card / no padding ring around the code (the code keeps its own quiet zone for scanning).
     It is a real button — click or focus+Enter expands it FULL-SCREEN (runtime openQrFullscreen).
     The linked URL shows CLEANED in small type beneath it. */
  .slide-qr.slide-qr-corner {
    position: absolute;
    left: var(--slide-pad-x);
    bottom: var(--slide-pad-y);
    z-index: 3;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    border: 0;
    background: none;
    width: auto;
    max-width: 40cqw;
  }
  .slide-qr.slide-qr-corner .qr-code {
    width: clamp(96px, 11cqw, 148px);
    padding: 0;
    margin: 0;
    border: 0;
    background: none;
    cursor: pointer;
    line-height: 0;
    border-radius: 6px;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .slide-qr.slide-qr-corner .qr-code:hover,
  .slide-qr.slide-qr-corner .qr-code:focus-visible {
    transform: scale(1.04);
    box-shadow: 0 6px 20px #17202a2e;
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .slide-qr.slide-qr-corner .qr-code svg { display: block; width: 100%; height: auto; border-radius: 4px; }
  .slide-qr.slide-qr-corner .qr-caption {
    border: 0;
    padding: 0;
    color: var(--muted);
    font-size: 0.78rem;
    letter-spacing: 0.01em;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .slide-qr.slide-qr-corner .qr-caption a { color: inherit; text-decoration: none; }
  .slide-qr.slide-qr-corner .qr-caption a:hover { text-decoration: underline; }
  .slide-qr.slide-qr-corner.qr-too-long { position: absolute; left: var(--slide-pad-x); bottom: var(--slide-pad-y); padding: 0; background: none; border: 0; }
  .slide-qr.slide-qr-corner.qr-too-long a { color: var(--accent); font-weight: 600; font-size: 0.82rem; word-break: break-all; }
  /* Full-screen QR overlay (runtime openQrFullscreen): a dimmed backdrop with the code centred
     large and the URL beneath. Click anywhere / Esc closes it. */
  .qr-fullscreen {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
    background: #17202a; cursor: zoom-out; padding: 4vh 4vw; box-sizing: border-box; overflow: auto;
  }
  .qr-fullscreen .qr-fs-code { width: min(48vh, 65vw); flex: 0 0 auto; background: #fff; padding: clamp(16px, 2.4vw, 32px); border-radius: 14px; box-sizing: border-box; }
  .qr-fullscreen .qr-fs-code :is(svg, img) { display: block; width: 100%; height: auto; }
  .qr-fullscreen .qr-fs-url { color: #fff; font-weight: 400; font-size: clamp(28px, 3vw, 64px); line-height: 1.2; overflow-wrap: anywhere; word-break: normal; max-width: 92vw; text-align: center; }
  .qr-fullscreen .qr-fs-url strong { font-weight: 400; color: inherit; }
  .figure-row.qr-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: clamp(14px, 1.6cqw, 24px); align-items: start; margin: 0; }
  .callouts {
    align-self: stretch;
    display: grid;
    align-content: center;
    gap: 12px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .callouts li {
    border-left: 3px solid var(--accent);
    border-radius: 0;
    background: none;
    box-shadow: none;
    padding: 6px 0 6px 18px;
    font-size: max(20px, 2cqw);
    line-height: 1.22;
    /* Callouts routinely carry long URLs/emails (e.g. CTA "scan or visit …" lines). Unlike
       titles, body tokens MAY break so a long URL never pushes the column past its track and
       overflows the slide horizontally. */
    overflow-wrap: anywhere;
  }
  .callouts li strong { color: var(--blue); }

  /* cta-screenshots layout (ported from KCL): a screenshots strip beside a right column of
     callouts + action buttons. The screenshots are .cta-shot figures; the right column reuses
     the v3 .callouts style. Everything keys off --accent (section accent), not a hard colour. */
  .cta-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.45fr) minmax(260px, .62fr);
    gap: clamp(20px, 2.4cqw, 28px);
    align-items: stretch;
    margin-top: 28px;
    min-height: 0;
  }
  .cta-images {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(0, 1fr);
    gap: 16px;
    align-items: stretch;
    min-width: 0;
  }
  .cta-shot {
    margin: 0;
    display: grid;
    grid-template-rows: 1fr auto;
    min-height: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: white;
    box-shadow: var(--hairline-shadow);
  }
  .cta-shot img {
    /* Never-upscale: see .slide-figure img. Natural size capped to the box, scaled down only. */
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: min(100%, 56cqh);
    object-fit: contain;
    justify-self: center;
    align-self: center;
    background: white;
  }
  .cta-shot figcaption {
    border-top: 1px solid var(--line);
    padding: 8px 11px;
    color: var(--muted);
    font-size: .84rem;
  }
  /* Right column: callouts centred, action buttons pinned below them. */
  .cta-aside {
    display: grid;
    grid-template-rows: 1fr auto;
    gap: 16px;
    min-width: 0;
  }
  .cta-aside .callouts { align-self: center; }
  /* CTA callouts follow the section accent rather than the fixed blue. */
  .cta-callouts li { border-left-color: var(--accent); }
  .cta-callouts li strong { color: var(--accent); }
  .slide-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    gap: 10px;
  }
  /* Refinement 7 (2026-06-09): keep a consistent GUTTER between text and any graphical element
     (action/CTA row, accent bars, rules, diagrams) so they never sit cramped against adjacent text.
     ONE token (--gutter-graphic); the visible offender was the CTA button row butting straight onto
     the statement above it (and onto the statement's accent bar). A button row that FOLLOWS any
     sibling gets the gutter above it. */
  :root { --gutter-graphic: clamp(18px, 2.2cqw, 32px); }
  .slide-content > * + .slide-actions,
  .slide-content .content-p + .slide-actions,
  .slide-content blockquote + .slide-actions,
  .slide-content .statement + .slide-actions { margin-top: var(--gutter-graphic); }
  /* The same gutter where a graphic/diagram follows body text in flow (top-title layouts): the
     diagram must not butt against the paragraph above it. (Layouts that already set their own
     top-margin — flow, timeline — keep theirs; this only adds a floor where none existed.) */
  .slide-content .content-p + .system-map,
  .slide-content .content-p + .mindmap-mm,
  .slide-content .content-p + .conceptmap,
  .slide-content .content-p + .pyramid,
  .slide-content .content-p + .figure-row,
  .slide-content .content-p + figure.slide-figure { margin-top: var(--gutter-graphic); }
  /* ADR-0005 amend: hidden per-branch reveal markers inside a mindmap. Zero-size and never
     display:none (so the reveal machinery counts them as units), they carry no visual weight and
     do not affect the markmap SVG's layout. */
  .slide-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    border: 1px solid var(--accent);
    border-radius: 7px;
    background: var(--accent);
    color: white;
    font-weight: 800;
    padding: 10px 16px;
    text-decoration: none;
  }
  .slide-action:hover { background: color-mix(in srgb, var(--accent) 82%, black); }
  /* Slide round 2 (0.37): four cards are always 2x2, never auto-fit into 3+1. Card text follows the deck
     card type (ADR-0028 5: body-size text, heading 1.15x) and never drops under the type floor; the pair
     and the quartet size it from --fs-body by how much width a card gets. */
  .smartart-grid:is(.count-2, .count-4) { --sa-head: calc(var(--sa-text) * 1.15); }
  .smartart-grid:is(.count-2, .count-4) .smartart-node { padding: 1.6cqw 1.8cqw; }
  .smartart-grid:is(.count-2, .count-4) .smartart-node ol { margin-top: .9cqw; }
  .smartart-grid:is(.count-2, .count-4) .smartart-node h2 { line-height: 1.12; }
  .smartart-grid:is(.count-2, .count-4) .smartart-node li, .smartart-grid:is(.count-2, .count-4) .smartart-node .smartart-text { line-height: 1.25; }
  .smartart-node h2:not(:last-child) { margin-bottom: 0; }

  .smartart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 16px;
    align-items: stretch;
    margin-top: 32px;
  }
  /* ADR-0005 (mockup roles-h card): paper, hairline border, accent TOP bar, ink heading. */
  .smartart-node {
    min-width: 0;
    border: 1px solid var(--hairline);
    border-top: 4px solid var(--accent);
    background: var(--paper);
    border-radius: 0;
    padding: 18px 20px;
    box-shadow: none;
  }
  .smartart-node h2 {
    margin: 0;
    color: var(--ink);
    font-weight: 700;
    font-size: var(--sa-head, max(var(--type-floor), 2cqw)); /* ADR-0033 §1: never below the type floor */
    line-height: 1.1;
    letter-spacing: -0.01em;
  }
  .smartart-node ol {
    list-style: none;
    margin: 12px 0 0;
    padding: 0;
    display: grid;
    gap: 8px;
  }
  .smartart-node li {
    border-top: 1px solid var(--hairline);
    padding: 10px 0 0;
    color: var(--ink);
    font-size: var(--sa-text, max(var(--type-floor), 1.4cqw)); /* ADR-0033 §1: never below the type floor */
    line-height: 1.35;
  }
  /* A nested node sitting inside a step is just text — it must not draw a second card. */
  .smartart-node li > .smartart-node {
    border: 0;
    box-shadow: none;
    padding: 0;
    background: transparent;
    border-radius: 0;
  }
  .smartart-node .smartart-text {
    margin: 0;
    color: var(--ink);
    font-size: var(--sa-text, max(var(--type-floor), 1.4cqw)); /* ADR-0033 §1: never below the type floor */
    line-height: 1.35;
    font-weight: 560;
  }
  /* One or two nodes should not stretch edge-to-edge — keep them readable and centred. */
  .smartart-grid.count-1 { grid-template-columns: minmax(0, 560px); justify-content: center; }
  .smartart-grid.count-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; gap: 2cqw; margin-top: 0; --sa-text: max(var(--type-floor), calc(var(--fs-body) * .85)); }

  /* PYRAMID ({pyramid}). Stacked tiers, narrow APEX on top, widest BASE at the bottom (first list
     item = apex, last = base). Tier width grows linearly toward the base; bands are centred and
     tinted from a light accent at the apex to the solid accent at the base. A tier's nested
     children render as a small caption under its label. */
  /* The pyramid FILLS the content width so the per-tier percentage widths compute off a real box
     (it used to shrink-wrap to ~nothing, leaving tiny cramped tiers). Tiers keep the apex-narrow /
     base-wide silhouette via their inline width:%, but a `min-width:fit-content` floor guarantees
     each box is at least as wide as its own text + padding — so a label NEVER clips, even at the
     narrow apex (a short-% apex simply grows to fit its word). Larger min-height + label type make
     the whole diagram legible. */
  .pyramid {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    margin: 30px auto 0; width: min(960px, 100%);
  }
  /* ADR-0005 pyramid (mockup .pyr): SOLID section accent at stepped opacities — apex strongest,
     base quietest — sharp corners, no borders, white labels throughout. One hue, one grammar. */
  .pyr-tier {
    box-sizing: border-box;
    min-width: fit-content;
    min-height: clamp(64px, 9cqh, 100px);
    padding: 14px 32px; border-radius: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: var(--accent);
    border: 0;
    color: var(--paper);
  }
  .pyr-tier:nth-child(2) { opacity: 0.82; }
  .pyr-tier:nth-child(3) { opacity: 0.64; }
  .pyr-tier:nth-child(4) { opacity: 0.46; }
  .pyr-tier:nth-child(n+5) { opacity: 0.34; }
  .pyr-label { font-weight: 600; font-size: max(22px, 2.4cqw); line-height: 1.12; white-space: nowrap; }
  .pyr-cap { margin-top: 5px; font-size: max(14px, 1.2cqw); opacity: .85; line-height: 1.2; white-space: normal; }

  /* ORGCHART ({orgchart}). A top node and its child tree (the nested list = hierarchy). Boxes are
     centred; CSS rails connect a parent to the row of its children. Reads top-down. */
  .orgchart { margin: 34px auto 0; text-align: center; overflow-x: auto; }
  .orgchart .org-node { display: inline-flex; flex-direction: column; align-items: center; position: relative; vertical-align: top; }
  .orgchart .org-box {
    background: var(--paper); border: 1px solid var(--hairline); border-top: 4px solid var(--accent);
    border-radius: 0; padding: 10px 16px; font-weight: 700; font-size: max(16px, 1.6cqw);
    box-shadow: none; max-width: 22ch;
  }
  .orgchart .org-children { display: flex; justify-content: center; gap: 18px; margin-top: 26px; position: relative; }
  /* vertical stem from a parent down to its children's connector bar */
  .orgchart .org-children::before {
    content: ""; position: absolute; top: -26px; left: 50%; width: 2px; height: 14px; background: var(--line);
  }
  /* each child's own stem up to the bar */
  .orgchart .org-children > .org-node::before {
    content: ""; position: absolute; top: -12px; left: 50%; width: 2px; height: 12px; background: var(--line);
  }
  /* horizontal connector bar spanning the children */
  .orgchart .org-children > .org-node:not(:only-child)::after {
    content: ""; position: absolute; top: -12px; height: 2px; background: var(--line);
  }
  .orgchart .org-children > .org-node:first-child:not(:only-child)::after { left: 50%; right: -9px; }
  .orgchart .org-children > .org-node:last-child:not(:only-child)::after { left: -9px; right: 50%; }
  .orgchart .org-children > .org-node:not(:first-child):not(:last-child):not(:only-child)::after { left: -9px; right: -9px; }
  .orgchart .org-multi { gap: 28px; display: flex; }

  /* MINDMAP ({mindmap}) — ADR-0005: rendered by vendored markmap (auto radial layout from the
     markdown sub-tree), never hand-positioned. The build emits ONLY a `.mindmap-mm` host carrying
     the outline as markdown in `data-mm-outline`; the runtime `initMarkmaps` lazily builds an
     `<svg class="markmap">` into it on the slide's FIRST activation (guarded by data-mm-done, and
     never while display:none — a zero-size box would spam NaN transforms). Branch colours come from
     the section palette (passed to deriveOptions); node text uses the deck --sans stack via
     `--markmap-font` (this rule out-specifies markmap's own injected `.markmap` defaults). */
  /* Fill the available cell height rather than forcing a large min-height: a big min-height makes the
     slide overflow the stage, which the runtime autofit then shrinks (zoom) — squashing the map to a
     sliver. height:100% + align-self:stretch lets the map take the region it is given; the modest
     min-height only guards degenerate (unsized) parents. */
  .mindmap-mm { position: relative; width: 100%; height: 100%; align-self: stretch; min-height: 68cqh; margin: 16px auto 0; max-width: none; }
  .mindmap-mm svg { font-size: max(22px, 1.7cqw); }
  .mindmap-mm > svg.markmap {
    /* the svg fills its host: the host's height comes from its flex parent (a percentage of an indefinite height),
       so height:100% fell back to the svg default of 150px and markmap fitted the map into that strip */
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    --markmap-font: 500 16px/1.34 var(--sans);
    --markmap-text-color: var(--ink);
    --markmap-a-color: var(--accent);
    --markmap-a-hover-color: var(--accent);
  }
  .mindmap-mm > svg.markmap .markmap-foreign,
  .mindmap-mm > svg.markmap foreignObject > div { font-family: var(--sans); }
  .mindmap-mm > svg.markmap .markmap-foreign em {
    /* ADR-0005: no italics. */
    font-style: normal;
  }

  /* Fenced Mermaid and SVG objects own the full structural stage band (ADR-0005/0019). */
  .mermaid-mm,
  .slide-svg {
    position: relative; width: 100%; height: 100%; min-height: 68cqh; max-width: none;
    align-self: stretch; margin: 16px auto 0;
  }
  .mermaid-mm { display: grid; place-items: center; }

  /* ===== PPT-replication batch (2026-06-11) — shapes ported from PPT2HandoutSkill so old
     PowerPoint slides replicate 1:1: {stats} {process} {steps} {iconrow} {image-quote}
     {image-grid}. All static build-time HTML+CSS (no runtime drawing, no share-parity hooks). */
  .slide-svg { display: flex; align-items: center; justify-content: center; }

  /* STATS ({stats}). A big-number row: huge accent value, label beneath, optional small caption.
     Cells are panel cards with the accent top rule (same device as orgchart boxes). */
  .mermaid-mm > svg,
  .slide-svg > svg { display: block; width: 100%; max-width: 100%; max-height: 68cqh; height: auto; }
  .stats-row {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: stretch;
    gap: 18px; margin: 40px auto 0; width: min(1150px, 100%);
  }
  .svg-error-source,
  .mermaid-mm > pre {
    width: 100%; max-height: 52cqh; overflow: auto; margin: 0; padding: 18px;
    border: 1px solid #e7c4cd; border-radius: 8px; background: var(--paper);
    color: var(--ink); font: 500 max(18px, 1.35cqw)/1.55 var(--mono); white-space: pre-wrap;
  }
  .stats-row .stat {
    flex: 1 1 0; min-width: 168px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 8px; padding: 26px 18px;
    background: var(--tint); border: 1px solid var(--line); border-top: 4px solid var(--accent);
    border-radius: 10px;
  }
  .stat-value {
    font-weight: 800; font-size: max(42px, 5cqw); line-height: 1;
    color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  }
  .svg-error,
  .mmd-error {
    width: 100%; margin-top: 10px; padding: 10px 14px; border: 1px solid #e7c4cd;
    border-radius: 6px; background: #fbe9e2; color: #9f1239; font: 600 max(18px, 1.25cqw)/1.45 var(--sans);
  }
  .stat-label { font-weight: 640; font-size: max(15px, 1.5cqw); line-height: 1.25; color: var(--ink); }
  .stat-cap { font-size: max(13px, 1.1cqw); color: var(--muted); line-height: 1.3; }

  /* PROCESS ({process} / {agenda}). Numbered accent discs on a connector line, label below,
     optional `· time` tail as a small accent sub-label, nested children as quiet detail lines.
     The connector is drawn per-step (::before spans the disc row; trimmed at the ends). */
  .process-strip {
    display: flex; align-items: flex-start; justify-content: center;
    margin: 44px auto 0; width: min(92.1875cqw, 100%); /* ADR-0030: 1180px of the 1280px canvas */
  }
  .proc-step {
    flex: 1 1 0; min-width: 0; position: relative;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 0 10px;
  }
  .proc-step::before {
    content: ""; position: absolute; top: 26px; left: 0; right: 0; height: 2px;
    background: color-mix(in srgb, var(--accent) 45%, var(--line));
  }
  .proc-step:first-child::before { left: 50%; }
  .proc-step:last-child::before { right: 50%; }
  .proc-step:only-child::before { display: none; }
  .proc-num {
    position: relative; z-index: 1; width: 52px; height: 52px; border-radius: 50%;
    display: grid; place-items: center; background: var(--accent); color: #fff;
    font-weight: 800; font-size: max(19px, 1.9cqw);
    box-shadow: 0 8px 18px #17202a1c;
  }
  .proc-label { margin-top: 14px; font-weight: 760; font-size: max(16px, 1.7cqw); line-height: 1.15; }
  .proc-time { margin-top: 4px; font-weight: 700; font-size: max(13px, 1.2cqw); color: var(--accent); letter-spacing: .02em; }
  .proc-details { list-style: none; margin: 8px 0 0; padding: 0; }
  .proc-details li { font-size: max(13px, 1.15cqw); color: var(--muted); line-height: 1.3; }
  .proc-details li::before { content: "– "; color: var(--accent); }

  /* STEPS ({steps} / {stairs}). Ascending stairs: bottom-aligned columns rising left-to-right
     (heights computed at build time). The tint ramp mirrors the pyramid's nth-last-child scheme
     so the highest step is the accent-filled one. */
  .steps-diagram {
    display: flex; align-items: flex-end; justify-content: center; gap: 12px;
    margin: 34px auto 0; width: min(1080px, 100%); height: min(48cqh, 440px);
  }
  .step-col {
    flex: 1 1 0; min-width: 0; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 6px; padding: 16px 12px; text-align: center;
    border-radius: 10px 10px 0 0;
    background: color-mix(in srgb, var(--accent) 16%, var(--tint));
    border: 1px solid color-mix(in srgb, var(--accent) 32%, var(--line));
    color: var(--ink);
  }
  .step-col:last-child { background: var(--accent); color: #fff; border-color: var(--accent); }
  .step-col:nth-last-child(2):not(:first-child) { background: color-mix(in srgb, var(--accent) 62%, var(--tint)); color: #fff; }
  .step-col:nth-last-child(3):not(:first-child) { background: color-mix(in srgb, var(--accent) 40%, var(--tint)); }
  .step-label { font-weight: 760; font-size: max(17px, 1.9cqw); line-height: 1.12; }
  .step-cap { font-size: max(13px, 1.15cqw); opacity: .85; line-height: 1.25; }

  /* ICON ROW ({iconrow}). The landscape sibling of {iconlist}/{annotated}: a horizontal row of
     big accent icons, a bold label under each, quiet description lines beneath. Icons resolve
     through the same semantic vocabulary as feature-lists ({icon=…} overrides + deck icons:). */
  .icon-row {
    /* ADR-0028 §5: a grid whose columns share one heading row and one items row (each .ir-item is a
       two-row subgrid, skin/icon-row.css), so items start at the same height when a heading wraps. */
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); grid-template-rows: auto auto;
    align-items: start; gap: 0 22px;
    margin: 46px auto 0; width: min(92.1875cqw, 100%); /* ADR-0030: 1180px of the 1280px canvas */
  }
  .ir-item {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px;
    padding: 18px 12px;
  }
  .ir-icon { width: clamp(52px, 5.4cqw, 78px); height: clamp(52px, 5.4cqw, 78px); color: var(--accent); display: grid; place-items: center; }
  .ir-icon svg, .ir-icon img { width: 100%; height: 100%; }
  /* Numbered-disc fallback (icons unresolvable — same icon-or-number contract as feature-lists). */
  .ir-icon.ir-num {
    border-radius: 50%; background: var(--accent); color: #fff;
    font-weight: 800; font-size: max(20px, 2cqw);
  }
  .ir-label { font-weight: 760; font-size: max(17px, 1.8cqw); line-height: 1.15; }
  .ir-desc { list-style: none; margin: 0; padding: 0; }
  .ir-desc li { font-size: max(14px, 1.25cqw); color: var(--muted); line-height: 1.35; }
  .ir-desc li + li { margin-top: 4px; }

  /* IMAGE QUOTE ({image-quote}). Image (≈40%) beside the quotation (≈60%), the attribution as a
     full-width accent bar along the bottom — the classic PPT person-photo/tweet + quote slide.
     Title is nav-only by default (mirrors {quote}); the global blockquote::before supplies the
     decorative mark. A plain {quote} carrying a figure keeps the quiet-cite pair treatment. */
  .slide-content.layout-image-quote {
    justify-content: center;
    align-content: center;
    min-height: min(820px, calc(86cqh - var(--quote-chrome-band)));
  }
  .slide-content.layout-image-quote > .slide-head-quiet { display: contents; }
  .slide:has(> .slide-content.layout-image-quote) {
    --quote-chrome-band: 59px;
    padding-bottom: calc(var(--slide-pad-y) + var(--quote-chrome-band));
  }
  .image-quote .iq-figure { grid-column: 1; grid-row: 1; margin: 0; display: grid; justify-items: center; row-gap: 8px; }
  .image-quote .iq-figure img {
    max-width: 100%; max-height: 56cqh; width: auto; height: auto;
    border-radius: 0; border: 1px solid var(--hairline); box-shadow: none;
  }
  .image-quote .iq-figure figcaption { font-size: max(12px, 1cqw); color: var(--muted); text-align: center; }
