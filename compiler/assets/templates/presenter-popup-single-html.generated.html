  /* ADR-0005 image-quote (mockup .iq): portrait beside an upright sans quote led by an oversized
     accent mark; boxed strong emphasis; attribution as a short accent rule + name (NOT a filled
     bar). line-height 1.28 is the readability floor for the boxed host. */
  .image-quote blockquote {
    grid-column: 2; grid-row: 1; margin: 0;
    /* em-based clearance: the mark (2.4em) always fits inside the reserved padding. */
    padding: 4px 0 4px 1.35em;
    justify-self: center; width: 100%; max-width: none;
    font-family: var(--sans); font-weight: 400; font-size: var(--quote-fitted-size); line-height: 1.28;
  }
  .image-quote blockquote::before { font-size: 2.4em; opacity: 0.9; top: -0.05em; left: 0; }
  .image-quote blockquote p { margin: 0 0 .3em; }
  .image-quote blockquote p:last-of-type { margin-bottom: 0; }
  .image-quote blockquote strong {
    background: var(--accent); color: var(--paper);
    padding: 0.02em 0.18em; border-radius: 0.1em;
    box-decoration-break: clone; -webkit-box-decoration-break: clone;
  }
  .image-quote .iq-cite {
    grid-column: 1 / -1; grid-row: 2; margin: 0;
    display: flex; align-items: center; gap: 0.8em;
    color: var(--ink);
    font-size: max(var(--type-floor), calc(var(--quote-fitted-size) * .58)); font-weight: 640; letter-spacing: .015em;
  }
  .image-quote .iq-cite::before {
    content: ""; flex: 0 0 auto;
    width: 3em; height: 2px; background: var(--accent);
  }
  @container (max-width: 950px) {
    .image-quote { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
    .image-quote .iq-figure { grid-column: 1; grid-row: 1; }
    .image-quote blockquote { grid-column: 1; grid-row: 2; }
    .image-quote .iq-cite { grid-column: 1; grid-row: 3; }
  }

  /* IMAGE GRID ({image-grid}). A STATIC annotated grid — image on top, note card (title + text)
     beneath — ALL cells visible at once (tool galleries, app showcases; the stepped one-at-a-time
     treatment stays with {cards}). Balanced flex like system-map satellites; --ig-cols set inline
     from the balanced column count (or an explicit {blocks:RxC}). Images CONTAIN (never crop,
     never upscale) on a quiet panel. */
  .image-grid {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 18px; margin: 28px auto 0; width: min(1200px, 100%);
  }
  .image-grid .ig-cell {
    flex: 0 1 calc((100% - (var(--ig-cols, 3) - 1) * 18px) / var(--ig-cols, 3));
    min-width: 0; margin: 0;
    display: flex; flex-direction: column;
    background: var(--tint); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden;
  }
  /* Absolute-inset containment: a viewBox-only SVG has no intrinsic px size, so percentage
     max-height against the auto grid row resolved to nothing and the image overflowed the cell.
     Pinning the img to the padded box guarantees containment for ANY media (object-fit keeps
     the aspect; small rasters are not upscaled past the box). */
  .image-grid .ig-media {
    position: relative;
    height: clamp(120px, 20cqh, 210px);
    background: color-mix(in srgb, var(--ink) 4%, var(--tint));
  }
  .image-grid .ig-media img {
    position: absolute; inset: 10px;
    width: calc(100% - 20px); height: calc(100% - 20px);
    object-fit: contain;
  }
  .image-grid .ig-note { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
  .image-grid .ig-note h4 {
    margin: 0; font-size: max(14px, 1.4cqw); font-weight: 740; color: var(--accent);
    letter-spacing: .01em;
  }
  .image-grid .ig-note .content-p { margin: 0; font-size: max(13px, 1.15cqw); color: var(--muted); line-height: 1.35; }
  /* Featurized lists inside a cell render QUIET (plain small lines, no panel-card chrome). */
  .image-grid .ig-note .feature-list { display: block; margin: 0; padding: 0; }
  .image-grid .ig-note .feature-list > li {
    display: block; background: none; border: 0; border-radius: 0; box-shadow: none;
    padding: 0; margin: 0; font-size: max(13px, 1.15cqw); color: var(--muted); line-height: 1.35;
  }
  .image-grid .ig-note .feature-list > li + li { margin-top: 4px; }
  .image-grid .ig-note .feature-list > li::before { content: "– "; color: var(--accent); }
  .image-grid .ig-note .feature-list .fl-icon, .image-grid .ig-note .feature-list .fl-svg { display: none; }
  /* ===== Layout batch 2 (2026-06-12) — charts, cycle, equation, contrast arrows,
     countdown element. All geometry computed at build time; CSS only paints. ===== */

  /* CHART — bar ({chart}/{barchart}). Bottom-aligned columns (the {steps} grammar): the plot
     area is a fixed-height flex row; each column's bar height % was computed at build time.
     Value above the bar, label beneath the plot. */
  .chart-cols {
    display: flex; align-items: stretch; justify-content: center; gap: clamp(14px, 2cqw, 30px);
    margin: 34px auto 0; width: min(1080px, 100%); height: min(50cqh, 460px);
  }
  .chart-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; text-align: center; }
  .chart-col-plot { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; min-height: 0; }
  .chart-bar {
    width: min(78%, 150px); border-radius: 8px 8px 0 0;
    background: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 80%, #000);
    box-sizing: border-box;
  }
  .chart-val { font-weight: 800; font-size: max(18px, 2cqw); color: var(--accent); line-height: 1.1; }
  .chart-label { margin-top: 10px; font-weight: 640; font-size: max(14px, 1.3cqw); color: var(--ink); line-height: 1.2; border-top: 2px solid var(--line); padding-top: 8px; }

  /* CHART — pie ({piechart}). Build-time SVG arcs + a legend column (label · value · %).
     Slice colours are the multicolour diagram palette. */
  .chart-pie {
    display: flex; align-items: center; justify-content: center; gap: clamp(26px, 4cqw, 70px);
    margin: 30px auto 0; width: min(1080px, 100%);
  }
  .chart-pie svg { width: min(46cqh, 420px); height: min(46cqh, 420px); flex: 0 0 auto; }
  .chart-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .chart-legend li { display: flex; align-items: baseline; gap: 12px; font-size: max(15px, 1.45cqw); }
  .chart-swatch { width: 18px; height: 18px; border-radius: 5px; flex: 0 0 auto; align-self: center; }
  .chart-leg-label { font-weight: 700; color: var(--ink); }
  .chart-leg-val { color: var(--muted); white-space: nowrap; }

  /* CHART — line ({linechart}/{curve}). Build-time SVG polyline + dots; values above dots,
     x labels under the baseline rule. Stroke/fill key off the section accent. */
  .chart-line { margin: 26px auto 0; width: min(1120px, 100%); }
  .chart-line svg { width: 100%; height: auto; }
  .chart-poly { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
  .chart-dot { fill: var(--accent); stroke: var(--tint); stroke-width: 3; }
  .chart-baseline { stroke: var(--line); stroke-width: 2; }
  .chart-val-svg { font: 800 26px/1 var(--sans, system-ui); fill: var(--accent); }
  .chart-label-svg { font: 640 22px/1 var(--sans, system-ui); fill: var(--ink); }

  /* SIGMOID ({sigmoid} / {curve=sigmoid}) — a conceptual S-curve; items sit ON the curve at a
     named stage or percent. Build-time SVG, one composition. */
  .sigmoid-curve { margin: 22px auto 0; width: min(1120px, 100%); }
  .sigmoid-curve svg { width: 100%; height: auto; overflow: visible; }
  .sigmoid-path { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; }
  .sigmoid-axis { stroke: var(--line); stroke-width: 2; }
  .sigmoid-stem { stroke: var(--line); stroke-width: 2; stroke-dasharray: 3 5; }
  .sigmoid-dot { fill: var(--accent); stroke: var(--tint); stroke-width: 4; }
  .sigmoid-label { font: 700 24px/1.1 var(--sans, system-ui); fill: var(--ink); }

  /* TABLE ({table}) — reuses .slide-table; only the numeric right-align class is new. */
  .slide-table th.num, .slide-table td.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* TIMETABLE ({timetable}) — a day schedule: a fixed-width time column + the session. Break
     rows are tinted and italicised so the eye finds the pauses. Rows are steppable units. */
  .timetable { width: min(960px, 100%); margin: 24px auto 0; border-collapse: collapse; font-size: max(18px, 2cqw); }
  .timetable td { padding: 12px 16px; border-bottom: 1px solid var(--line, #e4ded2); vertical-align: baseline; }
  .timetable tr:last-child td { border-bottom: 0; }
  .timetable .tt-time { width: 7.5em; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); }
  .timetable .tt-event { color: var(--ink); }
  .timetable tr.timetable-break td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .timetable tr.timetable-break .tt-event { font-style: italic; color: var(--muted, #6b7c8a); }

  /* CYCLE ({cycle}). Node cards on an ellipse (build-time % coordinates, centred on their
     point) over an SVG underlay of accent arc arrows joining consecutive stops into a loop.
     Nodes are the steppable units; the arrows are decorative chrome. */
  .cycle-diagram { position: relative; margin: 26px auto 0; width: min(1080px, 100%); aspect-ratio: 1000 / 620; }
  .cycle-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cycle-arc-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .cycle-arc { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; }
  .cycle-svg marker path, .cycle-arc-svg marker path { fill: var(--accent); }
  .cycle-node {
    position: absolute; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center;
    background: var(--tint); border: 2px solid var(--accent); border-radius: 12px;
    padding: clamp(10px, 1.2cqw, 18px) clamp(14px, 1.6cqw, 24px);
    max-width: clamp(150px, 19cqw, 250px); box-shadow: 0 6px 18px #17202a14;
  }
  .cycle-stage { font-weight: 760; font-size: max(15px, 1.5cqw); color: var(--ink); line-height: 1.15; }
  .cycle-cap { font-size: max(12px, 1.05cqw); color: var(--muted); line-height: 1.25; }

  /* EQUATION ({equation}). Operand discs + accent + glyphs → solid-accent result disc.
     One composition; reads as a single statement. */
  .equation-row {
    display: flex; align-items: center; justify-content: center; gap: clamp(12px, 1.6cqw, 26px);
    margin: 48px auto 0; width: min(92.1875cqw, 100%); /* ADR-0030: 1180px of the 1280px canvas */ flex-wrap: wrap;
  }
  /* ADR-0005 equation (mockup .formula): OUTLINE PILLS — ink-bordered capsules on paper,
     large type; operators in the accent; the RESULT pill fills with the section accent. */
  .eq-term {
    display: grid; place-items: center; text-align: center;
    min-width: clamp(120px, 13cqw, 220px); width: auto; height: auto; border-radius: 999px;
    background: var(--paper);
    border: 2.5px solid var(--ink);
    font-weight: 600; font-size: max(26px, 3cqw); color: var(--ink);
    padding: 0.35em 0.85em; box-sizing: border-box; line-height: 1.2;
  }
  .eq-op { font-weight: 400; font-size: max(34px, 3.8cqw); color: var(--accent); }
  .eq-result { background: var(--accent); border-color: var(--accent); color: var(--paper); }

  /* CONTRAST — opposing arrows (the batch-2 DEFAULT pair device; {contrast=cards} keeps the
     legacy serif-/ pair-cards). Each pair is one row: left term in a right-pointing ink
     arrow, right term in a left-pointing accent arrow, points meeting at centre with a small
     gap. CSS clip-path polygons — no images. */
  .contrast-arrows { display: flex; flex-direction: column; gap: clamp(12px, 1.6cqh, 22px); }
  /* The legacy pair-CARD rules (vertical rows template, 200px panel, ink/accent term colours,
     16ch shrink) still match `.contrast-pair` — every one is re-asserted here for the arrows. */
  .contrast-arrows .contrast-pair {
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto; align-content: stretch;
    justify-items: stretch; gap: 10px; min-height: 0;
    background: none; border: 0; border-radius: 0; padding: 0; box-shadow: none;
  }
  /* ADR-0005 INTERIM (the arrow chevrons were never designed — flagged for a design round):
     each pair is a LEDGER row — left term quiet and right-aligned, right term strong and
     left-aligned, a hairline between rows, the divider a thin accent tick. */
  .contrast-arrows .contrast-pair { grid-template-columns: 1fr auto 1fr; align-items: center; gap: clamp(18px, 2cqw, 36px); padding: clamp(10px, 1.4cqh, 18px) 0; border-top: 1px solid var(--hairline); }
  .contrast-arrows .contrast-pair:first-child { border-top: 0; }
  .contrast-arrows .contrast-pair span.ct-arrow,
  .contrast-arrows .contrast-pair span.ct-arrow:first-of-type,
  .contrast-arrows .contrast-pair span.ct-arrow:last-of-type {
    max-width: none; width: 100%;
    font-size: max(20px, 2.1cqw); letter-spacing: -0.01em; line-height: 1.2;
  }
  .ct-arrow { display: block; box-sizing: border-box; }
  .ct-left { grid-column: 1; grid-row: 1; color: var(--muted); font-weight: 500; text-align: right; background: none; clip-path: none; }
  .ct-right { grid-column: 3; grid-row: 1; color: var(--ink); font-weight: 600; text-align: left; background: none; clip-path: none; }
  /* Divider tick between the terms. */
  .contrast-arrows .contrast-pair::before { content: none; }
  .contrast-arrows .contrast-pair > .ct-left + .ct-right { position: relative; }
  .contrast-arrows .contrast-pair {
    position: relative;
  }
  .contrast-arrows .contrast-pair::after {
    content: ""; grid-column: 2; grid-row: 1;
    width: 2.5px; height: 1.6em; background: var(--accent);
    justify-self: center; align-self: center;
  }

  /* COUNTDOWN element (chrome, not content — composable with any layout). Hidden until the
     runtime arms it on slide activation; share exports never arm it, so handouts/print show
     nothing. digits: quiet mm:ss bottom-RIGHT (the corner QR owns bottom-left); final 10s
     shifts to the crimson secondary; a gentle flash at 0:00 — never auto-advances. bar: a
     thin accent bar along the slide bottom shrinking 100%→0 over the duration. */
  .countdown { display: none; }
  .countdown.countdown-armed { display: block; }
  .countdown-digits {
    position: absolute; right: clamp(18px, 2.4cqw, 40px); bottom: clamp(14px, 2cqh, 30px); z-index: 5;
    font: 760 clamp(22px, 2.4cqw, 38px)/1 var(--sans, system-ui);
    font-variant-numeric: tabular-nums; color: var(--accent); opacity: .85;
  }
  .countdown-digits.countdown-final { color: var(--accent-2, #9f1239); opacity: 1; }
  .countdown-digits.countdown-done { animation: countdown-flash 1.1s ease-in-out 3; }
  @keyframes countdown-flash { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .countdown-bar {
    position: absolute; left: 0; bottom: 0; z-index: 5; height: 7px; width: 100%;
    background: var(--accent); transform-origin: left center; opacity: .9;
  }
  .countdown-bar.countdown-final { background: var(--accent-2, #9f1239); }
  .countdown-bar.countdown-done { animation: countdown-flash 1.1s ease-in-out 3; }

  /* Presenter timer family. The single top clock (.tw-clock-bar) lives further down; here sit its
     cousins — the section chip beside the count, the audience float (cross-slide cousin of the
     per-slide countdown, runtime-created so share exports never have it), and the reminder banner
     that flashes in the presenter window until clicked. */
  .section-timer-chip {
    font-variant-numeric: tabular-nums; font-weight: 760; font-size: 12px;
    color: #fff; background: var(--accent, #0b3a6b); border-radius: 999px; padding: 3px 10px;
  }
  .section-timer-chip.talk-crit { background: var(--accent-2, #9f1239); }
  .section-timer-float {
    position: fixed; right: clamp(18px, 2.4vw, 40px); bottom: clamp(14px, 2vh, 30px); z-index: 6;
    font: 760 clamp(22px, 2.4vw, 38px)/1 var(--sans, system-ui);
    font-variant-numeric: tabular-nums; color: var(--accent); opacity: .85;
  }
  .section-timer-float.countdown-final { color: var(--accent-2, #9f1239); opacity: 1; }
  .section-timer-float.countdown-done { animation: countdown-flash 1.1s ease-in-out 3; }
  .presenter-reminder {
    position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 120;
    display: flex; gap: 14px; align-items: baseline; cursor: pointer;
    background: var(--accent-2, #9f1239); color: #fff; border-radius: 12px;
    padding: 14px 22px; box-shadow: 0 16px 40px #0006;
    font: 800 clamp(16px, 1.6vw, 22px)/1.2 var(--sans, system-ui);
    animation: reminder-flash 1s ease-in-out 6;
  }
  .presenter-reminder small { font: 600 11px/1 var(--sans, system-ui); opacity: .8; }
  @keyframes reminder-flash { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }


  @container (max-width: 950px) {
    .stats-row, .icon-row, .process-strip { flex-wrap: wrap; }
    .stats-row .stat, .ir-item, .proc-step { flex: 1 1 44%; }
    .proc-step::before { display: none; }
    .steps-diagram { height: auto; align-items: stretch; flex-direction: column; }
    .step-col { height: auto !important; border-radius: 10px; }
    .image-grid .ig-cell { flex-basis: 100%; }
    .chart-cols { height: auto; flex-wrap: wrap; }
    .chart-col { flex: 1 1 44%; }
    .chart-col-plot { min-height: 130px; }
    .chart-pie { flex-direction: column; }
    .cycle-diagram { aspect-ratio: auto; }
    .cycle-svg { display: none; }
    .cycle-arc-svg { display: none; }
    .cycle-node { position: static; transform: none; margin: 8px auto; max-width: 90%; }
    .contrast-arrows .contrast-pair { grid-template-columns: 1fr; }
    .ct-left, .ct-right { clip-path: none; border-radius: 8px; }
  }

  /* FLOW / DIAGRAM layout ({layout=flow}). A connected sequence of node cards joined by
     accent connectors (CSS-drawn chevron arrows — no unicode glyphs). Calibrated against the
     agent-architecture two-box + agentic-loop diagrams: warm card nodes, ink border, accent key
     phrase, a string-thin accent connector with a solid arrowhead. Typography is clamp()-scaled
     so the whole diagram shrinks with the slide (autofit) and the connectors reflow. */
  .flow {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
    justify-content: center;
    gap: 0;
    margin-top: 32px;
    font-size: max(15px, 1.5cqw);
  }
  .flow-node {
    flex: 0 1 auto;
    min-width: 0;
    max-width: 360px;
    align-self: center;
    background: var(--tint);
    border: 1.5px solid var(--ink);
    border-left: 5px solid var(--accent);
    border-radius: 8px;
    padding: 14px 18px;
    box-shadow: 0 10px 24px #17202a12;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .flow-label {
    color: var(--ink);
    font-weight: 600;
    line-height: 1.22;
  }
  .flow-label strong { color: var(--accent); }
  .flow-detail {
    display: flex;
    flex-direction: column;
    gap: 3px;
    border-top: 1px solid var(--line);
    padding-top: 7px;
  }
  .flow-detail-line {
    color: var(--muted);
    font-size: 0.82em;
    line-height: 1.3;
  }
  /* Connector — a thin accent rule with a chevron arrowhead drawn from borders. The base rule
     orients horizontally; the vertical/loop variants rotate it. aria-hidden, never selectable. */
  .flow-connector {
    flex: 0 0 auto;
    align-self: center;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    padding: 0 6px;
  }
  .flow-arrow {
    position: relative;
    display: block;
    width: clamp(30px, 4cqw, 64px);
    height: 3.5px;
    border-radius: 2px;
    background: currentColor;
  }
  .flow-arrow::after {
    content: "";
    position: absolute;
    right: -1px;
    top: 50%;
    width: 13px;
    height: 13px;
    border-top: 3.5px solid currentColor;
    border-right: 3.5px solid currentColor;
    border-radius: 1px;
    transform: translateY(-50%) rotate(45deg);
    transform-origin: center;
  }
  /* Horizontal (default) — nodes left→right, wrapping; connectors already horizontal. */
  .flow-horizontal { flex-direction: row; }
  /* SNAKE (2026-06-12) — >4 steps run boustrophedon: balanced rows, alternating direction,
     an obvious elbow turn dropping into each next row. Rows breathe: the turn's height IS the
     row gap. DOM stays logical (row-reverse is visual only), arrows mirror in RTL rows. */
  .flow-snake { flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 0; }
  .flow-snake-row {
    display: flex; flex-direction: row; flex-wrap: nowrap;
    align-items: stretch; justify-content: center; gap: 0;
  }
  .flow-snake-row .flow-node { flex: 1 1 0; max-width: 330px; align-self: stretch; }
  .flow-row-rtl { flex-direction: row-reverse; }
  .flow-row-rtl .flow-arrow { transform: scaleX(-1); }
  .flow-turn {
    align-self: flex-end;
    width: clamp(44px, 5cqw, 86px);
    height: clamp(42px, 7cqh, 80px);
    border-top: 3.5px solid var(--accent);
    border-right: 3.5px solid var(--accent);
    border-radius: 0 16px 0 0;
    margin: 8px clamp(20px, 3cqw, 56px) 8px 0;
    position: relative;
  }
  .flow-turn::after {
    content: "";
    position: absolute;
    right: -8.5px;
    bottom: -3px;
    width: 13px;
    height: 13px;
    border-right: 3.5px solid var(--accent);
    border-bottom: 3.5px solid var(--accent);
    border-radius: 1px;
    transform: rotate(45deg);
  }
  .flow-turn-left {
    align-self: flex-start;
    border-right: 0;
    border-left: 3.5px solid var(--accent);
    border-radius: 16px 0 0 0;
    margin: 8px 0 8px clamp(20px, 3cqw, 56px);
  }
  .flow-turn-left::after {
    right: auto;
    left: -8.5px;
    border-right: 0;
    border-left: 3.5px solid var(--accent);
    transform: rotate(-45deg);
  }
  /* Vertical — stack nodes, connectors point downward. */
  .flow-vertical { flex-direction: column; align-items: center; }
  .flow-vertical .flow-node { width: min(560px, 100%); }
  .flow-vertical .flow-arrow { transform: rotate(90deg); }
  /* Loop — a closed cycle. Nodes stay on ONE row (nowrap) and STRETCH to equal height so they
     align on a common baseline (the ragged 3/1 wrap was the old bug). Below the row a real
     loop-back connector closes last→first: it descends from the right, runs left under the whole
     row, and rises into the first node with an arrowhead — drawn from borders, no SVG. The return
     only appears at the FULL state when stepping (see mode rules below); otherwise always shown. */
  /* The loop is a column: a single even node row, then the loop-back connector beneath it. */
  .flow-loop { flex-direction: column; flex-wrap: nowrap; align-items: stretch; }
  .flow-cycle-row {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    align-items: stretch;
    justify-content: center;
    gap: 0;
  }
  /* Each node shares the row evenly and shrinks to fit (no ragged wrap). Equal flex-basis keeps
     the boxes the same width; align-self stretch keeps them the same height. */
  .flow-cycle-row .flow-node { flex: 1 1 0; max-width: none; align-self: stretch; }
  .flow-cycle-row .flow-connector { align-self: center; }
  .flow-return {
    flex: 0 0 auto;
    align-self: stretch;
    width: 100%;
    position: relative;
    height: clamp(26px, 3.2cqw, 40px);
    margin-top: clamp(8px, 1.2cqw, 16px);
    /* Three-sided bracket: down on the right, across the bottom, up on the left. */
    border: 2.5px solid var(--accent);
    border-top: none;
    border-radius: 0 0 12px 12px;
    box-sizing: border-box;
  }
  /* Suppress the inherited inline arrow rule — the loop-back arrowhead is drawn on ::after. */
  .flow-return .flow-arrow { display: none; }
  /* Arrowhead at the top-left of the bracket, pointing UP into the first node. */
  .flow-return::after {
    content: "";
    position: absolute;
    left: -1px;
    top: -2px;
    width: 9px;
    height: 9px;
    border-top: 2.5px solid var(--accent);
    border-left: 2.5px solid var(--accent);
    transform: translate(-50%, -1px) rotate(45deg);
    transform-origin: center;
  }
  /* Branch — a node fans out to its children as a sub-row joined by a downward stem. */
  .flow-branch { flex-direction: row; align-items: flex-start; gap: 14px; }
  .flow-branch .flow-item { display: flex; flex-direction: column; align-items: center; gap: 0; }
  .flow-fan { display: flex; flex-direction: column; align-items: center; }
  .flow-stem {
    width: 2px;
    height: clamp(14px, 2cqw, 26px);
    background: var(--accent);
  }
  .flow-children {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    padding-top: 4px;
    border-top: 2px solid var(--accent);
    margin-top: -1px;
  }
  .flow-child { border-left-width: 3px; max-width: 240px; font-size: 0.92em; }
  @container (max-width: 900px) {
    .flow-horizontal { flex-direction: column; align-items: center; }
    .flow-horizontal .flow-arrow { transform: rotate(90deg); }
    .flow-horizontal .flow-node, .flow-loop .flow-node { width: min(560px, 100%); }
    /* On narrow screens the loop stacks vertically; arrows point down and the return spans
       the stacked column rather than a horizontal row. */
    .flow-cycle-row { flex-direction: column; align-items: center; }
    .flow-cycle-row .flow-connector .flow-arrow { transform: rotate(90deg); }
  }
  /* Loop return arrow stepping: while stepping it stays hidden until every node has been
     revealed (the last node reaches data-mode-state="full"); otherwise it is always visible. */
  .slide.mode-active .flow-loop .flow-return { visibility: hidden; }
  .slide.mode-active .flow-loop:has(.flow-cycle-row .flow-node[data-mode-state="full"]) .flow-return { visibility: visible; }

  .slide-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 28px;
    font-size: max(var(--type-floor), 1.7cqw);
  }
  .slide-table th,
  .slide-table td {
    border: 1px solid var(--hairline);
    padding: clamp(12px, 1.6cqh, 20px) clamp(14px, 1.2cqw, 22px);
    text-align: left;
    vertical-align: top;
  }
  .slide-table thead th {
    background: var(--tint);
    color: var(--ink);
    font-weight: 600;
    font-size: max(var(--type-floor), 1.08em);
  }
  /* First-column row labels read as the mockup's small-caps mono field labels. */
  .slide-table tbody th:first-child {
    font-family: var(--mono);
    font-size: max(var(--type-floor), 0.72em);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  /* Fenced code + trace blocks. A generic ```lang block is a monospace panel; a ```trace block
     is a dark transcript of role-tagged turns (USER / HARNESS / MODEL / reasoning / TOOL) where
     each role gets its own colour so the turn-taking reads at a glance. Trace turns are content
     units, so reveal/focus stepping walks them (.trace .turn matches MODE_SELECTOR). */
  .slide-code {
    margin: auto 0;
    padding: 18px 20px;
    background: #11161c;
    color: #e8eef5;
    border-radius: 10px;
    border-left: 5px solid var(--accent);
    overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: max(var(--type-floor), 2.1cqw);
    font-weight: 500;
    line-height: 1.55;
    box-shadow: 0 10px 24px #17202a1f;
    position: relative;
    min-height: 0;
    max-height: 100%;
  }
  .slide-code .code-lang {
    position: absolute;
    top: 8px;
    right: 12px;
    font: 600 11px/1 var(--sans);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #9fb1c4;
  }
  .code-overflow-marker {
    position: absolute;
    right: 0 !important;
    bottom: 0 !important;
    left: auto !important;
    top: auto !important;
    z-index: 4;
    width: max-content !important;
    max-width: 100%;
    padding: .35em .65em;
    border-radius: 4px;
    background: var(--accent);
    color: var(--paper);
    font: 700 max(var(--type-floor), 1em)/1 var(--sans);
  }
  /* A trace fence that did not parse into role turns still renders as a slide-code panel — but
     it is PROSE, not code, so it must wrap rather than overflow horizontally. */
  .slide-code.lang-trace code { white-space: pre-wrap; overflow-wrap: anywhere; }
  .slide-code.lang-trace { overflow-x: hidden; }

  /* Code syntax theme. Colours are emitted at BUILD TIME by scripts/highlight.mjs as token
     <span>s (no runtime highlighter, no CDN, no network — ADR-0014 offline/single-file). A
     restrained palette tuned for the #11161c dark panel and to harmonise with the deck's
     Oxford-blue / crimson accents: keywords crimson-pink, strings sage-green, comments muted
     slate, numbers warm amber, function/call names sky-blue, builtins/types soft violet,
     attributes/keys gold, tags/markup blue-grey. All sit on a light base (#e8eef5) for contrast. */
  .slide-code .tok-kw      { color: #ff7a93; }
  .slide-code .tok-str     { color: #9ecf8a; }
  .slide-code .tok-com     { color: #7f8ea3; font-style: italic; }
  .slide-code .tok-num     { color: #e6b673; }
  .slide-code .tok-fn      { color: #7cc4f5; }
  .slide-code .tok-builtin { color: #c4a3f0; }
  .slide-code .tok-attr    { color: #e7c66b; }
  .slide-code .tok-tag     { color: #8fa6bd; }
  .slide-code .tok-op      { color: #c0ccd9; }

  /* Trace is a terminal panel: transcript copy and labels share a high-contrast mono surface. */
  .trace {
    margin: 22px 0 0;
    padding: 20px 22px;
    background: #101418;
    color: #e8eef5;
    border-radius: 0;
    box-shadow: none;
    font: 500 clamp(13px, 1.05cqw, 16px)/1.65 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    max-height: 70cqh;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-behavior: smooth;
    /* Fix 3 — in-card scroll affordance: a thin scrollbar + soft top/bottom fade so a long
       trace reads as "more above/below, scrollable" rather than a hard clip. The runtime
       scroll-follows the current turn into this box as reveal/focus steps. */
    scrollbar-width: thin;
    scrollbar-color: #3a4757 transparent;
  }
  .trace::-webkit-scrollbar { width: 8px; }
  .trace::-webkit-scrollbar-thumb { background: #3a4757; border-radius: 8px; }
  .trace::-webkit-scrollbar-track { background: transparent; }
  .slide-code { scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: #3a4757 transparent; }
  .slide-code::-webkit-scrollbar { width: 8px; height: 8px; }
  .slide-code::-webkit-scrollbar-thumb { background: #3a4757; border-radius: 8px; }
  .slide-code::-webkit-scrollbar-track { background: transparent; }
  .trace .turn { margin-bottom: 16px; }
  .trace .turn:last-child { margin-bottom: 0; }
  .trace .role {
    font: 700 12px/1 var(--sans);
    letter-spacing: .07em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .trace .role.user { color: #7cc4f5; }
  .trace .role.harness { color: #62d6b2; }
  .trace .role.model { color: #e6b673; }
  .trace .role.tool { color: #c4a3f0; }
  .trace .role.reasoning { color: #8fa6bd; }
  /* Auto-assigned speaker colours for arbitrary dialogue labels (any `Speaker: text` line that
     is not a well-known AI-loop role). The generator hashes each distinct speaker name to one of
     these 8 buckets (speaker-0…7) so a name keeps a stable, distinct colour. Hues spread around
     the wheel; tuned for legibility on the dark trace panel. */
  .trace .role.speaker-0 { color: #8a5a00; }
  .trace .role.speaker-1 { color: #0a7a5c; }
  .trace .role.speaker-2 { color: #b3502d; }
  .trace .role.speaker-3 { color: #3d6b1e; }
  .trace .role.speaker-4 { color: #5b4bd8; }
  .trace .role.speaker-5 { color: #a03a6b; }
  .trace .role.speaker-6 { color: #31506e; }
  .trace .role.speaker-7 { color: #0f4bd8; }
  .trace .body { white-space: pre-wrap; word-break: break-word; color: #e8eef5; }
  .trace .body em { color: #c4b5fd; font-style: normal; }
  .slide-content.layout-trace > h1,
  .slide-content.layout-trace > h2,
  .slide-content.layout-code > h1,
  .slide-content.layout-code > h2 { margin-bottom: 0; }

  /* G1 — CONSISTENT QUOTE DEVICE. Every quote (slide-level blockquote and card blockquote)
     carries one decorative oversized opening quotation mark (serif, accent colour) set into
     the left margin, plus the serif pull-quote treatment. The cite reads below. This is the
     single shared look so a quote is instantly recognisable as a quote everywhere. The mark
     is the visual signature: comments (Dominik's own text) deliberately do NOT get it. */
  blockquote { position: relative; }
  blockquote::before {
    content: "\201C";
    position: absolute;
    /* The oversized mark keeps the serif face (mockup .qpanel::before) — the ONE deliberate
       serif survivor; everything textual is the sans. Full accent, bold, per the lock. */
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    color: var(--accent);
    opacity: 0.9;
    line-height: 0.9;
    pointer-events: none;
  }
  /* Standalone quote (single blockquote outside a gallery) gets the serif pull-quote treatment. */
  .slide-content > blockquote {
    margin: 32px 0 0;
    padding: 4px 0 4px 56px;
    font-family: var(--sans);
    font-size: max(24px, 2.7cqw);
    line-height: 1.28;
    max-width: 28ch;
  }
  .slide-content > blockquote::before { font-size: 3.4em; top: -0.16em; left: -0.04em; }
  .slide-content > blockquote p { margin: 0 0 .3em; }
  .slide-content > blockquote strong { color: var(--accent); }
  .slide-content > blockquote cite { display: block; margin-top: .6em; font-family: var(--sans); font-style: normal; font-size: max(var(--type-floor), .46em); color: var(--muted); letter-spacing: .02em; }

  /* QUOTE CITATION — ONE normalised treatment (slide-level). A source line directly after a quote
     reads as a quiet attribution, whether the author wrote it as a plain paragraph OR a single
     bullet: muted sans, an accent left-rule, NO box, set well below the quotation. This is the
     "Brooks" format applied everywhere — a bulleted source (e.g. Shannon) no longer renders as a
     filled feature-list card. */
  .slide-content > blockquote + p,
  .slide-content > blockquote + .feature-list { margin-top: clamp(26px, 5cqh, 60px) !important; }
  .feature-list.fl-annotated > li > .fl-sublist > li {
    font-size: max(var(--type-floor), var(--fs-body));
    color: var(--ink);
  }
  .slide-content > blockquote + .feature-list > li + li { margin-top: .4em !important; }
  .slide-content > blockquote + .feature-list .fl-icon,
  .slide-content > blockquote + .feature-list .fl-svg { display: none !important; }
  .slide-content > blockquote + p,
  .slide-content > blockquote + .feature-list .fl-text {
    display: block; padding-left: .9em; border-left: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
    color: var(--muted); font-family: var(--sans); font-weight: 400; font-style: normal;
    font-size: max(var(--type-floor), 1.4cqw); line-height: 1.4;
  }

  /* QUOTE LAYOUT (quote-only slide, title hidden by default). The blockquote owns the whole
     stage: centred, full-bleed, larger than the inline pull-quote since no title competes. The
     nav-only heading (.slide-head-quiet) holds an sr-only h1 and is not drawn. {title=show}
     restores a normal .slide-head above the quote. */
  /* ADR-0005 quote (mockup .t-quote / .qpanel): a tinted panel with an accent left rule and an
     oversized quotation mark — "unmistakably a quote". Upright sans (NO italics), line-height
     1.42 so boxed strong emphasis clears its neighbours. Block centred both axes, text left
     inside. Attribution reads below with a short accent rule. */
  /* The fixed footer occupies 56px above its 3px progress tick. Add that 59px band to the
     lower safe area, while the existing --slide-pad-y supplies equal air above and below the
     usable quote box. The asymmetric slide padding shifts the box itself up by half the chrome
     band, so CSS-only thumbnails, handouts and PDF renders share the runtime's balance. */
  .slide-content.layout-quote {
    justify-content: center;
    align-content: center;
    justify-items: center;
    min-height: min(820px, calc(86cqh - var(--quote-chrome-band)));
  }
  .slide-content.layout-quote > .slide-head-quiet { display: contents; }
  /* Boxed emphasis inside the quote (mockup .box): filled accent chip, clone across line wraps. */
  .slide-content.layout-quote > blockquote strong {
    background: var(--accent); color: var(--paper);
    padding: 0.02em 0.18em; border-radius: 0.1em;
    box-decoration-break: clone; -webkit-box-decoration-break: clone;
  }
  /* Quote panel owner. The old skin duplicate is gone: layout geometry and its visual device now
     change together here. ADR-0023 §9: EVERY quote-only panel has the one width — the full content
     column, min(84cqw, 100%) of the 1180px-capped column (1180px at 1600) — and the one type,
     max(31px, 3.4cqw). Length never changes either: a quote that does not fit is split across
     continuation slides at compile time (compiler/scripts/lib/quote-layout.mjs mirrors the
     geometry below; change them together). The paragraph measure caps at 34em. */
  /* Quote + portrait/screenshot (2026-06-09): an explicit {quote} slide carrying a figure lays
     the image BESIDE the quote (image left ~40%, quote right), centred as a pair — it was
     stacking the figure under the quote in a full-width white card with dead whitespace. */
  .slide-content.layout-quote:has(> .slide-figure) {
    display: grid;
    grid-template-columns: minmax(0, 0.62fr) minmax(0, 1fr);
    column-gap: clamp(28px, 3.2cqw, 56px);
    align-items: center;
    align-content: center;
  }
  /* Quote-with-figure: the pair sits on PAPER (mockup .iq) — the tinted panel belongs to the
     text-only quote; a figure pairing goes flat so the image never floats on a tint slab. */
  .slide-content.layout-quote:has(> .slide-figure) > blockquote {
    background: none;
    border-left: 0;
    padding: 0 0 0 1.3em;
  }
  .slide-content.layout-quote:has(> .slide-figure) > blockquote::before { font-size: 2.4em; top: -0.05em; left: 0; }
  .slide-content.layout-quote:has(> .slide-figure) > .slide-figure {
    grid-column: 1;
    grid-row: 1;
    align-self: center;
    height: fit-content;
    grid-template-rows: auto auto;
    max-height: 80cqh;
    margin: 0;
  }
  .slide-content.layout-quote:has(> .slide-figure) > blockquote {
    grid-column: 2;
    grid-row: 1;
    margin: 0;
    max-width: none;
  }

  /* Opt-in contrast variants locked in the 2026-07-13 design round. Every treatment keeps one
     direct `.contrast-pair` child per authored pair so reveal stepping remains intact. */
  .slide-content.layout-compare {
    position: absolute;
    inset: 0;
    width: 100%;
    max-width: none;
    min-height: 100%;
    align-content: stretch;
  }
  .slide-content.layout-compare > .slide-head-quiet { display: contents; }
  .compare-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100%;
  }
  .compare-half {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(28px, 5cqh, 60px) clamp(28px, 4cqw, 64px);
    min-width: 0;
  }
  .compare-half.half-a { background: var(--tint); }
  .compare-half.half-b { background: var(--paper); }
  .compare-inner { font-size: clamp(1.7rem, 3.4cqw, 3rem); max-width: 12em; }
  /* The #### text is the mockup .t-half .half .lab: deliberately small presentation chrome,
     not a running-text heading. */
  .compare-half .compare-label {
    margin: 0 0 2.5cqh;
    font-family: var(--mono);
    font-size: .58em;
    font-weight: 400;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent);
  }
  /* Statements: big sans, weight 500, line-height 1.3 (clears boxed strong), capped at 12em. */
  .slide-content.layout-compare .compare-half .compare-inner .content-p,
  .slide-content.layout-compare .compare-half .compare-inner .statement {
    margin: 0;
    /* Mockup .t-half .half p: no left accent bar (reset the universal .content-p rule). */
    padding-left: 0;
    border-left: none;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 1em;
    line-height: 1.3;
    letter-spacing: -0.02em;
    color: var(--ink);
    max-width: 12em;
  }
  .slide-content.layout-compare .compare-half .compare-inner .content-p + .content-p { margin-top: 0.6em; }
  /* Boxed emphasis (mockup .box): filled accent chip, clone across line wraps. */
  .slide-content.layout-compare .compare-half .compare-inner strong {
    background: var(--accent); color: var(--paper);
    padding: 0.02em 0.18em; border-radius: 0.1em;
    box-decoration-break: clone; -webkit-box-decoration-break: clone;
  }

  /* D4: cards slides demote the title to a quiet eyebrow line — SECTION KICKER · Title —
     so the gallery is the hero. The title part stays in the accent-ink for slight weight
     against the muted kicker; the big h1 is sr-only (kept for nav/overview fallbacks). */
  /* E4 follow-up: the whole cards block (eyebrow + gallery/split) centres vertically in the
     stage; the two split columns keep their TOP edges level relative to each other. */
  .slide-content.layout-cards { align-content: center; }
  .slide-content.layout-cards .card-gallery { min-height: 62cqh; margin-top: 14px; }

  /* D5: source/citation reference for a card gallery — sits BELOW the gallery as a small
     muted line. Bare URLs in it are quietly styled (muted, dotted underline) rather than
     the loud default link blue. */
  .slide-source { margin: 14px 0 0; font-family: var(--sans); font-size: max(11px, .92cqw);
    line-height: 1.4; color: var(--muted); letter-spacing: .01em; max-width: 90ch; }
  .slide-source a { color: inherit; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--muted) 55%, transparent); text-underline-offset: 2px; }
  .slide-source a:hover { color: var(--ink); text-decoration-color: var(--accent); }
  .slide-content.layout-cards .card-gallery { /* leave room for the source line below */ }

  .card-gallery { position: relative; min-height: 56cqh; margin-top: 28px; }

  /* ── ADR-0022 CAROUSEL — stepped FULL-BLEED sub-slides ──────────────────────────────────
     A carousel reuses the data-exclusive stepping container, but each sub-slide is a real
     full-bleed slide (its content ran through inferLayout + the normal renderers), NOT a card.
     So strip ALL card chrome from .carousel-subslide and let its inner .slide-content fill the
     frame and lay out exactly as a top-level slide would. The runtime's applyExclusiveCards
     toggles .active-card on the visible sub-slide (same machinery as a gallery). */
  .slide-content.layout-carousel { display: flex; flex-direction: column; height: 100%; }
  .card-gallery.carousel { position: relative; min-height: 0; margin-top: 8px; flex: 1 1 auto; display: block; }
  .card-gallery.carousel .card.carousel-subslide {
    /* No panel: no border, no background, no shadow, no padding, no centring grid — a clean stage. */
    background: transparent; border: 0; border-radius: 0; box-shadow: none;
    padding: 0; margin: 0; height: 100%; max-height: none; min-height: 0;
    display: none; overflow: visible; align-content: stretch;
  }
  .card-gallery.carousel[data-exclusive] .card.carousel-subslide { display: none; }
  .card-gallery.carousel[data-exclusive] .card.carousel-subslide.active-card { display: block; }
  /* The sub-slide's own .slide-content fills the frame and keeps its layout grammar (title rail,
     media, figure-row grid, statement, quote …) — identical to a real slide. */
  .card-gallery.carousel .card.carousel-subslide > .slide-content {
    height: 100%; margin: 0; padding: 0; max-width: none;
  }
  /* The sub-slide draws its own visible title; the parent carousel head already shows the shared
     section · parent-title eyebrow above the stepped frames, so the parent head stays compact. */

  /* Static grid — the DEFAULT {cards} treatment: every card visible at once in a responsive grid,
     each sized to its content. Overrides the stepped-gallery base (height:100%, centred, tall
     min-height) which now only applies to {cards=stepped}. */
  .card-gallery .card .feature-list { margin: 0; }
  .card-gallery.card-grid { position: static; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: clamp(12px, 1.6cqw, 24px); align-content: start; }
  .slide-content.layout-cards .card-gallery.card-grid { min-height: 0; margin-top: 8px; }
  .card-gallery.card-grid .card { height: auto; max-height: none; align-content: start; }
  .slide[data-title-layout="top"] > .slide-content.layout-cards > .slide-head { margin-bottom: 0 !important; }
  /* ADR-0005 gallery card: flat hairline card on paper — no tint fill, no top bar, no radius,
     no elevation. Chrome carries nothing; type and the accent carry the card. */
  .card-gallery .card { position: relative; background: var(--paper); border: 1px solid var(--hairline); border-radius: 0; box-shadow: none; padding: clamp(24px, 3.2cqw, 48px); height: 100%; max-height: 72cqh; overflow-y: auto; overflow-x: hidden; display: grid; align-content: center; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--accent) 50%, transparent) transparent; }
  .card-gallery .card::-webkit-scrollbar { width: 8px; }
  .card-gallery .card::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 8px; }
  .card-gallery .card::-webkit-scrollbar-track { background: transparent; }
  .card-gallery .card.is-scrollable::after { content: ""; position: sticky; bottom: -1px; left: 0; right: 0; display: block; height: clamp(28px, 4cqh, 56px); margin: 0 calc(-1 * clamp(24px, 3.2cqw, 48px)) calc(-1 * clamp(24px, 3.2cqw, 48px)); background: linear-gradient(to bottom, transparent, var(--tint)); pointer-events: none; }
  /* Card titles: sentence case, ink, weight 600 — never shouting caps, never accent-on-title
     (ADR-0005: accent lives in icons/numbers/keywords). */
  .card-gallery .card h4 { margin: 0 0 .6em; font-size: max(var(--type-floor), 1.9cqw); font-weight: 600; letter-spacing: -0.01em; text-transform: none; color: var(--ink); }
  /* Type floor — no tiny text on a slide, ever. Anything inside a card not covered by a
     specific treatment (quotes, h4, figcaptions, cites) inherits at least statement-adjacent
     scale. Feature lists inside cards sit on paper (not panel) so their card edges read
     against the panel card background. */
  .card-gallery .card { font-size: max(var(--type-floor), 1.8cqw); }
  .card-gallery .card .feature-list li { background: var(--paper); font-size: max(var(--type-floor), 1.8cqw); }
  .card-gallery .card > p { font-size: max(21px, 2cqw); line-height: 1.35; max-width: 60ch; }
  /* G2/G4 — SPEAKER COMMENT. Dominik's own remark inside a card (a paragraph, not a quote)
     reads as a statement, NOT a quotation: an accent-bar callout in the sans face, no quote
     mark. Distinct from the serif + quote-mark blockquote so the audience can tell "this is
     the speaker talking" from "this is a cited source". One consistent size across cards and
     the in-card split text column. The .card > p selector above sets base size; this adds the
     bar and overrides the family/colour. Works regardless of split nesting (G4). */
  .card-gallery .card p.card-comment,
  .card-gallery .card .card-text-col p.card-comment {
    margin: 0 0 .5em;
    padding-left: 22px;
    border-left: 5px solid var(--accent);
    font-family: var(--sans);
    font-size: max(29px, 2.7cqw);
    line-height: 1.34;
    color: var(--ink);
    max-width: 46ch;
  }
  .card-gallery .card p.card-comment:last-child { margin-bottom: 0; }
  .card-gallery .card p.card-comment strong { color: var(--accent); }
  /* Slide-level floor for any generic list a layout doesn't specifically treat.
     Feature-list sub-lists carry their own (smaller) sub-bullet sizing — excluded. */
  /* GLOBAL LIST FLOOR — type-scale principle (30pt ideal / 20pt min): no list anywhere may
     render under ~31px. Timeline entries inherit the .timeline scale instead. */
  .slide-content ul:not(.feature-list):not(.timeline):not(.callouts):not(.fl-sublist) li,
  .slide-content ol:not(.timeline):not(.tl-entries) li { font-size: max(var(--type-floor), var(--fs-body)); line-height: var(--list-lh, 1.35); }
  .card-gallery .card blockquote { border: 0; margin: 0; padding: 0 0 0 0.9em; font-family: var(--sans); font-size: max(24px, 2.6cqw); line-height: 1.3; }
  /* G1: same decorative opening quote mark as slide-level quotes, scaled to the card. */
  .card-gallery .card blockquote::before { font-size: 2.6em; top: -0.18em; left: -0.14em; }
  .card-gallery .card blockquote p { margin: 0 0 .5em; }
  .card-gallery .card blockquote p:last-of-type { margin-bottom: 0; }
  .card-gallery .card blockquote strong { color: var(--accent); }
  .card-gallery .card blockquote cite { display: block; margin-top: .7em; font-family: var(--sans); font-style: normal; font-size: max(var(--type-floor), .42em); color: var(--muted); letter-spacing: .02em; }
  /* QUOTE + ATTRIBUTION: when a card's quote is followed by a source line (a reference/feature-list
     or a paragraph), the quotation is the hero and the reference sits QUIETLY AT THE BOTTOM with a
     clear gap — not crowded directly under the quote. Only engages when a blockquote actually has a
     trailing sibling, so a quote-only card keeps its centred treatment. */
  .card-gallery .card:has(> blockquote + *) { display: flex; flex-direction: column; justify-content: flex-start; min-height: 56cqh; }
  .card-gallery .card:has(> blockquote + *) > :last-child { margin-top: auto; padding-top: clamp(28px, 6cqh, 80px); }

  /* LIST + COMMENTARY: a card whose list is followed by a prose block puts them SIDE BY SIDE —
     the list in the left column, the commentary beside it — instead of stacking the text under
     the list. The h4 (if any) spans the top. */
  .card-gallery .card:has(> .feature-list + p) {
    display: grid; align-content: center;
    grid-template-columns: 1.35fr 1fr; column-gap: clamp(26px, 3cqw, 52px); align-items: center;
  }
  .card-gallery .card:has(> .feature-list + p) > h4 { grid-column: 1 / -1; }
  .card-gallery .card:has(> .feature-list + p) > .feature-list { grid-column: 1; margin: 0; }
  .card-gallery .card:has(> .feature-list + p) > p { grid-column: 2; margin: 0; }
  /* D6: scale quote type by length so long multi-paragraph quotes don't overflow. Buckets are
     set in the generator via data-quote-length. The runtime .card-dense step (scrollHeight >
     clientHeight) nudges one notch smaller before any scroll fallback kicks in. */
  .card-gallery .card blockquote[data-quote-length="medium"] { font-size: max(var(--type-floor), 2.05cqw); }
  .card-gallery .card blockquote[data-quote-length="long"] { font-size: max(var(--type-floor), 1.6cqw); line-height: 1.36; }
  .card-gallery .card.card-dense blockquote { font-size: max(var(--type-floor), 1.45cqw); line-height: 1.34; }
  .card-gallery .card.card-dense blockquote[data-quote-length="long"] { font-size: max(var(--type-floor), 1.32cqw); }
  /* D7: a card holding BOTH media and text lays them side-by-side inside the card — media in
     one column (≤56%, vertically centred, embeds 16:9), text in the other — instead of stacking
     and clipping. The card stays a centred grid; the inner .card-split-grid is the two-column
     row. Below 950px (handled in the breakpoint block) it stacks media above text. */
  .card-gallery .card.card-media-split { align-content: center; }
  .card-gallery .card.card-media-split .card-split-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    column-gap: clamp(20px, 2.4cqw, 40px);
    align-items: center;
  }
  .card-gallery .card.card-media-split .card-media-col { min-width: 0; display: grid; gap: 10px; align-content: center; }
  .card-gallery .card.card-media-split .card-media-col figure { margin: 0; }
  .card-gallery .card.card-media-split .card-media-col figure.slide-embed { aspect-ratio: 16 / 9; width: 100%; max-height: 56cqh; }
  .card-gallery .card.card-media-split .card-media-col figure.slide-embed iframe { min-height: 0; height: 100%; }
  .card-gallery .card.card-media-split .card-media-col .slide-figure { max-height: 56cqh; }
  .card-gallery .card.card-media-split .card-text-col { min-width: 0; }
  .card-gallery .card.card-media-split .card-text-col blockquote { font-size: max(var(--type-floor), 1.7cqw); }
  .card-gallery .card.card-media-split .card-text-col blockquote::before { font-size: 2.4em; top: -0.16em; left: -0.12em; }
  /* G4: card-text-col paragraphs were previously unstyled body copy. A non-quote paragraph
     in the split column is a speaker comment — give it the same accent-bar callout treatment
     as flow-card comments (the Nature "Chatbots are not reliable…" line). This selector matches
     the split-column specificity exactly and sits AFTER it, so the comment treatment wins. */
  .card-gallery .card.card-media-split .card-text-col > p.card-comment {
    margin: 0 0 .5em; padding-left: 18px; border-left: 5px solid var(--accent);
    font-family: var(--sans); font-size: max(16px, 1.55cqw); line-height: 1.4;
    color: var(--ink); max-width: none;
  }
  .card-gallery .card.card-media-split .card-text-col > p.card-comment:last-child { margin-bottom: 0; }
  .card-gallery .card.card-media-split .card-text-col > p.card-comment strong { color: var(--accent); }
  /* E2: media INSIDE a plain content card (an embed, optionally paired with a still image —
     no side-by-side text, so not .card-media-split). The base .slide-embed iframe carries
     min-height: 52cqh for full-bleed slide embeds; inside a height-capped, align-content:center
     card that forces the embed to ~52cqh AND lets a stacked image spill past the card's clip
     box, so only a thin sliver of the image shows below the embed. Scope the embed to a 16:9
     box, drop the iframe min-height, and cap any stacked figure/image so embed + still compose
     cleanly within one card. When a card holds BOTH (embed + image), let the rows size to
     content and share the height instead of one element dominating. */
  .card-gallery .card:not(.card-media-split):not(.card-title) figure.slide-embed {
    margin: 0; aspect-ratio: 16 / 9; width: 100%; max-height: 56cqh; justify-self: center;
  }
  .card-gallery .card:not(.card-media-split):not(.card-title) figure.slide-embed iframe { min-height: 0; height: 100%; }
  .card-gallery .card:not(.card-media-split):not(.card-title) .slide-figure { margin: 0; max-height: 56cqh; }
  .card-gallery .card:not(.card-media-split):not(.card-title) .slide-figure img,
  .card-gallery .card:not(.card-media-split):not(.card-title) .slide-figure video { max-height: 56cqh; }
  /* A media-only card with two stacked media (embed + still): give each its own row at a
     reduced cap so both fit the card without clipping one to a sliver. */
  .card-gallery .card:not(.card-media-split):not(.card-title):has(figure.slide-embed):has(.slide-figure) { row-gap: 12px; }
  .card-gallery .card:not(.card-media-split):not(.card-title):has(figure.slide-embed):has(.slide-figure) figure.slide-embed { max-height: 38cqh; }
  .card-gallery .card:not(.card-media-split):not(.card-title):has(figure.slide-embed):has(.slide-figure) .slide-figure { max-height: 24cqh; }
  .card-gallery .card:not(.card-media-split):not(.card-title):has(figure.slide-embed):has(.slide-figure) .slide-figure img,
  .card-gallery .card:not(.card-media-split):not(.card-title):has(figure.slide-embed):has(.slide-figure) .slide-figure video { max-height: 21cqh; }
  /* G3 — IMAGES ALWAYS FIT FULLY, never clipped. Every in-card image is object-fit:contain
     within a box capped against the card height (card max-height 72cqh, minus padding/chrome).
     When a card stacks MULTIPLE images they SHARE the vertical budget so all are fully visible
     (≈half each for two), rather than the first eating the box and the rest clipping. The card
     keeps content-sized rows so each figure's row is exactly as tall as the (contained) image.
     The slide-level figure cap (78cqh) already contains; this scopes the card budget. */
  .card-gallery .card .slide-figure { min-height: 0; }
  .card-gallery .card .slide-figure img,
  .card-gallery .card .slide-figure video { object-fit: contain; }
  /* G5 — SIDE-BY-SIDE multiple images. A non-split card with 2+ images (e.g. the slop
     "Reporting" card's two screenshots, or the Nature "Problem" card's two figures) lays the
     images out as an auto-fit row (2-up typical) so each gets half the width and is fully
     visible (object-fit:contain), rather than stacking and each eating a vertical sliver. The
     images live in a generated .figure-row wrapper. Below 950px the row collapses to a single
     column (stacking) — see the responsive block. Captions stay under each image. */
  .card-gallery .card:not(.card-media-split):not(.card-title) .figure-row,
  .card-gallery .card.card-media-split .card-media-col .figure-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
    gap: 12px;
    align-items: start;
    min-width: 0;
  }
  .card-gallery .card .figure-row .slide-figure { margin: 0; min-height: 0; max-height: 60cqh; }
  .card-gallery .card .figure-row .slide-figure img,
  .card-gallery .card .figure-row .slide-figure video { max-height: 56cqh; object-fit: contain; }
  .card-gallery .card.card-media-split .card-media-col .figure-row .slide-figure { max-height: 52cqh; }
  .card-gallery .card.card-media-split .card-media-col .figure-row .slide-figure img,
  .card-gallery .card.card-media-split .card-media-col .figure-row .slide-figure video { max-height: 48cqh; }
  .card-gallery[data-exclusive] .card { display: none; }
  .card-gallery[data-exclusive] .card.active-card { display: grid; }
  .card-gallery[data-exclusive] .card.hidden-fragment { opacity: 1; transform: none; }
  /* Title card: opens every gallery. No panel chrome — a clean accent-led title page so it
     reads distinctly from the bordered content cards. Big serif title, uppercase kicker. */
  .card-gallery .card.card-title {
    background: transparent;
    border: 0;
    box-shadow: none;
    border-radius: 0;
    text-align: center;
    justify-items: center;
    padding: clamp(20px, 4cqw, 64px);
  }
  .card-gallery .card.card-title .card-title-inner {
    display: grid;
    gap: clamp(14px, 1.6cqw, 24px);
    justify-items: center;
    border-top: 5px solid var(--accent);
    padding-top: clamp(22px, 3cqw, 44px);
  }
  .card-gallery .card.card-title .card-title-kicker {
    margin: 0;
    font-family: var(--sans);
    font-size: max(13px, 1.1cqw);
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent-2);
  }
  .card-gallery .card.card-title .card-title-h {
    margin: 0;
    font-family: var(--sans);
    font-weight: 500;
    line-height: 1.04;
    color: var(--ink);
    font-size: max(40px, 6cqw);
    /* E1: the measure must live on the TITLE element so ch resolves against the large serif
       font here — not on .card-title-inner (a base-16px sans box, where 22ch ≈ 350px forced
       the 84px title to one word per line). ~18ch matches a normal h1. */
    max-width: 18ch;
  }
  /* Mini-grid overview: every card of the active gallery at once, scaled into a responsive
     grid regardless of reveal state. Click a card to jump to it. Standalone trigger only. */
  .card-gallery.grid-view { min-height: 0; display: grid; gap: clamp(12px, 1.4cqw, 22px);
    grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); align-content: start; }
  .card-gallery.grid-view .card,
  .card-gallery.grid-view .card.card-title {
    display: grid !important;
    height: auto;
    min-height: 150px;
    max-height: 32cqh;
    overflow: hidden;
    cursor: pointer;
    padding: clamp(14px, 1.4cqw, 22px);
    box-shadow: var(--hairline-shadow);
    border: 1px solid var(--line);
    border-top: 4px solid var(--accent);
    border-radius: 10px;
    background: var(--tint);
    transition: transform 120ms ease, box-shadow 120ms ease;
  }
  .card-gallery.grid-view .card.card-title { text-align: left; justify-items: stretch; }
  .card-gallery.grid-view .card.card-title .card-title-inner { border-top: 0; padding-top: 0; max-width: none; justify-items: start; text-align: left; }
  .card-gallery.grid-view .card.card-title .card-title-h { font-size: max(22px, 2.4cqw); }
  .card-gallery.grid-view .card.grid-current { outline: 3px solid var(--accent); outline-offset: 2px; }
  .card-gallery.grid-view .card:hover { transform: translateY(-2px); box-shadow: var(--elevation); }
  .card-gallery.grid-view .card blockquote { font-size: max(var(--type-floor), 1.4cqw); }
  .card-gallery.grid-view .card figure img,
  .card-gallery.grid-view .card figure video { max-height: 18cqh; object-fit: contain; }
  .card-gallery.grid-view .card .slide-embed iframe { min-height: 0; height: 16cqh; }
  .gallery-grid-btn {
    width: 30px; height: 30px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 7px;
    background: var(--tint); color: var(--muted); cursor: pointer;
    transition: color 120ms ease, border-color 120ms ease;
  }
  .gallery-grid-btn:hover, .gallery-grid-btn.active { color: var(--accent); border-color: var(--accent); }
  .gallery-grid-btn svg { width: 16px; height: 16px; }
  body.audience-mode .gallery-grid-btn { display: none !important; }
  /* G5 — fullscreen LIGHTBOX gallery. A single keystroke (z) — or Enter/click on an image —
     opens a dark overlay that shows every image on the current slide at maximum size
     (object-fit:contain), with a caption, an "n / N" counter and ←/→ browsing. LearnWeaver's
     media fullscreen feel: full-bleed black backdrop, image centred and contained, close on
     Esc / same key / backdrop click. Hidden by default; toggled via .open. Never printed. */
  /* License popup (2026-06-13): centred card over a dimmed backdrop. Hidden via the [hidden]
     attribute (toggled by the runtime); print-safe (never shows in print). */
  .license-modal {
    position: fixed;
    inset: 0;
    z-index: 210;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(8, 12, 18, 0.62);
  }
  .license-modal[hidden] { display: none; }
  .license-card {
    position: relative;
    max-width: 560px;
    width: 100%;
    max-height: 80vh;
    overflow: auto;
    background: var(--panel, #fff);
    color: var(--ink, #1a1a1a);
    border: 1px solid var(--line, #e4ded2);
    border-radius: 12px;
    padding: 28px 30px;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
  }
  .license-close { position: absolute; top: 12px; right: 12px; }
  .license-body h3 { font-family: var(--sans); font-size: 1.15rem; margin: 0 0 12px; }
  .license-body h4 { font-family: var(--sans); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted, #6b7c8a); margin: 18px 0 8px; }
  .license-name { font-size: 1.05rem; font-weight: 700; margin: 0 0 8px; }
  .license-name a { color: var(--accent); }
  .license-note { margin: 0 0 6px; }
  .license-credits { margin: 0; padding-left: 1.1em; }
  .license-credits li { margin: 2px 0; }
  @media print { .license-modal { display: none !important; } }
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    background: rgba(8, 12, 18, 0.94);
    color: #f4f7fb;
    align-items: center;
    justify-content: center;
  }
  .lightbox.open { display: grid; grid-template-rows: 1fr auto; }
  .lightbox-stage {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: clamp(20px, 4vw, 64px);
    gap: clamp(12px, 2vw, 28px);
  }
  .lightbox-img {
    /* Viewport units, not %: percentage max-height does not resolve inside the flex stage,
       so tall images overflowed top+bottom (2026-06-10). The image now always fits. */
    max-width: 94vw;
    max-height: 84vh;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
  }
  .lightbox-nav {
    border: 0;
    background: rgba(255, 255, 255, 0.08);
    color: #f4f7fb;
    width: clamp(40px, 4vw, 56px);
    height: clamp(40px, 4vw, 56px);
    border-radius: 50%;
    font-size: max(20px, 2.2cqw);
    line-height: 1;
    cursor: pointer;
    flex: none;
    transition: background 120ms ease;
  }
  .lightbox-nav:hover, .lightbox-nav:focus-visible { background: rgba(255, 255, 255, 0.2); }
  .lightbox-nav[hidden] { display: none; }
  .lightbox-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px clamp(18px, 3vw, 40px) clamp(18px, 3vw, 40px);
  }
  .lightbox-caption {
    font-family: var(--sans);
    font-size: max(14px, 1.3cqw);
    color: #cdd7e2;
    max-width: 70ch;
  }
  .lightbox-counter {
    font-family: var(--sans);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: max(13px, 1.1cqw);
    color: #9fb0c0;
    flex: none;
  }
  .lightbox-close {
    position: absolute;
    top: 16px;
    right: 18px;
    border: 0;
    background: rgba(255, 255, 255, 0.08);
    color: #f4f7fb;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
  }
  .lightbox-close:hover, .lightbox-close:focus-visible { background: rgba(255, 255, 255, 0.2); }
  /* Ticket 24: a video entry in the lightbox is the slide's OWN <video> element, moved onto the
     stage (never a copy) so currentTime / paused state survive; it fills the stage box and shows
     native controls (the native full-screen button is one of them). The image is hidden meanwhile. */
  .lightbox.qr-focus.open { grid-template-rows: auto auto; align-content: center; }
  .lightbox.qr-focus .lightbox-stage { padding-bottom: 0; }
  .lightbox.qr-focus .lightbox-img { max-height: 48vh; }
  .lightbox.qr-focus .lightbox-bar {
    flex-direction: column;
    justify-content: center;
    gap: 8px;
    padding-top: clamp(18px, 3.2vh, 36px);
  }
  .lightbox.qr-focus .lightbox-caption {
    font-size: clamp(28px, 3vw, 64px);
    font-weight: 400;
    color: #fff;
    max-width: 92vw;
    text-align: center;
    line-height: 1.2;
    word-break: normal; overflow-wrap: anywhere;
  }
  .lightbox.qr-focus .lightbox-caption strong { font-weight: 400; color: inherit; }
  .lightbox.qr-focus .lightbox-counter { font-size: 13px; color: #7d8c9c; }
  /* Presenter "Gallery" button on the media control row — shown only when the slide has images. */
  .presenter-gallery[hidden] { display: none; }
  @media print { .lightbox { display: none !important; } }
  /* Images invite the gallery (not in the presenter mini-previews, which are static). */
  body:not(.presenter-mode) .slide.active figure.slide-figure img { cursor: zoom-in; }
  /* gallery affordance: dots + counter */
  .gallery-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 18px 0 0;
  }
  .gallery-dots { display: inline-flex; gap: 9px; }
  .gallery-dot {
    width: 11px;
    height: 11px;
    padding: 0;
    border: 1px solid var(--accent);
    border-radius: 999px;
    background: transparent;
    cursor: pointer;
    transition: background 140ms ease, transform 140ms ease;
  }
  .gallery-dot:hover { transform: scale(1.15); }
  .gallery-dot.active { background: var(--accent); }
  .gallery-counter { color: var(--muted); font-size: 0.85rem; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
  @media print { .gallery-nav { display: none !important; } }
  /* === Timelines (D10): structured groups, date emphasis, rail/columns/compact modes ===
     Shared shape: a .timeline wrapper holds one or more .tl-group blocks, each an optional
     small-caps accent header (.tl-group-head) above an <ol class="tl-entries"> of <li>.
     A dated entry splits into an accent .tl-date column and a .tl-body description; an
     undated entry is body-only. The mode class drives the layout of the groups. */
  .timeline { margin: 32px 0 0; font-size: max(31px, 3cqw); line-height: 1.3; }
  .timeline .tl-entries { list-style: none; margin: 0; padding: 0; display: grid; gap: .5em; }
  .timeline li { display: grid; grid-template-columns: minmax(4.4em, max-content) 1fr; column-gap: .9em; align-items: baseline; }
  .timeline li:only-child, .timeline li:has(> .tl-body:only-child) { grid-template-columns: 1fr; }
  .timeline .tl-date { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .timeline .tl-body { color: var(--ink); }
  .timeline .tl-body strong { color: var(--accent); }
  .timeline .tl-group-head {
    margin: 0 0 .3em; font-family: var(--mono, inherit); font-size: max(var(--type-floor), .5em); font-weight: 500;
    letter-spacing: .16em; text-transform: uppercase; color: var(--accent);
  }
  .timeline .tl-group + .tl-group { margin-top: 1.05em; }
  /* Fix 1: in single-column fallbacks (a timeline followed by a list/paragraph that did NOT
     pair into timeline-visual), give the following block clear separation from the rail
     instead of butting against it. */
  .timeline + * { margin-top: 28px; }

  /* rail (default): single vertical rail; dots sit ON the rail next to each entry. Group
     headers ride the rail as small-caps dividers (a smaller dot).
     Refinement 4 (2026-06-09): the rail LINE passes through the CENTRE of every dot. The line and
     the dots are anchored to ONE shared coordinate — `--tl-rail-x`, the rail's distance from the
     container's left edge — expressed in a FONT-INDEPENDENT unit (px). The previous border-left +
     per-li-`em` offset drifted because the container padding (container font) and the dot offset
     (li font) resolved `em` against different font sizes; pinning both to the same px value removes
     the drift. The line is an absolutely-positioned 2px bar at --tl-rail-x; content is inset past
     it; each dot is centred on --tl-rail-x. The dot SIZES keep `em` so they scale with the text. */
  .timeline-rail { position: relative; padding-left: 26px; --tl-rail-x: 13px; }
  .timeline-rail::before {
    content: ""; position: absolute; left: var(--tl-rail-x); top: 0; bottom: 0;
    width: 2px; transform: translateX(-1px); background: var(--line);
  }
  .timeline-rail .tl-entries { gap: .55em; position: relative; }
  .timeline-rail li { position: relative; }
  /* Dot CENTRE sits on the rail line. The li content begins at the container's left edge +
     padding-left (26px), so to put the dot centre at --tl-rail-x (13px from the container edge) the
     dot's left edge = --tl-rail-x − padding-left − dot-radius = 13px − 26px − .275em. All the
     horizontal terms that bridge container↔li are px (font-independent); only the dot radius is em. */
  .timeline-rail li::before {
    content: ""; position: absolute; left: calc(var(--tl-rail-x) - 26px - .275em); top: .55em;
    width: .55em; height: .55em; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 4px var(--paper); z-index: 1;
  }
  .timeline-rail .tl-group-head { position: relative; }
  /* ONE dot per dated event: the accent dot sits on the DATE (group head); the body rows
     beneath carry no dot of their own (the old two-dot pairing read as an artefact). */
  .timeline-rail .tl-group-head::before {
    content: ""; position: absolute; left: calc(var(--tl-rail-x) - 26px - .3em); top: .18em;
    width: .6em; height: .6em; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 4px var(--paper); z-index: 1;
  }
  .timeline-rail .tl-group:has(> .tl-group-head) li::before { display: none; }

  /* columns: one column per group (good for 2–4 grouped categories). Each column keeps its
     own header atop; entries flow down. No rail — width does the separating. */
  .timeline-columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(15em, 1fr)); gap: 1.4em 2em; }
  .timeline-columns .tl-group + .tl-group { margin-top: 0; }
  .timeline-columns .tl-group { border-top: 2px solid var(--line); padding-top: .55em; }
  .timeline-columns .tl-entries { gap: .55em; }
  .timeline-columns li { grid-template-columns: 1fr; }
  .timeline-columns .tl-date { display: block; }

  /* compact: dense two-column flow for long flat timelines; date-led rows, no rail. */
  .timeline-compact { font-size: max(var(--type-floor), 1.7cqw); }
  .timeline-compact .tl-entries { grid-template-columns: 1fr 1fr; gap: .4em 2.4em; }
  .timeline-compact li { align-items: baseline; }

  /* horizontal ({timelinehorizontal}): a left-to-right track of dated stops along a single line.
     Each entry is a column with a dot on the rail, its date above and body below. Entries flow in
     an auto-fit grid so the track fills the slide width; on narrow screens it falls back to a
     stacked vertical rail (so it never crushes). The horizontal rail is drawn as a top border on
     the entries row. */
  .timeline-horizontal { margin-top: 38px; }
  .timeline-horizontal .tl-group + .tl-group { margin-top: 1.4em; }
  .timeline-horizontal .tl-entries {
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(8em, 1fr);
    gap: 0 1.4em; padding-top: 1.4em; border-top: 2px solid var(--line);
  }
  .timeline-horizontal li {
    display: block; position: relative; grid-template-columns: none;
    padding-top: .2em; text-align: center;
  }
  .timeline-horizontal li::before {
    content: ""; position: absolute; top: calc(-1.4em - 1px); left: 50%; transform: translateX(-50%);
    width: .6em; height: .6em; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--paper);
  }
  .timeline-horizontal .tl-date { display: block; }
  .timeline-horizontal .tl-body { display: block; margin-top: .2em; }
  @container (max-width: 900px) {
    .timeline-columns { grid-template-columns: 1fr; }
    .timeline-compact .tl-entries { grid-template-columns: 1fr; }
    /* horizontal collapses to the vertical rail look when there is no room for a track. */
    .timeline-horizontal .tl-entries {
      grid-auto-flow: row; grid-auto-columns: auto; border-top: 0;
      padding-left: 1.5em; border-left: 2px solid var(--line); padding-top: 0; gap: .55em;
    }
    .timeline-horizontal li { text-align: left; padding-top: 0; }
    .timeline-horizontal li::before { top: .35em; left: calc(-1.5em - 7px); transform: none; }
  }

  /* spine ({timelinespine}, treatment A) + pills ({timeline-pills}, treatment D): the classic
     illustrated horizontal timeline. A central Oxford-blue spine bar runs across the slide; ONE
     dot per DATE stop sits ON the line; event CARDS (panel style) connect to their dot by a short
     DOTTED vertical leader. Both share this machinery; built for ~6 legible stops (>6 auto-splits
     across slides upstream). Layout: the track is an N-column grid (N = --tl-spine-cols, set per
     deck = the stop count); each stop is a relatively-positioned grid cell whose dot/leader/card/
     label are absolutely positioned about the central spine row. Generous spacing, no overlap.
       • A: card ALTERNATES above/below by index parity; the bold date LABEL sits on the spine.
       • D: a solid accent date PILL sits on the spine; a single card hangs BELOW every stop. */
  .timeline-spine, .timeline-pills {
    margin-top: 30px; --tl-spine-cols: 6; --tl-spine-scale: 1;
    --tl-spine-leader: color-mix(in srgb, var(--accent) 55%, transparent);
  }
  .timeline-spine .tl-spine-track, .timeline-pills .tl-spine-track {
    list-style: none; margin: 0; padding: 0; position: relative; width: 100%;
    display: grid; grid-template-columns: repeat(var(--tl-spine-cols), 1fr);
    /* Fill the stage so the spine centres with symmetric room for cards above AND below. */
    align-items: center; min-height: clamp(320px, 56cqh, 480px);
  }
  /* The spine bar: a continuous rounded Oxford-blue band running across the centre row. */
  .timeline-spine .tl-spine-track::before {
    content: ""; position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    height: 5px; border-radius: 99px; background: var(--accent); z-index: 0;
  }
  .timeline-spine .tl-spine-stop, .timeline-pills .tl-spine-stop {
    position: relative; display: flex; justify-content: center; min-width: 0;
  }
  /* Event card — the panel style shared with the deck. */
  .tl-spine-card {
    background: var(--tint); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 1px 0 #00000008; padding: .6em .75em;
    font-size: max(var(--type-floor), calc(clamp(14px, 1.35cqw, 19px) * var(--tl-spine-scale, 1))); line-height: 1.28; min-width: 0;
  }
  .tl-spine-card .tl-spine-events { list-style: none; margin: 0; padding: 0; display: grid; gap: .3em; }
  .tl-spine-card .tl-spine-events li { display: block; color: var(--ink); }
  .tl-spine-card .tl-spine-events li::before { content: "·"; color: var(--accent); font-weight: 700; margin-right: .35em; }
  .tl-spine-card .tl-spine-events li:only-child::before { content: none; }
  .tl-spine-card .tl-spine-events strong { color: var(--accent); }
  .tl-spine-card .tl-event-date { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
  /* The dot sits ON the spine, centred on each stop's cell. */
  .tl-spine-dot {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2;
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 4px var(--paper);
  }
  /* Dotted vertical leader in the accent colour, from the dot out to the card. */
  .tl-spine-leader {
    position: absolute; left: 50%; transform: translateX(-50%); width: 0; z-index: 1;
    border-left: 2px dotted var(--tl-spine-leader);
  }

  /* ── A (spine): date label on the spine; card alternates above/below ── */
  .timeline-spine .tl-spine-date {
    position: absolute; left: 50%; transform: translateX(-50%); margin: 0;
    font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums;
    font-size: max(var(--type-floor), calc(clamp(13px, 1.25cqw, 18px) * var(--tl-spine-scale, 1))); line-height: 1.1; white-space: nowrap; z-index: 2;
  }
  .timeline-spine .tl-spine-card {
    position: absolute; left: 50%; transform: translateX(-50%);
    /* Cards alternate above/below, so SAME-side cards sit ~2 columns apart — give them that room
       rather than shrinking with the font. A wide card keeps a dense (e.g. 10-stop) spine to ~2-3
       lines instead of a tall 6-line sliver. Capped so it never collides with its same-side
       neighbour; the font itself still scales down via --tl-spine-scale. */
    width: min(190%, clamp(160px, 16cqw, 205px));
  }
  /* even stop (card ABOVE): card sits above the spine, date label below the line. */
  .timeline-spine .tl-spine-stop[data-side="above"] .tl-spine-card { bottom: calc(50% + 30px); }
  .timeline-spine .tl-spine-stop[data-side="above"] .tl-spine-date { top: calc(50% + 13px); }
  /* odd stop (card BELOW): card sits below the spine, date label above the line. */

     button, regardless of preview size. The current size is shown in its label as an affordance

  .preview {

    border-radius: 6px;
    display: block;
    aspect-ratio: 16 / 9;

     via transform so the entire slide fits the box and nothing crops (D8). */
  .preview iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 720px;
    border: 0;
