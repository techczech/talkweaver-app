  body.presenter-mode .deck,
  body.presenter-mode .drawer,
  body.presenter-mode .notes-drawer,
  body.presenter-mode .progress { display: none; }
  body:not(.presenter-mode) .presenter-root { display: none; }

  body.audience-mode .deck {
    grid-template-rows: 1fr;
  }
  /* Definite height, not min-height (T27b): the stage is a container-type:size box, and an auto
     height resolved only through min-height is INDEFINITE for container-query resolution — every
     cqh inside the stage then collapses to its clamp minimum, the live projection's frame measures
     shorter than the compiled frame, and fitLists steps the same poll differently on the two sides.
     ADR-0030: the stage's fixed 720px canvas height is that definite size in every mode; the deck
     fills the viewport and the stage is scaled into it. Print resets it below. */
  body.audience-mode .progress,
  body.audience-mode .drawer,
  body.audience-mode .notes-drawer,
  body.audience-mode .footer-left,
  body.audience-mode #overviewBtn,
  body.audience-mode #notesBtn,
  body.audience-mode #printBtn,
  body.audience-mode #presenterBtn {
    display: none !important;
  }
  body.audience-mode .footer {
    position: fixed;
    top: 12px;
    right: 12px;
    left: auto;
    bottom: auto;
    min-height: 0;
    padding: 0;
    border: 0;
    background: transparent;
    z-index: 40;
  }
  body.audience-mode .footer-right {
    display: block;
  }
  body.audience-mode #fullscreenBtn {
    width: 32px;
    height: 32px;
    padding: 0;
    border-radius: 999px;
    background: #fffdf2b8;
    border-color: #17202a33;
    box-shadow: 0 4px 14px #17202a18;
    color: var(--ink);
    opacity: 0.6;
  }
  body.audience-mode #fullscreenBtn:hover,
  body.audience-mode #fullscreenBtn:focus {
    opacity: 1;
  }
  .audience-fullscreen-prompt {
    display: none;
  }

  /* ADR-0018: slide internals follow the STAGE, not the window — on a scaled fixed canvas the
     stage is always 1280px, so a slide never reflows. The deck footer is chrome and still adapts
     to the actual window. */

  /* === Container-mode renderings (ADR-0007, Task 6) ==========================================
     Painted at runtime onto the active slide (and the presenter preview clones) when the current
     beat is a grid / grid-return / contents beat. Colour follows the SECTION accent: --sc is the
     section colour (= the slide's inline --accent), --sct its 12% tint (no tint var exists in the
     runtime; color-mix is the established pattern). Maps the locked mockup
     (docs/design/2026-07-09-container-modes/mockup-card-table.html) onto current runtime tokens:
     mockup --white→--panel, --grey→--muted, --hair→--line. */
  .ct-host { --sc: var(--accent); --sct: color-mix(in srgb, var(--accent) 12%, white); }
  .ct-overlay { position: absolute; inset: 0; z-index: 4; }

  /* Card Table (grid / grid-return): the section's own content is replaced by the card grid. */
  .ct-grid-host > .slide-content { display: none; }
  .ct-grid {
    background: var(--paper);
    display: grid; place-content: center; align-content: center; gap: 2.6cqh;
    padding: var(--slide-pad-y) var(--slide-pad-x);
  }
  .ct-grid-head { display: grid; gap: 1.2cqh; }
  .ct-kicker {
    margin: 0; font-family: var(--mono); font-size: max(11px, 1.1cqw);
    letter-spacing: .2em; text-transform: uppercase; color: var(--sc); font-weight: 600;
  }
  .ct-title {
    margin: 0; font-family: var(--sans); font-weight: 500; line-height: 1.04;
    font-size: max(28px, 3.6cqw); max-width: 24ch; color: var(--ink);
  }
  .ct-cards {
    display: grid; grid-template-columns: repeat(var(--ct-cols, 4), 1fr); gap: 1.4cqw;
  }
  .ct-card {
    text-align: left; font: inherit; cursor: pointer;
    background: var(--tint); border: 1.5px solid var(--hairline); border-radius: 0;
    padding: 3.4cqh 1.8cqw 3cqh; display: grid; gap: 1.4cqh; align-content: start;
    min-height: 32cqh; position: relative; transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .ct-card:focus-visible { outline: 2px solid var(--sc); outline-offset: 2px; }
  .ct-card .ct-n { font-family: var(--mono); font-size: max(14px, 1.3cqw); color: var(--muted); letter-spacing: .08em; }
  .ct-card .ct-t { font-size: max(31px, 2.9cqw); font-weight: 600; line-height: 1.16; color: var(--ink); }
  .ct-card .ct-mini { height: 4.2cqh; border-radius: 5px; background: var(--sct); position: relative; overflow: hidden; }
  .ct-card .ct-mini::before { content: ""; position: absolute; left: 10%; top: 26%; width: 55%; height: 8%; background: var(--sc); opacity: .55; border-radius: 2px; }
  .ct-card .ct-mini::after { content: ""; position: absolute; left: 10%; top: 48%; width: 75%; height: 6%; background: var(--ink); opacity: .18; border-radius: 2px; }
  .ct-card.next { border-color: var(--sc); border-width: 2.5px; box-shadow: 0 10px 28px color-mix(in srgb, var(--sc) 15%, transparent); }
  .ct-card.next .ct-n::after { content: "  · next"; color: var(--sc); }
  .ct-card.done { background: var(--sct); border-color: transparent; }
  .ct-card.done .ct-t { color: var(--muted); font-weight: 500; }
  .ct-card.done .ct-mini { opacity: .35; }
  .ct-card.done::after { content: "✓"; position: absolute; top: 1.1cqh; right: .9cqw; font-size: max(13px, 1.4cqw); color: var(--sc); font-weight: 700; }

  /* Contents: THIN agenda rail (max 14vw per the taste rules). */
  .ct-rail-host { --ct-rail-w: max(150px, 13.5cqw); }
  .ct-rail-host > .slide-content { padding-left: var(--ct-rail-w); }
  .ct-rail {
    position: absolute; left: 0; top: 0; bottom: 0; width: var(--ct-rail-w);
    background: var(--sct); padding: 4cqh 1.1cqw; display: grid; align-content: center; gap: 1.9cqh; z-index: 3;
  }
  .ct-rail .ct-rail-kicker {
    margin: 0; font-family: var(--mono); font-size: max(9px, .8cqw); letter-spacing: .16em;
    text-transform: uppercase; color: var(--sc); font-weight: 600; line-height: 1.5;
  }
  .ct-item {
    display: grid; grid-template-columns: 1.5em 1fr; gap: .4cqw; align-items: baseline;
    font-size: max(11px, 1.05cqw); color: var(--muted); line-height: 1.25;
  }
  .ct-item .ct-item-no { font-family: var(--mono); font-size: .82em; }
  .ct-item.done .ct-item-no { color: var(--sc); }
  .ct-item.done .ct-item-lbl { opacity: .75; }
  .ct-item.now { color: var(--ink); font-weight: 600; }
  .ct-item.now .ct-item-no { color: var(--sc); }

  /* Contents: FILMSTRIP variant ({contents=strip}) — contact-sheet footer of miniatures. */
  .ct-strip-host > .slide-content { padding-bottom: 13cqh; }
  .ct-strip {
    /* overrides .ct-overlay's inset:0 top so the strip sits as a 13cqh FOOTER, not full-height. */
    position: absolute; left: 0; right: 0; top: auto; bottom: 0; height: 13cqh; border-top: 1px solid var(--line);
    display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 1.8cqw;
    padding: 0 var(--slide-pad-x); background: var(--paper); z-index: 3;
  }
  .ct-strip .ct-strip-kicker {
    margin: 0; font-family: var(--mono); font-size: max(9px, .8cqw); letter-spacing: .16em;
    text-transform: uppercase; color: var(--sc); font-weight: 600; max-width: 11ch; line-height: 1.5;
  }
  .ct-shots { display: grid; grid-auto-flow: column; grid-auto-columns: 9.5cqw; gap: .9cqw; align-items: center; overflow: hidden; }
  .ct-shot {
    aspect-ratio: 16 / 9; border: 1px solid var(--line); border-radius: 5px; background: var(--tint);
    position: relative; overflow: hidden; transition: outline-color .2s ease;
  }
  /* Real slide miniature (ADR-0007: the strip shows the slides themselves): a prepared clone of
     the child slide laid out at full stage size (cqw/cqh units inside slides resolve against the
     stage — the slideThumb pattern) and scaled as one rigid unit into the 9.5cqw shot
     (scale = 9.5cqw / 100cqw = .095, stage-independent so it also holds inside the fixed
     1280×720 presenter-preview iframe). */
  .ct-shot .ct-shot-mini {
    position: absolute; left: 0; top: 0; width: 100cqw; height: 56.25cqw;
    transform: scale(.095); transform-origin: top left; pointer-events: none;
  }
  .ct-shot .ct-shot-mini .slide { display: grid !important; position: absolute; inset: 0; }
  .ct-shot .ct-mini-ph {
    display: grid; place-items: center; width: 100%; height: 100%; min-height: 8em;
    background: var(--sct); color: var(--muted); font-family: var(--mono); font-size: 2em; border-radius: 8px;
  }
  .ct-shot.now { outline: 2.5px solid var(--sc); outline-offset: 2px; }
  .ct-shot.done { filter: grayscale(1); opacity: .45; }
  .ct-shot.done::after {
    content: "✓"; position: absolute; top: 5%; right: 5%; width: 1.35em; height: 1.35em;
    display: grid; place-items: center; font-size: max(8px, .9cqw); font-weight: 700;
    color: var(--tint); background: var(--sc); border-radius: 50%; filter: none;
  }

  /* Print / PDF export iterates SLIDES, not beats (ADR-0007 §consequences): a grid section prints
     once as its plain section slide. Hide the runtime-injected container chrome and restore the
     section's own content so print is never broken by an overlay. */
  @media print {
    .ct-overlay { display: none !important; }
    .ct-grid-host > .slide-content { display: grid !important; }
    .ct-rail-host > .slide-content { padding-left: 0 !important; }
    .ct-strip-host > .slide-content { padding-bottom: 0 !important; }
  }

  @media print {
    /* One slide per landscape page: the screen slide, scaled uniformly to the paper (ADR-0018: slides
       scale, they do not reflow). For the print, slideFit.preparePrint gives every slide a parent
       canvas (.tw-print-canvas), a 1280x720 size container like the projector's stage, so the slide
       keeps every screen rule (its padding, background and rail) and every cqw/cqh resolves as on
       screen; it fits each slide in this layout before the browser paginates. */
    @page { size: landscape; margin: 8mm; }
    html, body { background: #fff; height: auto; overflow: visible; }
    .footer, .drawer, .notes-drawer, .progress, .presenter-root { display: none !important; }
    /* The presenter window prints the deck, not the presenter's console: nothing beside the deck prints
       (the console, and every notice, toast, prompt, bar or palette the app lays over it). */
    body.presenter-mode .deck { display: block !important; }
    body.presenter-mode > :not(.deck) { display: none !important; }
    .deck { display: block; position: static; height: auto; min-height: 0; overflow: visible; background: none !important; container-type: inline-size; }
    .deck > .stage { position: static; display: block; width: 1280px; height: auto; overflow: visible; transform: none !important; container-type: normal; zoom: calc(100cqw / 1280px); }
    .stage > .tw-print-canvas { position: relative; display: block; box-sizing: border-box; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; container-type: size; break-after: page; break-inside: avoid; }
    .stage > .tw-print-canvas > .slide { display: grid !important; position: absolute; inset: 0; }
    .stage > :last-child { break-after: auto; }
    /* The side rail spans 99 grid rows (grid-row: 1 / span 99), so any row gap is paid 98 times. The
       fixed 1280px canvas never enters the narrow-stage rules; a narrow print fallback (a slide at a
       portrait paper's width, below) does, and its list and statement rules (row-gap: 20px) would push
       a rail slide's later items off the page. There, and only there, the rail takes no row gaps. */
    @container (max-width: 950px) {
      .slide:is([data-title-layout="left"], [data-title-layout="hidden"]) > .slide-content { row-gap: 0 !important; }
    }
    /* The one paper exception to "the screen slide, scaled": a rail statement with a picture stacks the
       picture over its paragraphs (layouts/statement.css), but a picture written after the paragraphs
       leaves the first one on the 99-row span and the rest below the slide, on screen as in 0.44.0.
       0.44.0's flowing print still showed them; on paper every paragraph takes its own row below the
       picture, so none is lost. */
    .slide:is([data-title-layout="left"], [data-title-layout="hidden"]) > .slide-content.layout-statement:has(> .slide-figure) > :not(.slide-head):not(.slide-figure) { grid-row: auto !important; }
    /* Speaker notes print under their slide's box (moved after the slide for the print). */
    .deck > .stage > .tw-print-canvas:has(+ aside.notes) { break-after: avoid; }
    .deck > .stage > aside.notes { break-after: page; break-inside: auto; }
    aside.notes {
      display: block;
      margin-top: 32px;
      padding: 18px;
      border: 1px solid #bbb;
      background: #f7f7f7;
      color: #333;
    }
    [data-fragment].hidden-fragment { opacity: 1; transform: none; }
    /* A video prints its poster, its current frame or its placeholder note (slideFit.preparePrint). */
    figure.tw-print-video-on > video { display: none !important; }
    figure.tw-print-video-on > img.tw-print-video, figure.tw-print-video-on > canvas.tw-print-video { display: block; width: 100%; height: auto; max-height: 100%; object-fit: contain; }
    figure.tw-print-video-on > .video-placeholder-note.tw-print-video { display: flex; }
    /* A carousel prints one page per item (slideFit.preparePrint clones the slide per item). */
    .carousel-print-src { display: none !important; }
  }

  /* === Reveal / Focus stepping modes (Dominik's redesign) ===
     Two OPTIONAL, mutually-exclusive modes that step through a slide's content units one at
     a time. Default is neither: every element renders fully visible and → advances the slide.
     Both modes share one stepping grammar; only the resting/dim treatment differs.

     The runtime tags each content unit (.mode-el) with a per-element state attribute so the
     CSS below paints it. Layout is NEVER touched — reveal "hidden" elements keep their space
     (opacity/visibility only, see .mode-el rule) so the slide does not reflow per step.
     Title/kicker stay fully visible in both modes. The same classes are baked statically into
     the presenter Current-preview clone (.mode-el + data-mode-state) so it mirrors exactly. */
  .slide.mode-active .mode-el {
    transition: opacity 220ms ease, filter 220ms ease;
  }
  /* REVEAL — step 0: all hidden; revealed-but-older soften to ~0.75; newest + full state full. */
  .slide.mode-reveal .mode-el[data-mode-state="hidden"] {
    opacity: 0;
    visibility: hidden;
  }
  .slide.mode-reveal .mode-el[data-mode-state="soft"] { opacity: 0.75; }
  /* Sub-bullet stepping (2026-06-13): a top-level bullet is a unit AND its sub-bullets are units.
     CSS opacity compounds, so a parent softened to 0.75 would cap a "current" child at 0.75 too.
     A parent that still CONTAINS a tagged child stays fully opaque — it is the live context for
     its sub-bullets, not an old/faded line. (Grouped lists never match: their bullets are not
     mode-els, so [data-reveal-group] has no .mode-el descendant and dims as one whole.) */
  .slide.mode-reveal .mode-el[data-mode-state="soft"]:has(.mode-el[data-mode-state]) { opacity: 1; }
  .slide.mode-focus .mode-el[data-mode-state="soft"]:has(.mode-el[data-mode-state]),
  .slide.mode-focus .mode-el[data-mode-state="fuzzy"]:has(.mode-el[data-mode-state]) { opacity: 1; filter: none; }
  .slide.mode-reveal .mode-el[data-mode-state="current"],
  .slide.mode-reveal .mode-el[data-mode-state="full"] { opacity: 1; }
  /* FOCUS — step 0: all fuzzy (~0.15 + blur); visited soften to ~0.6; current/full sharp. */
  .slide.mode-focus .mode-el[data-mode-state="fuzzy"] {
    opacity: 0.15;
    filter: blur(2px);
  }
  .slide.mode-focus .mode-el[data-mode-state="soft"] {
    opacity: 0.6;
    filter: none;
  }
  .slide.mode-focus .mode-el[data-mode-state="current"],
  .slide.mode-focus .mode-el[data-mode-state="full"] {
    opacity: 1;
    filter: none;
  }
  /* Presenter Current-preview mirror — same selectors, applied to the cloned slide which
     carries .mode-reveal/.mode-focus + .mode-active on its root and data-mode-state per unit. */
  /* Mode banner (top-centre toast, on-palette). Reused name kept for sync simplicity. */
  .focus-banner {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    z-index: 90;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border-radius: 999px;
    background: var(--tint);
    border: 1px solid var(--accent);
    color: var(--ink);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.16);
    font: 600 13px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms ease, transform 200ms ease;
  }
  .focus-banner.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .focus-banner kbd {
    font: inherit;
    font-weight: 700;
    color: var(--accent);
  }
  @media print { .focus-banner { display: none !important; } }
  /* F1 — live highlight sync. The presenter's highlight wraps the chosen text in <mark.hl-mark>;
     the same mark is reproduced on the audience slide. A warm translucent wash keeps the text
     fully readable (no boxed background that fights the slide's own type). Spanning nested
     markup (<strong> etc.) produces several adjacent marks, so they must read as one continuous
     stroke — no per-mark padding, inherit colour/weight. */
  mark.hl-mark {
    background: linear-gradient(transparent 8%, rgba(255, 209, 102, 0.62) 8%, rgba(255, 209, 102, 0.62) 92%, transparent 92%);
    color: inherit;
    padding: 0;
    border-radius: 2px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  /* Presenter Current preview shows the same marks (baked into the clone), so the speaker sees
     exactly what the audience sees. While highlight mode is armed, the preview is selectable. */
  .presenter-root.highlight-armed .presenter-main > .presenter-panel:first-child .preview iframe {
    pointer-events: auto;
    cursor: text;
  }
  .presenter-root.highlight-armed .presenter-main > .presenter-panel:first-child {
    outline: 2px solid var(--accent, #e0a93b);
    outline-offset: -2px;
  }
  /* Print: every element fully visible regardless of mode state. */
  @media print {
    .slide.mode-active .mode-el { opacity: 1 !important; visibility: visible !important; filter: none !important; }
  }
  /* Presenter mode-toggle button active states. */
  #presenterReveal.active,
  #presenterFocus.active { background: #2f6db5; border-color: #2f6db5; color: #fff; font-weight: 600; }

  /* === TITLE PLACEMENT — the locked deck-wide default (2026-06-09 title spec) ===
     ONE data-driven title system, applied by the generator's data-title-layout / data-split
     attributes on the slide <section>:
       data-title-layout="left"  → title in a LEFT rail (35/65 by default; data-split=30|50 tunes
                                    it), the rail vertically centred; all other content fills the
                                    right column. The default for text/list/statement/contrast/
                                    image-claim/quote and the vertical timelines.
       data-title-layout="top"   → a small title bar on TOP, content full width below. The default
                                    for wide layouts (columns, media, big diagrams, horizontal
                                    timeline) and the {titletop} override on any slide.
     Structural/centred layouts (title, section/subsection divider, closing) and self-columned ones
     (cards, copy-visual, code, trace, list-visual) carry NO data-title-layout and keep their own
     treatment. These rules turn .slide-content into the grid and re-home its children, overriding
     each layout's bespoke grid — so the placement is uniform regardless of the slide's layout. */

  /* LEFT rail (ADR-0005 title-as-sidebar, Gate B fix): the rail is the LEFTMOST band —
     flush with the slide edge — and the slide spans the FULL stage (the 1180px content box
     was floating the rail mid-slide). Content in column 2 gets the remaining width at a
     larger reading size. Split via data-split. */
  .slide[data-title-layout="left"] { --rail-w: max(260px, 26cqw); }
  .slide[data-title-layout="left"][data-split="30"] { --rail-w: max(240px, 30cqw) !important; }
  .slide[data-title-layout="left"][data-split="35"] { --rail-w: max(280px, 35cqw) !important; }
  .slide[data-title-layout="left"][data-split="40"] { --rail-w: max(300px, 40cqw) !important; }
  .slide[data-title-layout="left"][data-split="50"] { --rail-w: max(340px, 50cqw) !important; }
  /* The tint rail is painted on the SLIDE (full height by construction) — pseudo-element and
     grid-row tricks either inflated scrollHeight (autofit zoomed the slide to 0.45) or
     centre-packed with the grid rows. --rail-w keeps paint and column in lockstep. */
  .slide[data-title-layout="left"]:has(> .slide-content > .slide-head:not(.slide-head-quiet)) {
    padding: 0;
    background: linear-gradient(to right, var(--tint) 0, var(--tint) var(--rail-w), transparent var(--rail-w));
  }
  .slide[data-title-layout="left"]:has(> .slide-content > .slide-head:not(.slide-head-quiet)) > .slide-content {
    display: grid !important;
    width: 100%;
    max-width: none;
    min-height: 100%;
    margin: 0;
    grid-template-columns: var(--rail-w) 1fr !important;
    /* Ticket 21 (Dominik: "larger left and top/bottom padding"): the content column takes the
       locked mockup's `.t-side .content { padding: 6vh 5vw }` — 5cqw of column gap between the
       rail and the copy (was 4cqw), 6cqh of air above and below the column (was none: a tall list
       ran to the slide edge), never less than the 61px footer band so the column clears the fixed
       footer at every stage height. The right inset stays the slide safe area (--slide-pad-x). */
    column-gap: clamp(40px, 5cqw, 96px);
    padding-top: max(6cqh, 61px);
    padding-bottom: max(6cqh, 61px);
    padding-right: var(--slide-pad-x);
    align-content: center;
    align-items: center;
    text-align: left;
  }
      /* Rail text keeps the safe-area inset even though the band touches the edge. */
  .slide[data-title-layout="left"] > .slide-content > .slide-head:not(.slide-head-quiet) {
    padding-left: var(--slide-pad-x);
  }
  /* The right column reads LARGE — the rail earns its keep by giving the content room. */
  .slide:is([data-title-layout="left"], [data-title-layout="hidden"]) > .slide-content > .content-p:not(.card-comment) { font-size: var(--copy-size, max(var(--type-floor), 3.2cqw)); max-width: 40ch; }
  /* ADR-0005 title-as-sidebar (mockup .t-side): the rail is a SECTION-TINT panel — kicker in
     the accent, title in ink, vertically centred, stretching the column's full height. */
  .slide:is([data-title-layout="left"], [data-title-layout="hidden"]) > .slide-content > .slide-head {
    display: grid !important;
    align-content: center;
    grid-column: 1 !important;
    grid-row: 1 / span 99 !important;
    place-content: center;
  }
  /* The tint rail paints ONLY a VISIBLE head — a nav-only quiet head must stay invisible
     (painting it produced stray floating tint bars on statement/quote slides). The rail
     runs the column's FULL height via an oversized ::before clipped by the slide. */
  .slide[data-title-layout="left"] > .slide-content > .slide-head:not(.slide-head-quiet) {
    position: relative;
    /* Only this VISIBLE rail stretches to the column's full height. A quiet head used to get the
       same `min-height: 100%` (rule 1347 covered every head), which made a nav-only, paint-nothing
       header a slide-tall box: in a block-flow body (a media slide with a local embed) it pushed
       the embed down to y = slide height, off the stage, the audience screen, Current and Next. */
    align-self: stretch !important;
    min-height: 100%;
    padding: clamp(24px, 4cqh, 48px) clamp(28px, 2.6cqw, 72px);
    /* ADR-0028 §4: a visible rail title sits on the rail's left inset whatever its length —
       `place-content: center` (1347) centred a short title's column across the rail. Vertical
       centring (align-content) is unchanged. */
    justify-content: start;
    justify-items: start;
  }
  .slide:is([data-title-layout="left"], [data-title-layout="hidden"]) > .slide-content > .slide-head > h1 { max-width: 14ch; }
  .slide[data-title-layout="left"] > .slide-content > ol.timeline {
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    min-height: 62cqh;
  }
  .slide[data-title-layout="left"] .slide-content > .feature-list { row-gap: clamp(12px, 2.8cqh, 44px); }
  /* {sidebar}/{title=side}: the ADR-0005 tint rail above (the pre-rewrite blue panel stays
     retired; the tint panel is the locked replacement).
     data-title-style="sidebar" may still be stamped by legacy {titlestyle=sidebar}; it is inert. */
  /* Every non-title direct child fills the right content column (feature-list, figure,
     columns-grid, lv/tv body, diagram svg, prose, blockquote, statement paragraphs …). */
  .slide:is([data-title-layout="left"], [data-title-layout="hidden"]) > .slide-content > *:not(.slide-head) {
    grid-column: 2 !important;
    grid-row: 1 / span 99 !important;
    align-self: center;
    min-width: 0;
    max-width: 100%;
  }
  /* Trailing siblings after the first flow under it in the same column (multi-paragraph
     statements, a source line, an action row): let them take auto rows rather than stack on row 1. */
  .slide:is([data-title-layout="left"], [data-title-layout="hidden"]) > .slide-content > *:not(.slide-head) ~ *:not(.slide-head) {
    grid-row: auto !important;
    margin-top: clamp(20px, 5cqh, 72px);
  }
  /* {notitle} on a left-rail layout: the heading is nav-only (.slide-head-quiet, sr-only h1), so
     the empty 35% rail would just be dead space. Collapse to a single full-width column and let the
     content span it — the title-less statement then genuinely owns the whole slide (full-bleed). */
  .slide:is([data-title-layout="left"], [data-title-layout="hidden"]) > .slide-content:has(> .slide-head-quiet) {
    grid-template-columns: 1fr !important;
  }
  .slide:is([data-title-layout="left"], [data-title-layout="hidden"]) > .slide-content:has(> .slide-head-quiet) > *:not(.slide-head) {
    grid-column: 1 !important;
  }
  /* …EXCEPT a quote slide carrying a figure (2026-06-09): the pair keeps its two-column
     image-beside-quote arrangement even though the (quiet-headed) rail collapsed. */
  .slide:is([data-title-layout="left"], [data-title-layout="hidden"]) > .slide-content.layout-quote:has(> .slide-figure) {
    grid-template-columns: minmax(0, 0.62fr) minmax(0, 1fr) !important;
    column-gap: clamp(28px, 3.2cqw, 56px);
    align-items: center;
  }
  .slide:is([data-title-layout="left"], [data-title-layout="hidden"]) > .slide-content.layout-quote:has(> .slide-figure) > .slide-figure {
    grid-column: 1 !important;
    grid-row: 1 !important;
  }
  .slide:is([data-title-layout="left"], [data-title-layout="hidden"]) > .slide-content.layout-quote:has(> .slide-figure) > blockquote {
    grid-column: 2 !important;
    grid-row: 1 !important;
  }

  /* TOP title bar: title stacks above full-width content. The fix for the old "List D" overflow
     is here — .slide-head is a real grid row with its OWN track (grid-template-rows: auto 1fr) and
     a bottom margin, so the H1 can never overlap the content beneath it; the content row takes the
     remaining height and starts cleanly below the bar. */
  .slide[data-title-layout="top"] > .slide-content {
    display: flex !important;
    flex-direction: column !important;
    justify-content: flex-start;
    align-items: stretch;
    text-align: left;
  }
  /* The title bar sits at the TOP of the slide, LEFT-aligned (reset any align-self: center a
     layout like list/contrast would otherwise impose on the head in this flex column). */
  .slide[data-title-layout="top"] > .slide-content > .slide-head {
    display: block !important;
    flex: 0 0 auto !important;
    align-self: flex-start !important;
    text-align: left !important;
    margin: 0 0 2.2cqh !important;
  }
  /* The content below the top bar centres in the remaining space (leading/trailing auto margins
     absorb the free space, so a short list/figure sits mid-stage rather than hugging the title). */
  .slide[data-title-layout="top"] > .slide-content > .slide-head + * { margin-top: auto !important; }
  .slide[data-title-layout="top"] > .slide-content > *:last-child:not(.slide-head) { margin-bottom: auto !important; }
  /* The top-title bar reads as a compact band: a touch smaller than the rail H1 so the visual
     below owns the stage, with a thin accent underline marking the bar. */
  .slide[data-title-layout="top"] > .slide-content > .slide-head > h1 {
    /* 2026-07-08: full-width single line (was max-width: 32ch, which wrapped long titles). */
    max-width: none;
    font-size: max(22px, 3.1cqw);
    /* ADR-0005: no decorative underlines — whitespace separates the bar from the stage. */
    padding-bottom: 0.18em;
  }
  /* All non-title children stack in normal document flow BELOW the bar, full width. A flex column
     guarantees the title can never overlap the content (the old List D top-title bug): the head is
     its own non-shrinking flex item, the content follows after it. */
  .slide[data-title-layout="top"] > .slide-content > *:not(.slide-head) {
    flex: 0 1 auto;
    min-width: 0;
    max-width: 100%;
    width: 100%;
  }

  /* corner-section: quiet top-right label (SD-8, Wave 1 task 3) */
  .slide .corner-section {
    position: absolute;
    top: 4%;
    right: 5%;
    font-size: max(0.55rem, 1.4cqw);
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--faint, rgba(0,0,0,0.25));
    pointer-events: none;
  }

  /* ===== ADR-0005 PRECEDENCE REPAIRS (end of cascade — these win ties) ===== */
  /* A statement-family slide with a nav-only (quiet) head must NOT become a left-rail
     two-column slide: the rail override was flattening the statement's measure
     (max-width: 100%) and pushing the block into column 2. Restore the centred
     single-column statement with the binding readability measures. */
  .slide[data-title-layout="left"] .slide-content.layout-statement:has(> .slide-head-quiet),
  .slide[data-title-layout="hidden"] .slide-content.layout-statement:has(> .slide-head-quiet) {
    display: grid !important;
    grid-template-columns: 1fr !important;
    justify-items: start;
    align-content: center;
  }
  .slide[data-title-layout="left"] .slide-content.layout-statement:has(> .slide-head-quiet) > *:not(.slide-head),
  .slide[data-title-layout="hidden"] .slide-content.layout-statement:has(> .slide-head-quiet) > *:not(.slide-head) {
    grid-column: 1 !important;
    align-self: center;
    max-width: 14em; /* ADR-0028 §1 (was 12em) */
    border-left: 0;
    padding-left: 0;
  }
  /* Statement paragraphs never carry the content-p accent bar, wherever they appear. */
  .slide-content.layout-statement > p.content-p { border-left: 0; padding-left: 0; }
  /* Inside a container-mode host (contents rail / grid / strip) the SECTION owns the left
     band — the child slide's own title rail must not paint a second tint column. */
  .slide.ct-rail-host .slide-content > .slide-head:not(.slide-head-quiet),
  .slide.ct-grid-host .slide-content > .slide-head:not(.slide-head-quiet),
  .slide.ct-strip-host .slide-content > .slide-head:not(.slide-head-quiet) { background: none; }
  .slide.ct-rail-host .slide-content > .slide-head:not(.slide-head-quiet)::before,
  .slide.ct-grid-host .slide-content > .slide-head:not(.slide-head-quiet)::before,
  .slide.ct-strip-host .slide-content > .slide-head:not(.slide-head-quiet)::before { display: none; }
  /* Title slides are POSTERS, never left-rail slides — whatever title placement got stamped.
     Re-assert the poster grid over the rail system (same trick as the statement repair). */
  .slide[data-title-layout="left"] .slide-content.layout-title {
    grid-template-columns: 1fr !important;
    grid-template-rows: auto 1fr auto !important;
    width: 100% !important;
    max-width: none !important;
    margin: 0 !important;
  }
  .slide[data-title-layout="left"]:has(> .slide-content.layout-title) { padding-left: var(--slide-pad-x); }
  .slide[data-title-layout="left"] .slide-content.layout-title > .slide-head {
    grid-column: 1 !important;
    grid-row: 2 !important;
    align-self: center !important;
    justify-self: center;
    background: none;
    padding: 0;
  }
  .slide[data-title-layout="left"] .slide-content.layout-title > .slide-head::before { display: none; }
  .slide[data-title-layout="left"] .slide-content.layout-title > *:not(.slide-head) {
    grid-column: 1 !important;
    grid-row: 3 !important;
    align-self: end;
    max-width: none;
  }

  /* ===================================================================================
     ADR-0005 FIDELITY LAYER — ported from the LOCKED mockup round-2-structure-refined.html.
     The mockup is the spec; these rules sit at the very end of the cascade and express the
     mockup's design verbatim: em sizes against ONE proportional base per slide, so the
     mockup's proportions hold at any stage size. (Dominik, 2026-07-11: "every single design
     in there must be represented fully".)
     =================================================================================== */
  .slide { font-size: max(24px, 2.05cqw); }

  /* .box — the mockup's emphasis device: accent plate behind the key phrase, cloned per line */
  .slide-content.layout-statement strong,
  .slide-content.layout-section-title h1 strong,
  .slide-content.layout-compare strong,
  .slide-content.layout-quote blockquote strong,
  .image-quote blockquote strong {
    background: var(--accent);
    color: var(--paper);
    padding: .04em .18em;
    border-radius: .08em;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }

  /* Statement (mockup .t-statement): weight 500, tight measure, centred by the layout */
  .slide-content.layout-statement > p,
  .slide-content.layout-statement > .content-p {
    font-weight: 500;
    font-size: max(38px, 5.4cqw);
    /* ADR-0028 §1: more line spacing and a longer measure (were 1.3 and 12em); type unchanged. */
    line-height: 1.5;
    letter-spacing: -.02em;
    max-width: 14em;
  }

  /* Section divider (mockup .t-section): full-bleed tint, centred title */
  .slide:has(> .slide-content.layout-section-title) { background: var(--tint); }
  .slide-content.layout-section-title h1 {
    font-weight: 700;
    font-size: max(38px, 5.6cqw);
    line-height: 1.3;
    letter-spacing: -.025em;
    max-width: 12em;
  }
  /* ADR-0023 §9 continuation mark: parts 1..n−1 of a split quote say "n / N" in small mono chrome
     at the panel's bottom-right, inside the padding so the text block keeps its budget. The doctor
     lists .quote-continuation as small chrome. */
  .slide-content.layout-quote > blockquote {
    background: var(--tint);
    border-left: .22em solid var(--accent);
    border-radius: 0;
    box-shadow: none;
    margin: 0;
    padding: 1.4em 1.6em 1.2em 2.4em;
    width: min(84cqw, 100%);
    max-width: none;
    --quote-fitted-size: max(31px, 3.4cqw);
    font-family: var(--sans);
    font-weight: 400;
    font-size: var(--quote-fitted-size);
    line-height: 1.42;
    letter-spacing: -.01em;
  }
  .slide-content.layout-quote > blockquote::before {
    content: "\201C";
    position: absolute;
    left: .28em;
    top: .18em;
    font-size: 2.6em;
    line-height: 1;
    font-family: Georgia, serif;
    font-weight: 700;
    color: var(--accent);
    opacity: 1;
  }
  .slide-content.layout-quote > blockquote p { max-width: 34em; }
  .slide-content.layout-quote > blockquote cite,
  .slide-content.layout-quote > blockquote + cite {
    display: flex;
    align-items: center;
    gap: 1em;
    margin-top: 1.2em;
    font-style: normal;
    font-family: var(--sans);
    font-size: max(var(--type-floor), .58em);
    font-weight: 600;
    color: var(--ink);
    letter-spacing: .01em;
  }
  .slide-content.layout-quote > blockquote cite::before {
    content: "";
    flex: none;
    width: 3em;
    height: 2px;
    background: var(--accent);
  }

  /* Icon list (LOCKED mockup slide 4 renders the icon list as NUMBERED ICON CARDS in a grid,
     not flat rows): hairline card, accent icon top, label, mono index bottom. */
  .slide-content > .feature-list:not(.fl-annotated):has(.fl-icon),
  .slide-content > .feature-list.fl-wide:not(.fl-annotated):has(.fl-icon) {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(16ch, 100%), 1fr));
    /* ADR-0028 §5: cards read at the body size, so the gutter between them tightens (.55em -> .4em). */
    gap: .4em;
    align-content: center;
    max-width: none;
  }
  .slide-content > .feature-list:not(.fl-annotated):has(.fl-icon) > li,
  .slide-content > .feature-list.fl-wide:not(.fl-annotated):has(.fl-icon) > li {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    /* ADR-0028 §4: cards stack from the top, so every card's heading sits at one height
       (space-between pushed each heading down by its own card's spare height). */
    justify-content: flex-start;
    /* ADR-0028 §5: cards spend their padding before their type (padding 1em .8em -> .8em .6em, gap
       .9em -> .5em, no 21vh floor); both vertical spacings ride --list-gap, so fitLists' spacing
       step tightens them further before it steps the type. */
    gap: calc(.5em * var(--list-gap, 1));
    border: 1px solid var(--hairline);
    padding: calc(.8em * var(--list-gap, 1)) .6em;
    min-height: 0;
    font-size: max(26px, 1.05em);
    font-weight: 500;
    line-height: 1.25;
  }
  .slide-content > .feature-list:not(.fl-annotated):has(.fl-icon) > li::before { display: none; }
  /* Slide round 2 (0.37): an annotated list beside the rail keeps the base rail width (the title needs no
     more; the 35cqw above is for sparse slides), halves the column's top and bottom air (6cqh -> 3cqh,
     never under 40px) and narrows the column gap, so the annotations get the width instead of wrapping. */
  /* T28 (Dominik, 2026-09-17): the boxes variant carries no `01/02` mono numbers any more —
     numbering stays the explicit authoring choice ({cards numbered}). And the 1.8em icon
     sizing is scoped to the TOP-LEVEL icon only: the old `li svg` descendant selector also
     hit the nested .fl-sub-icon svgs, blowing a ~47px glyph out of its 20px box and over
     the sub-bullet text. Nested sub-icons keep base.css's 20px box with the svg inside it. */
  /* words never wrap one-per-line: cards keep a readable min width and text keeps words whole */
  .slide-content > .feature-list:not(.fl-annotated):has(.fl-icon) > li { overflow-wrap: normal; word-break: keep-all; hyphens: none; }

  /* Card gallery (mockup .cards): flat hairline cards, numbered, icon top / label / index bottom */
  .card-gallery.cards-numbered { counter-reset: twcard; }
  .card-gallery .card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
    gap: .9em;
    border: 1px solid var(--hairline);
    border-radius: 0;
    box-shadow: none;
    background: var(--paper);
    padding: 1em .9em;
    min-height: 21cqh;
  }
  .card-gallery.cards-numbered .card { counter-increment: twcard; }
  .card-gallery .card .card-icon svg, .card-gallery .card > svg {
    width: 1.8em;
    height: 1.8em;
    color: var(--accent);
    stroke-width: 1.5;
  }

  /* Title-as-sidebar panel typography (mockup .t-side .panel h3 — NOT display-scale) */
  .slide[data-title-layout="left"] > .slide-content > .slide-head:not(.slide-head-quiet) > h1 {
    font-size: max(31px, 2.9cqw);
    line-height: 1.22;
    letter-spacing: -.02em;
    font-weight: 700;
  }
  .slide[data-title-layout="left"] > .slide-content > .slide-head:not(.slide-head-quiet) .kicker {
    font-family: var(--mono);
    font-size: max(14px, 1.15cqw);
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 400;
  }
  /* Dominik's one correction TO the lock (2026-07-11): with text-only content the 26% rail
     reads too narrow — text-only rail slides get a wider panel so the two columns balance. */
  .slide[data-title-layout="left"]:has(> .slide-content > .slide-head:not(.slide-head-quiet)):not(:has(.slide-figure)):not(:has(.slide-table)):not(:has(.card-gallery)):not(:has(.timeline)):not(:has(svg)):not(:has(.chart-cols)):not(:has(.icon-row)):not(:has(.fl-annotated)) {
    --rail-w: max(320px, 35cqw);
  }

  /* ADR-0005 deck font options (frontmatter `font:`): Gill Sans and Verdana are the sanctioned
     alternatives; everything else rides the Trebuchet default. */
  .deck[data-deck-font="gill-sans"], .slide[data-deck-font="gill-sans"] { --sans: "Gill Sans", "Gill Sans MT", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .deck[data-deck-font="verdana"], .slide[data-deck-font="verdana"] { --sans: Verdana, system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* ── FIDELITY BATCH 2 (mockup slides 3, 3b, 9, 10, 13, 14, 14e, 17, 18) ─────────────── */

  /* Content-slide title treatment (mockup h3.head + .meta kicker) */
  .slide:not(:is([data-title-layout="left"], [data-title-layout="hidden"])) > .slide-content:not(.layout-title):not(.layout-section-title) > .slide-head:not(.slide-head-quiet) h1 {
    font-weight: 700;
    font-size: max(34px, 3.6cqw);
    letter-spacing: -.02em;
    line-height: 1.05;
    max-width: 18em;
  }
  .kicker {
    font-family: var(--mono);
    font-size: max(14px, .55em);
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 400;
  }

  /* Horizontal timeline (mockup .tl-simple): hairline track, ring dots, mono accent dates,
     the LAST event lands filled + bold. */
  .timeline.timeline-horizontal {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    align-items: start;
    position: relative;
    border-top: 2px solid var(--hairline);
    padding-top: 1em;
    margin-top: auto;
    font-size: var(--fs-body);
  }
  .timeline.timeline-horizontal .tl-group {
    position: relative;
    padding: 0 1.4em 0 0;
    margin: 0 !important;          /* the old design staggered alternate groups */
    border: none !important;
    background: none;
    transform: none !important;
  }
  .timeline.timeline-horizontal .tl-group-head { border: none !important; background: none; padding: 0; }
  .timeline.timeline-horizontal .tl-entries li { border: none; background: none; }
  .timeline.timeline-horizontal .tl-group::before {
    content: "";
    position: absolute;
    left: 0;
    top: calc(-1em - 9px);
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--paper);
    border: 3px solid var(--accent);
  }
  .timeline.timeline-horizontal .tl-group:last-child::before { background: var(--accent); }
  .timeline.timeline-horizontal .tl-group:last-child .tl-entries li { font-weight: 600; }
  .timeline.timeline-horizontal .tl-group-head,
  .timeline.timeline-rail .tl-group-head {
    font-family: var(--sans);
    font-size: 1.25em;
    font-weight: 700;
    letter-spacing: -.01em;
    text-transform: none;
    color: var(--accent);
    line-height: 1.15;
  }
  .timeline.timeline-horizontal .tl-entries { list-style: none; margin: 0; padding: 0; border: none !important; }
  .timeline.timeline-horizontal .tl-entries li { font-size: max(var(--type-floor), 1em); line-height: 1.3; max-width: none; padding: 0; }
  .timeline.timeline-horizontal .tl-entries li::before { display: none; }

  /* Vertical timeline (mockup .tl-dyn list): 2px hairline rail, ring dots ON the rail,
     mono dates, generous rhythm. */
  .timeline.timeline-rail {
    border-left: 0; padding-left: 0; margin-top: auto; font-size: var(--fs-body); --tl-rail-x: .45em;
    display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 1.1em;
  }
  .timeline.timeline-rail .tl-group {
    position: relative; grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: baseline;
    padding: .3em 0 .3em 1.9em;
  }
  .timeline.timeline-rail .tl-group::before {
    content: "";
    position: absolute;
    left: calc(var(--tl-rail-x) - 7px);
    top: calc(1.02em - 7px);
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--paper);
    border: 3px solid var(--accent);
  }
  .timeline.timeline-rail .tl-group-head { margin: 0; }
  .timeline.timeline-rail .tl-entries li { font-size: max(var(--type-floor), 1em); line-height: 1.3; }

  /* Contrast ledger (mockup slide 13): one bordered block, halves as columns, hairline-
     separated rows; the YES side sits on tint. Neutral by default (no auto cross-out). */
  .contrast-grid {
    border: 1px solid var(--hairline);
    background: var(--paper);
  }
  .contrast-grid .contrast-pair {
    display: grid !important;
    grid-template-columns: 1fr 1fr !important;
    gap: 0 !important;
    align-items: stretch;
    border: none;
    background: none;
    padding: 0;
    margin: 0;
  }
  .contrast-grid .contrast-pair::before, .contrast-grid .contrast-pair::after { display: none !important; content: none; }
  .contrast-grid .contrast-pair .ct-left,
  .contrast-grid .contrast-pair .ct-right {
    margin: 0 !important;
    border: none;
    box-shadow: none;
    background: none;
    grid-column: auto !important;
    justify-self: stretch !important;
    align-self: stretch !important;
    text-align: left !important;
    font-weight: 400;
    font-size: max(26px, 1.05em);
    line-height: 1.35;
    padding: .55em 1em;
    border-top: 1px solid var(--hairline);
    text-align: left;
    display: block;
  }
  .contrast-grid .contrast-pair:first-child .ct-left,
  .contrast-grid .contrast-pair:first-child .ct-right { border-top: none; }
  .contrast-grid .contrast-pair .ct-left { color: var(--muted); }
  .contrast-grid .contrast-pair .ct-right {
    background: var(--tint);
    border-left: 1px solid var(--hairline);
    font-weight: 500;
    color: var(--ink);
  }
  .contrast-grid .contrast-pair .ct-left::after,
  .contrast-grid .contrast-pair .ct-right::after { display: none; }
  /* authored {contrast=strike}: the left column is explicitly crossed out in the accent */
  .contrast-grid.contrast-strike .ct-left {
    text-decoration: line-through;
    text-decoration-color: var(--accent);
    text-decoration-thickness: 2px;
  }

  /* Table (mockup .ctable): tint column headers with weight, mono accent row headers,
     hairline grid throughout. */
  .slide-table { border: 1px solid var(--hairline); border-collapse: collapse; font-size: max(var(--type-floor), 1em); }
  .slide-table thead th {
    background: var(--tint);
    color: var(--ink);
    font-weight: 700;
    font-size: max(var(--type-floor), 1.05em);
    text-align: left;
    padding: .6em .8em;
    border-left: 1px solid var(--hairline);
    letter-spacing: 0;
    text-transform: none;
  }
  .slide-table tbody th:first-child,
  .slide-table tbody td:first-child {
    font-family: var(--mono);
    font-size: max(var(--type-floor), .62em);
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 400;
    vertical-align: middle;
  }
  .slide-table tbody td, .slide-table tbody th {
    padding: .55em .8em;
    border-top: 1px solid var(--hairline);
    border-left: 1px solid var(--hairline);
    line-height: 1.35;
    /* Ticket 21: cells read at the table's type (the body token), never a step under it. */
    font-size: max(var(--type-floor), 1em);
  }

  /* Equation (mockup .formula): outlined pills, accent operators, the RESULT fills accent. */
  .equation-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .6em .8em; max-width: 42em; margin: 0 auto; }
  .equation-row .eq-unit { display: inline-flex; align-items: center; gap: .6em; flex: none; }
  .equation-row .eq-term {
    font-weight: 600;
    font-size: max(30px, 3.3cqw);
    letter-spacing: -.01em;
    padding: .35em .8em;
    border: 2px solid var(--ink);
    border-radius: 100px;
    background: var(--paper);
    color: var(--ink);
    box-shadow: none;
  }
  .equation-row .eq-op { font-weight: 400; font-size: max(34px, 3.9cqw); color: var(--accent); }
  .equation-row .eq-term.eq-result { background: var(--accent); border-color: var(--accent); color: var(--paper); }
  .equation-row.equation-circle .eq-term { width: 4.8em; min-width: 4.8em; aspect-ratio: 1; padding: .35em; border-radius: 50%; }
  .equation-row.equation-square .eq-term { border-radius: 0; }
  .equation-row.equation-oval .eq-term { border-radius: 100px; }

  /* Pyramid (mockup .pyr): centred accent slabs, width + opacity ramp down the stack. */
  .pyramid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .pyramid .pyr-tier {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 2.6em;
    background: var(--accent);
    color: var(--paper);
    font-weight: 600;
    font-size: max(26px, 1.15em);
    border: none;
    border-radius: 0;
    padding: .2em 1em;
  }
  .pyramid .pyr-tier .pyr-label { color: inherit; }
  .pyramid .pyr-tier:nth-child(1) { width: 24%; }
  .pyramid .pyr-tier:nth-child(2) { width: 44%; opacity: .8; }
  .pyramid .pyr-tier:nth-child(3) { width: 64%; opacity: .6; }
  .pyramid .pyr-tier:nth-child(4) { width: 84%; opacity: .4; }
  .pyramid .pyr-tier:nth-child(5) { width: 96%; opacity: .3; }

  /* Stats (mockup .t-bignum): the number is the slide — huge accent figure, plain-weight label. */
  .stats-row .stat-value {
    color: var(--accent);
    font-weight: 700;
    letter-spacing: -.05em;
    line-height: .95;
    font-size: max(72px, 9cqw);
  }
  .stats-row.stats-1 .stat-value { font-size: max(110px, 16cqw); }
  .stats-row .stat-label { font-weight: 500; font-size: max(24px, 1.05em); color: var(--ink); line-height: 1.3; }

  /* Effort bars (mockup .effort): mono accent value above, accent block, label + grey sub. */
  .chart-cols { gap: 1.6em; }
  .chart-cols .chart-val { font-family: var(--mono); font-size: .75em; color: var(--accent); margin-bottom: .5em; }
  .chart-cols .chart-bar { background: var(--accent); border-radius: 0; }
  .chart-cols .chart-col:nth-child(1) .chart-bar { opacity: .35; }
  .chart-cols .chart-col:nth-child(2) .chart-bar { opacity: .55; }
  .chart-cols .chart-col:nth-child(3) .chart-bar { opacity: .75; }
  .chart-cols .chart-label { font-weight: 500; font-size: max(24px, 1.05em); line-height: 1.25; margin-top: .7em; }

  /* Icon rows (mockup .quad): accent top rule, icon+heading, hairline-separated sub-items. */
  .iconrow-grid .ir-item, .ir-item {
    border-top: 3px solid var(--accent);
    border-left: none; border-right: none; border-bottom: none;
    border-radius: 0;
    background: var(--paper);
    box-shadow: none;
    padding: .9em 0 0;
  }
  .ir-item .ir-icon { color: var(--accent); }
  .ir-item .ir-icon svg { width: 1.25em; height: 1.25em; stroke-width: 1.6; }
  .ir-item .ir-desc { list-style: none; margin: .7em 0 0; padding: 0; }
  .ir-item .ir-desc li { padding: .45em 0; color: var(--muted); font-size: .92em; border-top: 1px solid var(--hairline); }

  /* ── FIDELITY BATCH 3 (mockup slides 6 image-quote, 8 full-bleed) ─────────────────── */

  /* Image-quote (mockup .iq): 38% portrait column (tall, cover-cropped, hairline inset),
     quote beside it with the giant serif mark and rule attribution. */
  .image-quote {
    display: grid !important;
    grid-template-columns: 38% 1fr !important;
    gap: 3cqw;
    align-items: center;
    width: 100%;
    max-width: none;
  }
  .image-quote .iq-figure {
    position: relative;
    height: 64cqh;
    overflow: hidden;
    margin: 0;
    border: none;
    background: none;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
  }
  .image-quote .iq-figure img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .image-quote .iq-figure.iq-contain { background: var(--hairline); }
  .image-quote .iq-figure.iq-contain img { object-fit: contain; }
  .image-quote blockquote {
    background: none;
    border: none;
    box-shadow: none;
    padding: 0 0 0 1.2em;
    font-weight: 400;
    font-size: var(--quote-fitted-size);
    line-height: 1.28;
    width: 100%;
    max-width: none;
  }
  .image-quote blockquote::before {
    content: "\201C";
    position: absolute;
    left: -0.05em;
    top: -0.12em;
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 2.6em;
    color: var(--accent);
    opacity: 1;
  }
  .image-quote .iq-cite {
    display: flex;
    align-items: center;
    gap: 1em;
    margin-top: 1.2em;
    font-size: max(var(--type-floor), calc(var(--quote-fitted-size) * .58));
    font-weight: 600;
    color: var(--ink);
  }
  .image-quote .iq-cite::before {
    content: "";
    flex: none;
    width: 3em;
    height: 2px;
    background: var(--accent);
  }
  .slide:has(> .slide-content.layout-media > .slide-head-quiet) { padding: 0; }
  .slide-content.layout-media:has(> .slide-head-quiet) {
    display: block !important;
    width: 100% !important;
    max-width: none !important;
    min-height: 100%;
    margin: 0;
    padding: 0;
  }
  .slide-content.layout-media:has(> .slide-head-quiet) > .slide-figure {
    position: absolute;
    inset: 0;
    margin: 0;
    border: none;
    background: none;
    box-shadow: none;
    overflow: hidden;
  }
  .slide-content.layout-media:has(> .slide-head-quiet) > .slide-figure img {
    width: 100%;
    height: 100%;
    max-height: none;
    object-fit: contain;
    display: block;
  }
  .slide-content.layout-media:has(> .slide-head-quiet) > .slide-figure figcaption {
    position: absolute;
    left: 6cqw;
    bottom: 8cqh;
    color: #fff;
    background: none;
    border: none;
    font-weight: 600;
    font-size: max(34px, 4.2cqw);
    line-height: 1.3;
    letter-spacing: -.02em;
    max-width: 12em;
    text-align: left;
  }
  .slide-content.layout-media:has(> .slide-head-quiet) > .slide-figure figcaption strong {
    background: var(--accent);
    color: var(--paper);
    padding: 0 .14em;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }
  .slide-content.layout-media:has(> .slide-head-quiet) > .slide-figure:has(figcaption)::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(15deg, rgba(10,12,16,.82) 0%, rgba(10,12,16,.35) 55%, rgba(10,12,16,.05) 100%);
    pointer-events: none;
  }
  .slide-content.layout-media:has(> .slide-head-quiet) > .slide-figure figcaption { z-index: 1; }

  /* ── FIDELITY BATCH 4 (Dominik round-3 principles, 2026-07-11) ─────────────────────────
     Binding: NO centred text (especially paragraphs) — centre blocks, not lines.
     NO all-caps as main content — caps live only in kickers/short chrome labels.
     Type steps DOWN inside dense structures (tables, grids) relative to bullet text. */

  /* Stats (mockup .t-bignum, repaired): plain stage — no card, no tint, no border. The number
     is a huge accent figure; the label sits under it in ink at body scale, left-aligned. */
  .stats-row { display: flex; gap: 3em; align-items: baseline; justify-content: flex-start; }
  .stats-row .stat {
    background: none !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    display: block;
    text-align: left !important;
    font-size: 1em;
  }
  .stats-row .stat-value {
    display: block;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: -.05em;
    line-height: .95;
    font-size: max(64px, 7.5cqw);
  }
  .stats-row.stats-1 .stat-value { font-size: max(96px, 13cqw); }
  .stats-row .stat-label {
    display: block;
    margin-top: .6em;
    font-weight: 500;
    font-size: max(26px, 1.05em);
    line-height: 1.3;
    color: var(--ink);
    letter-spacing: 0;
    text-transform: none;
    max-width: 24em;
  }

  /* Tables: content is NEVER capsed or mono; row leader reads as a label by colour+weight
     only. Dense structure → one step smaller than bullet text. */
  .slide-table { font-size: max(var(--type-floor), .9em); }
  .slide-table tbody th:first-child,
  .slide-table tbody td:first-child {
    font-family: var(--sans);
    font-size: max(var(--type-floor), 1em);
    letter-spacing: 0;
    text-transform: none;
    color: var(--accent);
    font-weight: 600;
  }

  /* Icon rows (mockup .quad, corrected): heading is icon+label INLINE and left-aligned;
     sub-items left, grey, hairline-separated; whole grid a step smaller than body. */
  .icon-row { font-size: .85em; width: 100%; max-width: none; gap: 2em; }
  /* Structural layouts own the full band (mockup .body spans the stage; only TEXT keeps a
     ch-capped measure). The old 1180px content column strangled grids/tables/charts wide. */
  .slide-content:has(> .icon-row),
  .slide-content:has(> .slide-table),
  .slide-content:has(> .chart-cols),
  .slide-content:has(> .card-gallery),
  .slide-content:has(> .contrast-grid),
  .slide-content:has(> .flow-row),
  .slide-content:has(> .equation-row),
  .slide-content:has(> .stats-row),
  .slide-content:has(> .flow),
  .slide-content:has(> .orgchart) {
    max-width: none;
    width: calc(100% - 2 * var(--slide-pad-x, 48px));
  }
  .icon-row .ir-item {
    flex: 1 1 0;
    min-width: 0;
    /* ADR-0028 §5: each column is a two-row subgrid of the row (layouts/icon-row.css), so every
       column's items start at one height even when one heading wraps: row 1 = icon + label, row 2 =
       the items. Its top padding rides --list-gap (fitLists' spacing step; was .9em). */
    grid-row: span 2;
    display: grid;
    grid-template-rows: subgrid;
    grid-template-columns: auto minmax(0, 1fr);
    column-gap: .4em;
    row-gap: 0;
    align-items: center;
    text-align: left !important;
    padding: calc(.35em * var(--list-gap, 1)) 0 0;
  }
  /* mockup .quad h4: icon INLINE with the heading, both left */
  .icon-row .ir-item .ir-icon {
    /* ADR-0028 §5: the icon sits inline beside the label, 1.35em of the body (~55px at 1280; was a
       1.1em-of-dense float, ~37px). */
    margin: 0;
    display: inline-flex;
    vertical-align: middle;
    float: none;
    width: 1.35em;
    height: 1.35em;
  }
  .icon-row .ir-item .ir-label {
    font-weight: 600;
    font-size: 1.15em;
    text-align: left;
    line-height: 1.25;
    overflow-wrap: break-word;
    display: flex;
    align-items: center;
    gap: .55em;
  }
  .icon-row .ir-item .ir-label::before { content: none; }
  .icon-row .ir-item .ir-desc { width: 100%; grid-column: 1 / -1; align-self: start; margin-top: calc(.3em * var(--list-gap, 1)); }
  .icon-row .ir-item .ir-desc li { text-align: left; overflow-wrap: break-word; }

  /* Flow: no tiny elements adrift mid-stage — nodes share the full band and read large. */
  .flow-row { width: 100%; justify-content: space-between; gap: 1em; }
  .flow-row .flow-item { flex: 1 1 0; min-width: 0; }
  .flow-row .flow-node {
    width: 100%;
    box-sizing: border-box;
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-top: 4px solid var(--accent);
    border-radius: 0;
    box-shadow: none;
    font-weight: 600;
    font-size: max(28px, 1.05em);
    padding: 1em 1.1em;
    text-align: left;
  }
  .flow-row .flow-arrow { color: var(--accent); font-size: max(30px, 1.4em); }

  /* Chart columns: labels left-aligned under their bars (mockup .effort), never centred. */
  .chart-col { text-align: left; }
  .chart-col .chart-label { text-align: left; }
  .chart-col-plot { align-items: stretch; }
  .chart-cols .chart-bar { width: 100%; max-width: none; }
  .chart-cols .chart-val { text-align: left; }

  /* {novalues}: charts keep only their shape — value labels vanish, bars keep heights. */
  .slide[data-novalues] .chart-val,
  .slide[data-novalues] .chart-legend .legend-val,
  .slide[data-novalues] .stat-value { display: none; }

  /* ── FIDELITY BATCH 5 (Dominik round-4, 2026-07-11) ────────────────────────────────────
     Bold ONLY for headings and highlights. Grey ONLY for de-emphasis, never main content.
     Graph labels top-align on one shared line. Diagrams fill the band they are given. */

  /* Flow (#64): the chain owns the full band; accent-topped panels, no pills adrift */
  .flow.flow-horizontal {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .8em;
    width: 100%;
    max-width: none;
    margin: 0;
  }
  .flow.flow-horizontal .flow-node {
    flex: 1 1 0;
    min-width: 0;
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-top: 4px solid var(--accent);
    border-left: none;
    border-radius: 0;
    box-shadow: none;
    padding: 1em 1.1em;
    text-align: left;
  }
  .flow.flow-horizontal .flow-node .flow-label { font-weight: 600; font-size: max(28px, 1.05em); line-height: 1.25; }
  .flow.flow-horizontal .flow-connector { flex: 0 0 auto; }
  .flow.flow-horizontal .flow-arrow { color: var(--accent); font-size: max(30px, 1.3em); }

  /* Orgchart (#62): plain-weight nodes at body scale — bold is reserved for the root */
  .orgchart { font-size: max(26px, .95em); width: 100%; }
  .orgchart .org-box {
    font-weight: 400;
    font-size: 1em;
    padding: .55em 1em;
    border: 1px solid var(--hairline);
    border-top: 3px solid var(--accent);
    border-radius: 0;
    box-shadow: none;
    background: var(--paper);
  }
  .orgchart .org-root > .org-box { font-weight: 600; }

  /* Charts (#63): every label starts on the SAME top line — reserve constant label space so
     two-line labels can never eat into their column's plot and shift the baseline */
  .chart-cols .chart-label {
    align-self: stretch;
    min-height: 3.2em;
    margin-top: .6em;
    border-top: 1px solid var(--hairline);
    padding-top: .5em;
  }
  .chart-cols .chart-col-plot { border: none; }
  .chart-cols .chart-bar { border: none; }

  /* Stats (#65): the label reads at statement scale beside the figure — no tiny-next-to-huge */
  .stats-row .stat-value { font-size: max(56px, 6.5cqw); }
  .stats-row.stats-1 .stat-value { font-size: max(88px, 11cqw); }
  .stats-row .stat-label { font-size: max(31px, 1.5em); font-weight: 500; margin-top: .4em; }
  .stats-row .stat-cap { display: block; margin-top: .5em; font-size: max(24px, .95em); color: var(--muted); }

  /* Dense grids (#66): ink for content (grey is de-emphasis only), one further step down */
  .icon-row { font-size: .8em; }
  .icon-row .ir-item .ir-desc li { color: var(--ink); font-size: .88em; }
  .slide-table { font-size: max(var(--type-floor), .85em); }

  /* Titles left (#68): title/section headings never centre while other text left-aligns */
  .slide-content.layout-title h1,
  .slide-content.layout-title .content-p,
  .slide-content.layout-section-title h1 { text-align: left; }

  /* ── ADR-0005 title designs (title-variations.html, ported verbatim) ── */
  .slide-content.layout-title:has(.tp) { display: block !important; width: 100%; max-width: none; min-height: 100%; height: 100%; position: relative; margin: 0; }
  /* the head may be display:contents — hide its CHILDREN, the box may not exist */
  .slide-content.layout-title:has(.tp) > .slide-head,
  .slide-content.layout-title:has(.tp) > .slide-head > * { display: none !important; }
  .slide:has(> .slide-content.layout-title > .tp-poster),
  .slide:has(> .slide-content.layout-title > .tp-split),
  .slide:has(> .slide-content.layout-title > .tp-banner) { padding: 0; }
  .tp { position: absolute; inset: 0; display: flex; text-align: left; }
  .tp .tp-mono, .tp .tp-series {
    font-family: var(--mono);
    font-size: max(15px, .6em);
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .tp .tp-title { font-weight: 700; font-size: max(44px, 6.4cqw); line-height: 1.12; letter-spacing: -.035em; max-width: 11em; margin: 0; }
  .tp .tp-sub { margin: 1em 0 0; font-size: max(26px, 2.1cqw); color: var(--muted); line-height: 1.4; max-width: 26em; }
  /* V1 · Poster (default) */
  .tp-poster {
    --tint: color-mix(in srgb, var(--accent) 13%, var(--paper));
    --tint-line: color-mix(in srgb, var(--accent) 22%, var(--paper));
    --accent-under: color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .tp-poster .tp-side {
    width: 30%;
    flex: none;
    background: var(--tint);
    border-right: 1px solid var(--tint-line);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3.66cqw 3cqw;
  }
  :is(.tp-poster, .tp-bookend-assets) .tp-logo {
    display: block;
    max-width: 18cqw;
    max-height: 4.5cqw;
    width: auto;
    height: auto;
    object-fit: contain;
    object-position: left top;
  }
  :is(.tp-poster, .tp-bookend-assets) .tp-qr { display: flex; flex-direction: column; align-items: flex-start; gap: .56cqw; margin: auto 0 0; }
  /* V2 · Split card */
  :is(.tp-poster, .tp-bookend-assets) .tp-qr .qr-code { width: 9.5cqw; height: 9.5cqw; padding: 0; border: 0; background: transparent; box-shadow: 0 1px 3px rgba(0,0,0,.14); cursor: pointer; }
  :is(.tp-poster, .tp-bookend-assets) .tp-qr .qr-code svg { display: block; width: 100%; height: 100%; border-radius: .3em; }
  :is(.tp-poster, .tp-bookend-assets) .tp-qr .qr-caption {
    font-family: var(--mono);
    font-size: 1.7cqw;
    letter-spacing: .05em;
    color: var(--muted);
    max-width: 20cqw;
    overflow-wrap: anywhere;
  }
  .tp-split .tp-side { width: 22cqw; flex: none; background: var(--tint); display: flex; flex-direction: column; justify-content: space-between; padding: 3.38cqw 2.2cqw; }
  :is(.tp-poster, .tp-bookend-assets) .tp-qr .qr-caption a { color: inherit; text-decoration: none; }
  .tp-split .tp-side .tp-event { font-size: max(22px, .85em); color: var(--muted); line-height: 1.5; }
  :is(.tp-poster, .tp-bookend-assets) .tp-qr.qr-too-long { color: var(--accent); font: 600 1.7cqw/1.35 var(--mono); overflow-wrap: anywhere; }
  .tp-split .tp-main-col { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 5cqw; }
  .tp-poster .tp-main {
    flex: 1;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 3.66cqw 5cqw 3.66cqw 4.5cqw;
    min-width: 0;
  }
  .tp-split .tp-title { font-size: max(40px, 5.6cqw); line-height: 1.16; letter-spacing: -.03em; max-width: 12em; }
  .tp-poster .tp-kicker {
    font-family: var(--mono);
    font-size: 2cqw;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }
  .tp-split .tp-author { margin: 2.2em 0 0; font-size: max(22px, .95em); }
  .tp-poster .tp-mid { align-self: center; }
  .tp-split .tp-web { color: var(--accent); font-weight: 500; }
  /* V3 · Banner */
  .tp-poster .tp-title { font-size: 4.1cqw; line-height: 1.12; letter-spacing: -.02em; color: var(--ink); max-width: 12.5em; }
  .tp .tp-title strong { box-shadow: inset 0 -0.1em 0 var(--accent-under); }
  .tp-banner { flex-direction: column; }
  .tp-poster .tp-sub, .tp-poster .tp-cta { margin: 1.35cqw 0 0; font-size: 2.15cqw; line-height: 1.35; color: var(--muted); max-width: 24em; }
  .tp-banner .tp-main { flex: 1; display: flex; align-items: center; justify-content: center; }
  .tp-poster .tp-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 2em; }
  .tp-banner .tp-inner { width: fit-content; max-width: 76cqw; }
  .tp-poster .tp-who { font-size: 2.05cqw; line-height: 1.4; max-width: 18em; }
  .tp-banner .tp-series { display: flex; align-items: center; gap: 1em; margin-bottom: 1.4em; }
  .tp-poster .tp-name { font-size: 1.12em; font-weight: 700; }
  .tp-banner .tp-series::after { content: ""; width: 4em; height: 2px; background: var(--accent); }
  .tp-poster .tp-soft { color: var(--muted); }
  .tp-banner .tp-title { font-size: max(40px, 5.8cqw); line-height: 1.16; letter-spacing: -.03em; max-width: 12em; }
  .tp-poster .tp-whenweb { text-align: right; font-size: max(var(--type-floor), 1.85cqw); color: var(--muted); line-height: 1.55; flex: none; }
  .tp-banner .tp-band { background: var(--accent); color: var(--paper); display: flex; align-items: center; justify-content: space-between; padding: 1.46cqw 6cqw 2.53cqw; gap: 3em; font-size: max(20px, .9em); }
  .tp-poster .tp-web { color: var(--accent); font-weight: 600; }
  .tp-banner .tp-band .tp-mono { color: var(--paper); opacity: .9; }

  /* ── FIDELITY BATCH 6 (Dominik round-5, 2026-07-11) ─────────────────────────────────── */
  .tp-split { align-items: stretch; }

  /* #69 dense icon-row grids: genuinely small (mockup .quad ≈ .92em of a 25px base) and rows
     ALIGNED — uniform item heights so hairlines line up across columns */
  .icon-row { font-size: .62em; }
  .icon-row .ir-item .ir-label {
    /* ADR-0028 §5: the shared heading row (subgrid) replaces the fixed 2.6em / 2.4em min-heights
       that lined the columns up. */
    min-height: 0; display: flex; align-items: center;
  }
  .icon-row .ir-item .ir-desc li { min-height: 0; display: flex; align-items: center; }

  /* #71 plain lists (no icons): hairline-separated rows that fill the band — never bare lines */
  .slide-content > .feature-list:not(:has(.fl-icon)) { width: 100%; max-width: none; }
  .slide-content > .feature-list:not(:has(.fl-icon)) > li {
    border-top: 1px solid var(--hairline);
    padding: calc(.55em * var(--list-gap, 1)) 0;
    font-weight: 400;
  }
  .slide-content > .feature-list:not(:has(.fl-icon)) > li:last-child { border-bottom: 1px solid var(--hairline); }

  /* #72 columns content is never bold */
  .columns-grid li, .columns-grid p { font-weight: 400; }
  .columns-grid h4, .columns-grid h3, .columns-grid h2 { font-weight: 600; }

  /* #73 conceptmap: plain-weight, larger node text */
  .conceptmap { width: 100%; }
  .conceptmap svg { min-height: 60cqh; width: 100%; }
  .conceptmap svg text { font-weight: 400; }

  /* #74 cycle is a LOOP (mockup .cycle): ring stage with pill nodes on the circle */
  .slide-content:has(> .cycle-diagram) { max-width: none; width: calc(100% - 2 * var(--slide-pad-x, 48px)); }
  .cycle-diagram {
    position: relative;
    width: min(72cqw, 118cqh, 100%); /* 100%: beside a rail the ring is the column, never wider (the right node was cut at the slide edge) */
    aspect-ratio: 1000 / 620;
    margin: 0 auto;
  }
  .cycle-diagram .cycle-node {
    position: absolute;
    transform: translate(-50%, -50%);
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 100px;
    padding: .45em 1.1em;
    font-weight: 600;
    font-size: max(28px, 1.2em);
    box-shadow: none;
    text-align: center;
    white-space: normal;
    width: max-content; /* an absolutely placed node shrinks to the room right of its left edge: the right node stacked one word per line */
    max-width: 16ch;
    text-align: center;
  }
  .cycle-diagram .cycle-node:last-of-type { border-color: var(--accent); color: var(--accent); }
  .cycle-diagram .cycle-arc-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .cycle-diagram .cycle-arc { fill: none; stroke: var(--hairline); stroke-width: 3; }
  .cycle-diagram .cycle-arc-svg marker path { fill: var(--accent); }

  /* #76 a rail slide with NO content owns the stage: full tint, centred title block */
  .slide[data-title-layout="left"]:has(> .slide-content > .slide-head:not(.slide-head-quiet)):not(:has(> .slide-content > *:not(.slide-head))) {
    background: var(--tint);
  }
  .slide[data-title-layout="left"]:not(:has(> .slide-content > *:not(.slide-head))) > .slide-content {
    grid-template-columns: 1fr !important;
  }
  .slide[data-title-layout="left"]:not(:has(> .slide-content > *:not(.slide-head))) > .slide-content > .slide-head:not(.slide-head-quiet) > h1 {
    font-size: max(38px, 5.6cqw);
    max-width: 12em;
  }

  /* #77 closing mirrors the title poster: statement-scale thanks, accent CTA, identity bottom */
  .slide-content.layout-closing { display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; width: 100%; max-width: none; min-height: 100%; padding: 6cqh 6cqw; text-align: left; }
  .slide-content.layout-closing > * { text-align: left; }
  .slide-content.layout-closing .closing-thanks, .slide-content.layout-closing h1 {
    font-weight: 700;
    font-size: max(44px, 6cqw);
    line-height: 1.12;
    letter-spacing: -.035em;
    max-width: 12em;
    margin: auto 0;
  }
  .slide-content.layout-closing .closing-cta { color: var(--accent); font-weight: 600; font-size: max(28px, 2.2cqw); }
  .slide-content.layout-closing .closing-meta, .slide-content.layout-closing .content-p {
    display: flex;
    justify-content: space-between;
    gap: 3em;
    font-size: max(22px, 1em);
    background: none;
    border: none;
    padding: 0;
  }

  /* ── TYPE RAMP (round-6 size review, 2026-07-11): one documented scale, stage-relative.
     Hierarchy must never invert: display > title > rail title > body > dense > label. */
  .slide {
    --fs-display: max(40px, 5.6cqw);   /* statements, posters */
    /* Ticket 18 (Dominik, 2026-09-13): the DEFAULT step (M) is the former XL. The per-slide
       ladder in overrides.css re-steps around it and stays monotone:
         body  xs 2.0 · s 2.6 · M 3.2 · l 3.5 · xl 3.9 cqw   (dense 1.65 · 2.1 · 2.6 · 2.85 · 3.2)
         title xs 3.0 · s 3.4 · M 3.9 · l 4.6 · xl 5.2 cqw   (px floors 26 · 30 · 36 · 40 · 44)
         rail  xs 2.5 · s 3.2 · M 3.8 · l 4.1 · xl 4.5 cqw   (px floors 28 · 34 · 38 · 42 · 44)
       At the 1600 reference stage the M body is 51.2px; every step still sits on --type-floor. */
    --fs-title:   max(36px, 3.9cqw);   /* content-slide titles */
    --fs-rail:    max(38px, 3.8cqw);   /* sidebar rail titles */
    --fs-body:    max(var(--type-floor), 3.2cqw);   /* lists, paragraphs — Ticket 18 default (was RAMP 3, 2.3cqw) */
    --fs-dense:   max(var(--type-floor), 2.6cqw);   /* tables, grids, boxes */
    --fs-label:   max(15px, 1.1cqw);   /* mono kickers, indices */
  }
  .slide-content > .feature-list:not(:has(.fl-icon)) > li,
  .slide[data-title-layout="left"] .slide-content > .content-p:not(.card-comment),
  .slide[data-title-layout="hidden"] .slide-content > .content-p:not(.card-comment),
  .columns-grid li, .columns-grid p { font-size: var(--fs-body) !important; font-weight: 400; }
  .slide-content > .feature-list:has(.fl-icon) > li { font-size: var(--fs-dense) !important; font-weight: 400; }
  .icon-row {
    /* ADR-0028 §5 (amends ADR-0005): icon rows read at the body size, not the dense step; the
       gutter between columns tightens 2em -> 1.5em. */
    font-size: var(--fs-body) !important; gap: 0 1.5em;
  }
  .icon-row .ir-item .ir-label { font-size: 1.15em; font-weight: 700; line-height: 1.2; }
  .icon-row .ir-item .ir-desc li {
    /* Item lines already take the body size and the --list-lh leading from the global list floor
       (base.css @order 0814, which outranks this rule); their padding rides --list-gap. */
    font-weight: 400;
    padding: calc(.15em * var(--list-gap, 1)) 0;
  }
  /* Ticket 21 (Dominik, 2026-09-13: "larger font — eqv of current xl is minimum"): the table's
     type is the BODY token, not the dense step. --fs-body is also what the runtime fitter steps,
     so a table that cannot fit at the token joins the list seam (leading, air, then type). */
  .slide-table tbody th:first-child, .slide-table tbody td:first-child { font-weight: 500; }
  .columns-grid h4, .columns-grid h3, .columns-grid h2 { font-weight: 500; font-size: var(--fs-label); font-family: var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .slide[data-title-layout="left"] > .slide-content > .slide-head:not(.slide-head-quiet) > h1 { font-size: var(--fs-rail); }
  .card-gallery .card { font-size: max(var(--type-floor), var(--fs-dense)); }
  .card-gallery .card .card-title, .card-gallery .card h3 { font-weight: 500; }

  /* ── TITLE ZONE (round-6): content-slide titles sit at a FIXED distance from the top with a
     hairline divider; content anchors under it instead of drifting in a sea of white. ── */
  .slide:not(:is([data-title-layout="left"], [data-title-layout="hidden"])) > .slide-content:not(.layout-title):not(.layout-section-title):not(.layout-statement):not(.layout-closing):has(> .slide-head:not(.slide-head-quiet)) {
    display: flex !important;
    flex-direction: column;
    justify-content: flex-start;
    min-height: 100%;
    padding-top: 4cqh;
  }

  .slide:not(:is([data-title-layout="left"], [data-title-layout="hidden"])) > .slide-content:not(.layout-title):not(.layout-section-title):not(.layout-statement):not(.layout-closing) > *:not(.slide-head):first-of-type {

  /* ── PER-SLIDE TYPE OPTIONS: {font-body=…} / {font-title=…} (xs s m l xl; m = the skin default) ──
     Ticket 18 ladder (2026-09-13). M is set once in skin/base.css (body 3.2 / dense 2.6 / title
     max(44px, 5.2) / rail max(38px, 3.8)); the four steps here stay monotone around it:
       body  xs 2.0 · s 2.6 · [M 3.2] · l 3.5 · xl 3.9 cqw    dense 1.65 · 2.1 · [2.6] · 2.85 · 3.2
       title xs 3.0 · s 3.4 · [M 3.9] · l 4.6 · xl 5.2 cqw    rail  2.5 · 3.2 · [3.8] · 4.1 · 4.5
     Every body/dense step is clamped to --type-floor; titles carry their own px floors. */
  .slide[data-font-body="xs"] { --fs-body: max(var(--type-floor), 2.0cqw); --fs-dense: max(var(--type-floor), 1.65cqw); }
  .slide[data-font-body="s"]  { --fs-body: max(var(--type-floor), 2.6cqw); --fs-dense: max(var(--type-floor), 2.1cqw); }
  .slide[data-font-body="l"]  { --fs-body: max(var(--type-floor), 3.5cqw); --fs-dense: max(var(--type-floor), 2.85cqw); }
  .slide[data-font-body="xl"] { --fs-body: max(var(--type-floor), 3.9cqw); --fs-dense: max(var(--type-floor), 3.2cqw); }
  .slide[data-font-title="xs"] { --fs-title: max(26px, 3.0cqw); --fs-rail: max(28px, 2.5cqw); }
  .slide[data-font-title="s"]  { --fs-title: max(30px, 3.4cqw); --fs-rail: max(34px, 3.2cqw); }
  .slide[data-font-title="l"]  { --fs-title: max(40px, 4.6cqw); --fs-rail: max(42px, 4.1cqw); }
  .slide[data-font-title="xl"] { --fs-title: max(44px, 5.2cqw); --fs-rail: max(44px, 4.5cqw); }
  .slide:not(:is([data-title-layout="left"], [data-title-layout="hidden"])) > .slide-content:not(.layout-title):not(.layout-section-title) > .slide-head:not(.slide-head-quiet) h1 { font-size: var(--fs-title); line-height: 1.12; max-width: none; }
  .slide[data-title-layout="left"] > .slide-content > .slide-head:not(.slide-head-quiet) > h1 { font-size: var(--fs-rail); }
