  width: 100%; height: 34px; padding: 0 10px; margin: 0; box-sizing: border-box;
  border: 0; border-radius: 6px; background: none; color: var(--pal-text);
  font: 500 14px/1 var(--pal-ui); text-align: left; white-space: nowrap; cursor: pointer;
}
.tw-pal-row > .tw-ico { color: var(--pal-muted); }
.tw-pal-name { overflow: hidden; text-overflow: ellipsis; }
/* The task group the command belongs to (onboarding 01), muted, before the key caps. */
.tw-pal-task { font: 500 13px/1 var(--pal-ui); color: var(--pal-dim); white-space: nowrap; }
.tw-palette .tw-pal-row.hi { background: #2a4260; }
.tw-palette .tw-pal-row.hi > .tw-ico { color: var(--pal-text); }
.tw-palette .tw-pal-row:disabled { color: var(--pal-dim); cursor: default; }
.tw-palette .tw-pal-row:disabled > .tw-ico { color: #4f6072; }
.tw-pal-keys { display: inline-flex; justify-content: flex-end; gap: 4px; min-width: 18px; }
.tw-pal-keys kbd {
  display: inline-block; min-width: 18px; padding: 3px 6px; box-sizing: border-box;
  border: 1px solid #ffffff26; border-radius: 5px; background: #0f171f;
  font: 500 13px/1 var(--pal-ui); color: #d5e0ea; text-align: center;
}
.tw-pal-row:disabled .tw-pal-keys kbd { color: var(--pal-dim); border-color: #ffffff17; }
.tw-pal-empty { padding: 14px 10px; font: 500 14px/1.3 var(--pal-ui); color: var(--pal-dim); }
.tw-pal-foot { display: flex; gap: 18px; flex: none; padding: 9px 16px; border-top: 1px solid #ffffff14; font: 500 13px/1 var(--pal-ui); color: var(--pal-dim); }
/* Presenter poll panel (ADR-0031, presenter redesign ticket 06; drawn in
   docs/design/2026-09-26-presenter-redesign/round-2/, shots poll-armed, poll-collecting,
   poll-collecting-held, poll-results-shown). The panel sits under the current slide
   (presenter-notes-placement.css sizes it per placement). Its head row holds the phase chip and
   every action of the phase: Open poll / Reopen responses (Q), Reveal results (⇧Q), Stop
   accepting responses (Q), then Show question / Show results, the page buttons and Dismiss Quick
   poll, then the × that hides the panel. Actions in the head stay in view however little height
   the panel has; when the panel is narrower than its actions (the camera column) they wrap onto a
   second head row rather than clip. No live chip: live status is the status bar's (ADR-0031 §7).
   The body: the question, the type and results badges in sentence case, the count, and under them
   the held note in amber while results are held; the private tallies take the right column.
   One chrome type scale (ADR-0031 §5): 14px control labels, 13px chip, badges, keys, notes. */
.presenter-root .presenter-poll-panel {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.presenter-root .presenter-poll-panel [hidden] { display: none !important; }
.presenter-root .presenter-poll-head {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding: 8px 10px 8px 13px;
}
.presenter-root .presenter-poll-chip {
  flex: none; white-space: nowrap;
  padding: 5px 9px; font: 600 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; letter-spacing: 0;
}
.presenter-root .presenter-poll-head > .presenter-poll-controls,
.presenter-root .presenter-poll-head > .presenter-poll-display-controls {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  margin: 0; padding: 0; border: 0;
}
.presenter-root .presenter-poll-head > .presenter-poll-controls { margin-left: auto; }
.presenter-root .presenter-poll-head > .presenter-poll-dismiss { margin-left: 4px; width: 30px; height: 30px; }
.presenter-root .presenter-poll-dismiss .tw-ico { margin: 0; }

/* A head action: icon, label, then its key in lighter text (the key comes from the controls
   table through data-key, so the markup never repeats it). */
.presenter-root .presenter-poll-head button:not(.presenter-poll-dismiss) {
  display: inline-flex; align-items: center; gap: 7px; flex: none;
  height: 32px; min-height: 32px; padding: 0 12px; box-sizing: border-box;
  border: 1px solid #ffffff1c; border-radius: 7px; background: #1f2c39; color: #f7f3ea;
  font: 500 14px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; white-space: nowrap; cursor: pointer;
}
.presenter-root .presenter-poll-head button:not(.presenter-poll-dismiss):hover { background: #283a4c; }
.presenter-root .presenter-poll-head button:not(.presenter-poll-dismiss):disabled { opacity: .5; cursor: default; }
.presenter-root .presenter-poll-head button:not(.presenter-poll-dismiss) .tw-ico { width: 16px; height: 16px; margin: 0; }
.presenter-root .presenter-poll-head button[data-key]:not([data-key=""])::after {
  content: attr(data-key); margin-left: 4px; font: 500 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; color: #c8d5e1;
}
.presenter-root .presenter-poll-head .presenter-poll-open { background: #0f4bd8; border-color: #0f4bd8; color: #fff; }
.presenter-root .presenter-poll-head .presenter-poll-open:hover { background: #1b5ae8; }
.presenter-root .presenter-poll-head .presenter-poll-reveal { background: #f59e0b; border-color: #f59e0b; color: #3a2600; }
.presenter-root .presenter-poll-head .presenter-poll-reveal:hover { background: #fbb13c; }
.presenter-root .presenter-poll-head .presenter-poll-reveal[data-key]::after { color: #6b4700; }

/* Body: badges and count on one line, the held note under them. */
.presenter-root .presenter-poll-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
.presenter-root .presenter-poll-badge {
  white-space: nowrap; text-transform: none;
  padding: 5px 9px; font: 500 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; letter-spacing: 0;
}
.presenter-root .presenter-poll-count { color: #8aa0b4; font-size: 13px; }
.presenter-root .presenter-poll-meta > .presenter-poll-held-note {
  flex-basis: 100%; margin: 2px 0 0;
  color: #ffe08a; font: 500 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
}
.presenter-root .presenter-poll-display-status,
.presenter-root .presenter-poll-operation { font: 500 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
.presenter-root .presenter-poll-display-status { color: #a3b3c2; }
.presenter-root .presenter-poll-bar-label { font-size: 14px; }
.presenter-root .presenter-poll-bar-value { font: 600 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
/* The questions tray (ADR-0027 and its 2026-09-29 amendment, ticket "Anyone can ask the speaker";
   drawn in docs/design/2026-09-28-reactions-questions/round-2/, shots D5, D7, D8, D9, D10).
   A drawer over the Next and Then previews in the presenter's calm-stage chrome (ADR-0031): the
   menu card's colours (#16202a on the #0f1720 stage, hairline #ffffff26), the chrome type scale
   (13px meta and headings, 14px labels) and lucide icons. Question text is 16px, the scale's largest
   non-clock size, because it is read at arm's length mid-talk. The template places it (fixed, over
   the union of the two preview panels); questions and names are written with textContent only. */
.qt { position: fixed; z-index: 30; box-sizing: border-box; display: flex; flex-direction: column;
  background: #16202a; border: 1px solid #ffffff26; border-radius: 10px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
  --qt-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; font-family: var(--qt-ui); color: #f7f3ea; -webkit-font-smoothing: antialiased; overflow: hidden;
  container-type: inline-size; }
.qt[hidden] { display: none; }
.qt svg { width: 16px; height: 16px; flex: none; }
.qt-head { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; border-bottom: 1px solid #ffffff14; flex: none; }
.qt-title { display: inline-flex; align-items: center; gap: 7px; font: 600 14px/1 var(--qt-ui); }
.qt-title svg { color: #e9c46a; }
.qt-count { font: 500 13px/1 var(--qt-ui); color: #a3b3c2; }
.qt-spacer { flex: 1; }
.qt-keyhint { font: 500 13px/1 var(--qt-ui); color: #71849a; }
.qt-kbd { display: inline-block; min-width: 18px; padding: 2px 5px; margin-left: 3px; border: 1px solid #ffffff2e; border-radius: 4px; color: #c9d6e2; font: 500 13px/1.2 var(--qt-ui); text-align: center; }
.qt-x { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0; border: 1px solid #ffffff1c; border-radius: 7px; background: #1f2c39; color: #f7f3ea; cursor: pointer; }
.qt-x:hover, .qt-done:hover, .qt-answered:hover { background: #283a4c; }
.qt button:focus-visible { outline: 2px solid #5b9bd5; outline-offset: 1px; }
@container (max-width: 380px) { .qt-ago { display: none; } .qt-keyhint { display: none; } }
.qt-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 6px; scrollbar-width: thin; scrollbar-color: #3a4b5d transparent; }
.qt-item { padding: 10px 10px 9px; border-radius: 8px; }
.qt-item + .qt-item { border-top: 1px solid #ffffff10; border-top-left-radius: 0; border-top-right-radius: 0; }
.qt-item.is-current { background: #1d2b3a; box-shadow: inset 3px 0 0 #e9c46a; }
.qt-item.is-answered .qt-text { color: #a3b3c2; }
.qt-meta { display: flex; align-items: baseline; gap: 7px; min-width: 0; font: 500 13px/1.25 var(--qt-ui); color: #a3b3c2; }
.qt-slide { flex: none; font-weight: 600; color: #c9d6e2; }
.qt-stitle { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qt-here { flex: none; margin-left: auto; padding: 1px 6px; border-radius: 4px; background: #e9c46a22; color: #e9c46a; font-weight: 600; }
.qt-text { margin: 5px 0 7px; font: 500 16px/1.4 var(--qt-ui); color: #f7f3ea; white-space: pre-wrap; overflow-wrap: anywhere; }
.qt-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font: 500 13px/1 var(--qt-ui); color: #a3b3c2; }
.qt-who, .qt-time { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.qt-who { flex: none; max-width: 100%; }
.qt-time { flex: none; }
.qt-who > span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.qt-who svg, .qt-time svg { width: 14px; height: 14px; color: #71849a; }
.qt-who.anon { color: #71849a; font-style: italic; }
.qt-done { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid #ffffff1c; border-radius: 7px; background: #1f2c39; color: #f7f3ea; font: 500 14px/1 var(--qt-ui); white-space: nowrap; cursor: pointer; }
.qt-done svg { color: #6fcf97; }
.qt-done:disabled { opacity: .55; cursor: wait; }
.qt-answered { flex: none; display: flex; align-items: center; gap: 7px; width: 100%; padding: 9px 14px; border: 0; border-top: 1px solid #ffffff14; background: none; color: #a3b3c2; font: 500 13px/1 var(--qt-ui); text-align: left; cursor: pointer; }
.qt-answered svg { color: #71849a; transition: transform .12s; }
.qt-answered[aria-expanded="true"] svg { transform: rotate(90deg); }
.qt-answered .qt-muted { margin-left: auto; color: #71849a; }
.qt-answered-list { flex: 0 1 45%; min-height: 0; overflow-y: auto; padding: 0 6px 6px; border-top: 1px solid #ffffff10; scrollbar-width: thin; scrollbar-color: #3a4b5d transparent; }
.qt-error { flex: none; padding: 7px 14px; border-top: 1px solid #ffffff14; background: #3a1a1a; color: #f4b3ad; font: 500 13px/1.3 var(--qt-ui); }
.qt-error[hidden] { display: none; }
.qt-nextline { flex: none; display: flex; align-items: center; gap: 7px; padding: 8px 14px; border-top: 1px solid #ffffff14; background: #111a23; font: 500 13px/1.2 var(--qt-ui); color: #a3b3c2; white-space: nowrap; overflow: hidden; }
.qt-nextline b { color: #c9d6e2; font-weight: 600; }
.qt-nextline span { overflow: hidden; text-overflow: ellipsis; }
.qt-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 100%; min-height: 120px; padding: 24px; text-align: center; font: 500 14px/1.4 var(--qt-ui); color: #a3b3c2; }
.qt-empty svg { width: 28px; height: 28px; color: #71849a; }

/* The questions counter opens the tray, and is marked while it is open. */
#presenterTopBar .tw-st-questions { cursor: pointer; }
#presenterTopBar .tw-st-questions.qt-open { background: #2a3f55; border-radius: 6px; box-shadow: 0 0 0 1px #5b86b5; padding: 0 6px; }
/* Presenter status bar (ADR-0031 §2 and §5, presenter redesign ticket 02; drawn in
   docs/design/2026-09-26-presenter-redesign/round-2/, shots idle-*, L1-*, clock-popover-*).
   The top bar is one 40px row: talk title, the clock (the pause/resume button) with its chevron
   and popover, Start timer, the slide counter; then the status strip (recording block, live status
   with End live, section, reactions, questions); then the Live, Poll and View menus (ticket 04,
   presenter-top-menus.css).
   One chrome type scale, fixed: 26px clock, 16px counter / recorded length / stepper number, 14px
   control labels, 13px status, shortcuts, headings and hints. One UI typeface; monospace only for
   the clock, the counter and the recorded length. When the row runs short the title shrinks to
   120px, then fitTopBar() in the template adds the collapse steps c1-c10 in order until it fits. */
/* The chrome's colour and type tokens, shared with the bottom bar (presenter-bottom-bar.css). */
#presenterTopBar,
#presenterBottomBar {
  --tb-text: #f7f3ea;
  --tb-muted: #a3b3c2;
  --tb-dim: #71849a;
  --tb-line: #ffffff1c;
  --tb-ctl: #1f2c39;
  --tb-ctl-hover: #283a4c;
  --tb-live: #f0645c;
  --tb-live-bg: #3a1a1a;
  --tb-amber: #f5b64a;
  --tb-go: #1f9d55;
  --tb-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --tb-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
}
#presenterTopBar {
  position: relative;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 14px;
  height: 40px;
  min-height: 40px;
  box-sizing: border-box;
  padding: 0;
  background: none;
  border: 0;
  border-bottom: 1px solid #ffffff10;
  border-radius: 0;
  font-family: var(--tb-ui);
  color: var(--tb-text);
  white-space: nowrap;
  -webkit-font-smoothing: antialiased;
}
#presenterTopBar [hidden] { display: none !important; }
#presenterTopBar .tw-ico,
#presenterTopBar .tw-ico.tw-btn-ico { width: 16px; height: 16px; margin: 0; flex: none; vertical-align: middle; }
#presenterTopBar button { font-family: var(--tb-ui); cursor: pointer; }

/* Left: title · clock · Start timer · counter */
#presenterTopBar .tw-topbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 0 1 auto; }
#presenterTopBar #presenterTitle {
  flex: 0 1 auto; min-width: 120px; max-width: none; margin: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font: 600 14px/1.2 var(--tb-ui); color: var(--tb-muted);
}
#presenterTopBar .tw-topbar-sep { width: 1px; height: 22px; background: #ffffff1a; flex: none; }
#presenterTopBar .tw-clock-bar { position: relative; display: inline-flex; align-items: center; gap: 2px; flex: none; z-index: auto; }
#presenterTopBar .tw-clock-btn {
  display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 6px; margin-left: -6px;
  border: 1px solid transparent; border-radius: 7px; background: none; color: inherit; font: inherit; font-weight: 400;
}
#presenterTopBar .tw-clock-btn:hover { background: #ffffff0d; border-color: var(--tb-line); filter: none; }
#presenterTopBar .tw-clock {
  font: 700 26px/1 var(--tb-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  color: var(--tb-text); background: none; padding: 0; border-radius: 0; opacity: 1; animation: none;
}
#presenterTopBar .tw-clock[data-status="idle"] { color: #7d8e9e; }
#presenterTopBar .tw-clock[data-status="paused"] { color: var(--tb-amber); }
#presenterTopBar .tw-clock[data-level="warn"] { color: var(--tb-amber); }
#presenterTopBar .tw-clock[data-level="urgent"] { color: #f0913a; }
#presenterTopBar .tw-clock[data-level="over"] { color: var(--tb-live); animation: tw-clock-pulse 1s ease-in-out infinite; }
#presenterTopBar .tw-clock-sub { font: 500 13px/1 var(--tb-ui); color: var(--tb-dim); white-space: nowrap; }
#presenterTopBar .tw-clock-sub:empty { display: none; }
#presenterTopBar .tw-duration-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 26px; padding: 0;
  border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--tb-muted);
}
#presenterTopBar .tw-duration-btn:hover { background: var(--tb-ctl-hover); border-color: transparent; }
#presenterTopBar .tw-duration-btn[aria-expanded="true"] { background: #2a3f55; border-color: #5b86b5; color: var(--tb-text); }
#presenterTopBar .tw-start-timer {
  display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; box-sizing: border-box; flex: none;
  border: 1px solid var(--tb-go); border-radius: 6px; background: var(--tb-go); color: #fff; font: 600 13px/1 var(--tb-ui);
}
#presenterTopBar .tw-start-timer:hover { filter: brightness(1.08); }
#presenterTopBar .tw-start-timer.tw-resume-timer { background: var(--tb-ctl); border-color: var(--tb-line); color: var(--tb-text); font-weight: 500; }
#presenterTopBar .tw-count { font: 600 16px/1 var(--tb-mono); font-variant-numeric: tabular-nums; color: var(--tb-text); white-space: nowrap; flex: none; }
#presenterTopBar .tw-count-word { font: 500 13px/1 var(--tb-ui); color: var(--tb-dim); margin-right: 5px; }

/* The clock popover: talk length, presets, reminders, Reset timer */
#presenterTopBar .tw-duration-setter {
  position: absolute; top: calc(100% + 8px); left: -6px; transform: none; z-index: 200;
  width: 300px; box-sizing: border-box; padding: 12px;
  display: flex; flex-direction: column; gap: 0;
  background: #16202a; border: 1px solid #ffffff26; border-radius: 10px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
  font-family: var(--tb-ui); color: var(--tb-text); text-align: left; white-space: normal;
}
#presenterTopBar .tw-pop-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px 10px; }
#presenterTopBar .tw-pop-title { font: 600 14px/1 var(--tb-ui); }
#presenterTopBar .tw-pop-key { font: 500 13px/1 var(--tb-ui); color: var(--tb-muted); }
#presenterTopBar .tw-setter-input { display: flex; align-items: center; gap: 0; padding: 0 2px; }
#presenterTopBar .tw-setter-input .tw-step {
  display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0;
  border: 1px solid var(--tb-line); background: #111a22; color: var(--tb-muted);
}
#presenterTopBar #twDurationMinus { border-radius: 7px 0 0 7px; border-right: 0; }
#presenterTopBar #twDurationPlus { border-radius: 0 7px 7px 0; border-left: 0; }
#presenterTopBar .tw-setter-input .tw-step:hover { background: var(--tb-ctl-hover); filter: none; }
#presenterTopBar .tw-setter-input input {
  width: 44px; height: 32px; box-sizing: border-box; padding: 0; margin: 0; text-align: center;
  border: 1px solid var(--tb-line); border-left: 0; border-right: 0; border-radius: 0; background: #111a22;
  color: var(--tb-text); font: 600 16px/1 var(--tb-mono); font-variant-numeric: tabular-nums; -moz-appearance: textfield;
}
#presenterTopBar .tw-setter-input input::-webkit-inner-spin-button,
#presenterTopBar .tw-setter-input input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
#presenterTopBar .tw-setter-unit { margin-left: 10px; font: 500 13px/1 var(--tb-ui); color: var(--tb-muted); opacity: 1; }
#presenterTopBar .tw-duration-presets { display: flex; flex-wrap: nowrap; gap: 4px; padding: 10px 2px 2px; }
#presenterTopBar .tw-duration-presets button {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; height: 28px; padding: 0;
  border: 1px solid var(--tb-line); border-radius: 6px; background: #111a22; color: var(--tb-muted);
  font: 500 13px/1 var(--tb-ui); font-variant-numeric: tabular-nums;
}
#presenterTopBar .tw-duration-presets button:hover { background: var(--tb-ctl-hover); filter: none; }
#presenterTopBar .tw-duration-presets button.on { background: #244d88; border-color: #6293ec; color: #fff; font-weight: 500; }
#presenterTopBar .tw-setter-title {
  padding: 14px 2px 7px; font: 600 13px/1 var(--tb-ui); color: var(--tb-dim);
  text-transform: none; letter-spacing: 0; opacity: 1;
}
#presenterTopBar .tw-reminder-presets { display: flex; flex-wrap: nowrap; gap: 6px; padding: 0 2px; }
#presenterTopBar .tw-reminder {
  display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; white-space: nowrap;
  border: 1px solid var(--tb-line); border-radius: 999px; background: transparent; color: var(--tb-muted);
  font: 500 13px/1 var(--tb-ui);
}
#presenterTopBar .tw-reminder:hover { background: var(--tb-ctl-hover); filter: none; }
#presenterTopBar .tw-reminder.on { background: #1f3550; border-color: #3f6ea3; color: #fff; font-weight: 500; }
#presenterTopBar .tw-reminder .tw-ico { color: #8fc0ff; }
#presenterTopBar .tw-reminder:not(.on) .tw-ico { display: none; }
#presenterTopBar .tw-pop-rule { height: 1px; background: #ffffff14; margin: 12px 0 6px; }
#presenterTopBar .tw-pop-item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; box-sizing: border-box;
  border: 0; border-radius: 6px; background: none; color: var(--tb-text); text-align: left;
  font: 500 14px/1.2 var(--tb-ui); white-space: normal;
}
#presenterTopBar .tw-pop-item:hover { background: #ffffff0d; }
#presenterTopBar .tw-pop-item .tw-ico { color: var(--tb-muted); }
#presenterTopBar .tw-pop-sub { display: block; margin-top: 2px; font: 500 13px/1.25 var(--tb-ui); color: var(--tb-dim); }
#presenterTopBar .tw-pop-hint { margin: 0; padding: 6px 2px 0; font: 500 13px/1.35 var(--tb-ui); color: var(--tb-dim); }

/* The status strip */
#presenterTopBar .tw-status {
  display: flex; align-items: center; height: 32px; box-sizing: border-box; padding: 0 4px; margin: 0 auto; flex: none;
  border: 1px solid var(--tb-line); border-radius: 8px; background: #151f29; white-space: nowrap;
}
#presenterTopBar .tw-status:not(:has(> .tw-st:not([hidden]):not(:empty))) { display: none; }
#presenterTopBar .tw-status:not(:has(> .tw-st:not([hidden]):not(:empty))) + .presenter-header-actions { margin-left: auto; }
#presenterTopBar .tw-st {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px;
  font: 600 13px/1 var(--tb-ui); color: var(--tb-muted);
}
#presenterTopBar .tw-st:empty { display: none; }
#presenterTopBar .tw-st:not([hidden]):not(:empty) ~ .tw-st { box-shadow: -1px 0 0 #ffffff14; }
#presenterTopBar .tw-st-live { color: var(--tb-dim); font-weight: 500; }
#presenterTopBar .tw-st-live[data-tone="live"] { color: var(--tb-live); font-weight: 600; }
#presenterTopBar .tw-st-live[data-tone="reconnecting"] { color: var(--tb-amber); font-weight: 600; }
#presenterTopBar .tw-st-live[data-tone="connecting"] { color: var(--tb-muted); font-weight: 600; }
#presenterTopBar .tw-live-icon { display: inline-flex; }
#presenterTopBar .tw-live-icon:empty { display: none; }
#presenterTopBar .tw-st-btn {
  display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; margin-left: 2px; box-sizing: border-box;
  border: 1px solid #f0645c55; border-radius: 6px; background: var(--tb-live-bg); color: #ffd2cf; font: 500 13px/1 var(--tb-ui);
}
#presenterTopBar .tw-st-btn:hover { border-color: var(--tb-live); }
/* "Not live" is the Go live button before a session (Dominik's preview.8 feedback, 28 Sep):
   the status's radio icon and words in a bordered control, 26px like End live, tooltip
   "Go live  G". The slot's plain icon and words are hidden while it shows (present-live-bridge.ts). */
#presenterTopBar .tw-st-go {
  display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; margin: 0 -4px; box-sizing: border-box;
  border: 1px solid var(--tb-line); border-radius: 6px; background: var(--tb-ctl); color: var(--tb-muted); font: 500 13px/1 var(--tb-ui);
}
#presenterTopBar .tw-st-go:hover { background: var(--tb-ctl-hover); border-color: #ffffff33; color: var(--tb-text); }
#presenterTopBar .tw-st-go:focus-visible { outline: 2px solid #5b86b5; outline-offset: 1px; }
/* The venue-screen notice, beside the live status (ADR-0026 §3; presenter redesign ticket 06;
   shots venue-lost-*, venue-back-*): amber "Venue screen not following · reconnecting" while the
   venue screen has no connection, then "Venue screen following again" in green for three seconds.
   The live preload fills it from the session's presence count (present-live-state.ts). */
#presenterTopBar .tw-st-venue[data-tone="lost"] { color: var(--tb-amber); }
#presenterTopBar .tw-st-venue[data-tone="back"] { color: #7fd6a1; }
#presenterTopBar .tw-st-section { color: #9cc3f5; }
#presenterTopBar .tw-st-section .tw-btn-label { display: inline-flex; align-items: center; gap: 4px; }
#presenterTopBar .tw-st-time { font: 600 13px/1 var(--tb-ui); font-variant-numeric: tabular-nums; color: var(--tb-text); }
#presenterTopBar .tw-st-section.talk-crit .tw-st-time { color: var(--tb-live); }
#presenterTopBar .tw-st-reactions { gap: 10px; }
#presenterTopBar .tw-st-reactions > span { display: inline-flex; align-items: center; gap: 4px; color: var(--tb-text); font-variant-numeric: tabular-nums; }
#presenterTopBar .tw-st-reactions > span .tw-ico { color: var(--tb-muted); }
/* Ticket 04 (D11): a custom-label chip is numbers only, "2 · 14 · 1" */
#presenterTopBar .tw-st-reactions > .tw-rx-sep { margin: 0 -4px; color: var(--tb-muted); }
#presenterTopBar .tw-st-questions { color: var(--tb-text); }
#presenterTopBar .tw-st-questions .tw-ico { color: #e9c46a; }

/* The REC cluster: the recording preload mounts it in #presenterRecSlot and carries its own
   styles in the chrome type scale (src/preload/present-rec-ui.ts, presenter redesign ticket 03).
   This sheet owns only its collapse steps, c5 and c6 below. */

/* Right: the Live, Poll and View menus (ticket 04; presenter-top-menus.css). */
#presenterTopBar .presenter-header-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex: none; }

/* The mode chip (ticket 05): amber while Reveal, Focus or Highlight is on, with × to leave (and
   Clear for Highlight). Drawn in round-2 shots mode-focus-*, mode-highlight-*, mode-reveal-*. */
#presenterTopBar .tw-st-mode { gap: 6px; margin: 0 2px; padding: 0 3px 0 8px; border-radius: 5px; background: #3a3210; color: #ffe08a; font-weight: 600; }
#presenterTopBar .tw-st-mode:not([hidden]) + .tw-st:not([hidden]):not(:empty) { box-shadow: none; }
#presenterTopBar .tw-st:not([hidden]):not(:empty) ~ .tw-st-mode { box-shadow: none; }
#presenterTopBar .tw-mode-mark { display: inline-flex; }
#presenterTopBar .tw-mode-btn { margin-left: 2px; border-color: #ffe08a44; background: #4a4015; color: #fff0c2; }
#presenterTopBar .tw-mode-btn + .tw-mode-btn { margin-left: 0; }
#presenterTopBar .tw-mode-btn:hover { border-color: #ffe08a99; }
#presenterTopBar .tw-mode-btn:disabled { opacity: 0.55; cursor: default; }
#presenterTopBar .tw-mode-btn .tw-ico { width: 14px; height: 14px; }
#presenterTopBar #presenterModeExit,
#presenterTopBar #presenterHighlightExit { width: 26px; padding: 0; justify-content: center; }

/* Collapse steps, added one at a time by fitTopBar() until the row fits (surfaces-drawn.md).
   c5 and c6 act on the REC cluster; c7 on the venue notice; c8 (menu buttons icon-only) is in
   presenter-top-menus.css; c10 is the mode chip's. */
#presenterTopBar.c1 .tw-clock-sub { display: none; }
#presenterTopBar.c1 .tw-topbar-left, #presenterTopBar.c2 .tw-topbar-left { gap: 11px; }
#presenterTopBar.c2 .tw-st-section .tw-st-word { display: none; }
#presenterTopBar.c3 .tw-count-word { display: none; }
#presenterTopBar.c4 #presenterEndLive { width: 26px; padding: 0; justify-content: center; }
#presenterTopBar.c4 #presenterEndLive > .tw-btn-label { display: none; }
/* c5: "Not recording" / "Recording paused" go; the dot's colour and the button's tooltip carry it. */
#presenterTopBar.tw-no-mic-name #twrec-idle-name { display: none; }
#presenterTopBar.tw-no-rec-extras #twrec-module:is([data-rec="recording"], [data-rec="paused"]) :is(#twrec-again, #twrec-mic) { display: none; }
#presenterTopBar.c5 #twrec-label[data-collapse="c5"] { display: none; }
/* c6: Record and Change become icon-only (their tooltips name them). */
#presenterTopBar.c6 :is(#twrec-primary, #twrec-change-kind) { width: 26px; padding: 0; justify-content: center; }
#presenterTopBar.c6 :is(#twrec-primary, #twrec-change-kind) > .tw-btn-label { display: none; }
/* c7: the venue notice shortens to "Venue screen reconnecting" (its tooltip keeps the full words). */
#presenterTopBar.c7 .tw-venue-long { display: none; }
#presenterTopBar.c9 .tw-st-section { display: none; }
/* c10: the mode chip keeps its icon, colour and buttons but drops its words (the pressed
   bottom-bar button, or Reveal checked in More, names the mode). */
#presenterTopBar.c10 .tw-mode-word { display: none; }
#presenterTopBar.c10 #presenterHighlightChipClear { width: 26px; padding: 0; justify-content: center; }
#presenterTopBar.c10 #presenterHighlightChipClear > .tw-btn-label { display: none; }
/* The Live, Poll and View menus on the right of the presenter's top bar (ADR-0031 §2, presenter
   redesign ticket 04; drawn in docs/design/2026-09-26-presenter-redesign/round-2/, shots
   menu-live-open, menu-poll-open, menu-view-open, notes-menu-*). A menu button is icon, label and
   chevron; its menu hangs 8px below it, right-aligned. Each item is icon, label (with an optional
   sub-line) and its shortcut right-aligned; section headings; disabled items dimmed. The Notes
   menu opens from View and hangs in the same place. Chrome type scale: 14px labels, 13px headings,
   sub-lines and shortcuts, 16px for the speed number. At collapse step c8 the menu buttons show
   icon and chevron only (the tooltip names the menu). */
#presenterTopBar .tw-menu-anchor { position: relative; display: inline-flex; flex: none; }
#presenterTopBar .tw-menu-btn {
  display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; box-sizing: border-box;
  border: 1px solid var(--tb-line); border-radius: 7px; background: var(--tb-ctl); color: var(--tb-text);
  font: 500 14px/1 var(--tb-ui); white-space: nowrap;
}
#presenterTopBar .tw-menu-btn:hover { background: var(--tb-ctl-hover); }
#presenterTopBar .tw-menu-btn[aria-expanded="true"] { background: #2a3f55; border-color: #5b86b5; }
#presenterTopBar .tw-menu-btn:focus-visible { outline: 2px solid #6ea8e6; outline-offset: 1px; }
#presenterTopBar .tw-menu-btn .tw-ico.tw-menu-chev { width: 14px; height: 14px; margin-left: -1px; color: var(--tb-muted); }
#presenterTopBar.c8 .tw-menu-btn { gap: 3px; padding: 0 7px 0 9px; }
#presenterTopBar.c8 .tw-menu-btn > .tw-btn-label { display: none; }

/* The menu card */
:is(#presenterTopBar, #presenterBottomBar) .tw-menu,
#presenterTopBar .notes-menu {
  position: absolute; top: calc(100% + 8px); right: 0; z-index: 200;
  display: flex; flex-direction: column; box-sizing: border-box;
  background: #16202a; border: 1px solid #ffffff26; border-radius: 10px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
  font-family: var(--tb-ui); color: var(--tb-text); text-align: left; white-space: nowrap;
}
:is(#presenterTopBar, #presenterBottomBar) .tw-menu { width: 318px; padding: 6px; }
:is(#presenterTopBar, #presenterBottomBar) .tw-menu.tw-menu-view { width: 348px; }
:is(#presenterTopBar, #presenterBottomBar) .tw-menu-sec { font: 600 13px/1 var(--tb-ui); color: var(--tb-dim); padding: 10px 10px 6px; }
:is(#presenterTopBar, #presenterBottomBar) .tw-menu-sec:first-child { padding-top: 6px; }
:is(#presenterTopBar, #presenterBottomBar) .tw-menu-hr { height: 1px; background: #ffffff14; margin: 5px 4px; }

/* An item: icon · label (and sub-line) · shortcut */
:is(#presenterTopBar, #presenterBottomBar) .tw-mi {
  display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 10px;
  width: 100%; min-height: 34px; padding: 0 10px; box-sizing: border-box; margin: 0;
  border: 0; border-radius: 6px; background: none; color: var(--tb-text);
  font: 500 14px/1.2 var(--tb-ui); text-align: left; white-space: nowrap;
}
:is(#presenterTopBar, #presenterBottomBar) .tw-mi:has(.tw-mi-sub) { padding-top: 7px; padding-bottom: 7px; }
:is(#presenterTopBar, #presenterBottomBar) .tw-mi > .tw-ico { color: var(--tb-muted); }
:is(#presenterTopBar, #presenterBottomBar) .tw-mi > .tw-btn-label { overflow: hidden; text-overflow: ellipsis; }
:is(#presenterTopBar, #presenterBottomBar) .tw-mi-sub { display: block; margin-top: 2px; font: 500 13px/1.2 var(--tb-ui); color: var(--tb-dim); }
:is(#presenterTopBar, #presenterBottomBar) .tw-mi-key { font: 500 13px/1 var(--tb-ui); color: var(--tb-muted); text-align: right; min-width: 34px; white-space: nowrap; }
:is(#presenterTopBar, #presenterBottomBar) .tw-mi:not(:disabled):hover,
:is(#presenterTopBar, #presenterBottomBar) .tw-mi:focus-visible { background: #2a4260; outline: none; }
:is(#presenterTopBar, #presenterBottomBar) .tw-mi:disabled { color: #5f7183; cursor: default; }
:is(#presenterTopBar, #presenterBottomBar) .tw-mi:disabled > .tw-ico { opacity: 0.55; }
:is(#presenterTopBar, #presenterBottomBar) .tw-mi:disabled .tw-mi-sub,
:is(#presenterTopBar, #presenterBottomBar) .tw-mi:disabled .tw-mi-key { color: #56687a; }
/* Go live reads as the action; while a session is up it is End live session, in red. */
:is(#presenterTopBar, #presenterBottomBar) .tw-mi.is-danger { color: #ffb4ae; }
:is(#presenterTopBar, #presenterBottomBar) .tw-mi.is-danger > .tw-ico { color: var(--tb-live); }
:is(#presenterTopBar, #presenterBottomBar) .tw-mi[aria-checked="true"] > .tw-ico { color: var(--tb-amber); }

/* A row with a segmented control: Previews (Large / Medium / Small / Off), Slide text */
:is(#presenterTopBar, #presenterBottomBar) .tw-menu-row { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 4px 10px 6px; }
:is(#presenterTopBar, #presenterBottomBar) .tw-menu-row-label { display: contents; font: 500 14px/1.2 var(--tb-ui); }
:is(#presenterTopBar, #presenterBottomBar) .tw-menu-row-label > .tw-ico { color: var(--tb-muted); }
#presenterTopBar .tw-seg { display: inline-flex; border: 1px solid var(--tb-line); border-radius: 7px; overflow: hidden; background: #111a22; }
#presenterTopBar .tw-seg > button {
  display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 9px; margin: 0; box-sizing: border-box;
  border: 0; border-radius: 0; background: none; color: var(--tb-muted); font: 500 13px/1 var(--tb-ui); white-space: nowrap;
}
#presenterTopBar .tw-seg > button + button { box-shadow: -1px 0 0 var(--tb-line); }
#presenterTopBar .tw-seg > button:hover { background: var(--tb-ctl-hover); color: var(--tb-text); }
#presenterTopBar .tw-seg > button:focus-visible { outline: 2px solid #6ea8e6; outline-offset: -2px; }
#presenterTopBar .tw-seg > button[aria-pressed="true"] { background: #244d88; color: #fff; }
#presenterTopBar .tw-seg > button > .tw-ico { width: 14px; height: 14px; }
#presenterTopBar .tw-seg-btn .tw-mi-key { min-width: 0; margin-left: 1px; color: inherit; }

/* The Notes menu: placements, Just this talk, and for the teleprompter placements Scroll and Speed */
#presenterTopBar .notes-menu { width: 356px; padding: 12px; }
#presenterTopBar .notes-menu[hidden] { display: none; }
#presenterTopBar .notes-menu-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 8px; }
#presenterTopBar .notes-menu-title { font: 600 14px/1 var(--tb-ui); }
#presenterTopBar .notes-menu-key { font: 500 13px/1 var(--tb-ui); color: var(--tb-dim); }
#presenterTopBar .notes-menu-options { display: flex; flex-direction: column; gap: 2px; }
#presenterTopBar .notes-menu-options button {
  display: grid; grid-template-columns: 18px minmax(0, 1fr) 16px; align-items: center; gap: 10px;
  width: 100%; padding: 6px 8px; margin: 0; box-sizing: border-box;
  border: 1px solid transparent; border-radius: 7px; background: none; color: var(--tb-text); text-align: left;
}
#presenterTopBar .notes-menu-options button:hover { background: #ffffff0d; }
#presenterTopBar .notes-menu-options button:focus-visible { outline: 2px solid #6ea8e6; outline-offset: -2px; }
#presenterTopBar .notes-menu-options button > .tw-ico { width: 18px; height: 18px; color: var(--tb-muted); }
#presenterTopBar .notes-menu-options button > .tw-ico.notes-menu-tick { width: 16px; height: 16px; color: #8fc0ff; visibility: hidden; }
#presenterTopBar .notes-menu-options button[aria-pressed="true"] { background: #1f3550; border-color: #3f6ea3; }
#presenterTopBar .notes-menu-options button[aria-pressed="true"] > .tw-ico { color: #9cc3f5; }
#presenterTopBar .notes-menu-options button[aria-pressed="true"] > .tw-ico.notes-menu-tick { visibility: visible; color: #8fc0ff; }
#presenterTopBar .notes-menu b { display: block; font: 500 14px/1.2 var(--tb-ui); white-space: nowrap; }
#presenterTopBar .notes-menu i { display: block; margin-top: 2px; font: 500 13px/1.2 var(--tb-ui); font-style: normal; color: var(--tb-dim); white-space: nowrap; }
#presenterTopBar .notes-menu-check { display: grid; grid-template-columns: 18px minmax(0, 1fr); align-items: start; gap: 10px; padding: 8px 8px 4px; cursor: pointer; }
#presenterTopBar .notes-menu-check input { width: 16px; height: 16px; margin: 1px 0 0 1px; accent-color: #3b82f6; cursor: pointer; }
#presenterTopBar .notes-menu-check i { line-height: 1.3; }
#presenterTopBar .notes-menu-scroll { display: flex; flex-direction: column; align-items: flex-start; margin-top: 8px; padding-top: 2px; border-top: 1px solid #ffffff14; }
#presenterTopBar .notes-menu-scroll[hidden] { display: none; }
#presenterTopBar .notes-menu-sec { font: 600 13px/1 var(--tb-ui); color: var(--tb-dim); padding: 10px 4px 6px; }
#presenterTopBar .notes-menu-segments { margin: 4px; }
#presenterTopBar .notes-menu-segments > button { height: 30px; padding: 0 12px; font-size: 14px; }
#presenterTopBar .notes-menu-segments > button > .tw-ico { width: 14px; height: 14px; }
#presenterTopBar .notes-menu-speed { display: flex; align-items: center; gap: 10px; padding: 4px; }
#presenterTopBar .notes-menu-stepper { display: inline-flex; align-items: center; border: 1px solid var(--tb-line); border-radius: 7px; background: #111a22; }
#presenterTopBar .notes-menu-stepper .tw-step {
  width: 30px; height: 30px; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--tb-muted); font-size: 14px;
}
#presenterTopBar .notes-menu-stepper .tw-step:hover { background: var(--tb-ctl-hover); filter: none; }
#presenterTopBar .notes-menu-wpm { min-width: 40px; text-align: center; font: 600 16px/1 var(--tb-mono); font-variant-numeric: tabular-nums; color: var(--tb-text); }
#presenterTopBar .notes-menu-unit { font: 500 13px/1 var(--tb-ui); color: var(--tb-muted); white-space: nowrap; }
#presenterTopBar .notes-menu-hint { margin: 0; padding: 8px 4px 0; font: 500 13px/1.35 var(--tb-ui); color: var(--tb-dim); white-space: normal; }

/* From phones · this talk: a checked item with its switch on the right (ADR-0027 amendment, ticket 05) */
#presenterTopBar .tw-mi-switch { min-height: 48px; }
#presenterTopBar .tw-sw { position: relative; flex: none; width: 34px; height: 20px; border-radius: 10px; background: #3b4a59; }
#presenterTopBar .tw-sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #c4d0dc; transition: transform 0.12s; }
#presenterTopBar .tw-mi-switch[aria-checked="true"] .tw-sw { background: #2f6fd6; }
#presenterTopBar .tw-mi-switch[aria-checked="true"] .tw-sw::after { transform: translateX(14px); background: #fff; }
#presenterTopBar .tw-mi-switch .tw-mi-sub.is-error { color: #ffb4ae; }
/* A switch that is off: the chip or counter keeps what it holds, dimmed, with a small amber pause mark, no word */
#presenterTopBar .tw-st[data-paused="true"] > :not(.tw-pause-mark) { opacity: 0.5; }
#presenterTopBar .tw-pause-mark { display: inline-flex; align-items: center; color: var(--tb-amber); }
#presenterTopBar .tw-pause-mark .tw-ico { width: 13px; height: 13px; }
/* Paper and print preparation (PR 358). New, unmarked rules: they sort after every migrated block
   (README.md), so the print fallback below follows the deck's @media print block it overrides. */

/* A carousel item's "n / m" marker exists only for print (slideFit.preparePrint clones the slide per
   item); a video's stand-in likewise (slideFit.preparePrint). */
.carousel-print-count { display: none; }
.tw-print-video { display: none; }
@media print {
  .carousel-print-count { display: block; position: absolute; right: 2.2cqw; bottom: 1.4cqw; font: 600 1.15cqw/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .04em; color: #5b6572; }
}

/* A browser that cannot divide a length by a length drops the canvas zoom and would cut the 1280px
   canvas off at the paper edge: there each slide takes the paper width instead. */
@supports not (zoom: calc(100cqw / 1280px)) {
  @media print {
    .deck { container-type: normal; }
    .deck > .stage { width: auto; zoom: normal; }
  }
}

/* beforeprint measures every slide in the print layout at scale 1 (slideFit.preparePrint). */
html.tw-print-layout .stage { zoom: 1 !important; }

/* A diagram slide drawn ahead of time (predrawDiagrams): laid out on its canvas but invisible and
   inert; the moment it becomes the shown slide this rule stops applying. A mind map drawn ahead stays
   hidden on the shown slide until it is drawn afresh; the presenter window lays out its hidden deck
   for the draw. */
.deck > .stage > .slide.tw-predraw:not(.active) { display: grid !important; visibility: hidden !important; pointer-events: none; }
.slide.active .mindmap-mm[data-mm-ahead] > svg { visibility: hidden; }
body.presenter-mode.tw-predrawing .deck { display: block !important; position: fixed; inset: 0; visibility: hidden; pointer-events: none; z-index: -1; }

/* The fitter's "Code too long" badge (slide-fit.js fitCode) is a note to the author: a handout's participants never
   print it. */
@media print {
  .share-shell .code-overflow-marker { display: none !important; }
}

  .slide-content:has(> .icon-row),
  .slide-content:has(> .slide-table),
  .slide-content:has(> .chart-cols),
  .slide-content:has(> .card-gallery) {
    width: 100%;
  }

.deck[data-deck-font="trebuchet"], .slide[data-deck-font="trebuchet"] { --sans: "Trebuchet MS", system-ui, -apple-system, "Segoe UI", sans-serif; }

  .card-gallery.cards-numbered .card::after {
    content: counter(twcard, decimal-leading-zero);
    font-family: var(--mono);
    font-size: .6em;
    color: var(--muted);
    letter-spacing: .1em;
  }
  /* A body-less card (its label is the whole claim) has nothing for the second column: the label takes the row,
     rather than wrapping down a 22% column until the slide overflows and loses its title. */

  .icon-row .ir-item .ir-icon > svg { width: 100%; height: 100%; }
  /* Narrow stages (the base.css 950px container query wraps icon rows): two columns per row; each
     item still spans a heading row and an items row. */
  @container (max-width: 950px) {
    .slide-content > .icon-row { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  .slide-content > .feature-list:not(.fl-annotated):has(.fl-icon) > li > .fl-icon,
  .slide-content > .feature-list:not(.fl-annotated):has(.fl-icon) > li > .fl-icon > svg {
    /* ADR-0028 §5: 1.9em of the body size (was 1.8em of the dense step); icon lists set their own. */
    width: 1.9em;
    height: 1.9em;
    color: var(--accent);
    stroke-width: 1.5;
    flex: none;
  }
  /* ADR-0028 §5 (amends ADR-0005): cards (boxes / logolist) no longer take the dense step — they
     read at the body size. Annotated icon lists keep the rule above. When a card is too narrow for a
     word at this size, fitLists steps --fs-body down by 0.1cqw (never under --fs-dense). */
  .slide-content > .feature-list:not(.fl-annotated):not(.fl-iconlist-list):has(.fl-icon) > li { font-size: var(--fs-body) !important; }
  /* A card with sub-items has a heading: bold, 1.15x its items (it rides the same --fs-body, so the
     ratio holds at every fitted size). A childless card's text is the item itself and stays at 1em. */
  .slide-content > .feature-list:not(.fl-annotated):not(.fl-iconlist-list):has(.fl-icon) > li:has(> .fl-sublist) > .fl-text {
    font-size: 1.15em;
    font-weight: 700;
    line-height: 1.2;
  }
  .slide-content > .feature-list:not(.fl-annotated):not(.fl-iconlist-list):has(.fl-icon) > li > .fl-sublist > li {
    font-size: 1em;
    font-weight: 400;
  }

  /* {iconlist=list}: restore the pre-skin icon rows at today's type scale. The icon is the
     accent device; rows have no card chrome and no numbers. Same T28 scoping as the boxes
     variant: the icon size applies only to the top-level icon, never the nested .fl-sub-icon svgs.
     ADR-0028 §4: the icon is larger (1.75em, was 1.25em), further from the text (1.1em, was
     .7em) and centred on its item; rows are divided by a faint dotted line between items (ink at
     22%) instead of solid hairlines above every row and below the last; the row padding grows
     .55em -> .7em to keep the rhythm without the rules. */
  .slide-content > .feature-list.fl-iconlist-list:not(.fl-annotated),
  .slide-content > .feature-list.fl-wide.fl-iconlist-list:not(.fl-annotated) {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
    max-width: none;
    width: 100%;
    counter-reset: none;
  }
  .slide-content > .feature-list.fl-iconlist-list:not(.fl-annotated) > li,
  .slide-content > .feature-list.fl-wide.fl-iconlist-list:not(.fl-annotated) > li {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: center;
    justify-content: initial;
    gap: .7em 1.1em;
    min-height: 0;
    padding: calc(.7em * var(--list-gap, 1)) 0;
    border: 0;
    font-size: var(--fs-body) !important;
    font-weight: 400;
    line-height: var(--list-lh, 1.35);
  }
  /* Both selectors: the row rule above resets `border: 0` at the .fl-wide specificity. */
  .slide-content > .feature-list.fl-iconlist-list:not(.fl-annotated) > li + li,
  .slide-content > .feature-list.fl-wide.fl-iconlist-list:not(.fl-annotated) > li + li {
    border-top: 2px dotted color-mix(in srgb, var(--ink) 22%, transparent);
  }
  .slide-content > .feature-list.fl-iconlist-list:not(.fl-annotated) > li::after { content: none; }
  .slide-content > .feature-list.fl-iconlist-list:not(.fl-annotated) > li > .fl-icon,
  .slide-content > .feature-list.fl-iconlist-list:not(.fl-annotated) > li > .fl-icon > svg {
    width: 1.75em;
    height: 1.75em;
    color: var(--accent);
    stroke-width: 1.4;
  }

  /* Slide round 2 (0.37): a short-line icon list of five items or fewer (the compiler stamps
     .fl-short-lines) under a top title runs in two columns, so it reads at 2.3cqw (44px at 1920) instead
     of a smaller zoomed single column. An item never splits across the columns; the dotted rule between
     rows goes (it would start the second column with a stray line). A talk's own body size wins. */
  .slide[data-title-layout="top"]:not([data-font-body]) > .slide-content:has(> .feature-list.fl-short-lines) { --fs-body: max(var(--type-floor), 2.3cqw); --list-lh: 1.22; }
  .slide[data-title-layout="top"] > .slide-content > .feature-list.fl-iconlist-list.fl-short-lines:not(.fl-annotated) {
    display: block;
    columns: 2;
    column-gap: 4cqw;
    width: 100%;
  }
  .slide[data-title-layout="top"] > .slide-content > .feature-list.fl-iconlist-list.fl-short-lines:not(.fl-annotated) > li {
    break-inside: avoid;
    margin-bottom: 1.2cqh;
    border-top: 0;
  }

  /* ADR-0028 §4, cards (boxes / logolist with children): the same faint dotted line separates
     the sub-items inside each card — between sub-items only, none above the first or below the
     last. The sub-list stretches to the card's inner width so the line spans the card. */
  .slide-content > .feature-list:not(.fl-annotated):not(.fl-iconlist-list):has(.fl-icon) > li > .fl-sublist { align-self: stretch; }
  .slide-content > .feature-list:not(.fl-annotated):not(.fl-iconlist-list):has(.fl-icon) > li > .fl-sublist > li + li {
    border-top: 2px dotted color-mix(in srgb, var(--ink) 22%, transparent);
    /* Rides fitLists' spacing step, but never closer than .15em to the dotted line (legibility floor). */
    padding-top: max(.15em, calc(.3em * var(--list-gap, 1)));
    margin-top: max(.15em, calc(.3em * var(--list-gap, 1)));
  }
  .slide-content > .feature-list.fl-has-children:not(:has(.fl-icon)) {
    gap: 0;
    row-gap: 0;
  }

  /* ADR-0028 §6 — NUMBERED LISTS take the icon-list layout with the number in the icon's box
     (the compiler stamps .fl-numbered on a numbered list and gives it the icon-list treatment:
     rows above three items or with {iconlist=list}, cards otherwise). Default style: the number
     in an outlined square — outline only, no fill: beside the tint rail a filled square would be
     a second tint. In rows the square is the 1.75em row-icon box with the numeral at 1.05em of
     the text; in cards it is the card icon's 1.9em box with the numeral at 1.1em. Both are in em
     of the item, so the number rides the same --fs-body / --list-gap fitting as the icons.
     Replaces, for numbered lists: base.css's tinted .fl-num disc (@order 0108) and the 15px
     .fl-num in wide lists (layouts/list.css @order 0109). */
  .slide-content > .feature-list.fl-numbered:not(.fl-annotated) > li > .fl-icon.fl-num {
    background: none;
    border: 2px solid var(--accent);
    border-radius: .14em;
    display: grid;
    place-items: center;
    color: var(--accent);
    font-family: var(--sans);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    box-sizing: border-box;
  }
  .slide-content > .feature-list.fl-iconlist-list.fl-numbered:not(.fl-annotated) > li > .fl-icon.fl-num {
    font-size: 1.05em;
    width: calc(1.75em / 1.05);
    height: calc(1.75em / 1.05);
  }
  .slide-content > .feature-list.fl-numbered:not(.fl-iconlist-list):not(.fl-annotated) > li > .fl-icon.fl-num {
    font-size: 1.1em;
    width: calc(1.9em / 1.1);
    height: calc(1.9em / 1.1);
  }
  /* {numbered=plain}: the numeral set like the text — same size, accent, 700, with a full stop,
     right-aligned in a fixed 1.4em column so the text starts at one x for 1–9 and 10+; the item
     aligns to the top so the numeral sits on the first line. Each style restates the row and card
     selectors so it outranks the square's box at the same specificity. */
  .slide-content > .feature-list.fl-iconlist-list.fl-numbered-plain:not(.fl-annotated) > li > .fl-icon.fl-num {
    border: 0;
    display: block;
    width: 1.4em;
    height: auto;
    font-size: 1em;
    line-height: var(--list-lh, 1.35);
    text-align: right;
  }
  .slide-content > .feature-list.fl-numbered-plain:not(.fl-annotated) > li > .fl-icon.fl-num::after { content: "."; }
  .slide-content > .feature-list.fl-iconlist-list.fl-numbered-plain:not(.fl-annotated) > li,
  .slide-content > .feature-list.fl-wide.fl-iconlist-list.fl-numbered-plain:not(.fl-annotated) > li { align-items: start; }
  /* Not drawn — the row treatment carried to cards: the plain numeral heads the card at the
     heading's size, left-aligned. */
  .slide-content > .feature-list.fl-numbered-plain:not(.fl-iconlist-list):not(.fl-annotated) > li > .fl-icon.fl-num {
    border: 0;
    display: block;
    width: auto;
    height: auto;
    font-size: 1.1em;
    line-height: 1.2;
    text-align: left;
  }
  /* {numbered=styled}: a large light numeral, two text lines tall, weight 300, accent, centred on
     its item like the icons. */
  .slide-content > .feature-list.fl-iconlist-list.fl-numbered-styled:not(.fl-annotated) > li > .fl-icon.fl-num {
    border: 0;
    width: 1.1em;
    height: auto;
    font-size: 2.1em;
    font-weight: 300;
    line-height: .9;
    letter-spacing: -.04em;
  }
  /* Not drawn — the row treatment carried to cards: the styled numeral heads the card, left-aligned. */
  .slide-content > .feature-list.fl-numbered-styled:not(.fl-iconlist-list):not(.fl-annotated) > li > .fl-icon.fl-num {
    border: 0;
    display: block;
    width: auto;
    height: auto;
    font-size: 2.1em;
    font-weight: 300;
    line-height: .9;
    letter-spacing: -.04em;
  }

/* ADR-0033 §5 (slide design round 2, ticket 07): columns too narrow for their words change shape.
   compiler/scripts/lib/narrow-columns.mjs decides and stamps the classes read here; nothing below
   applies to a slide the setting left alone ({narrowcols=off}, `narrow_columns: off`, or an authored
   {iconlist=boxes|list}), so those keep today's columns. Unmarked, so it sorts after the legacy blocks.
   Lifted from drawings/overrides/3-*.css of the round-2 design pack. It replaces the fixed
   `@container (max-width: 950px)` two-column icon-row rule (skin/icon-row.css) for a stamped row;
   the container rule stays for an icon row the compiler did not reshape. */

/* Five or more icon-row columns on a slide too narrow for them: rows of three (3 + 2), or two beside
   a rail. The row uses the full slide width (the doubled inset of skin/base.css @order 1536 goes), reads
   at 2.1cqw, and a label never breaks mid-word. Each item keeps its two-row subgrid span. */
.slide-content:has(> .icon-row.ir-rows) { width: 100% !important; }
.slide-content.layout-iconrow:has(> .icon-row.ir-rows) { --fs-body: 2.1cqw !important; --list-lh: 1.2 !important; --list-gap: .8 !important; }
.slide-content > .icon-row.ir-rows {
  grid-auto-flow: row !important; grid-template-rows: none !important; grid-auto-rows: auto;
  gap: 1.6cqw 2.2cqw !important; margin-top: 1.4cqw !important;
}
.slide-content > .icon-row.ir-rows-3 { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
.slide-content > .icon-row.ir-rows-1 { grid-template-columns: minmax(0, 1fr) !important; }
.slide-content > .icon-row.ir-rows-2 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
.slide-content > .icon-row.ir-rows .ir-item { grid-row: span 2; }
.slide-content > .icon-row.ir-rows .ir-label { flex-wrap: nowrap; white-space: nowrap; }

/* Cards beside a rail that became icon-list rows ({iconlist=list} shape, skin/list.css): the row text
   takes a tighter line height, and a row with a sub-list (a family and its members) reads on one line:
   the family name never breaks (so "Anthropic - Claude" never breaks after the dash) and the members run
   inline, separated by a middle dot. */
.slide-content > .feature-list.fl-narrow-cols > li > .fl-text { line-height: 1.22; }
.slide-content > .feature-list.fl-narrow-cols > li:has(> .fl-sublist) { grid-template-columns: auto minmax(0, 1fr) !important; row-gap: .15em !important; }
.slide-content > .feature-list.fl-narrow-cols > li:has(> .fl-sublist) > .fl-text { white-space: nowrap; font-weight: 700; font-size: 1.15em; }
.slide-content > .feature-list.fl-narrow-cols > li > .fl-sublist {
  grid-column: 2 !important; display: flex !important; flex-wrap: wrap; gap: 0; margin: 0; padding: 0; list-style: none; font-size: .72em;
}
.slide-content > .feature-list.fl-narrow-cols > li > .fl-sublist > li {
  font-size: 2.3cqw !important; display: inline-block !important; border: 0 !important; padding: 0 !important; margin: 0 !important;
  grid-template-columns: none !important; white-space: nowrap;
}
/* The separator is the LEADING mark of every item after the first, never the trailing mark of the one before:
   an item is nowrap, so its separator travels with it when the run wraps and can never end a line. */
.slide-content > .feature-list.fl-narrow-cols > li > .fl-sublist > li::after { display: none !important; content: none !important; }
.slide-content > .feature-list.fl-narrow-cols > li > .fl-sublist > li::before { display: none !important; content: none !important; }
.slide-content > .feature-list.fl-narrow-cols > li > .fl-sublist > li:not(:first-child)::before { content: "·" !important; margin: 0 .55em; color: var(--muted); display: inline !important; position: static; }
.slide-content > .feature-list.fl-narrow-cols > li > .fl-sublist > li > .fl-subtext { grid-column: auto; display: inline; }

/* Members too long to share one line stack, one per line, with no separator (a separator can never end or start a line). */
.slide-content > .feature-list.fl-narrow-cols.fl-subs-stack > li > .fl-sublist { flex-direction: column; flex-wrap: nowrap; }
.slide-content > .feature-list.fl-narrow-cols.fl-subs-stack > li > .fl-sublist > li { white-space: normal; }
.slide-content > .feature-list.fl-narrow-cols.fl-subs-stack > li > .fl-sublist > li:not(:first-child)::before { content: none !important; display: none !important; }

  .qf {
    --qf-ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .qf-words { font-weight: 400; font-style: normal; background: none; border: 0; box-shadow: none; }
  /* Bold typed inside the words is bold only (the left side panel keeps today's accent chip, spec 2.6): neither the accent chip of the plain quote nor the
     accent colour of slide text (those selectors in base.css and skin/base.css are less specific). */
  .slide .qf:not(.qf-side) .qf-words strong { font-weight: 700; background: none; color: inherit; padding: 0; border-radius: 0; }
  /* The decorative quotation mark of every other blockquote (base.css G1) is not part of the card. */
  .qf-words::before { content: none; display: none; }
  .qf-avatar { color: #fff; font: 700 1.9792cqw/1 var(--qf-ui); }

  .qf-x-card { background: #fff; border-color: #cfd9de; box-shadow: 0 0.5208cqw 2.0833cqw rgba(16,20,24,.08); font-family: var(--qf-ui); color: #0f1419; --qf-x-muted: #536471; --qf-x-rule: #eff3f4; }
  .qf-x-name { font-size: 1.9792cqw; font-weight: 700; }
  .qf-x-handle { font-size: 1.5625cqw; color: var(--qf-x-muted); }
  .qf-tweet .qf-words { line-height: 1.33; font-weight: 400; letter-spacing: -.005em; }
  .qf-x-time { font-size: 1.4583cqw; color: var(--qf-x-muted); }
  .qf-x-actions { border-top-color: var(--qf-x-rule); color: var(--qf-x-muted); }

  .qf-ph { border-color: #7d8a93; color: #536471; font-family: var(--qf-ui); font-weight: 400; }
  .qf-ph-who { font-size: 1.5625cqw; }
  .qf-avatar-empty { border-color: #7d8a93; }
  .qf-x-card .qf-ph-words { font-size: var(--qf-step-2); }

  /* Video: the YouTube player (spec 6.3) */
  .qf-yt { font-family: var(--qf-ui); color: #0f0f0f; }
  .qf-yt-player { background: linear-gradient(160deg, #2b333d 0%, #14181d 55%, #0b0d10 100%); }
  .qf-yt-captions span { font-family: Roboto, Arial, var(--qf-ui); font-weight: var(--weight-reading, 400); color: #fff; background: rgba(8,8,8,.78); }
  .qf-yt-controls { background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0)); color: #fff; }
  .qf-yt-track { background: rgba(255,255,255,.35); }
  .qf-yt-played, .qf-yt-knob { background: #f00; }
  .qf-yt-time { font: 500 1.4583cqw/1 var(--qf-ui); }
  .qf-yt-title { font: 700 2.1875cqw/1.25 var(--qf-ui); }
  .qf-yt-channel b { font-size: 1.6667cqw; }
  .qf-yt-subscribe { background: #0f0f0f; color: #fff; font-size: 1.4063cqw; font-weight: 600; }
  .qf-yt-likes { background: #f2f2f2; }
  .qf-yt-sep { background: #cfcfcf; }
  .qf-yt-captions.qf-ph-words { color: #d5dbe0; border-color: rgba(255,255,255,.6); font-size: var(--qf-step-3); }

  /* The left side panel (spec 6.6): shared by video, book, paper and web */
  .qf-panel::after { background: rgba(16,20,24,.14); }
  .qf-side .qf-words { font-family: var(--sans); font-weight: 400; line-height: 1.42; letter-spacing: -.01em; text-wrap: balance; color: var(--ink); }
  .qf-source { border-left-color: var(--accent); }
  .qf-source-who { font-size: max(var(--qf-floor), calc(var(--qf-words) * .58)); font-weight: 600; letter-spacing: .01em; color: var(--ink); }
  .qf-source-where { font-size: var(--qf-floor); color: var(--muted); font-weight: 400; }
  .qf-pill { background: var(--ink); color: var(--paper); font-size: var(--qf-floor); font-weight: 700; }
  .qf-source-id { font-size: var(--qf-floor); color: var(--muted); }
  .qf-side .qf-ph-words { font-family: var(--sans); font-size: var(--qf-step-1); }
  /* Book: the made cover is paper and stays light in every skin; the sand under it follows the skin (spec 8). */
  .qf-source-title { font-weight: 700; }
  .qf { --qf-sand: #efe6d3; --qf-cover-shadow: rgba(60,40,10,.35); }
  .book-generated .qf-panel, .qf-cover-whole .qf-panel { background: var(--qf-sand); }
  .qf-cover { background: #f6f1e4; color: #101418; border-color: #cdbf9c; font-family: var(--sans); }
  .qf-cover-spine { background: #cdbf9c; }
  .qf-cover-title { font-weight: 700; }
  .qf-cover-authors { font-weight: 400; }
  .qf-cover-pub { font-weight: 400; color: #3b434c; }
  .is-dark .book-generated .qf-panel, .is-dark .qf-cover-whole .qf-panel { --qf-sand: #3a3327; }
  .is-dark .qf-cover-pub { color: #e6dcc6; }
  /* Paper (spec 6.5, 8): the journal page depicts paper and stays light in every skin; the words on it are 400
     (never bold) with the sentence highlighted. The panel's page picture casts a shadow to the right. */
  .qf { --qf-highlight: #f6dc6a; }
  .qf-page { background: #fff; color: #101418; border-color: #d6d6d0; box-shadow: 0 0.7292cqw 2.0833cqw rgba(16,20,24,.14); font-family: var(--sans); }
  .qf-page-head { color: #5c6570; border-bottom-color: #101418; }
  .qf-page-head b { color: #101418; font-weight: 700; }
  .qf-page-title { font-weight: 700; color: #101418; }
  .qf-page-authors { font-weight: 400; color: #3b434c; }
  .qf-page-filler span { background: #dedfe0; }
  .qf-page .qf-words { font-family: var(--sans); font-weight: 400; color: #101418; letter-spacing: 0; }
  .qf-words mark { background: linear-gradient(to bottom, transparent 8%, var(--qf-highlight) 8%, var(--qf-highlight) 94%, transparent 94%); color: inherit; font-weight: inherit; }
  .qf-page-foot { color: #5c6570; border-top-color: #e3e2dc; }
  .qf-page-number { font-weight: 700; color: #101418; }
  .qf-page .qf-ph-words { color: #5c6570; border-color: #7d8a93; font-size: var(--qf-step-3); }
  .qf-paper.qf-side .qf-panel { box-shadow: 0.9375cqw 0 2.2917cqw rgba(16,20,24,.18); }
  .is-dark .qf-page, .is-dark .qf-paper.qf-side .qf-panel { box-shadow: none; }
  /* Web (spec 17.2, 8): the browser window depicts a page whose colours are not known, so it stays light in every skin.
     The headline is smaller than the words (38 against 44.16 at the smallest step); the quoted words are 400. */
  .qf-web-win { background: #fff; color: #101418; border-color: #c9cdd2; box-shadow: 0 0.7292cqw 2.0833cqw rgba(16,20,24,.14); font-family: var(--sans); }
  .qf-web-bar { background: #e9ecef; border-bottom-color: #c9cdd2; }
  .qf-web-pill { background: #fff; border-color: #d3d7dc; font: 500 1.4583cqw/1.25 var(--qf-ui); color: #2b323a; }
  .qf-web-pill .qf-ic { color: #5c6570; }
  .qf-web-mast { background: var(--qf-web-tint, #ebeced); font-family: var(--qf-ui); }
  .qf-web-mark { background: var(--qf-web-mark, #3b434c); color: #fff; font: 700 1.4583cqw/1 var(--qf-ui); }
  .qf-web-site { font-size: 1.6667cqw; font-weight: 700; color: #101418; }
  .qf-web-nav span { background: rgba(16,20,24,.16); }
  .qf-web-headline { font: 700 1.9792cqw/1.25 var(--sans); color: #101418; }
  .qf-web-by { font-size: 1.4583cqw; color: #5c6570; }
  .qf-web-by b { font-weight: 600; color: #101418; }
  .qf-avatar-xs { font-size: 1.25cqw; }
  .qf-web.qf-full .qf-words { font-family: var(--sans); font-weight: 400; letter-spacing: -.01em; color: #101418; }
  .qf-web-domain { font: 500 1.4583cqw/1.25 var(--qf-ui); color: #5c6570; }
  .qf-web-body .qf-ph-words { font-size: var(--qf-step-2); font-family: var(--sans); color: #536471; }
  .qf-web.qf-side .qf-panel { background: #fff; box-shadow: 0.9375cqw 0 2.2917cqw rgba(16,20,24,.18); }
  .is-dark .qf-web-win, .is-dark .qf-web.qf-side .qf-panel { box-shadow: none; }
  .qf-yt-base { background: linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0)); }
  .qf-yt-timepill { background: rgba(0,0,0,.8); color: #fff; font: 700 1.6667cqw/1 var(--sans); }
  .qf-avatar-s { font-size: 1.5625cqw; }

  /* One static rendering for the handout, a shared talk, the venue page and print (spec 9): the slide
     carries .qf-static (quote-forms-static.mjs). The link is the only underline in the design. */
  .qf-source-link { color: inherit; text-decoration: none; }
  .qf-static .qf-source-link { color: var(--accent); text-decoration: underline; text-decoration-thickness: .07em; text-underline-offset: .16em; overflow-wrap: anywhere; }
  .qf-static .qf-doi { min-width: 0; overflow-wrap: anywhere; }
  .qf-static .qf-x-card, .qf-static .qf-page, .qf-static .qf-web-win, .qf-static .qf-paper.qf-side .qf-panel, .qf-static .qf-web.qf-side .qf-panel { box-shadow: none; }
  .qf-static .qf-placeholder { display: none !important; }
  /* The address pill holds the link: it widens to its text (at least 620, at most the bar) and wraps when the address is longer. */
  .qf-static .qf-web.qf-full .qf-web-pill { width: auto; min-width: 32.2917cqw; }
  .qf-static .qf-web.qf-full .qf-web-host { white-space: normal; overflow: visible; }
  @media print {
    /* Backgrounds are the picture here (highlight, caption boxes, avatars, panel tints): print them. */
